			<text x="74" y="132" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,264) scale(1,-1)">THE MEDIATION IS WHAT MAKES IT UNBEARABLE.</text>
			<text x="74" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,240) scale(1,-1)">She cannot even hand over an ending without the block in the middle of it — and once the block has set</text>
			<text x="74" y="110" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,220) scale(1,-1)">her word down in the same size as the hospital’s words, nobody afterward can tell which was which.</text>
			<text x="74" y="100" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,200) scale(1,-1)">She has never been told she was wrong. This is the one time it could have been checked.</text>
			<rect x="60" y="40" width="600" height="44" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="68" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,136) scale(1,-1)">SHE IS THE BOOK’S ONE TRUE ARTIST — A WOMAN WHOSE ENTIRE CRAFT IS FINISHING WHAT THE MACHINE HAS EATEN —</text>
			<text x="74" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,114) scale(1,-1)">and the story puts nothing between the Thursday and the flowers.</text>
			<text x="74" y="47" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,94) scale(1,-1)">Nothing in the story says she was wrong. Nothing in the story says she was right, either.</text>
			<text x="20" y="24" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 9px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,48) scale(1,-1)">THURSDAY.</text>
		</g>
	</g>
</svg>

</div>

</figure>
<figure class="plate">
<div class="plate-frame" tabindex="0" role="group" aria-label="162 · The Last Word">
<svg preserveAspectRatio="xMinYMin meet" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink" class="plate-svg" role="img" aria-labelledby="f162-t">
	<title id="f162-t">THE LAST WORD · THE MESSAGE THAT ARRIVES DOCKED — her mother’s block has taken the last word off everything for eleven years · all her sentences arrive leaning forward</title>
	
	<clipPath id="f162-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>
	<g id="f162-group" transform="scale(1,-1) translate(0,-430)" style="clip-path: url(#f162-clip)">
		<g transform="">
			<rect x="0" y="0" width="700" height="430" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6; fill: rgb(98%,98%,98%); fill-rule: evenodd;"/>
			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">THE LAST WORD · THE MESSAGE THAT ARRIVES DOCKED</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">her mother’s block has taken the last word off everything for eleven years · all her sentences arrive leaning forward</text>
			<rect x="110" y="246" width="430.0" height="32" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(93%,93%,90%); fill-rule: evenodd;"/>
			<text x="248.77177734375" y="258" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,516) scale(1,-1)">the doctor looked at the pictures and says</text>
			<rect x="540.0" y="246" width="70.0" height="32" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(100%,100%,100%); fill-rule: evenodd; stroke-dasharray: 3, 2;"/>
			<text x="564.509375" y="258" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,516) scale(1,-1)">[taken]</text>
			<text x="557.035302734375" y="284" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,568) scale(1,-1)">THE WORD</text>
			<text x="518.264501953125" y="234" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,468) scale(1,-1)">she knows it · it is her whole trade to know it</text>
			<text x="70" y="202" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,404) scale(1,-1)">SHE PLAYED IT FOUR TIMES</text>
			<text x="300" y="202" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,404) scale(1,-1)">on the fourth she heard the block’s own small pause — THE SOUND OF NOTHING BEING TAKEN</text>
			<text x="70" y="183" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,366) scale(1,-1)">SHE PRESSED RECORD</text>
			<text x="300" y="183" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,366) scale(1,-1)">and said nothing for a second, WHICH THE BLOCK WOULD KEEP</text>
			<text x="70" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,328) scale(1,-1)">THEN SHE SAID THE ONE WORD</text>
			<text x="300" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,328) scale(1,-1)">only the word, and stopped · four seconds</text>
			<text x="70" y="145" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,290) scale(1,-1)">AND AT HER MOTHER’S END</text>
			<text x="300" y="145" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,290) scale(1,-1)">the block takes the last word off everything</text>
			<text x="70" y="126" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,252) scale(1,-1)">SHE SENT IT ANYWAY</text>
			<text x="70" y="107" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,214) scale(1,-1)">THEN RECORDED IT AGAIN</text>
			<text x="300" y="107" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,214) scale(1,-1)">the same word with a second after it · ANY WORD · A WORD FOR THE BLOCK TO TAKE</text>
			<text x="70" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,176) scale(1,-1)">AND HELD HER THUMB OVER SEND</text>
			<text x="300" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,176) scale(1,-1)">and did not · AND KEPT IT</text>
			<rect x="60" y="40" width="600" height="32" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="60" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,120) scale(1,-1)">SHE SENDS THE VERSION THAT WILL ARRIVE EMPTY, AND KEEPS THE ONE THAT WOULD HAVE ARRIVED WHOLE.</text>
			<text x="74" y="49" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,98) scale(1,-1)">The woman who finishes everyone’s sentences cannot get one word to her own mother, and she knows exactly why.</text>
			<text x="20" y="24" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,48) scale(1,-1)">SHE HAS AN ENDING FOR THAT TOO.</text>
		</g>
	</g>
</svg>
