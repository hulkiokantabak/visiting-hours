<figure id="figure-160"><a aria-label="Open full-size diagram: 160. The new figure and her father's stock" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-160.svg"><img alt="160. The new figure and her father's stock" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-160.svg" width="842"/></a><figcaption>160. The new figure and her father's stock</figcaption><p>All four bars use retained words; the old threshold and shortfall are calculated.</p><p>retained words</p><div aria-label="Table: 160. The new figure and her father's stock" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Father at last asking</th><td>239</td><td>What his retention slips show</td></tr><tr><th scope="row">Old board</th><td>240</td><td>300 minus the stated 60-word increase</td></tr><tr><th scope="row">New board</th><td>300</td><td>The number she is paid to say</td></tr><tr><th scope="row">Calculated shortfall</th><td>61</td><td>300 minus 239; not the 60-word increase</td></tr></tbody></table></div><p class="reading">The new board rises by 60, but his shortfall is 61 because the last asking yielded 239.</p></figure>
<figure id="figure-161"><a aria-label="Open full-size diagram: 161. One breath in different positions" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-161.svg"><img alt="161. One breath in different positions" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-161.svg" width="842"/></a><figcaption>161. One breath in different positions</figcaption><p>Editing changes the sound's relation to the accepted words.</p><dl><dt>Borrowed breath</dt><dd>The announcement sounds kind.</dd><dt>Her first take</dt><dd>Her breath catches between three and hundred.</dd><dt>Breath removed</dt><dd>The voice sounds as though it owes nothing.</dd><dt>Restored at her request</dt><dd>She hears the catch before she signs.</dd><dt>New-year broadcast</dt><dd>The breath follows the two words and sounds like relief.</dd></dl><h4>Relationships</h4><ul><li>Borrowed breath → Her first take: she asks to use her own</li><li>Her first take → Breath removed: engineer cuts</li><li>Breath removed → Restored at her request: she asks to restore</li><li>Restored at her request → New-year broadcast: position changed later</li></ul><p class="reading">The public version uses her recorded breath but moves it; sameness of material does not preserve its effect.</p></figure>
<figure id="figure-162"><a aria-label="Open full-size diagram: 162. Cash paid, words still to be learned" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-162.svg"><img alt="162. Cash paid, words still to be learned" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-162.svg" width="842"/></a><figcaption>162. Cash paid, words still to be learned</figcaption><p>The recording fee and retained-word account are not interchangeable.</p><div aria-label="Table: 162. Cash paid, words still to be learned" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Recording and cash</th><th scope="col">Father's retention</th></tr></thead><tbody><tr><th scope="row">Accepted work</th><td>Two spoken words earn a fee</td><td>His slips still show 239 retained words</td></tr><tr><th scope="row">Private copy</th><td>First take costs half the fee</td><td>Hearing where the breath belonged is not a transfer of words</td></tr><tr><th scope="row">Household support</th><td>The fee can ease her mother's money shortage</td><td>The new board still requires 300</td></tr><tr><th scope="row">At the bank</th><td>Money for bread goes into her mother's pocket</td><td>She leans toward the water and says the next word</td></tr></tbody></table></div><p class="reading">She leaves money for bread and helps with the next word. Neither act is shown to buy her father passage.</p></figure>
