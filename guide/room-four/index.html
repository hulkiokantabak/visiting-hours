<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room Four · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/room-four/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/room-four/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/room-four/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/room-four/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-23"><h1>23. Room Four</h1>
<figure id="figure-67"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-067.svg"><img alt="067. Cards shown, knowledge withheld" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-067.svg" width="842"/></a><figcaption>067. Cards shown, knowledge withheld</figcaption><p>Disclosure during the hand, not a calculation of every player's possible holdings.</p><dl><dt>Before the flop</dt><dd>The Valuer folds sevens face down.</dd><dt>Flop</dt><dd>The Steward folds nines face up; the Valuer studies them.</dd><dt>Turn: nine of spades</dt><dd>The Widow has a flush; the Steward cannot see the Boy's fourth nine.</dd><dt>River: ten of diamonds</dt><dd>The Widow’s five-spade flush beats the Boy’s king-high straight; he sits.</dd><dt>Cards up</dt><dd>The Foreman shows two fours. Both pots go to the Widow.</dd></dl><p class="reading">Four nines: the Steward’s two, the turn’s one, the Boy’s hidden one. His reason for showing the pair stays unknown.</p></figure>
<figure id="figure-68"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-068.svg"><img alt="068. What is held, owed and asserted" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-068.svg" width="842"/></a><figcaption>068. What is held, owed and asserted</figcaption><p>Different units remain separate; the Boy disputes the Widow's account of his words.</p><div aria-label="Table: 068. What is held, owed and asserted" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Amount or unit</th><th scope="col">Status</th></tr></thead><tbody><tr><th scope="row">Husband's continuation</th><td>Four months</td><td>The Widow leaves with it</td></tr><tr><th scope="row">Boy's booked debt</th><td>420 words of proven retention</td><td>Signed by him and held by her</td></tr><tr><th scope="row">Widow's count of the Boy</th><td>211 words, and a mother</td><td>He has just said he has the required words</td></tr><tr><th scope="row">House's share of the pots</th><td>Five percent, rounded down</td><td>Taken to the second decimal</td></tr><tr><th scope="row">Debt booking</th><td>Handling charge, amount unstated</td><td>Deducted from the booked debt transaction</td></tr></tbody></table></div><p class="reading">Her 211 is an assertion about him, not an independent audit supplied by the diagram.</p></figure>
<figure id="figure-69"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-069.svg"><img alt="069. Hands repeat after the cards" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-069.svg" width="842"/></a><figcaption>069. Hands repeat after the cards</figcaption><p>Gestures at the card table lead to the following Tuesday at the ramp.</p><div aria-label="Table: 069. Hands repeat after the cards" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">At the table</th><th scope="col">After the hand</th></tr></thead><tbody><tr><th scope="row">Boy</th><td>Touches liked cards twice</td><td>Touches his own hands twice before signing</td></tr><tr><th scope="row">Steward</th><td>Shows the folded nines</td><td>Conceals the nines from his wife; later brings a chair to the ramp</td></tr><tr><th scope="row">Valuer</th><td>Escorts the Foreman and misses a hand</td><td>Witnesses the Boy's signature</td></tr><tr><th scope="row">Widow</th><td>Her money is counted twice</td><td>Reads the debt slip twice</td></tr></tbody></table></div><p class="reading">The Tuesday chair at the ramp recurs in “Order Was Restored” (26): the same one-motion act, without an explanation of the nines.</p></figure>
