	<title id="f69-t">ROOM FOUR · WHAT IS ACTUALLY BEING PLAYED FOR — the chips are the smaller currency · the drawer under the cloth holds the other one</title>
	
	<clipPath id="f69-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>
	<g id="f69-group" transform="scale(1,-1) translate(0,-430)" style="clip-path: url(#f69-clip)">
		<g transform="">
			<rect x="0" y="0" width="700" height="430" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6; fill: rgb(98%,98%,98%); fill-rule: evenodd;"/>
			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">ROOM FOUR · WHAT IS ACTUALLY BEING PLAYED FOR</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">the chips are the smaller currency · the drawer under the cloth holds the other one</text>
			<text x="60" y="300" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,600) scale(1,-1)">THE BOY OWES</text>
			<text x="250" y="300" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,600) scale(1,-1)">420 words of proven retention</text>
			<text x="450" y="300" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,600) scale(1,-1)">at the spring board, less a handling charge</text>
			<path d="M 60,290 L 660,290 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="270" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,540) scale(1,-1)">THE BOY HAS</text>
			<text x="250" y="270" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,540) scale(1,-1)">211 words · and a mother</text>
			<text x="450" y="270" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,540) scale(1,-1)">&quot;You have not got four hundred of them.&quot;</text>
			<path d="M 60,260 L 660,260 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,480) scale(1,-1)">THE WIDOW CAME FOR</text>
			<text x="250" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,480) scale(1,-1)">four months of her husband</text>
			<text x="450" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,480) scale(1,-1)">the month is the ninth</text>
			<path d="M 60,230 L 660,230 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="210" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,420) scale(1,-1)">THE WIDOW LEAVES WITH</text>
			<text x="250" y="210" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,420) scale(1,-1)">four months · and 420 of a stranger’s</text>
			<text x="450" y="210" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,420) scale(1,-1)">one in her handbag, one folded once in her coat pocket</text>
			<path d="M 60,200 L 660,200 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="180" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,360) scale(1,-1)">THE STEWARD LEAVES WITH</text>
			<text x="250" y="180" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,360) scale(1,-1)">nothing he can say at home</text>
			<text x="450" y="180" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,360) scale(1,-1)">he does not tell his wife about the nines</text>
			<path d="M 60,170 L 660,170 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="150" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,300) scale(1,-1)">THE VALUER LEAVES WITH</text>
			<text x="250" y="150" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,300) scale(1,-1)">what he learned</text>
			<text x="450" y="150" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,300) scale(1,-1)">a man showed him a pair of nines on purpose · he stays till five</text>
			<path d="M 60,140 L 660,140 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<text x="60" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,240) scale(1,-1)">THE HOUSE TAKES</text>
			<text x="250" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,240) scale(1,-1)">five percent, rounded down</text>
			<text x="450" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,240) scale(1,-1)">the only generosity in the building</text>
			<path d="M 60,110 L 660,110 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.35;"/>
			<rect x="60" y="46" width="600" height="60" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="72" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,176) scale(1,-1)">&quot;NOBODY IN ROOM FOUR HAS EVER KNOWN WHAT ANYBODY HAS. SHE HAS COUNTED HIS.&quot;</text>
			<text x="72" y="76" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,152) scale(1,-1)">He signs. The Valuer witnesses. She reads it twice, which is how she reads now, and folds it once.</text>
			<text x="72" y="66" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,132) scale(1,-1)">At the door he asks the only question in the story that nobody can answer, and she does not:</text>
			<text x="72" y="54" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,108) scale(1,-1)">&quot;WHICH ONE WILL YOU SPEND FIRST.&quot;</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,56) scale(1,-1)">HE TOUCHES HIS OWN HANDS TWICE, AS HE TOUCHED THE CARDS. IT IS NOT A HAND ANYMORE.</text>
		</g>
	</g>
</svg>
