<figure id="figure-103"><a aria-label="Open full-size diagram: 103. One wrist, two urgent uses" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-103.svg"><img alt="103. One wrist, two urgent uses" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-103.svg" width="842"/></a><figcaption>103. One wrist, two urgent uses</figcaption><p>Utterances in narrative order; the text does not name their speakers.</p><dl><dt>The phone calls</dt><dd>“Listen. My phone.” is followed by “His name. Look.”</dd><dt>A wrist is held</dt><dd>“Let go of my wrist.” meets “Just till we’re in.”</dd><dt>“I need that hand.”</dt><dd>Instructions to hold and not pull cross one another.</dd><dt>The phone goes under the ferry</dt><dd>The call is lost.</dd><dt>Thanks and a repeated name</dt><dd>“You saved me.” is followed by “It had his name on it.”</dd></dl><h4>Relationships</h4><ul><li>The phone calls → A wrist is held: then</li><li>A wrist is held → “I need that hand.”: then</li><li>“I need that hand.” → The phone goes under the ferry: then</li><li>The phone goes under the ferry → Thanks and a repeated name: then</li></ul><p class="reading">Hip speaker, wrist-holder and speaker of “my son” are possible roles, not a fixed cast. Their identity links remain uncertain.</p></figure>
<figure id="figure-104"><a aria-label="Open full-size diagram: 104. Evidence of a call, replies about callers" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-104.svg"><img alt="104. Evidence of a call, replies about callers" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-104.svg" width="842"/></a><figcaption>104. Evidence of a call, replies about callers</figcaption><p>Statements about the call meet other lines in the unattributed exchange.</p><div aria-label="Table: 104. Evidence of a call, replies about callers" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Words about the call</th><th scope="col">What the conversation supplies</th></tr></thead><tbody><tr><th scope="row">Before the loss</th><td>A name on the display</td><td>Attention remains on the hip and keeping hold</td></tr><tr><th scope="row">After the loss</th><td>“He was calling.”</td><td>An assurance that people call again if they want something</td></tr><tr><th scope="row">Repeated evidence</th><td>“It had his name on it.”</td><td>A warning that names can be put on anything</td></tr><tr><th scope="row">Listening</th><td>The incoming call is lost</td><td>Somebody declares that they have really been listened to</td></tr></tbody></table></div><p class="reading">The displayed name matters within the exchange; it does not independently certify the caller’s identity.</p></figure>
<figure id="figure-105"><a aria-label="Open full-size diagram: 105. Lost, retained, offered from an empty bag" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-105.svg"><img alt="105. Lost, retained, offered from an empty bag" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-105.svg" width="842"/></a><figcaption>105. Lost, retained, offered from an empty bag</figcaption><p>Three unlike things cross the scene under different conditions.</p><div aria-label="Table: 105. Lost, retained, offered from an empty bag" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Thing</th><th scope="col">State</th><th scope="col">What remains possible or missing</th></tr></thead><tbody><tr><th scope="row">Phone</th><td>Under the ferry</td><td>The incoming call cannot be taken</td></tr><tr><th scope="row">Word kept “for him”</th><td>A speaker reports keeping it eleven months, checking it with their teeth</td><td>Still retained rather than spent</td></tr><tr><th scope="row">Bag of crusts</th><td>Declared empty before and after the call</td><td>An offer is repeated without a shown transfer</td></tr></tbody></table></div><p class="reading">No one is shown accepting a crust. The saved word is not spent in the dialogue.</p></figure>
