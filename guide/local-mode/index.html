<figure id="figure-79"><a aria-label="Open full-size diagram: 079. Repair touches the repairer" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-079.svg"><img alt="079. Repair touches the repairer" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-079.svg" width="842"/></a><figcaption>079. Repair touches the repairer</figcaption><p>Two devices leave marks before the father's demand is answered.</p><div aria-label="Table: 079. Repair touches the repairer" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Made hands</th><th scope="col">The night-light</th></tr></thead><tbody><tr><th scope="row">Contact</th><td>Close on his bare forearm after repair</td><td>Prongs press into his thigh while concealed</td></tr><tr><th scope="row">Trace</th><td>Bruises change from yellow to green</td><td>Marks remain above his knee</td></tr><tr><th scope="row">Return</th><td>A repaired hand goes home</td><td>The father receives only the emptied shell</td></tr></tbody></table></div><p class="reading">The marks establish work and bodily involvement, not a right to keep the device.</p></figure>
<figure id="figure-80"><a aria-label="Open full-size diagram: 080. The payment and the working parts separate" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-080.svg"><img alt="080. The payment and the working parts separate" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-080.svg" width="842"/></a><figcaption>080. The payment and the working parts separate</figcaption><p>Follow possession in narrative order; the prayer is not the whole night-light.</p><dl><dt>A working night-light</dt><dd>The father brings the agreed balance and wants it back.</dd><dt>The light is opened again</dt><dd>Battery, board and speaker stay wired together.</dd><dt>Works in the mender's tin</dt><dd>He returns the empty shell.</dd><dt>Money back with the father</dt><dd>The father leaves the shell and takes his money.</dd><dt>Prayer carried after him</dt><dd>The mender follows with the loose works in his palm.</dd></dl><h4>Relationships</h4><ul><li>A working night-light → The light is opened again: opened again</li><li>The light is opened again → Works in the mender's tin: parts withheld</li><li>Works in the mender's tin → Money back with the father: payment withdrawn</li><li>Money back with the father → Prayer carried after him: then</li></ul><p class="reading">The father withdraws his payment. The mender follows with working parts he has withheld.</p></figure>
<figure id="figure-81"><a aria-label="Open full-size diagram: 081. The borrowed bench and the stairs" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-081.svg"><img alt="081. The borrowed bench and the stairs" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-081.svg" width="842"/></a><figcaption>081. The borrowed bench and the stairs</figcaption><p>A relational layout of competing kinds of care, not a measured map.</p><dl><dt>Nuri's bench</dt><dd>A shared work surface in the underpass</dd><dt>Nuri</dt><dd>Stops cutting when the pigeon beats at the drawer</dd><dt>The pigeon</dt><dd>Drags one wing over a rag</dd><dt>The mender</dt><dd>Works at the end of the borrowed bench</dd><dt>The folding table</dt><dd>A paid disappearance service nearby</dd><dt>The father on the stairs</dt><dd>Stops; the mender stops two steps below</dd></dl><h4>Relationships</h4><ul><li>Nuri → Nuri's bench: lends space</li><li>Nuri → The pigeon: feeds and attends</li><li>The mender → Nuri's bench: uses one end</li><li>The mender → The folding table: points it out to father</li><li>The mender → The father on the stairs: follows with the prayer</li></ul><p class="reading">Shelter for the mender and pigeon coexists with the father's unanswered demand to receive his property.</p></figure>
