			<text x="179.4078125" y="296" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,592) scale(1,-1)">IF HE SIGNS</text>
			<text x="72" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,544) scale(1,-1)">· the identification stands</text>
			<text x="72" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,480) scale(1,-1)">· the body becomes the name</text>
			<text x="80" y="230" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,460) scale(1,-1)">and the name boards the dusk boat</text>
			<text x="72" y="208" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,416) scale(1,-1)">· the fare is paid from the old account</text>
			<text x="80" y="198" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,396) scale(1,-1)">the crossing that was never sold to his</text>
			<text x="80" y="190" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,380) scale(1,-1)">brother</text>
			<text x="72" y="176" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,352) scale(1,-1)">· the declaration of interest is priced</text>
			<text x="80" y="166" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,332) scale(1,-1)">four words a year, while the file is open</text>
			<rect x="370" y="150" width="285" height="160" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="481.38662109375" y="296" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,592) scale(1,-1)">IF HE DOES NOT</text>
			<text x="382" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,544) scale(1,-1)">· the water keeps what it took</text>
			<text x="382" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,480) scale(1,-1)">· a man made entirely of effects</text>
			<text x="390" y="230" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,460) scale(1,-1)">stays that way</text>
			<text x="382" y="208" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,416) scale(1,-1)">· the name remains good for one crossing</text>
			<text x="390" y="198" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,396) scale(1,-1)">his own, later</text>
			<text x="382" y="176" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,352) scale(1,-1)">· and he keeps his four words a year</text>
			<text x="390" y="166" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,332) scale(1,-1)">and the tray goes back on the wall</text>
			<rect x="60" y="58" width="595" height="72" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="72" y="114" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,228) scale(1,-1)">HE THINKS ABOUT IT FOR TWO DAYS, WHICH THE OFFICE ALLOWS. THE WATER IS PATIENT AND THE TRAYS DO NOT SPOIL.</text>
			<text x="72" y="102" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,204) scale(1,-1)">On the third morning he signs. The reader wants the signature against the specimen, and the specimen is a name</text>
			<text x="72" y="92" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,184) scale(1,-1)">in a child’s careful hand, taken the registry winter — each letter placed, not made.</text>
			<text x="72" y="79" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,158) scale(1,-1)">He confirms the identity of the deceased in his own hand, which no file in the city has ever held.</text>
			<text x="72" y="67" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,134) scale(1,-1)">The watch goes with the boat, wound. He retains the dictionary, swollen shut. Under REMARKS he writes nothing.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,64) scale(1,-1)">AT THE DESK THE MAN WINDS A WATCH HE NO LONGER HAS, THE WRIST REMEMBERING THE WEIGHT.</text>
		</g>
	</g>
