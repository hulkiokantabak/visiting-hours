<figure id="figure-52"><a aria-label="Open full-size diagram: 052. The two prospective outcomes of one signature" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-052.svg"><img alt="052. The two prospective outcomes of one signature" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-052.svg" width="842"/></a><figcaption>052. The two prospective outcomes of one signature</figcaption><p>The junior and the officer describe this case; the fare comes from the existing account.</p><div aria-label="Table: 052. The two prospective outcomes of one signature" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">If he confirms the match</th><th scope="col">If he voids the match</th></tr></thead><tbody><tr><th scope="row">Dead brother</th><td>The name goes with the body</td><td>Unidentified; sent to the northern wall</td></tr><tr><th scope="row">Fare</th><td>From the living officer's existing account</td><td>The officer retains the account</td></tr><tr><th scope="row">Living officer</th><td>Takes his brother's place below the reading</td><td>Keeps name and desk; account has a gray margin</td></tr><tr><th scope="row">Separate retention field</th><td>4 words per year while the file remains open</td><td>No alternate fee outcome is specified</td></tr></tbody></table></div><p class="reading">Registration alone is not a universal promise of passage. The fare amount is unstated; four words a year concerns the retention box.</p></figure>
<figure id="figure-53"><a aria-label="Open full-size diagram: 053. Recognition does not settle the registry winter" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-053.svg"><img alt="053. Recognition does not settle the registry winter" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-053.svg" width="842"/></a><figcaption>053. Recognition does not settle the registry winter</figcaption><p>The records and the officer's bodily recognitions disagree without a full childhood account.</p><div aria-label="Table: 053. Recognition does not settle the registry winter" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What the record presents</th><th scope="col">What the officer recognizes</th></tr></thead><tbody><tr><th scope="row">Identity card</th><td>The drowned body bears the officer's name</td><td>He knows his brother's hands</td></tr><tr><th scope="row">Childhood record</th><td>One name continues after the registry visit</td><td>Two boys went in; the household came home fewer</td></tr><tr><th scope="row">Specimen signature</th><td>Letters he has copied for 50 years</td><td>They were written by the drowned fingers</td></tr><tr><th scope="row">Final confirmation</th><td>Reader files under the name it finds</td><td>He writes in his own previously unfiled hand</td></tr></tbody></table></div><p class="reading">Two boys and one continuing name do not establish every detail of the substitution or prove that the register never erred.</p></figure>
<figure id="figure-54"><a aria-label="Open full-size diagram: 054. The watch goes; the dictionary stays" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-054.svg"><img alt="054. The watch goes; the dictionary stays" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-054.svg" width="842"/></a><figcaption>054. The watch goes; the dictionary stays</figcaption><p>The final handling of two effects, followed by a gesture without its object.</p><dl><dt>Effects released for the crossing</dt><dd>One item may be retained against error</dd><dt>Dictionary retained</dt><dd>Still swollen shut; nothing entered under REMARKS</dd><dt>Watch fastened to the brother</dt><dd>The officer punches a new strap hole and closes the buckle</dd><dt>Watch leaves wound</dt><dd>It goes on the wrist to which it was promised</dd><dt>Officer at the desk</dt><dd>He winds a watch that is no longer there</dd></dl><h4>Relationships</h4><ul><li>Effects released for the crossing → Dictionary retained: one item stays</li><li>Effects released for the crossing → Watch fastened to the brother: watch goes with the body</li><li>Watch fastened to the brother → Watch leaves wound: crossing</li><li>Watch leaves wound → Officer at the desk: gesture persists afterward (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">The record retains the dictionary, while the officer's wrist keeps an action. Neither preservation opens the unreadable book.</p></figure>
