<figure id="figure-133"><a aria-label="Open full-size diagram: 133. What the last recording preserves" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-133.svg"><img alt="133. What the last recording preserves" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-133.svg" width="842"/></a><figcaption>133. What the last recording preserves</figcaption><p>Her bodily memory does not match the post-stroke recording.</p><div aria-label="Table: 133. What the last recording preserves" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">On the drive</th><th scope="col">In her listening</th></tr></thead><tbody><tr><th scope="row">Speech</th><td>Fluent reading after the stroke</td><td>Her mouth supplies an absent stumble</td></tr><tr><th scope="row">Interruptions</th><td>Two remarks outside the book</td><td>She plays the drive twice</td></tr><tr><th scope="row">Family knowledge</th><td>A voice in the cataloged lot</td><td>She does not play it for her brothers</td></tr></tbody></table></div><p class="reading">The difference is observed; the source of the flawless reading remains unsettled.</p></figure>
<figure id="figure-134"><a aria-label="Open full-size diagram: 134. A claim surviving destruction" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-134.svg"><img alt="134. A claim surviving destruction" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-134.svg" width="842"/></a><figcaption>134. A claim surviving destruction</figcaption><p>Responses are shown in narrated order, not a dated causal chain.</p><dl><dt>Night before sale</dt><dd>The siblings burn the drives.</dd><dt>Sale morning</dt><dd>Lot 31 is withdrawn; a withdrawal charge follows.</dd><dt>Within the week</dt><dd>The photographer also captures her raised finger.</dd><dt>A week later</dt><dd>A client offers the full reserve for the residue.</dd><dt>Renewal marked</dt><dd>His autumn renewal is marked for review; no reason is given.</dd><dt>Summer letter</dt><dd>The offer remains open; she has dug the ash into the beans.</dd></dl><p class="reading">The elder brother's review has no stated reason. Chronology alone does not prove retaliation.</p></figure>
<figure id="figure-135"><a aria-label="Open full-size diagram: 135. Three forms of an inheritance" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-135.svg"><img alt="135. Three forms of an inheritance" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-135.svg" width="842"/></a><figcaption>135. Three forms of an inheritance</figcaption><p>Destruction, concealment and cultivation have different results.</p><div aria-label="Table: 135. Three forms of an inheritance" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Material</th><th scope="col">What the family does</th><th scope="col">What remains</th></tr></thead><tbody><tr><th scope="row">Voice drives</th><td>Burned one by one</td><td>The drives can no longer yield what could have been made from them; the residue remains claimed</td></tr><tr><th scope="row">Ash</th><td>Dug into the bean row</td><td>A reserve-price claim remains open</td></tr><tr><th scope="row">Paper albums</th><td>Kept hidden under the daughter's bed</td><td>Not included in this catalog</td></tr><tr><th scope="row">Beans</th><td>Grow through the cultivated ash</td><td>Growth does not close the offer</td></tr></tbody></table></div><p class="reading">Uncataloged is not the same as inherently unpriceable or beyond every possible claim.</p></figure>
