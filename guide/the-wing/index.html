			<text x="450.54541015625" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 17px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,256) scale(1,-1)">37</text>
			<text x="198.87768554687497" y="106" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,212) scale(1,-1)">sixty-eight · the vote is taken by moving to one side of the yard or the other, which is how a count is honest</text>
			<rect x="60" y="40" width="600" height="42" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="72" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,114) scale(1,-1)">They begin, and are unfailingly kind, and get through it. Nobody says goodbye at any length —</text>
			<text x="72" y="47" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,94) scale(1,-1)">the goodbyes being for people who are going somewhere.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,56) scale(1,-1)">THEY VOTED AFTER LEARNING THE COUNTING HAD ALREADY HAPPENED.</text>
