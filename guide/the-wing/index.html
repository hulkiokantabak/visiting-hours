<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Wing · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-wing/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-wing/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-wing/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-wing/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-25"><h1>25. The Wing</h1>
<figure id="figure-73"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-073.svg"><img alt="073. Shelter has daily work" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-073.svg" width="842"/></a><figcaption>073. Shelter has daily work</figcaption><p>The wing's protections stand beside the work and limits of maintaining them.</p><div aria-label="Table: 073. Shelter has daily work" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What the wing provides</th><th scope="col">What must still be done</th></tr></thead><tbody><tr><th scope="row">Walls</th><td>Confirmations and corrections do not pass through</td><td>People carry flour nine hundred meters</td></tr><tr><th scope="row">School</th><td>Two hours each morning, without a register</td><td>Families have left over schooling</td></tr><tr><th scope="row">Care</th><td>A doctor visits twice monthly, unpaid</td><td>Pipe fittings are no longer made</td></tr><tr><th scope="row">Learning</th><td>The plumber asks who will learn</td><td>Two people eventually get up and go with him</td></tr><tr><th scope="row">Outside offer</th><td>A real hardship tier and return to the rolls</td><td>The visit is recorded even if the gate stays shut</td></tr></tbody></table></div><p class="reading">Help inside the wing remains real; neither the hardship offer nor opposition literature answers every need.</p></figure>
<figure id="figure-74"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-074.svg"><img alt="074. The yard divides; the sides are unnamed" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-074.svg" width="842"/></a><figcaption>074. The yard divides; the sides are unnamed</figcaption><p>Counts of people at the fire and in the yard; 31 plus 37 equals 68.</p><p>people</p><div aria-label="Table: 074. The yard divides; the sides are unnamed" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Count read at the fire</th><td>68</td><td>Before the visit and argument</td></tr><tr><th scope="row">By the gate at the vote</th><td>31</td><td>The position is given; its vote is not labeled</td></tr><tr><th scope="row">At the wall at the vote</th><td>37</td><td>The position is given; its vote is not labeled</td></tr></tbody></table></div><p class="reading">The gate opens later. The story does not label the sides, announce a winning motion or identify who opens it.</p></figure>
<figure id="figure-75"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-075.svg"><img alt="075. Numbers do different jobs" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-075.svg" width="842"/></a><figcaption>075. Numbers do different jobs</figcaption><p>Separate a headcount, a household register and a count of counting occasions.</p><div aria-label="Table: 075. Numbers do different jobs" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Number</th><th scope="col">Unit</th><th scope="col">Use in the story</th></tr></thead><tbody><tr><th scope="row">68</th><td>People</td><td>Read at the fire, chalked up, then rubbed off</td></tr><tr><th scope="row">31</th><td>Counting occasions</td><td>Someone has kept this total; earlier purposes withheld</td></tr><tr><th scope="row">19</th><td>Households</td><td>Registered by the visitors before dark</td></tr><tr><th scope="row">68</th><td>The retained wall number</td><td>Left unread that night; later explained to a child</td></tr></tbody></table></div><p class="reading">Nineteen households cannot be subtracted from sixty-eight people. The old wall number later needs explaining.</p></figure>
