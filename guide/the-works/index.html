<figure id="figure-49"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-049.svg"><img alt="049. Records beside a counted height" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-049.svg" width="842"/></a><figcaption>049. Records beside a counted height</figcaption><p>Compare the records printed in this story.</p><div aria-label="Table: 049. Records beside a counted height" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Record or observation</th><th scope="col">Floor count</th><th scope="col">Immediate consequence</th></tr></thead><tbody><tr><th scope="row">Lift sheet</th><td>19</td><td>Names the rescue unauthorized</td></tr><tr><th scope="row">Measures card</th><td>23</td><td>Engineer turns it face down; Sava turns it back</td></tr><tr><th scope="row">Crew lift log</th><td>23</td><td>Driver records the floor in the unpaid shared log</td></tr><tr><th scope="row">Fence notice</th><td>19</td><td>Unchanged when he leaves</td></tr><tr><th scope="row">Driver's evening count</th><td>23 lit floors</td><td>He counts again</td></tr></tbody></table></div><p class="reading">The count matters because the cage must rise beyond 19 to reach the men; competing documents do not make their rescue merely notional.</p></figure>
<figure id="figure-50"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-050.svg"><img alt="050. A height dispute becomes a rescue cost" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-050.svg" width="842"/></a><figcaption>050. A height dispute becomes a rescue cost</figcaption><p>Actions follow narrative order; the deduction is the engineer's recorded penalty.</p><dl><dt>The engineer's denial</dt><dd>Nobody above 19, despite the voice over the radio</dd><dt>Finger against the glass</dt><dd>He points above the cage and says it is too low</dd><dt>The cage raised</dt><dd>Three men come down, one with an injured foot</dd><dt>Adverse lift sheet</dt><dd>19; unauthorized lift; 3 hours' pay deducted</dd><dt>The driver signs</dt><dd>The engineer acknowledges descent, not the disputed height</dd></dl><h4>Relationships</h4><ul><li>The engineer's denial → Finger against the glass: driver demands a location</li><li>Finger against the glass → The cage raised: driver raises the cage</li><li>The cage raised → Adverse lift sheet: engineer records penalty</li><li>Adverse lift sheet → The driver signs: signature follows</li></ul><p class="reading">Three men return to the ground, while the driver loses three hours' pay. The rescue does not force the record to acknowledge its height.</p></figure>
<figure id="figure-51"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-051.svg"><img alt="051. Height is defended; pay is left unwitnessed" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-051.svg" width="842"/></a><figcaption>051. Height is defended; pay is left unwitnessed</figcaption><p>Sava contests one jurisdiction and does not take up the driver's next request.</p><div aria-label="Table: 051. Height is defended; pay is left unwitnessed" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Official or professional act</th><th scope="col">Limit of the act</th></tr></thead><tbody><tr><th scope="row">Engineer</th><td>Claims attendance and records 19</td><td>Saw the cage return but refuses the driver's account</td></tr><tr><th scope="row">Sava</th><td>Asserts height and restores his 23 card face up</td><td>Does not witness the pay deduction</td></tr><tr><th scope="row">Driver</th><td>Adds 23 to the workers' log</td><td>Still signs the adverse sheet</td></tr><tr><th scope="row">Workers' log</th><td>Carries years of floors in their own hands</td><td>No protection from amendment or reprisal is guaranteed</td></tr></tbody></table></div><p class="reading">A competing card is limited help. Sava's motives for withholding witness remain unstated.</p></figure>
