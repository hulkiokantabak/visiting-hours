			<text x="490" y="190" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,380) scale(1,-1)">· it came down in the second year</text>
			<text x="490" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,328) scale(1,-1)">· and was not replaced</text>
			<text x="490" y="138" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,276) scale(1,-1)">· the man from the counterparty</text>
			<text x="490" y="130" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,260) scale(1,-1)">thanked them and left</text>
			<rect x="60" y="56" width="600" height="46" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="72" y="86" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,172) scale(1,-1)">ELEVEN YEARS IS A LONG TIME TO BE PAID TO LIFT THINGS INTO A SHAPE NOBODY WILL NAME.</text>
			<text x="72" y="75" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,150) scale(1,-1)">He has stopped saying the number out loud at home. He can retire in four with the site pension,</text>
			<text x="72" y="65" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,130) scale(1,-1)">which is a real thing and pays on the day, and the crane will go to the boy who is better at it.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,64) scale(1,-1)">THE SITE KNOWS EXACTLY WHAT IT IS BUILDING AND HAS NEVER ONCE BEEN TOLD.</text>
		</g>
	</g>
</svg>

			<text x="330" y="298" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,596) scale(1,-1)">nineteen</text>

			<text x="330" y="246" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,492) scale(1,-1)">nineteen</text>

			<text x="330" y="142" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,284) scale(1,-1)">the wrong numbers</text>

			<text x="72" y="75" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,150) scale(1,-1)">It goes back years, the numbers are in the men’s own hands, and they are the wrong numbers —</text>
