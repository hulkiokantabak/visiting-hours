<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Press Nine · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/press-nine/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/press-nine/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/press-nine/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/press-nine/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-44"><h1>44. Press Nine</h1>
<figure id="figure-130"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-130.svg"><img alt="130. The options he actually uses" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-130.svg" width="842"/></a><figcaption>130. The options he actually uses</figcaption><p>His path through the call, with the repeated option loop.</p><dl><dt>3 - Report a fault</dt><dd>The late laugh conforms to the licensed profile.</dd><dt>0 - Speak to someone</dt><dd>A held place becomes You have left the queue.</dd><dt>4 - Estates</dt><dd>The counterparty does not take calls.</dd><dt>5 - Say the name</dt><dd>The name opens another set of options.</dd><dt>2 - Hear the voice</dt><dd>The sample stops before the first word.</dd><dt>9 - Repeat options</dt><dd>The worn key returns him to the menu.</dd></dl><h4>Relationships</h4><ul><li>3 - Report a fault → 0 - Speak to someone: next selected option</li><li>0 - Speak to someone → 4 - Estates: next selected option</li><li>4 - Estates → 5 - Say the name: next selected option</li><li>5 - Say the name → 2 - Hear the voice: sample selected</li><li>2 - Hear the voice → 9 - Repeat options: options repeated</li><li>9 - Repeat options → 9 - Repeat options: press nine again</li></ul><p class="reading">This traces the story's selected keys, not the service's complete menu.</p></figure>
<figure id="figure-131"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-131.svg"><img alt="131. Free access, limited contact" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-131.svg" width="842"/></a><figcaption>131. Free access, limited contact</figcaption><p>No call charge does not mean unrestricted access to the person.</p><div aria-label="Table: 131. Free access, limited contact" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What is offered</th><th scope="col">What the caller receives</th></tr></thead><tbody><tr><th scope="row">The call</th><td>Free calls</td><td>Repeated menus</td></tr><tr><th scope="row">The person</th><td>A route through estates and residuals</td><td>Recorded apology counted as contact</td></tr><tr><th scope="row">The voice</th><td>One sample per calendar year</td><td>Breath before the first word</td></tr><tr><th scope="row">After playback</th><td>An option to repeat the menu</td><td>The sample has been used</td></tr></tbody></table></div><p class="reading">The annual sample is consumed; the story does not say that his whole year is lost.</p></figure>
<figure id="figure-132"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-132.svg"><img alt="132. Memory held in surfaces" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-132.svg" width="842"/></a><figcaption>132. Memory held in surfaces</figcaption><p>Objects register familiarity without identifying the waiting man.</p><dl><dt>The caller</dt><dd>His body already knows the quiet-box.</dd><dt>Stool</dt><dd>Knees remember its position.</dd><dt>Door</dt><dd>Varnish covers old initials.</dd><dt>Key</dt><dd>Still in his pocket after the sample.</dd><dt>Nine</dt><dd>Repeated pressing has worn away the number.</dd><dt>Waiting man</dt><dd>Visible beyond the glass; his role is not stated.</dd></dl><h4>Relationships</h4><ul><li>The caller → Stool: familiar contact</li><li>The caller → Door: known surface</li><li>The caller → Key: carries</li><li>The caller → Nine: presses repeatedly</li><li>Waiting man → The caller: waits outside</li></ul><p class="reading">Wear suggests repetition, but supplies no exact duration or proof of the waiting man's role.</p></figure>
