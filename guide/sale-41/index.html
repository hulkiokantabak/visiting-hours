<figure id="figure-61"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-061.svg"><img alt="061. Breath across three measurements" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-061.svg" width="842"/></a><figcaption>061. Breath across three measurements</figcaption><p>Lot 4 is measured in minutes at three named stages.</p><p>minutes</p><div aria-label="Table: 061. Breath across three measurements" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Cataloging</th><td>41</td><td>Breath between verses</td></tr><tr><th scope="row">Printing</th><td>44</td><td>The house cannot account for accrual</td></tr><tr><th scope="row">Close of sale</th><td>46</td><td>No warrant of a final state</td></tr></tbody></table></div><p class="reading">The readings increase; neither the cause nor a final duration is supplied.</p></figure>
<figure id="figure-62"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-062.svg"><img alt="062. A claim does not have one outcome" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-062.svg" width="842"/></a><figcaption>062. A claim does not have one outcome</figcaption><p>Three family interventions meet three distinct catalog outcomes.</p><div aria-label="Table: 062. A claim does not have one outcome" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Lot</th><th scope="col">Family action</th><th scope="col">Recorded outcome</th></tr></thead><tbody><tr><th scope="row">7</th><td>Corrects a guest's laugh attributed to the singer</td><td>Correction noted; lot sold remotely</td></tr><tr><th scope="row">12</th><td>Reserves silence at the sealed viewing</td><td>Sold sealed and unopened; silence exercised</td></tr><tr><th scope="row">21</th><td>Rejects both attempted descriptions</td><td>Item withdrawn from sale during description</td></tr></tbody></table></div><p class="reading">Silence, correction and withdrawal are different acts; none establishes complete control of the estate.</p></figure>
<figure id="figure-63"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-063.svg"><img alt="063. The coat and the unsent message" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-063.svg" width="842"/></a><figcaption>063. The coat and the unsent message</figcaption><p>Relations created by the purchaser's request, not a map of completed delivery.</p><dl><dt>Lot 23: the winter coat</dt><dd>Sold at the reserve</dd><dt>Paddle 44</dt><dd>Purchases the coat</dd><dt>Lot 20</dt><dd>An unsent message, sold remotely</dd><dt>The message's addressee</dt><dd>Requested destination; no arrival shown</dd><dt>Auction house</dt><dd>Asked whether delivery was included</dd></dl><h4>Relationships</h4><ul><li>Paddle 44 → Lot 23: the winter coat: purchases</li><li>Lot 20 → The message's addressee: has an addressee</li><li>Lot 23: the winter coat → The message's addressee: delivery requested (reported, incomplete, disputed or interpretive connection)</li><li>Paddle 44 → Auction house: asks about delivery</li></ul><p class="reading">The request connects separate lots. The addressee receives nothing within the narrated record.</p></figure>
