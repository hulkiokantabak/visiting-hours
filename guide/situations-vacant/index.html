<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Situations Vacant · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/situations-vacant/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/situations-vacant/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/situations-vacant/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/situations-vacant/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-46"><h1>46. Situations Vacant</h1>
<figure id="figure-136"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-136.svg"><img alt="136. The removed post and the arrival" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-136.svg" width="842"/></a><figcaption>136. The removed post and the arrival</figcaption><p>The board's response does not explain how the helper finds them.</p><div aria-label="Table: 136. The removed post and the arrival" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Public posting</th><th scope="col">Private response</th></tr></thead><tbody><tr><th scope="row">Need</th><td>A Thursday sitter; nine years of care</td><td>A woman arrives on Thursday</td></tr><tr><th scope="row">Published result</th><td>61 views; 0 applications; removed, code 4</td><td>Her route to the address is not explained</td></tr><tr><th scope="row">Practical relief</th><td>The daughter cannot offer the standard rate</td><td>Careful turning and an hour outside</td></tr></tbody></table></div><p class="reading">Zero applications on the board does not prove the helper used it, or establish who sent her.</p></figure>
<figure id="figure-137"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-137.svg"><img alt="137. The room becomes an interview room" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-137.svg" width="842"/></a><figcaption>137. The room becomes an interview room</figcaption><p>A relation map of access, applications and competing authority.</p><dl><dt>Kitchen and bedroom</dt><dd>Care and a proposed hiring process occupy the same space.</dd><dt>Helper</dt><dd>Asks for the key; brings the applications.</dd><dt>Daughter</dt><dd>Takes down the spare and holds the forms.</dd><dt>Occupied Office posts</dt><dd>Their current workers must also apply.</dd><dt>Former rejecting clerk</dt><dd>Arrives as an applicant with his own pen.</dd></dl><h4>Relationships</h4><ul><li>Helper → Kitchen and bedroom: obtains access</li><li>Helper → Occupied Office posts: claims to fill early (reported, incomplete, disputed or interpretive connection)</li><li>Daughter → Occupied Office posts: offered RETAIN / DISMISS (reported, incomplete, disputed or interpretive connection)</li><li>Former rejecting clerk → Kitchen and bedroom: comes for interview</li><li>Helper → Daughter: leaves her to answer</li></ul><p class="reading">The process claims the power to retain or dismiss; its practical reach is not established.</p></figure>
<figure id="figure-138"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-138.svg"><img alt="138. Turning is not the same task twice" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-138.svg" width="842"/></a><figcaption>138. Turning is not the same task twice</figcaption><p>The mother interrupts the uses made of her care.</p><div aria-label="Table: 138. Turning is not the same task twice" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">The helper's first visit</th><th scope="col">The clerk's attempted lift</th></tr></thead><tbody><tr><th scope="row">Question</th><td>Asks the mother which side hurts</td><td>The mother has to demand a question</td></tr><tr><th scope="row">Handling</th><td>Turns her without chilling the sheet</td><td>Moves too quickly; she catches his sleeve</td></tr><tr><th scope="row">The daughter</th><td>Receives an hour outside</td><td>Falsely says her hands are wet</td></tr><tr><th scope="row">Authority</th><td>Attention begins with the mother's answer</td><td>The pen is raised; the mother stops the lift</td></tr></tbody></table></div><p class="reading">Her final request is Ask me which side; the diagram does not decide why that side matters.</p></figure>
