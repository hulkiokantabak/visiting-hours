<figure id="figure-151"><a aria-label="Open full-size diagram: 151. Stopping one thing leaves another running" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-151.svg"><img alt="151. Stopping one thing leaves another running" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-151.svg" width="842"/></a><figcaption>151. Stopping one thing leaves another running</figcaption><p>Controls and interruptions act on different parts of the event.</p><div aria-label="Table: 151. Stopping one thing leaves another running" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Intended or announced</th><th scope="col">What happens</th></tr></thead><tbody><tr><th scope="row">Pedal</th><td>Rauf tries the rehearsal's DOWN control</td><td>The canvas climbs; the electrician shouts UP</td></tr><tr><th scope="row">Pulled plug</th><td>Rauf tries to stop the danger</td><td>Projected faces vanish; the motor still runs</td></tr><tr><th scope="row">Audience order</th><td>Families are told to remain standing</td><td>A woman later orders them to sit for access</td></tr><tr><th scope="row">After the fall</th><td>The observance's microphone is restored</td><td>Lida is breathing and hurt on the boards</td></tr></tbody></table></div><p class="reading">This compares observed results; it is not a complete electrical or stage plan.</p></figure>
<figure id="figure-152"><a aria-label="Open full-size diagram: 152. Scissors through a learned game" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-152.svg"><img alt="152. Scissors through a learned game" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-152.svg" width="842"/></a><figcaption>152. Scissors through a learned game</figcaption><p>The cutting tool changes hands and mouths before it can be used.</p><dl><dt>Woman's bag</dt><dd>Kitchen scissors come from the front row.</dd><dt>Rauf's occupied hands</dt><dd>He cannot take them; they fall.</dd><dt>Biscuit's mouth</dt><dd>The dog takes the plastic handles and backs away.</dd><dt>Learned return</dt><dd>Rauf uses praise; Biscuit comes within reach.</dd><dt>Rauf's teeth</dt><dd>He catches the handles.</dd><dt>Woman's hand</dt><dd>She takes the scissors and cuts canvas, then sleeve.</dd></dl><h4>Relationships</h4><ul><li>Woman's bag → Rauf's occupied hands: offered</li><li>Rauf's occupied hands → Biscuit's mouth: dropped and taken</li><li>Biscuit's mouth → Learned return: a familiar game</li><li>Learned return → Rauf's teeth: within reach</li><li>Rauf's teeth → Woman's hand: tool transferred</li></ul><p class="reading">The delay connects a learned game to danger; it does not make Biscuit a deliberate saboteur.</p></figure>
<figure id="figure-153"><a aria-label="Open full-size diagram: 153. What the microphone makes public" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-153.svg"><img alt="153. What the microphone makes public" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-153.svg" width="842"/></a><figcaption>153. What the microphone makes public</figcaption><p>Spoken framing and the body's evidence occupy the same event.</p><div aria-label="Table: 153. What the microphone makes public" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Public action</th><th scope="col">Bodily event</th><th scope="col">Disparity</th></tr></thead><tbody><tr><th scope="row">Microphone thanks Lida for all-clear</th><td>Rauf had said ready while Lida was beneath the shroud</td><td>Readiness is credited to a different person</td></tr><tr><th scope="row">Director warns about the sewn names</th><td>Rauf is holding Lida as her sleeve winds in</td><td>Preserved lettering competes with access to her</td></tr><tr><th scope="row">Woman takes the microphone</th><td>Asks the audience to sit so help can pass</td><td>Speech changes from ceremony to injury</td></tr><tr><th scope="row">Director covers the opened blouse</th><td>Pulls the microphone from Lida's mouth</td><td>Protection and control occur together</td></tr></tbody></table></div><p class="reading">The final gesture combines covering Lida with moving the microphone away; motive is not diagnosed.</p></figure>
