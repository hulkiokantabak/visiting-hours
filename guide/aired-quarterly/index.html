<figure id="figure-139"><a aria-label="Open full-size diagram: 139. Maintenance outlasts an expected visit" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-139.svg"><img alt="139. Maintenance outlasts an expected visit" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-139.svg" width="842"/></a><figcaption>139. Maintenance outlasts an expected visit</figcaption><p>The room's records and its material life keep different time.</p><div aria-label="Table: 139. Maintenance outlasts an expected visit" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Measure or record</th><th scope="col">What it establishes</th><th scope="col">What it does not settle</th></tr></thead><tbody><tr><th scope="row">Eleven years paid</th><td>The account is current</td><td>What happened during each visit</td></tr><tr><th scope="row">Monthly, then quarterly</th><td>A changed airing schedule</td><td>A stopped or empty working life</td></tr><tr><th scope="row">Expected date: second year</th><td>An early expectation remains in the file</td><td>The date of a future return</td></tr><tr><th scope="row">Spring strips</th><td>The keeper says she always renews them</td><td>What the owner will choose after the coat</td></tr></tbody></table></div><p class="reading">Eleven paid years and an old expected date coexist; no exact year of this visit is supplied.</p></figure>
<figure id="figure-140"><a aria-label="Open full-size diagram: 140. A window under two instructions" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-140.svg"><img alt="140. A window under two instructions" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-140.svg" width="842"/></a><figcaption>140. A window under two instructions</figcaption><p>The keeper acts between the surveyor's notice and Meral's call.</p><div aria-label="Table: 140. A window under two instructions" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Instruction or request</th><th scope="col">What the keeper does</th></tr></thead><tbody><tr><th scope="row">Surveyor</th><td>Keep the windows shut pending inspection</td><td>Pushes this window wider</td></tr><tr><th scope="row">Meral</th><td>The room still needs airing</td><td>Continues the room's airing</td></tr><tr><th scope="row">Documentation</th><td>Meral asks to keep the call off the form</td><td>The keeper says she put it on</td></tr></tbody></table></div><p class="reading">Meral is the care liaison on the phone, not an identified name for the keeper.</p></figure>
<figure id="figure-141"><a aria-label="Open full-size diagram: 141. The bed acquires another afternoon" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-141.svg"><img alt="141. The bed acquires another afternoon" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-141.svg" width="842"/></a><figcaption>141. The bed acquires another afternoon</figcaption><p>The offer of rest is negotiated through small actions.</p><dl><dt>Shared folding</dt><dd>Both hold the sheet; she describes sleeping in her kitchen.</dd><dt>Rest offered</dt><dd>He imagines a life in the room beyond his knowledge.</dd><dt>Shoe undone</dt><dd>She sits; he takes the coat from its hanger.</dd><dt>Make it as it was</dt><dd>She reaches for the shoe after his request.</dd><dt>Not now</dt><dd>He clarifies; the shoe stays on the floor.</dd><dt>A sound below</dt><dd>He stops on the stairs until the bed settles.</dd></dl><h4>Relationships</h4><ul><li>Shared folding → Rest offered: an offer</li><li>Rest offered → Shoe undone: taken up</li><li>Shoe undone → Make it as it was: condition voiced</li><li>Make it as it was → Not now: timing clarified</li><li>Not now → A sound below: he leaves with the coat</li></ul><p class="reading">Rest becomes possible without erasing his wish to control how the room is left.</p></figure>
