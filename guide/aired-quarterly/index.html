			<text x="280" y="104" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,208) scale(1,-1)">year twelve: attended. bed: sat on. strips: due spring.</text>
			<text x="280" y="94" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,188) scale(1,-1)">AS YEAR ELEVEN</text>
			<rect x="60" y="44" width="600" height="46" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="74" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,148) scale(1,-1)">THE VISIT IS FILED BEFORE IT HAPPENS. THE FORM ALREADY KNOWS IT WILL READ: AS YEAR ELEVEN.</text>
			<text x="74" y="63" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,126) scale(1,-1)">Nobody does anything to him. A building waits, correctly, at a reduced schedule, and bills, and the drop from</text>
			<text x="74" y="53" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,106) scale(1,-1)">monthly to quarterly is dated to the same year as the Thursday nobody crossed out.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,56) scale(1,-1)">HOLDING, STANDARD RATE, ELEVEN YEARS, PAID IN FULL AND CURRENT. NOTHING WAS OWED.</text>
		</g>
	</g>
