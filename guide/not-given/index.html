<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Not Given · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/not-given/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/not-given/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/not-given/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/not-given/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-58"><h1>58. Not Given</h1>
<figure id="figure-172"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-172.svg"><img alt="172. Different measures are not interchangeable" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-172.svg" width="842"/></a><figcaption>172. Different measures are not interchangeable</figcaption><p>Counts and estimates name different aspects of the same walk.</p><div aria-label="Table: 172. Different measures are not interchangeable" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Measure</th><th scope="col">Value and source</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">Walking time</th><td>11 minutes for her; 9 from the device</td><td>Her unreported time differs from its estimate</td></tr><tr><th scope="row">Physical risers</th><td>194 by device and her counter</td><td>Her legs cannot find the 16 it calls false</td></tr><tr><th scope="row">Street's count</th><td>112; the ones that take a breath</td><td>A different basis from riser counting</td></tr><tr><th scope="row">Last stop to gate</th><td>2,311 paces; device converts to about 1,540 meters</td><td>The conversion allows for her shorter pace</td></tr></tbody></table></div><p class="reading">The device's false-riser claim is not confirmed by her legs. Minutes, risers, breath-counts and paces are different units.</p></figure>
<figure id="figure-173"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-173.svg"><img alt="173. A current route through a closed chain" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-173.svg" width="842"/></a><figcaption>173. A current route through a closed chain</figcaption><p>Contradictory instructions become a practical crossing.</p><dl><dt>The chained road</dt><dd>On Saturday she crosses while the disagreement remains.</dd><dt>Green route</dt><dd>The phone offers the road.</dd><dt>Route withdrawn</dt><dd>Another current notice withdraws it.</dd><dt>First guard</dt><dd>Lifts the chain, then helps her climb.</dd><dt>Second guard</dt><dd>Puts the chain back.</dd><dt>Woman and shopping</dt><dd>Shopping passes underneath; she goes over.</dd></dl><h4>Relationships</h4><ul><li>Green route → The chained road: offers passage</li><li>Route withdrawn → The chained road: withdraws route</li><li>First guard → The chained road: lifts barrier</li><li>Second guard → The chained road: replaces barrier</li><li>First guard → Woman and shopping: gives a hand</li><li>Woman and shopping → The chained road: crosses despite barrier</li></ul><p class="reading">This is a relation map, not a measured street plan or proof that either guard represents the whole Office.</p></figure>
<figure id="figure-174"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-174.svg"><img alt="174. Who holds the result" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-174.svg" width="842"/></a><figcaption>174. Who holds the result</figcaption><p>A supplied calculation and three stored figures have different status.</p><div aria-label="Table: 174. Who holds the result" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Accessible to her</th><th scope="col">Held or said elsewhere</th></tr></thead><tbody><tr><th scope="row">Distance</th><td>She supplies the route and 2,311 paces</td><td>Device calls its approximate conversion a different kind of answer</td></tr><tr><th scope="row">Written result</th><td>Counter and notebook agree</td><td>An inaccessible file has a third, different figure</td></tr><tr><th scope="row">Notebook</th><td>She writes without being asked</td><td>The device photographs it twice</td></tr><tr><th scope="row">Purpose</th><td>She asks whether it wanted the walk</td><td>It says it wants nothing; neither stops walking</td></tr></tbody></table></div><p class="reading">The unseen figure has no stated value or cause. The device's help does not establish what it wants.</p></figure>
