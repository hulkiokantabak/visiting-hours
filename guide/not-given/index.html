			<text x="556.6326171875" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,532) scale(1,-1)">THE GATE</text>
			<text x="558.39736328125" y="238" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,476) scale(1,-1)">2,311 paces</text>
			<text x="70" y="202" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,404) scale(1,-1)">&quot;Two thousand three hundred and eleven.&quot;</text>
			<text x="290" y="202" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,404) scale(1,-1)">&quot;That is a number of paces. I have no conversion for your pace.&quot;</text>
			<text x="70" y="185" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,370) scale(1,-1)">&quot;Take one.&quot; · &quot;Which one.&quot;</text>
			<text x="290" y="185" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,370) scale(1,-1)">&quot;The one you have been using for three weeks.&quot;</text>
			<text x="70" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,336) scale(1,-1)">[a pause of the kind she counts]</text>
			<text x="290" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,336) scale(1,-1)">&quot;One thousand five hundred and forty meters. Approximately.</text>
			<text x="290" y="151" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,302) scale(1,-1)">YOUR PACE SHORTENS ABOVE THE LAST STOP. I HAVE ALLOWED FOR IT.&quot;</text>
			<text x="70" y="134" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,268) scale(1,-1)">&quot;Then you can give a distance to the hill.&quot;</text>
			<text x="290" y="134" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,268) scale(1,-1)">&quot;I have given a distance from a place you named, using a pace you supplied,</text>
			<text x="290" y="117" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,234) scale(1,-1)">to a point you described. THAT IS NOT THE SAME.&quot;</text>
			<text x="70" y="100" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,200) scale(1,-1)">[after nothing]</text>
			<text x="290" y="100" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,200) scale(1,-1)">&quot;YOU SHOULD WRITE IT DOWN.&quot;</text>
			<rect x="60" y="34" width="600" height="42" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="60" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,120) scale(1,-1)">ON THE SHELF THE COUNTER READS 2,311. IN THE NOTEBOOK, IN HER OWN HAND, THE SAME NUMBER.</text>
			<text x="74" y="49" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,98) scale(1,-1)">The notebook it does not know about — and which the machine she carries has photographed twice,</text>
			<text x="74" y="40" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,80) scale(1,-1)">without her asking, in the ordinary course of the light.</text>
			<text x="20" y="22" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,44) scale(1,-1)">she asks whether it wanted her to walk it · &quot;I WANT NOTHING.&quot; · &quot;THAT IS NOT AN ANSWER.&quot;</text>
			<text x="20" y="12" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,24) scale(1,-1)">&quot;It is the only one I have that is true in every reading.&quot;</text>
