<figure id="figure-31"><a aria-label="Open full-size diagram: 031. The band and the body separate" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-031.svg"><img alt="031. The band and the body separate" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-031.svg" width="842"/></a><figcaption>031. The band and the body separate</figcaption><p>Track whose band each person wears, not an invented balance in money.</p><div aria-label="Table: 031. The band and the body separate" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">On his body</th><th scope="col">On her body</th></tr></thead><tbody><tr><th scope="row">Before the crush</th><td>His band turns bright on the second round</td><td>No opening balance is stated</td></tr><tr><th scope="row">After the crush</th><td>Her dark band, narrow enough to bite</td><td>His bright band, carrying his debt</td></tr><tr><th scope="row">Spending</th><td>He uses her balance for expensive hours</td><td>She wears his lack of money</td></tr><tr><th scope="row">Selection</th><td>The room selects her band on him</td><td>Her bodily response interrupts his reach</td></tr><tr><th scope="row">Dawn</th><td>Bands returned</td><td>Bands returned</td></tr></tbody></table></div><p class="reading">The band exchange redistributes spending access. It does not establish equal agreement to sell the night's recording.</p></figure>
<figure id="figure-32"><a aria-label="Open full-size diagram: 032. Touch is not one continuous permission" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-032.svg"><img alt="032. Touch is not one continuous permission" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-032.svg" width="842"/></a><figcaption>032. Touch is not one continuous permission</figcaption><p>The story places three encounters together without making their consent equivalent.</p><div aria-label="Table: 032. Touch is not one continuous permission" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Encounter</th><th scope="col">His action</th><th scope="col">Her response</th></tr></thead><tbody><tr><th scope="row">Old water stairs</th><td>Asks at her hips</td><td>Answers</td></tr><tr><th scope="row">Free glass for the recorded night</th><td>Reaches for the drink</td><td>Closes a hand on his wrist; he uses the other hand</td></tr><tr><th scope="row">Watching their recorded intimacy</th><td>Finds her waistband with his thumb</td><td>Catches it there</td></tr><tr><th scope="row">Later queue</th><td>Returns to the entrance</td><td>They both pay to enter again</td></tr></tbody></table></div><p class="reading">The later stopping gestures trouble the shared return to the club; the diagram does not decide her final motives.</p></figure>
<figure id="figure-33"><a aria-label="Open full-size diagram: 033. A room that plays, records and gives water" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-033.svg"><img alt="033. A room that plays, records and gives water" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-033.svg" width="842"/></a><figcaption>033. A room that plays, records and gives water</figcaption><p>Relations within the Tank; spatial placements are schematic, not to scale.</p><dl><dt>The Tank</dt><dd>Drained cistern; 40 columns transmit bass</dd><dt>Entrance</dt><dd>Bands display spending; a boy is refused over something in his blood.</dd><dt>Old water stairs</dt><dd>Behind the third column; an intimate encounter</dd><dt>Bar</dt><dd>A free glass buys the whole recorded night</dd><dt>Wall above the bar</dt><dd>Bought nights play through the week</dd><dt>Saucer</dt><dd>The barman replaces tips with water for the tortoise</dd></dl><h4>Relationships</h4><ul><li>The Tank → Entrance: entry control</li><li>The Tank → Old water stairs: stairs behind column 3</li><li>The Tank → Bar: recording transaction</li><li>Bar → Wall above the bar: licensed to keep and show</li><li>Bar → Saucer: the barman's action</li></ul><p class="reading">The room's transactions coexist with a small act of care; neither the saucer nor the stairs is assigned an invented tariff.</p></figure>
