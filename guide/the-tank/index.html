			<text x="250" y="140.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,280) scale(1,-1)">worn round, wet by tradition</text>
			<text x="440" y="140.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,280) scale(1,-1)">nothing · no camera names them, and one does film them</text>

			<text x="82" y="94" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,188) scale(1,-1)">A drink is bought with a night. The night is played on a wall all week to a full bar,</text>
			<text x="82" y="84" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,168) scale(1,-1)">and the two people in it stand in the queue outside and pay to get in.</text>
			<text x="20" y="30" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,60) scale(1,-1)">&quot;THEY PAID TO GET IN.&quot;</text>
