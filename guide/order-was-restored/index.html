<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Was Restored · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/order-was-restored/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/order-was-restored/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/order-was-restored/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/order-was-restored/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-26"><h1>26. Order Was Restored</h1>
<figure id="figure-76"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-076.svg"><img alt="076. The open hand and the closed one" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-076.svg" width="842"/></a><figcaption>076. The open hand and the closed one</figcaption><p>Compare the training image with this intervention and its report.</p><div aria-label="Table: 076. The open hand and the closed one" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Instruction or record</th><th scope="col">Observed action</th></tr></thead><tbody><tr><th scope="row">Training image</th><td>An open hand</td><td>The steward closes his hand and keeps holding</td></tr><tr><th scope="row">After the grip</th><td>The report says no mark</td><td>The man supports his right hand in his left palm</td></tr><tr><th scope="row">Writing Thursday</th><td>The man uses his left hand</td><td>The steward steadies the right hand being written on</td></tr><tr><th scope="row">Report capacity</th><td>Room for eleven words</td><td>Nine written words, counted from the printed report</td></tr></tbody></table></div><p class="reading">His right hand becomes something he supports and writes on with his left.</p></figure>
<figure id="figure-77"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-077.svg"><img alt="077. Four figures, not one balance" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-077.svg" width="842"/></a><figcaption>077. Four figures, not one balance</figcaption><p>The posted fare, the customer's words and the steward's household are separate accounts.</p><div aria-label="Table: 077. Four figures, not one balance" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Figure</th><th scope="col">Amount</th><th scope="col">What it measures</th></tr></thead><tbody><tr><th scope="row">Today's board</th><td>240</td><td>Posted fare</td></tr><tr><th scope="row">Man at the ramp</th><td>239</td><td>Words he has</td></tr><tr><th scope="row">Steward's file</th><td>91</td><td>Arrears, not a stated retained-word balance</td></tr><tr><th scope="row">Steward's wife</th><td>206</td><td>Words she has; four years of Thursdays also stated</td></tr></tbody></table></div><p class="reading">The customer is one word below today's fare. The other figures do not prove what any future crossing will cost.</p></figure>
<figure id="figure-78"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-078.svg"><img alt="078. A hold becomes a lesson" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-078.svg" width="842"/></a><figcaption>078. A hold becomes a lesson</figcaption><p>Written instruction and physical demonstration pass to a younger steward.</p><dl><dt>A note beside the open hand</dt><dd>The margin says not to release before the room is quiet.</dd><dt>The steward sits in the chair</dt><dd>He gives the younger man his arm.</dd><dt>Fingers are placed</dt><dd>He arranges the younger man's grip with his free hand.</dd><dt>One finger moves higher</dt><dd>The lesson ends in a bodily adjustment.</dd></dl><h4>Relationships</h4><ul><li>A note beside the open hand → The steward sits in the chair: then demonstrated</li><li>The steward sits in the chair → Fingers are placed: then</li><li>Fingers are placed → One finger moves higher: then</li></ul><p class="reading">The final adjustment teaches a specific hold; its later use is not shown.</p></figure>
