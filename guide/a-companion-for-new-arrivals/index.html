			<text x="104" y="182" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,364) scale(1,-1)">twelve seconds of lit glass</text>
			<circle cx="90" cy="166" r="2.6" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 0.8; fill: rgb(54%,18%,18%); fill-rule: evenodd;"/>
			<text x="104" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,328) scale(1,-1)">standing for one</text>
			<rect x="430" y="128" width="230" height="180" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="512.72412109375" y="294" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,588) scale(1,-1)">WHAT THIS LIST IS</text>
			<text x="506.396826171875" y="274" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,548) scale(1,-1)">An office that cannot charge</text>
			<text x="497.46767578125" y="260" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,520) scale(1,-1)">for a thing still CATALOGUES it,</text>
			<text x="520.5330078125" y="246" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,492) scale(1,-1)">for completeness.</text>
			<text x="545.0" y="232" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,464) scale(1,-1)"></text>
			<text x="506.746484375" y="218" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,436) scale(1,-1)">By the last line the list holds</text>
			<text x="508.4720703125" y="204" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,408) scale(1,-1)">the three most private acts</text>
			<text x="506.396826171875" y="190" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,380) scale(1,-1)">in the book — and the office</text>
			<text x="510.0220703125" y="176" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,352) scale(1,-1)">has written them all down</text>
			<text x="523.458935546875" y="162" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,324) scale(1,-1)">in its own hand,</text>
			<text x="509.324267578125" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,296) scale(1,-1)">under a heading that says</text>
			<text x="516.051025390625" y="134" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,268) scale(1,-1)">it cannot reach them.</text>
			<rect x="60" y="36" width="600" height="50" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="70" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,140) scale(1,-1)">THE UNPRICEABLE LIST IS THE UNADMINISTERED, WRITTEN BY THE OTHER SIDE.</text>
			<text x="74" y="59" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,118) scale(1,-1)">Water, stone, paper, chalk, ash and time — the six materials the record cannot hold — all appear here,</text>
			<text x="74" y="49" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,98) scale(1,-1)">itemized by the office that cannot hold them, and offered to a new arrival as a courtesy.</text>
			<text x="20" y="22" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,44) scale(1,-1)">IS WATCHING FREE? YES. WATCHING HAS ALWAYS BEEN FREE.</text>
		</g>
	</g>
</svg>

	<title id="f114-t">A COMPANION FOR NEW ARRIVALS · THE LAST TWO SENTENCES — a welcome, and then the line that undoes the document you are holding</title>
	
	<clipPath id="f114-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>
	<g id="f114-group" transform="scale(1,-1) translate(0,-430)" style="clip-path: url(#f114-clip)">
		<g transform="">
			<rect x="0" y="0" width="700" height="430" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6; fill: rgb(98%,98%,98%); fill-rule: evenodd;"/>
			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">A COMPANION FOR NEW ARRIVALS · THE LAST TWO SENTENCES</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">a welcome, and then the line that undoes the document you are holding</text>
			<rect x="110" y="210" width="520" height="96" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1.3; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="349.11328125" y="288" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,576) scale(1,-1)">WELCOME</text>
			<text x="287.958984375" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,532) scale(1,-1)">You will be told when your first renewal is due.</text>
			<text x="251.731103515625" y="244" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,488) scale(1,-1)">Keep your first receipt: it is the only document you will be</text>
			<text x="278.249169921875" y="228" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,456) scale(1,-1)">asked for that cannot be issued to you twice.</text>
			<rect x="110" y="118" width="520" height="66" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.4; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="285.4193359375" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,328) scale(1,-1)">There is no need to keep this companion.</text>
			<text x="287.546240234375" y="146" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,292) scale(1,-1)">A corrected edition is issued every year.</text>
			<text x="282.786083984375" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 9.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,256) scale(1,-1)">THE CORRECTIONS ARE NOT LISTED.</text>
			<rect x="60" y="42" width="600" height="60" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="86" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,172) scale(1,-1)">ONE DOCUMENT IN THIS CITY CANNOT BE REISSUED, AND THE OFFICE TELLS YOU WHICH ONE IT IS,</text>
			<text x="74" y="75" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,150) scale(1,-1)">in the same breath as it tells you that the document in your hand will be silently replaced.</text>
			<text x="74" y="63" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,126) scale(1,-1)">The companion supersedes all previous companions, and previous companions are not held, and next year’s</text>
			<text x="74" y="53" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,106) scale(1,-1)">will supersede this one, and you will not be told what changed.</text>
			<text x="20" y="26" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,52) scale(1,-1)">THE FIRST RECEIPT IS THE ONLY THING IN SIXTY STORIES THE CITY ADMITS IT CANNOT PRINT AGAIN.</text>
		</g>
	</g>
