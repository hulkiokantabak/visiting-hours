<figure id="figure-112"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-112.svg"><img alt="112. A cover carries changed middle sheets" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-112.svg" width="842"/></a><figcaption>112. A cover carries changed middle sheets</figcaption><p>The booklet describes a route for its own circulation, not an independently identified organization.</p><dl><dt>The altered booklet</dt><dd>Two rows of staple holes mark the change</dd><dt>The Office's cover</dt><dd>Retained as the outside of the booklet</dd><dt>Changed middle sheets</dt><dd>Replaced before reaching the counter</dd><dt>The clerk</dt><dd>May not know about the change</dd><dt>The addressed reader</dt><dd>Told how to pass the alteration onward</dd></dl><h4>Relationships</h4><ul><li>The Office's cover → The altered booklet: supplies cover</li><li>Changed middle sheets → The altered booklet: supplies altered middle</li><li>The clerk → The altered booklet: hands out the copy</li><li>The altered booklet → The addressed reader: gives copying instructions</li><li>The addressed reader → Changed middle sheets: further substitution urged (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">The clerk may be unaware. The instruction to alter another copy is not evidence that the reader has already done it.</p></figure>
<figure id="figure-113"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-113.svg"><img alt="113. A locked door interrupts a demand" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-113.svg" width="842"/></a><figcaption>113. A locked door interrupts a demand</figcaption><p>Events on the landing, as the booklet reports them.</p><dl><dt>A woman is given a room</dt><dd>She refuses to pass the sheets to neighbors.</dd><dt>Someone returns for the key</dt><dd>Someone from the booklet's side seeks the key.</dd><dt>The door is already locked</dt><dd>The occupant has locked it.</dd><dt>The room-finder stays outside</dt><dd>The woman who found the room remains on the landing.</dd><dt>The key-seeker leaves first</dt><dd>They leave while the room-finder stays.</dd></dl><h4>Relationships</h4><ul><li>A woman is given a room → Someone returns for the key: after refusal</li><li>Someone returns for the key → The door is already locked: encounters locked door</li><li>The door is already locked → The room-finder stays outside: then</li><li>The room-finder stays outside → The key-seeker leaves first: then</li></ul><p class="reading">Staying may protect the occupant. The room-finder's motive and the occupant's lasting safety remain uncertain.</p></figure>
<figure id="figure-114"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-114.svg"><img alt="114. Evidence the booklet tells its side to keep" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-114.svg" width="842"/></a><figcaption>114. Evidence the booklet tells its side to keep</figcaption><p>Contradictory slips and awkward objects test the booklet's own account.</p><div aria-label="Table: 114. Evidence the booklet tells its side to keep" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Evidence or field</th><th scope="col">Pressure upon it</th><th scope="col">Instruction in the booklet</th></tr></thead><tbody><tr><th scope="row">Two refusal slips</th><td>Clerks name different issuing offices</td><td>Keep both; do not let the booklet's side discard one</td></tr><tr><th scope="row">The stamped-on shoe</th><td>Moved beneath the copies</td><td>Bring it out</td></tr><tr><th scope="row">Spare hours or refused address</th><td>A new line asks for this information</td><td>The line may stay blank; no reason box</td></tr><tr><th scope="row">The registers</th><td>The booklet proposes changing who gives orders</td><td>Leave the registers intact</td></tr></tbody></table></div><p class="reading">These are demands for conduct, not proof that all its authors or future officials will obey them.</p></figure>
