			<text x="74" y="69" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,138) scale(1,-1)">One member has twice paid a household’s arrears from her own account and asked that it not be minuted —</text>
