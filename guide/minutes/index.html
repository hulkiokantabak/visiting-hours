<figure id="figure-106"><a aria-label="Open full-size diagram: 106. Present for the heading, absent for the item" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-106.svg"><img alt="106. Present for the heading, absent for the item" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-106.svg" width="842"/></a><figcaption>106. Present for the heading, absent for the item</figcaption><p>The secretary's body and the meeting's usable attendance are set side by side.</p><div aria-label="Table: 106. Present for the heading, absent for the item" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Physical presence</th><th scope="col">Procedural presence</th></tr></thead><tbody><tr><th scope="row">Asked to withdraw</th><td>Remains seated, coat caught beneath her</td><td>Writes that she withdrew</td></tr><tr><th scope="row">Objections invited</th><td>Raises her hand</td><td>A Holder declares her absent for the item</td></tr><tr><th scope="row">Agreement recorded</th><td>Lowers her hand to write</td><td>Records the Chair's agreement with her absence</td></tr><tr><th scope="row">Correction requested</th><td>Says she was there throughout</td><td>Referred to the heading that lists her present</td></tr></tbody></table></div><p class="reading">The final reference to the heading does not repair her exclusion during the renewal item.</p></figure>
<figure id="figure-107"><a aria-label="Open full-size diagram: 107. Omission produces another entry" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-107.svg"><img alt="107. Omission produces another entry" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-107.svg" width="842"/></a><figcaption>107. Omission produces another entry</figcaption><p>The minutes record declarations about what cannot or should not be recorded.</p><div aria-label="Table: 107. Omission produces another entry" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Subject</th><th scope="col">Rule or action</th><th scope="col">Trace left</th></tr></thead><tbody><tr><th scope="row">Condolences</th><td>Declared not minuted</td><td>The Chair orders that declaration retained</td></tr><tr><th scope="row">Thirty-one-year claim</th><td>Question withdrawn</td><td>A thin strike leaves its words legible</td></tr><tr><th scope="row">Thanks to the Secretary</th><td>Read aloud to her</td><td>She writes the thanks herself</td></tr><tr><th scope="row">Adoption</th><td>Minutes adopted without signature</td><td>The Board supplies no signature</td></tr></tbody></table></div><p class="reading">A retained sentence can document an omission while leaving the omitted claim ineffective.</p></figure>
<figure id="figure-108"><a aria-label="Open full-size diagram: 108. The struck question reaches a wet cuff" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-108.svg"><img alt="108. The struck question reaches a wet cuff" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-108.svg" width="842"/></a><figcaption>108. The struck question reaches a wet cuff</figcaption><p>The material sequence ends with an attempt, not a confirmed legible copy.</p><dl><dt>A claim is asked about</dt><dd>A Holder asks whether thirty-one years constitutes a claim.</dd><dt>The question is withdrawn</dt><dd>Her thin strike leaves the words legible.</dd><dt>Water spills on her cuff</dt><dd>The carafe passes across her.</dd><dt>The cuff covers the struck words</dt><dd>She spreads the wet cloth over the ink.</dd><dt>She waits</dt><dd>No readable result is shown.</dd></dl><h4>Relationships</h4><ul><li>A claim is asked about → The question is withdrawn: withdrawn</li><li>The question is withdrawn → Water spills on her cuff: later</li><li>Water spills on her cuff → The cuff covers the struck words: cloth brought to ink</li><li>The cuff covers the struck words → She waits: awaits transfer</li></ul><p class="reading">The wet cuff may carry ink away; the story stops before its success can be read.</p></figure>
