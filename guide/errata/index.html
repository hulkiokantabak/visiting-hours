			<rect x="60" y="44" width="600" height="60" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="86" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,172) scale(1,-1)">THE FOUR WORDS ARE NEVER PRINTED. WE ARE TOLD ONLY THAT THEY EXIST, HOW HARD THEY WERE PRESSED,</text>
			<text x="74" y="75" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,150) scale(1,-1)">and that margins are part of the page and the page is part of the edition.</text>
