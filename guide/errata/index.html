<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Errata · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/errata/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/errata/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/errata/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/errata/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-42"><h1>42. Errata</h1>
<figure id="figure-124"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-124.svg"><img alt="124. Agreement rewritten under objection" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-124.svg" width="842"/></a><figcaption>124. Agreement rewritten under objection</figcaption><p>The composing service changes what can count as agreement.</p><div aria-label="Table: 124. Agreement rewritten under objection" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Proposed wording</th><th scope="col">Widow's response</th><th scope="col">Next use</th></tr></thead><tbody><tr><th scope="row">His agreement is retained</th><td>Crosses it out; he was already dying</td><td>Correction returned to composing service</td></tr><tr><th scope="row">He would have agreed</th><td>Says he would not; asks to ask him</td><td>Husband's voice reads proposed agreement</td></tr><tr><th scope="row">I asked for him</th><td>Objects to its position</td><td>Service places her wording beneath renewal</td></tr></tbody></table></div><p class="reading">These are proposed textual corrections inside Errata; they do not rewrite the other stories' events.</p></figure>
<figure id="figure-125"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-125.svg"><img alt="125. The voice and the signature" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-125.svg" width="842"/></a><figcaption>125. The voice and the signature</figcaption><p>Actions at the kitchen table, in narrative order.</p><dl><dt>Proposed agreement</dt><dd>The clerk connects her husband's voice.</dd><dt>No, then yes</dt><dd>It gives each answer when she requests it.</dd><dt>The remembered breath</dt><dd>She asks to hear that small breath again.</dd><dt>Renewal wording</dt><dd>She objects to where her words were placed.</dd><dt>Disconnect offered</dt><dd>The clerk offers to turn off the speaker.</dd><dt>Signature</dt><dd>She signs and asks for lower volume.</dd></dl><h4>Relationships</h4><ul><li>Proposed agreement → No, then yes: directed answers</li><li>No, then yes → The remembered breath: a sound recalled</li><li>The remembered breath → Renewal wording: wording relocated</li><li>Renewal wording → Disconnect offered: clerk's response</li><li>Disconnect offered → Signature: narrative order</li></ul><p class="reading">The voice's ability to answer both ways does not establish the dead husband's agreement.</p></figure>
<figure id="figure-126"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-126.svg"><img alt="126. The copy and the account diverge" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-126.svg" width="842"/></a><figcaption>126. The copy and the account diverge</figcaption><p>Material actions remain beside their official descriptions.</p><div aria-label="Table: 126. The copy and the account diverge" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What remains in the room</th><th scope="col">What the record can say</th></tr></thead><tbody><tr><th scope="row">The hand</th><td>No physical alteration required</td><td>Its action is assigned to instructions</td></tr><tr><th scope="row">The mark</th><td>Attempted removal enlarges it</td><td>Classified as domestic salt water; retained</td></tr><tr><th scope="row">The visit</th><td>One signature required before he leaves</td><td>Recast as corrections the widow requested</td></tr><tr><th scope="row">The book</th><td>She keeps this copy uncorrected</td><td>Signed request for a corrected edition on file</td></tr></tbody></table></div><p class="reading">The final file claim does not certify voluntary consent or a corrected physical copy.</p></figure>
