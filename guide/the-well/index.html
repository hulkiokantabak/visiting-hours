			<text x="74" y="130" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,260) scale(1,-1)">THE PAPER IS THE LINE THAT FINISHES THE STORY.</text>
			<text x="74" y="118" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,236) scale(1,-1)">Somebody could not say it aloud, so they wrote it and dropped it in — and the office dried it, in case</text>
			<text x="74" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,216) scale(1,-1)">it was currency, and having established that it was not, discarded it.</text>
			<text x="74" y="97" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,194) scale(1,-1)">This city in one sentence, and it took fifty-five stories to earn it.</text>
			<rect x="60" y="40" width="600" height="40" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="66" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,132) scale(1,-1)">THE SECOND WISHER KNOWS SHE IS SECOND AND WISHES ANYWAY.</text>
			<text x="74" y="55" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,110) scale(1,-1)">It is the only communal act in the book that costs nothing and is not audited — two strangers, at the same</text>
			<text x="74" y="45" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,90) scale(1,-1)">well, asking for the same Sunday, one of them knowing.</text>
			<text x="20" y="24" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,48) scale(1,-1)">THE COINS ARE RECORDED. THE WISHES ARE NOT. THEY WERE NEVER ASKED FOR.</text>
		</g>
	</g>
</svg>
