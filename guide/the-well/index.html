<figure id="figure-163"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-163.svg"><img alt="163. Different scales of wanting" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-163.svg" width="842"/></a><figcaption>163. Different scales of wanting</figcaption><p>One possible grouping of wishes that the story leaves unattributed.</p><div aria-label="Table: 163. Different scales of wanting" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Scope</th><th scope="col">Examples</th><th scope="col">What the wish keeps open</th></tr></thead><tbody><tr><th scope="row">Ordinary bodily life</th><td>Knee, money, dog and a small yard</td><td>Relief without a general theory</td></tr><tr><th scope="row">Another occasion</th><td>A voiced Sunday; the first film evening again</td><td>Repetition, not necessarily restoration</td></tr><tr><th scope="row">Control over an encounter</th><td>A new question; breath where it belonged</td><td>Who may decide how something happens</td></tr><tr><th scope="row">A refusal to follow</th><td>Staying for the hill instead of climbing it</td><td>A place beside others' different desires</td></tr></tbody></table></div><p class="reading">These are reading categories, not identities or a ranking of which desires deserve fulfillment.</p></figure>
<figure id="figure-164"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-164.svg"><img alt="164. Echoes without named wishers" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-164.svg" width="842"/></a><figcaption>164. Echoes without named wishers</figcaption><p>Current stories supply recognizable phrases, not certified speakers.</p><dl><dt>Unattributed wishes</dt><dd>The Well gathers desires without assigning names.</dd><dt>43 - Four Minutes</dt><dd>An earlier evening still containing the boat.</dd><dt>49 - The Standard Vows</dt><dd>Saturday's extended form.</dd><dt>54 - The Last Word</dt><dd>A breath between the accepted words.</dd><dt>53 - Service Improvement</dt><dd>The hour with open doors at three.</dd></dl><h4>Relationships</h4><ul><li>Unattributed wishes → 43 - Four Minutes: echo of the film (reported, incomplete, disputed or interpretive connection)</li><li>Unattributed wishes → 49 - The Standard Vows: echo of the ceremony (reported, incomplete, disputed or interpretive connection)</li><li>Unattributed wishes → 54 - The Last Word: echo of the recording (reported, incomplete, disputed or interpretive connection)</li><li>Unattributed wishes → 53 - Service Improvement: echo of the hour (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">Shared details invite recognition. They do not prove that the wisher is the earlier story's protagonist.</p></figure>
<figure id="figure-165"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-165.svg"><img alt="165. What leaves the well as a record" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-165.svg" width="842"/></a><figcaption>165. What leaves the well as a record</figcaption><p>The quarter-end procedure sorts material without recording the wishes.</p><div aria-label="Table: 165. What leaves the well as a record" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Material or content</th><th scope="col">Treatment</th><th scope="col">Recorded result</th></tr></thead><tbody><tr><th scope="row">Coins</th><td>Counted at quarter end</td><td>Returned to the general account</td></tr><tr><th scope="row">Paper from the water</th><td>Dried to check whether it is money; then discarded</td><td>No preserved wish is described</td></tr><tr><th scope="row">Wishes</th><td>Never requested by the procedure</td><td>Not recorded</td></tr></tbody></table></div><p class="reading">Coins enter the general account; that does not mean the wishes were submitted or answered.</p></figure>
