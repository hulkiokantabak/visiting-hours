<figure id="figure-22"><a aria-label="Open full-size diagram: 022. The promised extension has no force" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-022.svg"><img alt="022. The promised extension has no force" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-022.svg" width="842"/></a><figcaption>022. The promised extension has no force</figcaption><p>Two disagreements place a person's account beside a document or device.</p><div aria-label="Table: 022. The promised extension has no force" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Personal account or intervention</th><th scope="col">Document or device response</th></tr></thead><tbody><tr><th scope="row">Hand service</th><td>The fitter says the notice is wrong and stamps EXTENDED</td><td>His phone rejects the stamp</td></tr><tr><th scope="row">Book loan</th><td>Narration calls it his copy, previously lent</td><td>The loan slip names him as borrower</td></tr><tr><th scope="row">Persistence</th><td>She keeps trying the stamp</td><td>The shutdown still occurs at midnight</td></tr></tbody></table></div><p class="reading">The guide keeps both versions of the loan in view. It does not correct the slip or decide that the fitter knowingly lies.</p></figure>
<figure id="figure-23"><a aria-label="Open full-size diagram: 023. Eleven years enter a one-field ending" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-023.svg"><img alt="023. Eleven years enter a one-field ending" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-023.svg" width="842"/></a><figcaption>023. Eleven years enter a one-field ending</figcaption><p>Different records preserve different parts of the same hand.</p><div aria-label="Table: 023. Eleven years enter a one-field ending" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Record</th><th scope="col">What it contains</th><th scope="col">What it does not settle</th></tr></thead><tbody><tr><th scope="row">Past injury</th><td>Flesh hand lost at age 42</td><td>A calendar date</td></tr><tr><th scope="row">Nightly reporting</th><td>11 years; grip, tremor and temperature</td><td>An exact number of nights</td></tr><tr><th scope="row">Domestic change</th><td>Month he stopped opening jars for two</td><td>Whom or what he lost</td></tr><tr><th scope="row">OPEN</th><td>Technician attendance required</td><td>Price or perpetual billing</td></tr><tr><th scope="row">CLOSED</th><td>No further visit required; small credit</td><td>The meaning of the hand holding him</td></tr></tbody></table></div><p class="reading">Eleven years cannot be converted into an exact night count here. The stopped jar-opening does not identify the household loss.</p></figure>
<figure id="figure-24"><a aria-label="Open full-size diagram: 024. A shutdown made into a hold" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-024.svg"><img alt="024. A shutdown made into a hold" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-024.svg" width="842"/></a><figcaption>024. A shutdown made into a hold</figcaption><p>Selected actions on the last evening and their later administrative recognition.</p><dl><dt>Last evening</dt><dd>He buttons, unbuttons and starts again; peels the orange.</dd><dt>Two signatures</dt><dd>He writes once with each hand; the names agree.</dd><dt>The field</dt><dd>He selects CLOSED.</dd><dt>His chosen position</dt><dd>He puts the living hand inside the mechanical one.</dd><dt>Midnight to morning</dt><dd>The last charge closes the fingers gently; he stays.</dd><dt>Second week</dt><dd>The counterparty thanks him and encloses a small credit.</dd></dl><p class="reading">His use of CLOSED exceeds the field's service calculation, without restoring power or preventing the shutdown.</p></figure>
