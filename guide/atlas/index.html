<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; script-src &#x27;none&#x27;; style-src &#x27;self&#x27;; img-src &#x27;self&#x27;; media-src &#x27;self&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/atlas/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/atlas/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="location">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/atlas/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content" tabindex="-1"><section id="atlas"><h1>Atlas</h1>
<figure><a aria-label="Open full-size diagram: Two hills, no complete plan" class="figure-visual" href="/visiting-hours/guide/figures/en/atlas-01.svg"><img alt="Two hills, no complete plan" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/atlas-01.svg" width="842"/></a><figcaption>Two hills, no complete plan</figcaption><p>A schematic of stated locations, not a street map or a scale drawing.</p><dl><dt>A port and two hills</dt><dd>The city supplies routes unevenly.</dd><dt>Near hill</dt><dd>Funicular, middle station, dome, last stop.</dd><dt>Far hill</dt><dd>The works, cranes, contracted weather.</dd><dt>Water, differently named</dt><dd>Office: channel. Elsewhere: sea, or river-or-sea.</dd><dt>Fish market</dt><dd>Weather under the awnings; the talking cat.</dd><dt>Above the last stop</dt><dd>Rope rail, open gate, monastery.</dd></dl><h4>Relationships</h4><ul><li>A port and two hills → Near hill: Near hill</li><li>A port and two hills → Far hill: Far hill</li><li>A port and two hills → Water, differently named: Reference point</li><li>A port and two hills → Fish market: Market</li><li>Near hill → Above the last stop: Route above the last stop (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">Not all rain is purchased. The route continues above the last stop; its exact distance and a complete city plan remain withheld.</p></figure>
<figure><a aria-label="Open full-size diagram: Ways of leaving" class="figure-visual" href="/visiting-hours/guide/figures/en/atlas-02.svg"><img alt="Ways of leaving" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/atlas-02.svg" width="842"/></a><figcaption>Ways of leaving</figcaption><p>Different journeys; no total of all possible departures.</p><div aria-label="Table: Ways of leaving" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Journey in the story</th><th scope="col">What follows</th></tr></thead><tbody><tr><th scope="row">Export · 14</th><td>The daughter takes the dawn flight.</td><td>Her mother's license runs only to the paid month's end.</td></tr><tr><th scope="row">The Rate · 15</th><td>The audited husband crosses by boat.</td><td>The widow enters the water; she is not returned.</td></tr><tr><th scope="row">Not Given · 58</th><td>The visitor counts to the open gate.</td><td>She comes down and gives her count to the device.</td></tr><tr><th scope="row">Visiting Hours · Final</th><td>Another ascent with a return ticket.</td><td>She goes back inside and signs.</td></tr></tbody></table></div><p class="reading">Crossing, emigration and walking uphill are different journeys. The final visitor goes back inside and signs; the duration remains open.</p></figure>
<figure><a aria-label="Open full-size diagram: Times that recur" class="figure-visual" href="/visiting-hours/guide/figures/en/atlas-03.svg"><img alt="Times that recur" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/atlas-03.svg" width="842"/></a><figcaption>Times that recur</figcaption><p>Selected schedules and one explicit turn of the year.</p><div aria-label="Table: Times that recur" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Clock or interval</th><th scope="col">Where it operates</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">First twelve hours</th><td>Maternity registration · 3</td><td>No charge; the use is recorded.</td></tr><tr><th scope="row">Thursday</th><td>Renewals; queues; the wing's agreed day</td><td>A recurrence, not proof of one synchronized calendar.</td></tr><tr><th scope="row">Fourteenth, 03:00-04:00</th><td>Stimulus · 20</td><td>A person works under PERSONS PRESENT: none.</td></tr><tr><th scope="row">03:00-04:00</th><td>Planned interruption · 53</td><td>04:01 restoration; a 03:41 voice mark.</td></tr><tr><th scope="row">The year's first morning</th><td>The Last Word · 54</td><td>The new fare is already being spoken.</td></tr></tbody></table></div><p class="reading">The book includes long histories, repeated cycles and a turn of the year. This is not a universal single-year chronology.</p></figure>
<figure><a aria-label="Open full-size diagram: The fare and the changing gap" class="figure-visual" href="/visiting-hours/guide/figures/en/atlas-04.svg"><img alt="The fare and the changing gap" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/atlas-04.svg" width="842"/></a><figcaption>The fare and the changing gap</figcaption><p>Words of proven retention; not cash and not the number of words recorded for pay.</p><p>Words of proven retention</p><div aria-label="Table: The fare and the changing gap" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Previous fare · The Rate</th><td>200</td><td>The board's earlier requirement.</td></tr><tr><th scope="row">Household holding · Cheap Words</th><td>206</td><td>Two adults and one child; no allocation is supplied.</td></tr><tr><th scope="row">Father's last count · The Last Word</th><td>239</td><td>One below the old fare; 61 below the new.</td></tr><tr><th scope="row">Current fare before the turn</th><td>240</td><td>The widow's husband reaches it after audit.</td></tr><tr><th scope="row">Fare at the turn</th><td>300</td><td>An increase of 60 from 240; not a price-conversion formula.</td></tr></tbody></table></div><p class="reading">The 61-word gap is calculated from 300 minus 239. Teaching, retaining, auditing and paying a reader remain distinct.</p></figure>
