<figure id="figure-127"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-127.svg"><img alt="127. Two witnessed endings" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-127.svg" width="842"/></a><figcaption>127. Two witnessed endings</figcaption><p>The filed review and later corrected account describe different films.</p><div aria-label="Table: 127. Two witnessed endings" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">First evening: v.10</th><th scope="col">v.11 corrected account described</th></tr></thead><tbody><tr><th scope="row">Invitation</th><td>Come with me</td><td>Come again</td></tr><tr><th scope="row">Boat</th><td>They take the dusk boat</td><td>No boat appears</td></tr><tr><th scope="row">Counter</th><td>Empty; an arrival is not served</td><td>She stays, wipes the cup ring and serves</td></tr><tr><th scope="row">Witness</th><td>Mother squeezes the reviewer's hand</td><td>Reviewer returns to the same seat</td></tr></tbody></table></div><p class="reading">The screening report corroborates the first account within the file. Its later supersession leaves the accounts in conflict.</p></figure>
<figure id="figure-128"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-128.svg"><img alt="128. A version that will not stay final" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-128.svg" width="842"/></a><figcaption>128. A version that will not stay final</figcaption><p>Known versions and filings, in their narrated order.</p><dl><dt>First evening</dt><dd>The screening print is v.10.</dd><dt>v.11</dt><dd>Four minutes shorter; v.10 superseded.</dd><dt>Correction required</dt><dd>206 earlier filings require paid correction.</dd><dt>Corrected filing</dt><dd>The reviewer disavows having seen the first ending.</dd><dt>This morning</dt><dd>v.12 is standard; its difference is not itemized.</dd></dl><p class="reading">Only v.11's four-minute shortening is quantified.</p></figure>
<figure id="figure-129"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-129.svg"><img alt="129. Where correction lands" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-129.svg" width="842"/></a><figcaption>129. Where correction lands</figcaption><p>Consequences reach beyond the film's stored version.</p><div aria-label="Table: 129. Where correction lands" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Relation</th><th scope="col">Action</th><th scope="col">Consequence</th></tr></thead><tbody><tr><th scope="row">Archive / filer</th><td>206 corrections required</td><td>Filers pay; originals kept for training</td></tr><tr><th scope="row">Reviewer / mother</th><td>Denies the ending she witnessed</td><td>She apologizes for crying</td></tr><tr><th scope="row">Reviewer / next screening</th><td>Books one ticket</td><td>Returns without the mother being booked</td></tr><tr><th scope="row">Reviewer / boat</th><td>Keeps going for its return</td><td>No restoration is established</td></tr></tbody></table></div><p class="reading">The reviewer's hope that the boat returns remains a hope, not a promised restoration.</p></figure>
