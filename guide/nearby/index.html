<figure id="figure-4"><a aria-label="Open full-size diagram: 004. A routine centered on the middle station" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-004.svg"><img alt="004. A routine centered on the middle station" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-004.svg" width="842"/></a><figcaption>004. A routine centered on the middle station</figcaption><p>Places connected by his routine; this is not a measured map.</p><dl><dt>Middle station</dt><dd>His work and his room share a location.</dd><dt>Room above</dt><dd>Bed, fork, bicycle; he sleeps alone on Sundays</dd><dt>Loop outside the window</dt><dd>Two cars meet for 12 seconds</dd><dt>Sea</dt><dd>Sunday swimming</dd><dt>Fish counter</dt><dd>He eats standing</dd><dt>Stair street</dt><dd>The cellist's route after the second March encounter</dd></dl><h4>Relationships</h4><ul><li>Middle station → Room above: room above</li><li>Middle station → Loop outside the window: working view</li><li>Middle station → Sea: Sunday routine</li><li>Sea → Fish counter: Sunday routine</li><li>Middle station → Stair street: cellist avoids platform (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">The text locates the room over the station; it does not put every destination within sight of the cable.</p></figure>
<figure id="figure-5"><a aria-label="Open full-size diagram: 005. The annual account cannot settle memory" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-005.svg"><img alt="005. The annual account cannot settle memory" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-005.svg" width="842"/></a><figcaption>005. The annual account cannot settle memory</figcaption><p>Different units and kinds of evidence remain separate.</p><div aria-label="Table: 005. The annual account cannot settle memory" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Evidence</th><th scope="col">Reported amount or fact</th><th scope="col">What remains uncertain</th></tr></thead><tbody><tr><th scope="row">Annual service account</th><td>11 names; 4.5 stars</td><td>Which entries account for the mismatch</td></tr><tr><th scope="row">His recollection</th><td>9 bodies</td><td>What he has forgotten or failed to recognize</td></tr><tr><th scope="row">Two entries</th><td>Photographs in his own room</td><td>He cannot place a face above the blanket</td></tr><tr><th scope="row">Pillowcases</th><td>He owns the set he did not recognize</td><td>Why possession and memory differ</td></tr><tr><th scope="row">Healed bite</th><td>Matches none of the 11 names</td><td>Whose encounter left it</td></tr></tbody></table></div><p class="reading">Eleven names and nine remembered bodies disagree; the text does not identify every discrepancy or its cause.</p></figure>
<figure id="figure-6"><a aria-label="Open full-size diagram: 006. Twelve seconds and an unclosed gesture" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-006.svg"><img alt="006. Twelve seconds and an unclosed gesture" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-006.svg" width="842"/></a><figcaption>006. Twelve seconds and an unclosed gesture</figcaption><p>Narrative sequence of the final encounter; his exact vantage is not specified.</p><dl><dt>Meeting at the loop</dt><dd>The cars hold 12 seconds of level glass.</dd><dt>A hand in the down car</dt><dd>A palm rises against the glass.</dd><dt>His answering hand</dt><dd>He raises it without seeing whose hand he answers.</dd><dt>Cars separate</dt><dd>His hand remains raised.</dd><dt>Room above</dt><dd>The second plate remains visible from the door.</dd></dl><p class="reading">The raised hand has no identified owner. Keeping his hand raised is observable; mutual recognition is not.</p></figure>
