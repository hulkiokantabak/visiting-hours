			<text x="252.777294921875" y="68" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,136) scale(1,-1)">He is still holding his hand up when the cars have gone their ways.</text>
			<text x="20" y="40" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,80) scale(1,-1)">EVERY OTHER MEETING IN THIS STORY IS BROKERED, RATED, MAPPED OR PHOTOGRAPHED.</text>
			<text x="20" y="30" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,60) scale(1,-1)">This one has no name attached, no introduction paid for, no star given, and nobody knows it happened.</text>
			<text x="20" y="20" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,40) scale(1,-1)">It is also the only one he answers.</text>
