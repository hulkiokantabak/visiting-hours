<figure id="figure-154"><a aria-label="Open full-size diagram: 154. Who may decide where the blood goes" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-154.svg"><img alt="154. Who may decide where the blood goes" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-154.svg" width="842"/></a><figcaption>154. Who may decide where the blood goes</figcaption><p>Competing claims converge on the same carrier.</p><dl><dt>The blood carrier</dt><dd>Suna removes it and later helps bring it back.</dd><dt>Suna</dt><dd>Inherited standing; wants her mother remembered and the balcony.</dd><dt>The man in the alley</dt><dd>Claims a collective right; holds a bag above the gutter.</dd><dt>Recent donor</dt><dd>Recognizes her contribution and reaches for it.</dd><dt>The Pool</dt><dd>Records contributions; held years are reported above the draw room.</dd></dl><h4>Relationships</h4><ul><li>Suna → The blood carrier: takes out, then returns</li><li>The man in the alley → The blood carrier: claims collective disposal (reported, incomplete, disputed or interpretive connection)</li><li>Recent donor → The blood carrier: claims her contribution</li><li>The Pool → The blood carrier: tags and stores</li></ul><p class="reading">Held years are reported, not independently demonstrated. No claim shown here becomes a universal ownership rule.</p></figure>
<figure id="figure-155"><a aria-label="Open full-size diagram: 155. A return with evidence still outside" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-155.svg"><img alt="155. A return with evidence still outside" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-155.svg" width="842"/></a><figcaption>155. A return with evidence still outside</figcaption><p>Narrative order through violence, return and identification.</p><dl><dt>Bag over the gutter</dt><dd>Suna stops the man's wrist; the donor intervenes.</dd><dt>Violence at the carrier</dt><dd>He pushes the donor; Suna strikes; he hits Suna.</dd><dt>Return together</dt><dd>Suna and the donor push the carrier into the clinic.</dd><dt>Care inside</dt><dd>Seals checked; chair and tea brought to Suna.</dd><dt>Identification form</dt><dd>The clerk asks for the man and his associates.</dd><dt>Her map remains</dt><dd>It is still in his pocket when she takes the pen.</dd></dl><h4>Relationships</h4><ul><li>Bag over the gutter → Violence at the carrier: confrontation escalates</li><li>Violence at the carrier → Return together: carrier brought back</li><li>Return together → Care inside: material and bodily care</li><li>Care inside → Identification form: another demand</li><li>Identification form → Her map remains: her implication remains</li></ul><p class="reading">Returning the blood does not erase Suna's part in planning its removal.</p></figure>
<figure id="figure-156"><a aria-label="Open full-size diagram: 156. Two wrists, no easy division" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-156.svg"><img alt="156. Two wrists, no easy division" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-156.svg" width="842"/></a><figcaption>156. Two wrists, no easy division</figcaption><p>Suna's grip changes context without losing its power to constrain.</p><div aria-label="Table: 156. Two wrists, no easy division" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">In the alley</th><th scope="col">At the donor's chair</th></tr></thead><tbody><tr><th scope="row">What is held</th><td>The man's wrist above the gutter</td><td>The donor's wrist against linen, then his other wrist</td></tr><tr><th scope="row">Immediate request</th><td>Suna tells the man to put the bag back</td><td>The donor says not to let the tube come out</td></tr><tr><th scope="row">Changed demand</th><td>He continues trying to reach the blood</td><td>The donor says Let go</td></tr><tr><th scope="row">At the limit</th><td>Suna recovers the carrier with the donor's help</td><td>She waits for the nurse and holds on</td></tr></tbody></table></div><p class="reading">The last grip can be read as care and restraint together; the donor's changing words do not resolve it.</p></figure>
