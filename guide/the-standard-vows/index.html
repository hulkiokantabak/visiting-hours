			<text x="100" y="268.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,536) scale(1,-1)">HE SIGNS</text>
			<text x="280" y="268.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,536) scale(1,-1)">in the box, at the fee posted for a Thursday</text>
			<circle cx="84" cy="232.0" r="4" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<path d="M 84,226 L 84,206 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6;"/>
			<text x="100" y="230.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,460) scale(1,-1)">SHE SIGNS</text>
			<text x="280" y="230.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,460) scale(1,-1)">in the box</text>
			<circle cx="84" cy="194.0" r="4" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1; fill: rgb(54%,18%,18%); fill-rule: evenodd;"/>
			<path d="M 84,188 L 84,168 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6;"/>
			<text x="100" y="192.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,384) scale(1,-1)">AND THEN</text>
			<text x="280" y="192.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,384) scale(1,-1)">hand FLAT ON THE WET INK, then shows him her palm</text>
			<text x="280" y="182.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,364) scale(1,-1)">the only unlicensed act in the building</text>
			<circle cx="84" cy="156.0" r="4" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1; fill: rgb(54%,18%,18%); fill-rule: evenodd;"/>
			<path d="M 84,150 L 84,130 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6;"/>
			<text x="100" y="154.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,308) scale(1,-1)">THE REGISTRAR LOOKS</text>
			<text x="280" y="154.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,308) scale(1,-1)">at the page, which was still legible</text>
			<text x="280" y="144.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,288) scale(1,-1)">AND LETS IT STAND</text>

			<text x="280" y="116.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,232) scale(1,-1)">presses his own thumb to it, and puts it in the margin</text>

			<rect x="60" y="44" width="600" height="58" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="86" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,172) scale(1,-1)">THE ONE SPONTANEOUS ACT IN THE HALL IS IMMEDIATELY WITNESSED, INITIALED AND DATED —</text>
			<text x="74" y="75" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,150) scale(1,-1)">and the man who does it is not obstructing her. He is protecting it. A thing initialed and dated in the margin</text>
			<text x="74" y="65" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,130) scale(1,-1)">is a thing the record cannot later say did not happen.</text>
			<text x="74" y="53" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,106) scale(1,-1)">Her marked palm closed around nothing, carried like change, all the way down the hall past the queue.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,56) scale(1,-1)">THE CHAIRS WERE ALREADY BEING STACKED FOR THE ELEVEN O’CLOCK. THE QUEUE MOVED UP ONE.</text>
