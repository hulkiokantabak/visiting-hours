<figure id="figure-145"><a aria-label="Open full-size diagram: 145. Room within the issued ceremony" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-145.svg"><img alt="145. Room within the issued ceremony" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-145.svg" width="842"/></a><figcaption>145. Room within the issued ceremony</figcaption><p>Formal requirements coexist with bodily and family gestures.</p><div aria-label="Table: 145. Room within the issued ceremony" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Formal structure</th><th scope="col">What enters it</th><th scope="col">Visible accommodation</th></tr></thead><tbody><tr><th scope="row">Required questions twice each</th><td>Loud and quiet answers</td><td>Both ways of answering remain in the ceremony</td></tr><tr><th scope="row">Issued vows</th><td>Her thumb on his pulse</td><td>Touch accompanies the words</td></tr><tr><th scope="row">The next couple waiting</th><td>Her request for the aunt's blessing</td><td>Registrar turns his card face down</td></tr><tr><th scope="row">Gift book</th><td>Gifts without stated amounts</td><td>A narrower third column, filled last</td></tr></tbody></table></div><p class="reading">A place for an unpriced gift is not proof that the gift could never be valued.</p></figure>
<figure id="figure-146"><a aria-label="Open full-size diagram: 146. Ink carried beyond the signed page" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-146.svg"><img alt="146. Ink carried beyond the signed page" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-146.svg" width="842"/></a><figcaption>146. Ink carried beyond the signed page</figcaption><p>The sequence follows the marks, not a declared exemption.</p><dl><dt>Renewal ink</dt><dd>The Thursday stamp is already wet.</dd><dt>Signed page</dt><dd>Both sign; she presses her palm onto the ink.</dd><dt>A closed hand</dt><dd>She lifts the print and closes her palm.</dd><dt>Registrar's thumb</dt><dd>He adds, initials and dates a mark in the margin.</dd><dt>Two hands in the hall</dt><dd>Her husband holds the clean one; the ink stays in the other.</dd></dl><h4>Relationships</h4><ul><li>Renewal ink → Signed page: used in the ceremony</li><li>Signed page → A closed hand: ink transferred</li><li>A closed hand → Registrar's thumb: registrar adds his mark</li><li>Registrar's thumb → Two hands in the hall: marks travel differently</li></ul><p class="reading">The page stays legible. The registrar's added mark neither erases the form nor settles the later recording conflict.</p></figure>
<figure id="figure-147"><a aria-label="Open full-size diagram: 147. Permission, recording and uncertain delivery" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-147.svg"><img alt="147. Permission, recording and uncertain delivery" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-147.svg" width="842"/></a><figcaption>147. Permission, recording and uncertain delivery</figcaption><p>A visible phone action does not settle what her own phone receives.</p><div aria-label="Table: 147. Permission, recording and uncertain delivery" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Agreement or intention</th><th scope="col">What the scene establishes</th></tr></thead><tbody><tr><th scope="row">Their agreement</th><td>Pictures, without voices</td><td>She has agreed</td></tr><tr><th scope="row">Her private request</th><td>Sound only for herself</td><td>She made a separate request to the witness</td></tr><tr><th scope="row">Witness's phone</th><td>Sound marked Sent</td><td>It plays; her husband removes that recording</td></tr><tr><th scope="row">Her own phone</th><td>Moves against her hip</td><td>Pictures arrive; sound delivery is unproved</td></tr></tbody></table></div><p class="reading">Sent appears on the witness's phone. Only pictures are explicitly said to be arriving at the end.</p></figure>
