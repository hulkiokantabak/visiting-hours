<figure id="figure-157"><a aria-label="Open full-size diagram: 157. The log beside the listening hour" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-157.svg"><img alt="157. The log beside the listening hour" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-157.svg" width="842"/></a><figcaption>157. The log beside the listening hour</figcaption><p>Times are copied from the story; the log's claims are not reconciled.</p><dl><dt>02:58</dt><dd>Evening schedule read to its end.</dd><dt>03:00</dt><dd>Planned interruption begins.</dd><dt>03:41</dt><dd>A voice line contains a dash.</dd><dt>04:01</dt><dd>Service returns; integrity clean; the hour said to have no entries.</dd><dt>04:02</dt><dd>The voice gives four and one minute.</dd><dt>05:14</dt><dd>Meral arrives at Seven's door with an open-door notice.</dd></dl><p class="reading">The 03:41 dash is a visible log line beside the claim of no entries; it does not reveal what was said.</p></figure>
<figure id="figure-158"><a aria-label="Open full-size diagram: 158. Experience and what may be issued" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-158.svg"><img alt="158. Experience and what may be issued" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-158.svg" width="842"/></a><figcaption>158. Experience and what may be issued</figcaption><p>The retained statements do not amount to accessible official copies.</p><div aria-label="Table: 158. Experience and what may be issued" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Residents' accounts</th><th scope="col">Administrative treatment</th></tr></thead><tbody><tr><th scope="row">Voices numbered</th><td>One, Two, Three, Five, Six, Seven</td><td>No statement numbered Four is printed</td></tr><tr><th scope="row">Experience</th><td>Touch, cold, possible singing, disclosure, dark and unidentified boxes</td><td>No incident recorded; incidents require records</td></tr><tr><th scope="row">Copies</th><td>Three residents ask for their own statements</td><td>Ownership acknowledged; no issuing procedure</td></tr><tr><th scope="row">Memory</th><td>The hour is remembered differently</td><td>No further interruption; the hour forms no precedent</td></tr></tbody></table></div><p class="reading">The absence of a statement numbered Four has no explanation. A blank in numbering is not proof of a particular missing person.</p></figure>
<figure id="figure-159"><a aria-label="Open full-size diagram: 159. Who reads, who decides, who corrects" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-159.svg"><img alt="159. Who reads, who decides, who corrects" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-159.svg" width="842"/></a><figcaption>159. Who reads, who decides, who corrects</figcaption><p>Care and a private record answer practical needs left open by the political sheet.</p><dl><dt>After the interruption</dt><dd>The need for reading and an account of the hour remains.</dd><dt>Meral and Seven</dt><dd>She reads both labels again without choosing between them.</dd><dt>Two door notices</dt><dd>One requires open doors; the other says close them.</dd><dt>Political sheet</dt><dd>Calls the hour a rehearsal; a margin asks who will read boxes.</dd><dt>Two residents</dt><dd>One writes the other's account; the speaker changes a word.</dd></dl><h4>Relationships</h4><ul><li>Two door notices → Meral and Seven: conflicting instructions</li><li>Meral and Seven → After the interruption: reading without deciding</li><li>Political sheet → After the interruption: proposes an interpretation (reported, incomplete, disputed or interpretive connection)</li><li>Two residents → After the interruption: makes a corrected copy</li></ul><p class="reading">The private copy is corrected by its speaker; it is not guaranteed to preserve every resident's account.</p></figure>
