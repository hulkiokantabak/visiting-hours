	<title id="f48-t">THEREFORE · THE PROOF, AND THE TWO WORDS THAT CONVICT IT — seven lines at the end of the story · six of them valid, and one of them a man deciding</title>
	
	<clipPath id="f48-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>
	<g id="f48-group" transform="scale(1,-1) translate(0,-430)" style="clip-path: url(#f48-clip)">
		<g transform="">
			<rect x="0" y="0" width="700" height="430" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6; fill: rgb(98%,98%,98%); fill-rule: evenodd;"/>
			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">THEREFORE · THE PROOF, AND THE TWO WORDS THAT CONVICT IT</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">seven lines at the end of the story · six of them valid, and one of them a man deciding</text>
			<text x="70" y="312" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,624) scale(1,-1)">Proof.</text>
			<text x="340" y="312" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,624) scale(1,-1)">the register of a discipline</text>
			<text x="70" y="289" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,578) scale(1,-1)">Assume the world can be understood.</text>
			<text x="340" y="289" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,578) scale(1,-1)">the axiom every science needs</text>
			<text x="70" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,532) scale(1,-1)">Assume also that I would still be paid.</text>
			<text x="340" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,532) scale(1,-1)">the axiom that does not belong — and he writes it anyway</text>
			<text x="70" y="243" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,486) scale(1,-1)">Then there is a shortest true description of it.</text>
			<text x="340" y="243" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,486) scale(1,-1)">follows from the first assumption</text>
			<text x="70" y="220" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,440) scale(1,-1)">Take that description. Add this sentence to it.</text>
			<text x="340" y="220" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,440) scale(1,-1)">the move</text>
			<text x="70" y="197" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,394) scale(1,-1)">It is longer now. It is still true.</text>
			<text x="340" y="197" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,394) scale(1,-1)">true, and not a contradiction — a longer true description is not a shorter one</text>
			<text x="70" y="174" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,348) scale(1,-1)">Contradiction, I write.</text>
			<text x="340" y="174" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,348) scale(1,-1)">I WRITE · two words that tell you he is manufacturing the conclusion he needs</text>
			<text x="70" y="151" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,302) scale(1,-1)">Therefore.</text>
			<text x="340" y="151" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,302) scale(1,-1)">no consequent</text>
			<text x="70" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,256) scale(1,-1)">Therefore.</text>
			<text x="340" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,256) scale(1,-1)">and again, with nothing after it</text>
			<rect x="60" y="48" width="600" height="56" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="72" y="86" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,172) scale(1,-1)">THE PROOF IS INVALID, AND THE STORY KNOWS IT.</text>
			<text x="72" y="74" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,148) scale(1,-1)">Adding a true sentence to a shortest description makes a longer true description. It contradicts nothing.</text>
			<text x="72" y="64" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,128) scale(1,-1)">Two words — I WRITE — move the failure from the mathematics into the man, without the book saying so,</text>
			<text x="72" y="54" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,108) scale(1,-1)">and the second THEREFORE has nothing after it. There is nothing that follows.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,64) scale(1,-1)">HE WAS ASKED TO PRICE A WORD. HE PROVED IT CANNOT BE DONE. THEY THANKED HIM. THEY WERE KIND.</text>
		</g>
	</g>
</svg>

</div>
