<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Therefore · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/therefore/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/therefore/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/therefore/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/therefore/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-16"><h1>16. Therefore</h1>
<figure id="figure-46"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-046.svg"><img alt="046. Four reported stair counts" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-046.svg" width="842"/></a><figcaption>046. Four reported stair counts</figcaption><p>All bars are reported counts, not independent measurements of the staircase.</p><p>reported stairs</p><div aria-label="Table: 046. Four reported stair counts" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Narrator's first count</th><td>17</td><td>While counting down</td></tr><tr><th scope="row">Narrator's repeated count</th><td>19</td><td>Does not match his first count</td></tr><tr><th scope="row">His hands</th><td>23</td><td>A bodily count as narrated</td></tr><tr><th scope="row">His son going up</th><td>20</td><td>Not designated the correct count</td></tr></tbody></table></div><p class="reading">No stair count is certified as correct. His separate claim, “I have three hands,” remains outside this stair comparison.</p></figure>
<figure id="figure-47"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-047.svg"><img alt="047. One answer, two meanings" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-047.svg" width="842"/></a><figcaption>047. One answer, two meanings</figcaption><p>The clerk records refusal; the speaker continues his claim about the account.</p><div aria-label="Table: 047. One answer, two meanings" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Meaning selected by the clerk</th><th scope="col">Meaning repeated by the narrator</th></tr></thead><tbody><tr><th scope="row">Question in focus</th><td>Do you accept?</td><td>Will my account ever close?</td></tr><tr><th scope="row">The answer no</th><td>He does not accept</td><td>His account will not close</td></tr><tr><th scope="row">Action</th><td>The clerk selects the first no</td><td>He keeps saying the second</td></tr><tr><th scope="row">Visible continuation</th><td>His mother's mouth moves</td><td>No agreement over the answer is shown</td></tr></tbody></table></div><p class="reading">The screen accepts a meaning the speaker disputes. This is a conflict over an answer, not proof of a universal account law.</p></figure>
<figure id="figure-48"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-048.svg"><img alt="048. Where the attempted proof stops following" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-048.svg" width="842"/></a><figcaption>048. Where the attempted proof stops following</figcaption><p>The narrator's final reasoning keeps returning to its claimed conclusion.</p><dl><dt>Assumptions he writes</dt><dd>An understandable world; continued payment</dd><dt>A shortest true description</dt><dd>The narrator asserts its existence</dd><dt>One sentence added</dt><dd>A longer true description results</dd><dt>Contradiction</dt><dd>He labels the result a contradiction</dd><dt>Therefore, repeated</dt><dd>No further conclusion follows on the page</dd></dl><h4>Relationships</h4><ul><li>Assumptions he writes → A shortest true description: asserted by the narrator (reported, incomplete, disputed or interpretive connection)</li><li>A shortest true description → One sentence added: adds a sentence</li><li>One sentence added → Contradiction: invalid inference (reported, incomplete, disputed or interpretive connection)</li><li>Contradiction → Therefore, repeated: claimed conclusion (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">A longer true description does not refute a shortest one. The last inference fails formally; why does the speaker need it to follow?</p></figure>
