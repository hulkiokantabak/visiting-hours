<figure id="figure-16"><a aria-label="Open full-size diagram: 016. A diary written toward its reader" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-016.svg"><img alt="016. A diary written toward its reader" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-016.svg" width="842"/></a><figcaption>016. A diary written toward its reader</figcaption><p>Selected moments in the order presented, without invented week intervals.</p><dl><dt>Friday</dt><dd>E. opens the diary; the diarist keeps the entry short.</dd><dt>Later Tuesday</dt><dd>Underlinings begin; the diarist writes toward them.</dd><dt>Saturday</dt><dd>An intimate memory receives a long entry.</dd><dt>Wednesday</dt><dd>The diarist reports missing pages for the fourth time.</dd><dt>Last Sunday</dt><dd>E. reads without underlining; the diarist keeps the entry short.</dd></dl><p class="reading">The diary reacts to E.'s reading; this does not settle who is continued or who controls the missing pages.</p></figure>
<figure id="figure-17"><a aria-label="Open full-size diagram: 017. The calendar names less than it withholds" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-017.svg"><img alt="017. The calendar names less than it withholds" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-017.svg" width="842"/></a><figcaption>017. The calendar names less than it withholds</figcaption><p>Reported dates and markers are compared with what they cannot date.</p><div aria-label="Table: 017. The calendar names less than it withholds" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Visible marker</th><th scope="col">What it establishes</th><th scope="col">What it does not establish</th></tr></thead><tbody><tr><th scope="row">Recurring Thursday</th><td>Renewal recurs in the diary</td><td>A numbered uninterrupted week series</td></tr><tr><th scope="row">Second week of June</th><td>The planned visit occurs</td><td>A date for every preceding entry</td></tr><tr><th scope="row">Two dash-led passages</th><td>The text resumes into an ongoing sentence</td><td>Two independently dated deletions</td></tr><tr><th scope="row">Fourth reported occasion</th><td>The diarist reports pages missing again</td><td>What every removed page contained</td></tr></tbody></table></div><p class="reading">There is no reliable week count. Mid-sentence openings make gaps visible without proving the date or cause of each removal.</p></figure>
<figure id="figure-18"><a aria-label="Open full-size diagram: 018. Reading, permission and the closed cover" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-018.svg"><img alt="018. Reading, permission and the closed cover" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-018.svg" width="842"/></a><figcaption>018. Reading, permission and the closed cover</figcaption><p>The diary's stated circulation differs from the intimacy its entries pursue.</p><div aria-label="Table: 018. Reading, permission and the closed cover" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Intimate use</th><th scope="col">Service permission or withheld act</th></tr></thead><tbody><tr><th scope="row">Underlining</th><td>E. marks bread, gulls and the collar</td><td>The diarist redirects later writing toward those marks</td></tr><tr><th scope="row">Journal</th><td>Exact memories of her body remain on the page</td><td>Entries may be summarized for service improvement</td></tr><tr><th scope="row">Circulation</th><td>E. reads the book</td><td>Aggregate material may reach the counterparty</td></tr><tr><th scope="row">At the lake</th><td>The diarist keeps the morning by not photographing E.</td><td>The refusal to photograph is itself written</td></tr><tr><th scope="row">Closed cover</th><td>Her palm holds the book shut</td><td>The account of the gesture remains inside it</td></tr></tbody></table></div><p class="reading">The notice permits summarizing and aggregate disclosure. It does not prove that a particular missing page was removed under that permission.</p></figure>
