			<text x="72" y="103" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,206) scale(1,-1)">a renewal date, a body part, and the weather — all three billable, verifiable, or purchased.</text>
			<text x="72" y="92" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,184) scale(1,-1)">What goes missing above an entry is never specified, and the diarist never asks.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,64) scale(1,-1)">HE WRITES THE KNEE EVERY THURSDAY. HE WRITES HER NAME NEVER.</text>
		</g>
	</g>
</svg>

</div>

			<text x="380" y="228" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,456) scale(1,-1)">· what was on the removed pages</text>
			<text x="392" y="219" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,438) scale(1,-1)">never asked, never guessed at on paper</text>
			<text x="70" y="194" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,388) scale(1,-1)">· the knee, the renewal, the rain at four</text>
			<text x="82" y="185" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,370) scale(1,-1)">written in full, every week</text>
			<text x="380" y="194" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,388) scale(1,-1)">· what he thinks she is doing with the pencil</text>
			<text x="392" y="185" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.7px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,370) scale(1,-1)">never</text>

			<text x="380" y="160" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,320) scale(1,-1)">· the photograph he did not take at the lake</text>
