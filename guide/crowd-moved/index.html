<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crowd, Moved · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/crowd-moved/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/crowd-moved/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/crowd-moved/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/crowd-moved/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-10"><h1>10. Crowd, Moved</h1>
<figure id="figure-28"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-028.svg"><img alt="028. Five bookings, different records" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-028.svg" width="842"/></a><figcaption>028. Five bookings, different records</figcaption><p>Only the charges and classifications actually supplied are shown.</p><div aria-label="Table: 028. Five bookings, different records" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Booking</th><th scope="col">What the unit does</th><th scope="col">Record supplied</th></tr></thead><tbody><tr><th scope="row">Wedding at nine</th><td>Coordinates the first dance</td><td>No invoice basis stated</td></tr><tr><th scope="row">School at noon</th><td>Changes pitch and speed for the resisting boy</td><td>Songs licensed</td></tr><tr><th scope="row">Fish-market wake</th><td>Plays or rests for 4 quiet minutes</td><td>One selection, performed</td></tr><tr><th scope="row">Tank in the evening</th><td>Plays the unlicensed six-step tune</td><td>4 minutes: anomaly, recurring</td></tr><tr><th scope="row">Square at dawn</th><td>Moves the crowd; square empty in 20 minutes</td><td>One line: crowd, moved</td></tr></tbody></table></div><p class="reading">The wake is invoiced as a performance and the square as an outcome; the other bookings lack a stated invoice basis.</p></figure>
<figure id="figure-29"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-029.svg"><img alt="029. Who gets time to speak" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-029.svg" width="842"/></a><figcaption>029. Who gets time to speak</figcaption><p>The people dispute access before and during the unit's work.</p><div aria-label="Table: 029. Who gets time to speak" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Claim on attention</th><th scope="col">Response</th></tr></thead><tbody><tr><th scope="row">At the wake</th><td>A mourner raises a paid request while the daughter speaks</td><td>The widow lowers his hand; the daughter finishes</td></tr><tr><th scope="row">At the banner</th><td>A woman removes OURS from the demand</td><td>The holders keep the remaining strip aloft</td></tr><tr><th scope="row">At the megaphone</th><td>The same woman holds out her hand</td><td>Its holder passes it to the man behind her</td></tr><tr><th scope="row">At the unit's case</th><td>A man reaches it and repeats a mouth movement</td><td>The handler keeps his wax in and pulls the case away</td></tr></tbody></table></div><p class="reading">The altered banner and denied megaphone show contested access, not a unified organization or doctrine.</p></figure>
<figure id="figure-30"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-030.svg"><img alt="030. The feet learn behind the stoppers" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-030.svg" width="842"/></a><figcaption>030. The feet learn behind the stoppers</figcaption><p>A chain of bodily reception in the Tank and its later audible trace.</p><dl><dt>The unlicensed tune</dt><dd>Six descending steps in the Tank</dd><dt>Feet on the stone</dt><dd>His feet learn what he cannot hear</dd><dt>Stoppers removed at dawn</dt><dd>The ordinary city returns to his ears</dd><dt>The walk through the square</dt><dd>He hums six steps down</dd></dl><h4>Relationships</h4><ul><li>The unlicensed tune → Feet on the stone: felt through the floor</li><li>Feet on the stone → Stoppers removed at dawn: later in the narrative (reported, incomplete, disputed or interpretive connection)</li><li>Stoppers removed at dawn → The walk through the square: later in the narrative (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">His hearing is blocked, not his susceptibility. The tune's later humming does not establish ownership or freedom from it.</p></figure>
