			<text x="90" y="290" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,580) scale(1,-1)">SHE STANDS AT THE END OF IT WITH THE TABLET AT HER SIDE AND DOES NOT GO DOWN IT.</text>
			<text x="90" y="280" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,560) scale(1,-1)">She marks the row DEFERRED, ACCESS — a category for a gate that will not open, and not for a woman who will not walk.</text>
			<rect x="90" y="136" width="540" height="46" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="104" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,336) scale(1,-1)">THE PLATE</text>
			<text x="200" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,336) scale(1,-1)">six years on a monthly debit that leaves her account on the ninth</text>
			<text x="200" y="156" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,312) scale(1,-1)">she wrote the copy herself, in the fortnight after, out of a list of</text>
			<text x="200" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,296) scale(1,-1)">approved phrases</text>
			<rect x="90" y="76" width="540" height="46" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="104" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,216) scale(1,-1)">THE STONE</text>
			<text x="200" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,216) scale(1,-1)">blank granite, a name on the base plate, a space above it</text>
			<text x="200" y="96" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,192) scale(1,-1)">there was no money for cutting that year · the space has waited six years</text>
			<text x="200" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,176) scale(1,-1)">for a line she cannot choose</text>
			<text x="20" y="42" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,84) scale(1,-1)">EVERY MONTH THE DEBIT GOES OUT FOR THE SENTENCE SHE COULD AFFORD INSTEAD.</text>
			<text x="20" y="31" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,62) scale(1,-1)">She is the estate. There was nobody else to be it.</text>
			<text x="20" y="21" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,42) scale(1,-1)">Tomorrow she has three hundred and eleven stones left, and one of them is nine along a row she has deferred.</text>
		</g>
	</g>
</svg>

			<text x="302.1259765625" y="214" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,428) scale(1,-1)">handwritten · no license · nothing renews</text>
			<text x="70" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,336) scale(1,-1)">what the plate is</text>
			<text x="230" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,336) scale(1,-1)">licensed, renewable, editable, and it costs on the ninth of every month</text>
			<text x="70" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,296) scale(1,-1)">what the card offers</text>
			<text x="230" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,296) scale(1,-1)">a cut line, once, at an honest price, and then nothing further — ever</text>
			<text x="70" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,256) scale(1,-1)">what it would end</text>
			<text x="230" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,256) scale(1,-1)">the debit, the approved phrases, the screen and the fortnight after</text>
			<text x="70" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,216) scale(1,-1)">what it would begin</text>
			<text x="230" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,216) scale(1,-1)">a sentence in granite that no one can edit and no estate can renew</text>
			<text x="70" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,176) scale(1,-1)">what she does with it</text>
			<text x="230" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,176) scale(1,-1)">takes it down at the end of the day and puts it in her pocket</text>
			<rect x="70" y="44" width="590" height="24" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="82" y="56" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,112) scale(1,-1)">THE ONLY THING SHE TAKES FROM THE SLOPE IN 1,451 WORDS IS A HANDWRITTEN CARD ADVERTISING PERMANENCE.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,56) scale(1,-1)">AND AT THE TOP OF THE SLOPE THE TWO OF THEM EAT STANDING UP, AND SHE LAUGHS WITH HER MOUTH FULL</text>
			<text x="20" y="18" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,36) scale(1,-1)">and has to turn away from the stones to do it, which is the rule, and is also the only rule up here she keeps for herself.</text>
