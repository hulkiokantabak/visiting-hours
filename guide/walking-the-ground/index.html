<figure id="figure-55"><a aria-label="Open full-size diagram: 055. The plate, the stone and her decision" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-055.svg"><img alt="055. The plate, the stone and her decision" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-055.svg" width="842"/></a><figcaption>055. The plate, the stone and her decision</figcaption><p>Selected discrepancies have different filing outcomes.</p><div aria-label="Table: 055. The plate, the stone and her decision" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Location</th><th scope="col">Plate / stone relation</th><th scope="col">Her response</th></tr></thead><tbody><tr><th scope="row">40 / 12</th><td>Devoted father and fish trade / a good man on the water</td><td>Corresponding</td></tr><tr><th scope="row">40 / 19</th><td>Beloved wife of / her own woman</td><td>Sentiment, family-supplied</td></tr><tr><th scope="row">41 / 8</th><td>Silent plate / promise of Thursday visits</td><td>Corresponding; standing marks remain</td></tr><tr><th scope="row">42 / 1</th><td>Name and trade / paid for 9 crossings</td><td>Marks twice; tablet accepts once</td></tr><tr><th scope="row">42 / 6</th><td>Taken from us / TAKEN</td><td>Nothing filed</td></tr><tr><th scope="row">43 / 11</th><td>Repeated restart / warning about the one underneath</td><td>Corresponding; stone predates plate by 11 years</td></tr></tbody></table></div><p class="reading">Granite is not automatically certified as truer. Her filing choices include discretion, withholding and a failed second mark.</p></figure>
<figure id="figure-56"><a aria-label="Open full-size diagram: 056. Her mother's memorial has two wordings" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-056.svg"><img alt="056. Her mother's memorial has two wordings" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-056.svg" width="842"/></a><figcaption>056. Her mother's memorial has two wordings</figcaption><p>Remembered choice, renewal and blank stone stay distinct.</p><div aria-label="Table: 056. Her mother's memorial has two wordings" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Her remembered or bodily account</th><th scope="col">Recorded surface</th></tr></thead><tbody><tr><th scope="row">Chosen sentence</th><td>She remembers easier and calls it true</td><td>The renewal says warmer</td></tr><tr><th scope="row">Six years</th><td>She has not chosen the line to cut</td><td>Granite remains blank</td></tr><tr><th scope="row">Avoided row</th><td>Her heels dig in; she does not walk it</td><td>Deferred, access: a category for a locked gate</td></tr><tr><th scope="row">Payment</th><td>The debit continues each month</td><td>It buys the sentence she could afford instead</td></tr></tbody></table></div><p class="reading">The guide keeps easier and warmer in view. It does not select a correct original or identify a change mechanism.</p></figure>
<figure id="figure-57"><a aria-label="Open full-size diagram: 057. Work, company and an uncompleted alternative" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-057.svg"><img alt="057. Work, company and an uncompleted alternative" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-057.svg" width="842"/></a><figcaption>057. Work, company and an uncompleted alternative</figcaption><p>Reported totals and final actions do not guarantee a future inscription.</p><div aria-label="Table: 057. Work, company and an uncompleted alternative" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Measure or act</th><th scope="col">Given in the story</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">Work completed / remaining</th><td>629 examined; 311 left; 940 total</td><td>629 + 311 = 940, a calculated check</td></tr><tr><th scope="row">Discrepancies</th><td>106 in 629 examined</td><td>Does not certify each judgment</td></tr><tr><th scope="row">Office average</th><td>280</td><td>Comparable workload denominator not stated</td></tr><tr><th scope="row">Shared flask and soup</th><td>Idris exchanges names; the neighbor stays</td><td>Care does not settle her mother's memorial</td></tr><tr><th scope="row">Lettering card</th><td>She takes it after laughing with Idris</td><td>No inscription, price paid or canceled debit is shown</td></tr></tbody></table></div><p class="reading">Taking the card is an action, not a completed purchase or the end of renewal. The office average has no stated denominator here.</p></figure>
