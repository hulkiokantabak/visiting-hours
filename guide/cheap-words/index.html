<figure id="figure-13"><a aria-label="Open full-size diagram: 013. Household retention against the rate" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-013.svg"><img alt="013. Household retention against the rate" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-013.svg" width="842"/></a><figcaption>013. Household retention against the rate</figcaption><p>All three bars use words of proven retention; differences are calculations.</p><p>words of proven retention</p><div aria-label="Table: 013. Household retention against the rate" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Household held words</th><td>206</td><td>Distribution among three people is not supplied</td></tr><tr><th scope="row">Current rate</th><td>240</td><td>Calculated shortfall: 240 - 206 = 34 words</td></tr><tr><th scope="row">New-year rate</th><td>300</td><td>Calculated shortfall: 300 - 206 = 94 words</td></tr></tbody></table></div><p class="reading">The totals establish a household shortfall. They do not allocate the 206 words among the two adults and child.</p></figure>
<figure id="figure-14"><a aria-label="Open full-size diagram: 014. Taught is not the same as saved" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-014.svg"><img alt="014. Taught is not the same as saved" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-014.svg" width="842"/></a><figcaption>014. Taught is not the same as saved</figcaption><p>Three language practices use different accounts of value.</p><div aria-label="Table: 014. Taught is not the same as saved" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Practice</th><th scope="col">What is counted or used</th><th scope="col">What does not follow</th></tr></thead><tbody><tr><th scope="row">Dog story</th><td>Words she can afford to lose</td><td>Cheapness does not make them immune to loss</td></tr><tr><th scope="row">Tin and monthly recitation</th><td>9 saved words; tenth conditional</td><td>The hoped-for tenth is not yet acquired</td></tr><tr><th scope="row">Private word under the tap</th><td>One utterance; 9 still</td><td>Speaking it does not add a tenth</td></tr><tr><th scope="row">School note</th><td>Dear words taught; figure unspecified</td><td>Vocabulary is not the saved retention total</td></tr></tbody></table></div><p class="reading">The school note supplies no printed number in the story. It goes into the tin without becoming proof of additional saved words.</p></figure>
<figure id="figure-15"><a aria-label="Open full-size diagram: 015. A device becomes a model of storytelling" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-015.svg"><img alt="015. A device becomes a model of storytelling" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-015.svg" width="842"/></a><figcaption>015. A device becomes a model of storytelling</figcaption><p>A causal chain stated by the story, with the mother's deliberate accommodation.</p><dl><dt>The aging block</dt><dd>Drops the last word of anything longer than a sentence</dd><dt>The mother's adaptation</dt><dd>Keeps her sentences short</dd><dt>The boy's model</dt><dd>Thinks this is how stories go</dd></dl><h4>Relationships</h4><ul><li>The aging block → The mother's adaptation: she accommodates the limit</li><li>The mother's adaptation → The boy's model: form becomes familiar</li></ul><p class="reading">The block is nine years old; the child's age is not given. The story supplies no removal count.</p></figure>
