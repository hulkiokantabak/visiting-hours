<figure id="figure-91"><a aria-label="Open full-size diagram: 091. Two bringers, two remaining gestures" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-091.svg"><img alt="091. Two bringers, two remaining gestures" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-091.svg" width="842"/></a><figcaption>091. Two bringers, two remaining gestures</figcaption><p>The card and the made hand arrive after repeated failed attempts to part with them.</p><div aria-label="Table: 091. Two bringers, two remaining gestures" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Woman with the renewal card</th><th scope="col">Man with the made hand</th></tr></thead><tbody><tr><th scope="row">Before the table</th><td>Four cancellations and four reinstatements</td><td>Twice carries the hand home from the bins</td></tr><tr><th scope="row">Request or burden</th><td>Asks for disappearance, not destruction</td><td>Brings the hand wrapped in a shirt</td></tr><tr><th scope="row">After the trick</th><td>Hands retain the shape of the card</td><td>His breathing changes</td></tr><tr><th scope="row">Destination question</th><td>Asks where it went</td><td>Does not ask</td></tr></tbody></table></div><p class="reading">The requests and relief are concrete; the destination of either object is not established.</p></figure>
<figure id="figure-92"><a aria-label="Open full-size diagram: 092. Charges and what is held inside him" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-092.svg"><img alt="092. Charges and what is held inside him" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-092.svg" width="842"/></a><figcaption>092. Charges and what is held inside him</figcaption><p>Separate stated payment terms from the magician's accumulated words.</p><div aria-label="Table: 092. Charges and what is held inside him" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Statement</th><th scope="col">Quantity or relation</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">Woman's payment</th><td>Less than a reinstatement</td><td>No coin amount or currency named</td></tr><tr><th scope="row">Request after the man's trick</th><td>One word, said clearly</td><td>A particular exchange shown</td></tr><tr><th scope="row">Words inside the magician</th><td>140 that are not his</td><td>Their full acquisition history is not supplied</td></tr><tr><th scope="row">The woman's word</th><td>He feels it to be load-bearing</td><td>This is his bodily perception</td></tr></tbody></table></div><p class="reading">The woman's payment is not denominated in coins. A single request does not establish a universal tariff.</p></figure>
<figure id="figure-93"><a aria-label="Open full-size diagram: 093. Objects disappear; a word is retained" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-093.svg"><img alt="093. Objects disappear; a word is retained" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-093.svg" width="842"/></a><figcaption>093. Objects disappear; a word is retained</figcaption><p>Relations at the folding table, without a route to an unseen destination.</p><dl><dt>The magician</dt><dd>Does the tricks without touching either object</dd><dt>Renewal card</dt><dd>The woman's hands stay shaped around it</dd><dt>Made hand</dt><dd>The man does not ask where it went</dd><dt>The woman's word</dt><dd>Among the words he feels inside him</dd><dt>Behind the table</dt><dd>No drawer</dd></dl><h4>Relationships</h4><ul><li>Renewal card → The magician: disappearance performed</li><li>Made hand → The magician: disappearance performed</li><li>The woman's word → The magician: held within him</li><li>The magician → Behind the table: no storage shown there (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">The absence of a drawer blocks one mundane explanation; it does not reveal the method.</p></figure>
