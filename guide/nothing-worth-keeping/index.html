<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nothing Worth Keeping · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/nothing-worth-keeping/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/nothing-worth-keeping/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/nothing-worth-keeping/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/nothing-worth-keeping/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-41"><h1>41. Nothing Worth Keeping</h1>
<figure id="figure-121"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-121.svg"><img alt="121. A landscape edited to cost less" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-121.svg" width="842"/></a><figcaption>121. A landscape edited to cost less</figcaption><p>What he includes and excludes from the bedtime story.</p><div aria-label="Table: 121. A landscape edited to cost less" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Left in the telling</th><th scope="col">Kept out of the telling</th></tr></thead><tbody><tr><th scope="row">Landscape</th><td>Road, hedge, empty field, open gate</td><td>Names and numbers</td></tr><tr><th scope="row">Sensory detail</th><td>Afternoon; no weather to speak of</td><td>Lemon and music</td></tr><tr><th scope="row">Earlier attempt</th><td>A green door was tried once</td><td>He woke with a four-unit fee in mind</td></tr></tbody></table></div><p class="reading">This is his attempted protection against a charge, not proof that every unnamed story is free.</p></figure>
<figure id="figure-122"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-122.svg"><img alt="122. Shared words and the coming threshold" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-122.svg" width="842"/></a><figcaption>122. Shared words and the coming threshold</figcaption><p>Retained words compared with the announced new-year figure.</p><p>retained words</p><div aria-label="Table: 122. Shared words and the coming threshold" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Shared stock</th><td>194</td><td>Between them; survives a second asking</td></tr><tr><th scope="row">New-year threshold</th><td>300</td><td>Announced figure on the board</td></tr><tr><th scope="row">Calculated shortfall</th><td>106</td><td>300 minus 194; not an additional charge</td></tr></tbody></table></div><p class="reading">The shortfall is a calculation. The story does not allocate their words between the two people.</p></figure>
<figure id="figure-123"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-123.svg"><img alt="123. Who is telling whom" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-123.svg" width="842"/></a><figcaption>123. Who is telling whom</figcaption><p>Narrative order as the listener begins supplying his actions.</p><dl><dt>His bedtime road</dt><dd>He tells only as far as the gate.</dd><dt>Her private ending</dt><dd>She supplies his turning and free sleep.</dd><dt>His next words</dt><dd>She voices the offer he was about to make.</dd><dt>An unfinished account</dt><dd>She says she has not got further.</dd><dt>A refusal at the hand</dt><dd>She says he lets go; he answers Not yet.</dd></dl><h4>Relationships</h4><ul><li>His bedtime road → Her private ending: narrative initiative shifts</li><li>Her private ending → His next words: anticipation remains possible (reported, incomplete, disputed or interpretive connection)</li><li>His next words → An unfinished account: no complete forecast</li><li>An unfinished account → A refusal at the hand: ending contested</li></ul><p class="reading">Sleep-talk remains a possible explanation. Her account neither proves prediction nor settles the ending.</p></figure>
