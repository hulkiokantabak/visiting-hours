			<text x="84" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,544) scale(1,-1)">· a road, not going anywhere in particular</text>

			<text x="84" y="233" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,466) scale(1,-1)">· the afternoon · no weather to speak of</text>
			<text x="84" y="220" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,440) scale(1,-1)">· a gate, further along · open a long time,</text>
			<text x="84" y="207" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,414) scale(1,-1)">· from the look of the grass</text>

			<text x="394" y="259" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,518) scale(1,-1)">· a green door — tried once, and he woke with</text>
			<text x="394" y="246" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,492) scale(1,-1)">· the fee already written in his head:</text>
			<text x="394" y="233" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,466) scale(1,-1)">· FOUR UNITS, PAYABLE ON WAKING</text>
			<text x="394" y="220" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,440) scale(1,-1)">· no lemon · no music · no one at the gate</text>
			<text x="394" y="207" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,414) scale(1,-1)">· cut grass, which would cost her in the morning</text>

			<text x="84" y="153" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,306) scale(1,-1)">and she lets him do it anyway, most nights.</text>
			<text x="84" y="140" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,280) scale(1,-1)">ON THE BAD NIGHTS SHE ASKS THE QUESTIONS THAT MAKE IT HARDER FOR HIM.</text>
			<text x="84" y="129" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,258) scale(1,-1)">ON THE WORST NIGHTS SHE ASKS NOTHING AT ALL, AND THAT IS HOW HE KNOWS.</text>
			<text x="84" y="119" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,238) scale(1,-1)">Her questions are the only diagnostic instrument in this book that is never wrong.</text>
			<text x="20" y="92" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,184) scale(1,-1)">&quot;IS ANYONE AT THE GATE?&quot; · &quot;NO.&quot; · &quot;ARE YOU?&quot;</text>
			<text x="20" y="80" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,160) scale(1,-1)">He does not answer that one. Her hand finds his under the blanket and weighs it, the way you weigh a thing</text>
			<text x="20" y="69" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,138) scale(1,-1)">at a stall, and puts it back. She lets it go, and after a while she asks what the field smells like.</text>
			<text x="20" y="58" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,116) scale(1,-1)">He has an answer ready and does not use it. &quot;Nothing. It has been raining and it has stopped.&quot;</text>
			<text x="20" y="44" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,88) scale(1,-1)">EVEN HIS SLEEP HAS LEARNED THE TARIFF.</text>
			<text x="20" y="33" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,66) scale(1,-1)">He has made himself unquotable so that he cannot be billed, and the proof is that a green door woke him with a charge attached.</text>
