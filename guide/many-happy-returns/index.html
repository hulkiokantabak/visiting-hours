<figure id="figure-1"><a aria-label="Open full-size diagram: 001. The chairs the story actually counts" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-001.svg"><img alt="001. The chairs the story actually counts" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-001.svg" width="842"/></a><figcaption>001. The chairs the story actually counts</figcaption><p>Three reported moments; these are not points on a complete annual series.</p><div aria-label="Table: 001. The chairs the story actually counts" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Moment</th><th scope="col">At the table / loan</th><th scope="col">On the balcony</th></tr></thead><tbody><tr><th scope="row">First birthday shown</th><td>11 borrowed chairs; 10 guests</td><td>No opening count supplied</td></tr><tr><th scope="row">Later parties</th><td>No table count supplied</td><td>3 chairs, then 5</td></tr><tr><th scope="row">Last party</th><td>1 chair: his</td><td>Full rows, uncounted</td></tr></tbody></table></div><p class="reading">The balcony accumulates chairs, but no conserved total or count for every party is supplied.</p></figure>
<figure id="figure-2"><a aria-label="Open full-size diagram: 002. A room with several kinds of attendance" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-002.svg"><img alt="002. A room with several kinds of attendance" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-002.svg" width="842"/></a><figcaption>002. A room with several kinds of attendance</figcaption><p>A relational map of particular presences, not a complete guest census.</p><dl><dt>The birthday room</dt><dd>The room remains full as its occupants change.</dd><dt>Best friend</dt><dd>Licensed back; later excluded from the greeting</dd><dt>Father</dt><dd>His chair goes out; his watch remains</dd><dt>Aunt</dt><dd>Attends on her usual seat; chair declines a photograph</dd><dt>Girl with a braid</dt><dd>A different girl repeats the appetite</dd><dt>Mother</dt><dd>Handmade cake gives way to cake printed to her file</dd></dl><h4>Relationships</h4><ul><li>The birthday room → Best friend: return and refusal</li><li>The birthday room → Father: chair and watch remain</li><li>The birthday room → Aunt: attendance by her seat</li><li>The birthday room → Girl with a braid: repeated gesture</li><li>The birthday room → Mother: recipe becomes a file</li></ul><p class="reading">Physical absence and continued attendance do not share one meaning; the licensed friend's return can be refused.</p></figure>
<figure id="figure-3"><a aria-label="Open full-size diagram: 003. The greeting changes; the ring returns" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-003.svg"><img alt="003. The greeting changes; the ring returns" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-003.svg" width="842"/></a><figcaption>003. The greeting changes; the ring returns</figcaption><p>Narrative order, with the story's stated delays preserved.</p><dl><dt>Seventh birthday</dt><dd>A two-note bell admits guests.</dd><dt>Another ring</dt><dd>The friend returns from a job abroad; the boy's voice has changed.</dd><dt>The voice replaces the bell</dt><dd>It names each guest half a second before the ring.</dd><dt>The friend licensed back</dt><dd>His name returns; his laugh arrives half a second late.</dd><dt>Repeated rings</dt><dd>Three consecutive rings compress passing years.</dd><dt>Last line</dt><dd>The doorbell rings again; no visitor is identified.</dd></dl><p class="reading">The final ring supplies another arrival signal without identifying a visitor or ending the cycle.</p></figure>
