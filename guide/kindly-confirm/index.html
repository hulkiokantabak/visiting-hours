			<text x="568.3671875" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,544) scale(1,-1)">still paused · she takes a</text>
			<text x="575.834765625" y="264" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,528) scale(1,-1)">ticket and does not sit</text>
			<rect x="70" y="96" width="580" height="56" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="84" y="134" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,268) scale(1,-1)">HE HAS WORKED OUT WHAT IT COSTS HIS MOTHER, IN MORNINGS, EVERY TIME HE IS ASKED TO BE SOMEBODY.</text>
			<text x="84" y="122" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,244) scale(1,-1)">The register answers for him whether he is there or not, so his attendance has stopped being a fact</text>
			<text x="84" y="112" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,224) scale(1,-1)">about him and started being an expense. A nine-year-old does the arithmetic and withdraws himself.</text>
			<text x="84" y="101" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,202) scale(1,-1)">The smaller boy is not told anything, and the room adjusts the way a room does.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,64) scale(1,-1)">A CHILD LEARNS THE CITY’S ARITHMETIC BEFORE HE LEARNS LONG DIVISION.</text>
		</g>
	</g>
</svg>

<svg preserveAspectRatio="xMinYMin meet" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg" version="1.0" fill-rule="evenodd" xmlns:xlink="http://www.w3.org/1999/xlink" class="plate-svg" role="img" aria-labelledby="f66-t">
	<title id="f66-t">KINDLY CONFIRM · WINDOW SEVEN — one screen, in one story, does everything right · and it is filed here beside what the same machinery does elsewhere</title>
	
	<clipPath id="f66-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>
	<g id="f66-group" transform="scale(1,-1) translate(0,-430)" style="clip-path: url(#f66-clip)">
		<g transform="">
			<rect x="0" y="0" width="700" height="430" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.6; fill: rgb(98%,98%,98%); fill-rule: evenodd;"/>
			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">KINDLY CONFIRM · WINDOW SEVEN</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">one screen, in one story, does everything right · and it is filed here beside what the same machinery does elsewhere</text>
			<rect x="70" y="210" width="270" height="96" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.4; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="172.77734375" y="292" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,584) scale(1,-1)">WINDOW SEVEN</text>
			<text x="84" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,544) scale(1,-1)">· finds a payment taken twice in April</text>
			<text x="84" y="257" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,514) scale(1,-1)">· returns it BEFORE the mother asks</text>
			<text x="84" y="242" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,484) scale(1,-1)">· prints a line to say so</text>
			<text x="84" y="227" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,454) scale(1,-1)">· asks nothing further of her</text>
			<text x="163.81298828125" y="216" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,432) scale(1,-1)">She stands looking at the slip.</text>
			<rect x="370" y="210" width="290" height="96" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="446.956494140625" y="292" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,584) scale(1,-1)">THE SAME MACHINERY, ELSEWHERE</text>
			<text x="384" y="272" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,544) scale(1,-1)">· pauses a child pending confirmation of identity</text>
			<text x="384" y="257" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,514) scale(1,-1)">· shakes its head at photographs and dates</text>
			<text x="384" y="242" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,484) scale(1,-1)">· writes warmly: thank you for helping us</text>
			<text x="384" y="227" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,454) scale(1,-1)">· keep the record true</text>
			<text x="402.82177734375" y="216" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,432) scale(1,-1)">It is the same hall, the same sentence above every window, on another Thursday.</text>
			<rect x="70" y="96" width="590" height="78" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="84" y="156" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,312) scale(1,-1)">&quot;NOBODY IN THE QUEUE HAS SEEN THIS HAPPEN.&quot;</text>
			<text x="84" y="143" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,286) scale(1,-1)">The refund is real, unprompted, correct and unbilled. It is also one of only two moments in sixty stories</text>
			<text x="84" y="133" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,266) scale(1,-1)">where the machinery returns something before it is asked — and the queue does not know what to do with it.</text>
			<text x="84" y="118" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,236) scale(1,-1)">A SYSTEM THAT IS SOMETIMES RIGHT IS HARDER TO LEAVE THAN ONE THAT IS ALWAYS WRONG.</text>
			<text x="84" y="106" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,212) scale(1,-1)">That is why the piece contains this window: to make the hall’s cruelty un-dismissable.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,64) scale(1,-1)">THE QUEUE MOVES. THE FEE SCHEDULE HANGS WHERE THE QUEUE BENDS.</text>
