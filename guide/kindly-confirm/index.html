<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindly Confirm · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/kindly-confirm/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/kindly-confirm/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/kindly-confirm/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/kindly-confirm/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-22"><h1>22. Kindly Confirm</h1>
<figure id="figure-64"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-064.svg"><img alt="064. Two Thursdays, unlike results" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-064.svg" width="842"/></a><figcaption>064. Two Thursdays, unlike results</figcaption><p>The register and the mothers change tactics in narrative order.</p><dl><dt>First Thursday</dt><dd>Forty exchanged folders produce forty renewals; no invoices go out.</dd><dt>Weekend</dt><dd>The register puts itself right.</dd><dt>Monday</dt><dd>Kept printouts agree with the files, not with Thursday.</dd><dt>Next form</dt><dd>A second signature box adds a confirmation requirement.</dd><dt>Second Thursday</dt><dd>Sisters join; a shoe holds the door and the ticket machine crosses the threshold.</dd></dl><p class="reading">The second protest continues the action; its outcome is not reported.</p></figure>
<figure id="figure-65"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-065.svg"><img alt="065. One hall, two kinds of correction" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-065.svg" width="842"/></a><figcaption>065. One hall, two kinds of correction</figcaption><p>Compare what the hall can settle with what the mother cannot settle.</p><div aria-label="Table: 065. One hall, two kinds of correction" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Double payment</th><th scope="col">The son's identity</th></tr></thead><tbody><tr><th scope="row">Evidence</th><td>Two payments taken in April</td><td>Photographs retain the same eyebrow notch</td></tr><tr><th scope="row">Initiative</th><td>Returned before the mother asks</td><td>She brings every photograph</td></tr><tr><th scope="row">Screen response</th><td>Prints a refund slip</td><td>Rejects her evidence</td></tr><tr><th scope="row">Unsettled remainder</th><td>Refund is held up to the queue</td><td>Name still read at school; somebody answers</td></tr></tbody></table></div><p class="reading">The refund is real. Its presence does not explain or cancel the child's paused renewal.</p></figure>
<figure id="figure-66"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-066.svg"><img alt="066. Who gets to name the cost" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-066.svg" width="842"/></a><figcaption>066. Who gets to name the cost</figcaption><p>Statements about the action are placed beside acts that resist those statements.</p><div aria-label="Table: 066. Who gets to name the cost" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Who or text</th><th scope="col">Names or offers</th><th scope="col">What the mother or body does</th></tr></thead><tbody><tr><th scope="row">Organizer</th><td>Four extra seconds per confirmation</td><td>Mother repeats that phrase while returning the folder</td></tr><tr><th scope="row">Replacement companion</th><td>Calls the folder exchange a first victory</td><td>Mother makes its bearer read the paused line</td></tr><tr><th scope="row">Bearer</th><td>Asks to copy her son's file</td><td>She closes it</td></tr><tr><th scope="row">Organizer at home</th><td>Stays with the boy</td><td>Mother gives his mealtime and takes another ticket</td></tr><tr><th scope="row">Guard at Second Thursday</th><td>Tries to close the entrance</td><td>Stamps on the shoe holding the door</td></tr></tbody></table></div><p class="reading">The mother's refusal of publicity and acceptance of childcare are separate choices.</p></figure>
