<figure id="figure-58"><a aria-label="Open full-size diagram: 058. The first playback answers in different bodies" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-058.svg"><img alt="058. The first playback answers in different bodies" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-058.svg" width="842"/></a><figcaption>058. The first playback answers in different bodies</figcaption><p>Reported note positions compare her movement with the unit's response.</p><div aria-label="Table: 058. The first playback answers in different bodies" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Moment</th><th scope="col">Woman or recording</th><th scope="col">Unit or cabinets</th></tr></thead><tbody><tr><th scope="row">After 4 notes</th><td>Her left heel lifts; she puts it down hard</td><td>No response yet specified</td></tr><tr><th scope="row">Recorded catch</th><td>Old heel catches before note 5; scrape and laugh follow</td><td>No separate cause established</td></tr><tr><th scope="row">Note 5</th><td>Playback continues</td><td>Unit lights change rate</td></tr><tr><th scope="row">Note 6</th><td>Playback continues</td><td>Unit fans slow; cabinets settle with them</td></tr></tbody></table></div><p class="reading">Her lifted heel precedes the recorded scrape. The sequence does not establish whether memory, music or the unit directs her.</p></figure>
<figure id="figure-59"><a aria-label="Open full-size diagram: 059. The visiting unit is the one she disconnects" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-059.svg"><img alt="059. The visiting unit is the one she disconnects" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-059.svg" width="842"/></a><figcaption>059. The visiting unit is the one she disconnects</figcaption><p>A sequence of tests and actions, not proof of an experiment's controls.</p><dl><dt>Needle lifted</dt><dd>Fans continue; she considers ordinary cooling</dd><dt>Playback resumed</dt><dd>Her heel lifts; she misses the man's words again</dd><dt>Visiting unit unplugged</dt><dd>Its lights go out; cabinets keep humming</dd><dt>Record played again</dt><dd>She steps away and is on the wrong foot at the scrape</dd><dt>Outside afterward</dt><dd>She tries the step and misses</dd></dl><h4>Relationships</h4><ul><li>Needle lifted → Playback resumed: she tries again</li><li>Playback resumed → Visiting unit unplugged: she acts on the unit</li><li>Visiting unit unplugged → Record played again: she resumes the record</li><li>Record played again → Outside afterward: later in the narrative (reported, incomplete, disputed or interpretive connection)</li></ul><p class="reading">The licensed cabinets remain powered. Her imperfect later dance suggests an attempt at agency without proving release from influence.</p></figure>
<figure id="figure-60"><a aria-label="Open full-size diagram: 060. What the stimulus record misses" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-060.svg"><img alt="060. What the stimulus record misses" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-060.svg" width="842"/></a><figcaption>060. What the stimulus record misses</figcaption><p>A scheduled delivery and the woman's uncertain attachment describe the same hour.</p><div aria-label="Table: 060. What the stimulus record misses" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Recorded or scheduled</th><th scope="col">Present in the scene</th></tr></thead><tbody><tr><th scope="row">Recurring stimulus window</th><td>03:00-04:00; every fourteenth</td><td>She brings her own records and turntable</td></tr><tr><th scope="row">Attendance</th><td>Persons present: none, at opening and close</td><td>She plays, stops, touches the unit and dances</td></tr><tr><th scope="row">Mid-hall cabinet</th><td>Estate paid 4 units more in spring</td><td>She had read its extra activity as gladness</td></tr><tr><th scope="row">Empty bay</th><td>Decommissioned</td><td>She plays its record to the end</td></tr><tr><th scope="row">Completed stimulus</th><td>The closing log records delivery</td><td>The partner's words remain unheard; she misses the step</td></tr></tbody></table></div><p class="reading">The log's none does not make her absent from the scene. The estate's extra charge is shown, but its precise cause is not proved.</p></figure>
