<figure id="figure-142"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-142.svg"><img alt="142. A body present, a matter settled" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-142.svg" width="842"/></a><figcaption>142. A body present, a matter settled</figcaption><p>The old man's day does not match the outcome shown on his phone.</p><div aria-label="Table: 142. A body present, a matter settled" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Physical attendance</th><th scope="col">Administrative result</th></tr></thead><tbody><tr><th scope="row">Verification</th><td>Answers to R-73 five times</td><td>His blood is cleaned off before acceptance</td></tr><tr><th scope="row">At six</th><td>His number appears at a closed window</td><td>The voice says the call was made</td></tr><tr><th scope="row">Overcollection</th><td>Eleven years are recorded on the phone</td><td>The matter becomes settled</td></tr><tr><th scope="row">Tomorrow</th><td>The ticket remains valid</td><td>The new numbers start at one</td></tr></tbody></table></div><p class="reading">A record of settlement is not evidence that he receives money in this scene.</p></figure>
<figure id="figure-143"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-143.svg"><img alt="143. One list, changing readers" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-143.svg" width="842"/></a><figcaption>143. One list, changing readers</figcaption><p>Relations inside the old man's family tale, not a resolved history.</p><dl><dt>A list of missing people</dt><dd>Its later readers ask which names belong to soldiers.</dd><dt>The first collector</dt><dd>A soldier—or a man whose brother was taken by soldiers.</dd><dt>The keeper</dt><dd>Lends a pencil; later puts the pot on.</dd><dt>Prison openers</dt><dd>Arrive years later carrying the list.</dd><dt>People outside</dt><dd>Some hold photographs; some hold rope.</dd></dl><h4>Relationships</h4><ul><li>The first collector → A list of missing people: writes down the missing</li><li>The keeper → The first collector: lends pencil</li><li>Prison openers → A list of missing people: returns with it</li><li>Prison openers → The keeper: asks for identification</li><li>People outside → The keeper: awaits an answer</li></ul><p class="reading">The soldier and bereaved brother are alternative tellings. Whether the keeper later names anyone is unresolved.</p></figure>
<figure id="figure-144"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-144.svg"><img alt="144. Help that also asks for names" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-144.svg" width="842"/></a><figcaption>144. Help that also asks for names</figcaption><p>The present visit puts different kinds of assistance together.</p><div aria-label="Table: 144. Help that also asks for names" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Relation</th><th scope="col">Help or promise</th><th scope="col">Remaining demand</th></tr></thead><tbody><tr><th scope="row">Young woman / old man</th><td>Dresses his thumb; shares bread; helps him stand</td><td>Promises someone, not herself, will return</td></tr><tr><th scope="row">Young man / old man</th><td>Copies the overcollection down to its last unit</td><td>Requests and spells his name for future action</td></tr><tr><th scope="row">Present helpers / family tale</th><td>Listen and disagree about its ending</td><td>The young man asks for the keeper's name</td></tr><tr><th scope="row">Woman / old man on steps</th><td>They repeat the prayer together</td><td>Their agreement does not settle the list's fate</td></tr></tbody></table></div><p class="reading">The offered food and practical support are real; the future use of the recorded names remains open.</p></figure>
