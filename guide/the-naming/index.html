			<text x="230" y="63" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,126) scale(1,-1)">NO NAME · FOUR ATTEMPTS</text>
			<text x="420" y="63" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,126) scale(1,-1)">the pen goes down every time · nothing to attach to</text>
			<path d="M 60,55 L 660,55 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.25;"/>
			<text x="60" y="42" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,84) scale(1,-1)">THE ONLY PIECE WHERE THE BOOK’S CENTRAL LAW IS PERFORMED RATHER THAN OBEYED — by a clerk who cannot</text>
			<text x="60" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,64) scale(1,-1)">stop trying, losing live, in real time, and not putting the pen down. THREE NAMES ARE KEPT — Josef, Dora, Esen. FOUR ARE LEFT STANDING — Aron, Petar, Halide, Milena.</text>
			<text x="60" y="18" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,36) scale(1,-1)">&quot;THERE ARE MORE OF THEM THAN THERE WERE WHEN I STARTED THIS PAGE AND THE PAGE HAS NOT GOT ANY LONGER.&quot;</text>
		</g>
	</g>
</svg>

	<clipPath id="f167-clip">
		<rect x="0" y="0" width="700" height="430"/>
	</clipPath>

			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">THE NAMING · THE ONE HE PUTS AT THE END</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">where the ones you cannot do go</text>
			<rect x="150" y="174" width="400" height="132" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.5; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="294.905810546875" y="290" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 9.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,580) scale(1,-1)">THE CAT HAS NO NAME</text>
			<text x="312.217578125" y="268" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,536) scale(1,-1)">I will come back to the cat</text>
			<text x="306.337841796875" y="253" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,506) scale(1,-1)">I am putting the cat at the end</text>
			<text x="301.197705078125" y="238" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,476) scale(1,-1)">where the ones you cannot do go</text>
			<text x="273.8744140625" y="208" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,416) scale(1,-1)">gray and in the market and remembering for nothing</text>
			<text x="286.705419921875" y="193" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,386) scale(1,-1)">and playing back as a patch of clean sound</text>
			<text x="234.296630859375" y="163" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,326) scale(1,-1)">I HAVE TRIED FOUR TIMES AND THE PEN GOES DOWN EVERY TIME</text>
			<text x="277.6689453125" y="182" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,364) scale(1,-1)">THERE IS NOTHING TO ATTACH TO</text>
			<text x="70" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,296) scale(1,-1)">why the naming fails</text>
			<text x="250" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,296) scale(1,-1)">a name attaches a person to a record · SHE HAS NO RECORD TO ATTACH IT TO</text>
			<text x="70" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,256) scale(1,-1)">what the market says</text>
			<text x="250" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,256) scale(1,-1)">she belongs to nobody and is fed by everybody</text>
			<text x="70" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,216) scale(1,-1)">what the recordings do</text>
			<text x="250" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,216) scale(1,-1)">come back as room tone · the city cannot hold a speaker it cannot file</text>
			<text x="70" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,176) scale(1,-1)">and the verification room</text>
			<text x="250" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,176) scale(1,-1)">asks her name too, and persons and machines now answer identically</text>

			<text x="74" y="68" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,136) scale(1,-1)">THE LAST LINE OF THE STORY IS ALSO THE REASON THE STORY EXISTS.</text>
			<text x="74" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,114) scale(1,-1)">Every other figure on the page fails to be named · a name would be violence. The cat fails to be named</text>
			<text x="74" y="47" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,94) scale(1,-1)">for want of a surface to put one on — which is the only freedom in this city that cannot be revoked.</text>
			<text x="20" y="26" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,52) scale(1,-1)">FOUR ATTEMPTS. FOUR TIMES THE PEN GOES DOWN.</text>

			<rect x="60" y="300.0" width="600" height="44.0" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="230" y="330.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,660) scale(1,-1)">the clerk declines FOR her</text>
			<text x="230" y="318.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,636) scale(1,-1)">naming her would tell the room · the joke is hers</text>
			<rect x="60" y="246.0" width="600" height="44.0" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="276.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,552) scale(1,-1)">THE TWO IN THE QUEUE</text>
			<text x="230" y="276.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,552) scale(1,-1)">they decline for themselves</text>
			<text x="230" y="264.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,528) scale(1,-1)">THEY HAVE HAD ENOUGH OF BEING WRITTEN DOWN</text>
			<rect x="60" y="192.0" width="600" height="44.0" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<rect x="60" y="138.0" width="600" height="44.0" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="230" y="168.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,336) scale(1,-1)">the page itself declines</text>
			<text x="230" y="156.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,312) scale(1,-1)">there is nothing to attach to</text>
			<rect x="60" y="48" width="600" height="44" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="114.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,228) scale(1,-1)">AND FERIT</text>

			<text x="230" y="102.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,204) scale(1,-1)">and LEAVES THE STRIKE LEGIBLE, which is the Secretary’s own move, used on</text>
			<text x="230" y="94.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,188) scale(1,-1)">himself</text>

			<text x="74" y="74" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,148) scale(1,-1)">THE PAGE THAT TRIES HARDEST TO NAME PEOPLE IS THE ONE THAT PROVES THE BOOK’S RULE IS NOT A STYLE.</text>
			<text x="74" y="63" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,126) scale(1,-1)">A machine takes a name in no time at all. A person takes eleven years and does not get one. And the clerk,</text>
