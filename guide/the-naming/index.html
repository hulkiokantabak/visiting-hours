<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Naming · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-naming/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-naming/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-naming/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-naming/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-56"><h1>56. The Naming</h1>
<figure id="figure-166"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-166.svg"><img alt="166. Names tried, revised and refused" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-166.svg" width="842"/></a><figcaption>166. Names tried, revised and refused</figcaption><p>Examples follow this voice's attempts, not confirmed biographies.</p><div aria-label="Table: 166. Names tried, revised and refused" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Person as approached</th><th scope="col">Names or designations tried</th><th scope="col">Where this passage leaves it</th></tr></thead><tbody><tr><th scope="row">Boy before the eighth candle</th><td>Emin / Tomas / Aron</td><td>Leave him before that candle</td></tr><tr><th scope="row">Mother in the third bed</th><td>Nadia / Roza / the third bed / Halide</td><td>The unspent word remains with the boy</td></tr><tr><th scope="row">Woman with the ledger</th><td>Dora / Sabine / Dora</td><td>Finger beside the signature line</td></tr><tr><th scope="row">Man carrying a chair</th><td>Marek / Selim / nothing</td><td>Let him say goodnight through doors</td></tr></tbody></table></div><p class="reading">The arrows implicit in each row are revisions in the naming voice; they do not rename the people in the other stories.</p></figure>
<figure id="figure-167"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-167.svg"><img alt="167. One name cannot settle a position" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-167.svg" width="842"/></a><figcaption>167. One name cannot settle a position</figcaption><p>Already named people and uncertain identities resist tidy filing.</p><div aria-label="Table: 167. One name cannot settle a position" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What the naming voice has</th><th scope="col">What it cannot conclude</th></tr></thead><tbody><tr><th scope="row">Rauf and Lida</th><td>Names already present</td><td>Naming does not replace the hurt body</td></tr><tr><th scope="row">Suna</th><td>One name for taking and returning the carrier</td><td>It cannot place her on only one moral side</td></tr><tr><th scope="row">The widow</th><td>Possible echoes of two other women</td><td>Three women or one; neither file nor voice has a field</td></tr><tr><th scope="row">R-73</th><td>A designation answered to five times</td><td>The response to a ticket is not a settled personal name</td></tr></tbody></table></div><p class="reading">The sides of the page can be read as a moral division, not different Sunas. The widow's three-or-one possibility remains open.</p></figure>
<figure id="figure-168"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-168.svg"><img alt="168. Different reasons to stop naming" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-168.svg" width="842"/></a><figcaption>168. Different reasons to stop naming</figcaption><p>Refusal, privacy and failure are not the same limit.</p><dl><dt>An unfinished naming page</dt><dd>There are more people than when the naming started, but the page has not grown longer.</dd><dt>Secretary</dt><dd>The voice declines to expose her joke.</dd><dt>Two people left unnamed</dt><dd>They have had enough of being written down.</dd><dt>Ferit</dt><dd>The easy name is struck out and the strike left legible.</dd><dt>Cat</dt><dd>Four attempts; the voice finds nothing to attach to.</dd></dl><h4>Relationships</h4><ul><li>An unfinished naming page → Secretary: withholds</li><li>An unfinished naming page → Two people left unnamed: leaves unnamed</li><li>An unfinished naming page → Ferit: records its own refusal</li><li>An unfinished naming page → Cat: cannot complete</li></ul><p class="reading">These are limits performed on this page, not a guaranteed immunity from every record or cost.</p></figure>
