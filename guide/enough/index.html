<figure id="figure-97"><a aria-label="Open full-size diagram: 097. Who reads whose body" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-097.svg"><img alt="097. Who reads whose body" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-097.svg" width="842"/></a><figcaption>097. Who reads whose body</figcaption><p>Professional assessment, sexual judgment and bodily knowledge change hands.</p><div aria-label="Table: 097. Who reads whose body" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Reader</th><th scope="col">Body or action read</th><th scope="col">What follows</th></tr></thead><tbody><tr><th scope="row">Clinic</th><td>Her grip, span and tremor</td><td>Hands insured only to the second knuckle</td></tr><tr><th scope="row">Her, after the carpenter</th><td>Shaking hand on the measuring desk</td><td>Asks to move a patient; gives the carpenter five stars with her other hand</td></tr><tr><th scope="row">Her, with the funicular man</th><td>His breath stops at her seventh count</td><td>She recognizes the response from her work</td></tr><tr><th scope="row">Her, with the attendant</th><td>Thumb clicks under her fingers</td><td>She keeps the hand there until the scrub resumes</td></tr></tbody></table></div><p class="reading">The clicking thumb is recognized but not diagnosed. Five stars do not settle the cost of the encounter.</p></figure>
<figure id="figure-98"><a aria-label="Open full-size diagram: 098. A kindness remembered, a thread unchanged" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-098.svg"><img alt="098. A kindness remembered, a thread unchanged" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-098.svg" width="842"/></a><figcaption>098. A kindness remembered, a thread unchanged</figcaption><p>Compare her memory of a reply with what she later finds.</p><div aria-label="Table: 098. A kindness remembered, a thread unchanged" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What she remembers</th><th scope="col">What the thread shows</th></tr></thead><tbody><tr><th scope="row">Action</th><td>Writing a kind sentence</td><td>No sent sentence</td></tr><tr><th scope="row">Completion</th><td>Sending it on a wet Thursday</td><td>No draft of the sentence either</td></tr><tr><th scope="row">Later return</th><td>She looks for a plumber's number months later</td><td>His invitation remains the last message</td></tr></tbody></table></div><p class="reading">The conflict is preserved. No unseen sender, deletion or defect is supplied as its cause.</p></figure>
<figure id="figure-99"><a aria-label="Open full-size diagram: 099. The cloth lifts; she brings it back" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-099.svg"><img alt="099. The cloth lifts; she brings it back" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-099.svg" width="842"/></a><figcaption>099. The cloth lifts; she brings it back</figcaption><p>A sequence of bodily permission and pressure in the baths.</p><dl><dt>Her hands open</dt><dd>Heat works through the week in her shoulders.</dd><dt>The cloth lifts</dt><dd>Her back follows it.</dd><dt>She claims a missed place</dt><dd>She guides the attendant back to a place not missed.</dd><dt>The attendant's thumb clicks</dt><dd>The attendant apologizes.</dd><dt>Her hand keeps the hand in place</dt><dd>Scrubbing begins again.</dd><dt>Water supports her weight</dt><dd>The repeated passage of the cloth stings.</dd></dl><h4>Relationships</h4><ul><li>Her hands open → The cloth lifts: then</li><li>The cloth lifts → She claims a missed place: then</li><li>She claims a missed place → The attendant's thumb clicks: then</li><li>The attendant's thumb clicks → Her hand keeps the hand in place: then</li><li>Her hand keeps the hand in place → Water supports her weight: then</li></ul><p class="reading">Relief and the sting coexist in the last sentence; the repeated scrub is obtained through a false complaint.</p></figure>
