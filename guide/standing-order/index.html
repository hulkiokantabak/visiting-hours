<figure id="figure-70"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-070.svg"><img alt="070. One reference changes direction" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-070.svg" width="842"/></a><figcaption>070. One reference changes direction</figcaption><p>Follow the inquiry reference through the payments and payer field.</p><dl><dt>Inquiry</dt><dd>She refuses to sign the account over without the authority for payments.</dd><dt>That night</dt><dd>Her rent, mother's room and boiler debts settle under the inquiry reference.</dd><dt>Next morning</dt><dd>A thank-you arrives; the authority does not.</dd><dt>New funding line</dt><dd>Her full name appears as payer.</dd><dt>Next crossing</dt><dd>A fare comes out of her last salary.</dd></dl><p class="reading">The debts settle without the requested authority ever arriving.</p></figure>
<figure id="figure-71"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-071.svg"><img alt="071. Two offices, one open inquiry" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-071.svg" width="842"/></a><figcaption>071. Two offices, one open inquiry</figcaption><p>A procedural relation, not a diagram of who secretly controls the order.</p><dl><dt>Her inquiry reference</dt><dd>The authority remains missing</dd><dt>Accounts</dt><dd>Confirms credits; will not discuss the old order</dd><dt>Inquiries</dt><dd>Needs the authority; will not discuss money</dd><dt>The two replies</dt><dd>Each office tells her to keep the other's reply</dd></dl><h4>Relationships</h4><ul><li>Accounts → Her inquiry reference: confirms credits under it</li><li>Inquiries → Her inquiry reference: cannot close without proof</li><li>Accounts → The two replies: retain Inquiries' reply</li><li>Inquiries → The two replies: retain Accounts' reply</li></ul><p class="reading">Each office directs her toward evidence that the other office will not discuss.</p></figure>
<figure id="figure-72"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-072.svg"><img alt="072. The payer's name fits" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-072.svg" width="842"/></a><figcaption>072. The payer's name fits</figcaption><p>The handover proceeds in narrative order; informed agreement is not established.</p><dl><dt>New name in the payer field</dt><dd>The replacement has left another job for this one.</dd><dt>A question about whose fare</dt><dd>The answer is that it has always been here.</dd><dt>A signature guided by a finger</dt><dd>The older woman holds the page still.</dd><dt>The key changes hands</dt><dd>She waits until the ink dries.</dd><dt>The bell sounds</dt><dd>One fare goes out; the older woman's balance holds.</dd></dl><h4>Relationships</h4><ul><li>New name in the payer field → A question about whose fare: then</li><li>A question about whose fare → A signature guided by a finger: then</li><li>A signature guided by a finger → The key changes hands: then</li><li>The key changes hands → The bell sounds: then</li></ul><p class="reading">Her balance holds after the transfer. The new woman's understanding remains unshown.</p></figure>
