<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Present · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/present/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/present/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/present/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/present/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-9"><h1>9. Present</h1>
<figure id="figure-25"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-025.svg"><img alt="025. A name outlasts renewal" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-025.svg" width="842"/></a><figcaption>025. A name outlasts renewal</figcaption><p>Reported stages only; the opening school year is not numbered.</p><dl><dt>Before renewals stop</dt><dd>At nine her name is answered; the desk card renews separately on Thursdays.</dd><dt>Year of long division</dt><dd>Renewals stop.</dd><dt>One further term</dt><dd>The head retains the unpaid name; the teacher still reads it.</dd><dt>Following year</dt><dd>The teacher leaves without explaining.</dd><dt>Replacement</dt><dd>A different name occupies the seat.</dd><dt>Twenty years later</dt><dd>The reunion reads the old paper register.</dd></dl><p class="reading">The teacher leaves without giving a reason. The timeline records sequence, not a proved explanation for her departure.</p></figure>
<figure id="figure-26"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-026.svg"><img alt="026. Fee, name and funding are separate entries" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-026.svg" width="842"/></a><figcaption>026. Fee, name and funding are separate entries</figcaption><p>The story reports three linked records without identifying who stopped payment.</p><div aria-label="Table: 026. Fee, name and funding are separate entries" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Entry</th><th scope="col">What continues</th><th scope="col">What the figure cannot infer</th></tr></thead><tbody><tr><th scope="row">Desk fee</th><td>Listed between milk and swimming during renewal</td><td>A monthly schedule or reason payment stops</td></tr><tr><th scope="row">Name on the roll</th><td>Retained one unpaid term</td><td>The head's exclusive motive</td></tr><tr><th scope="row">Headcount and funding</th><td>Both hold while the name remains</td><td>That the child's presence costs nothing</td></tr><tr><th scope="row">Old paper register</th><td>Survives to the reunion outside funding's record</td><td>That it restores the child</td></tr></tbody></table></div><p class="reading">Keeping the name preserves funding for one term. Whether that act is kindness, expedience or both remains open.</p></figure>
<figure id="figure-27"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-027.svg"><img alt="027. A photograph moves; a hand remembers" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-027.svg" width="842"/></a><figcaption>027. A photograph moves; a hand remembers</figcaption><p>Two bodily or visual disturbances occur without remembered decisions.</p><div aria-label="Table: 027. A photograph moves; a hand remembers" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">School photograph</th><th scope="col">Reunion table</th></tr></thead><tbody><tr><th scope="row">Trigger</th><td>The autumn photograph has changed by spring</td><td>The fourth name is reached</td></tr><tr><th scope="row">Visible change</th><td>The neighboring children have moved apart</td><td>The former neighbor's hand lies flat</td></tr><tr><th scope="row">Remembered decision</th><td>Neither child remembers moving</td><td>She did not decide to put her hand there</td></tr><tr><th scope="row">The child at the center</th><td>Eight years old as printed</td><td>The answering silence is eight years old</td></tr></tbody></table></div><p class="reading">The comparison joins two unchosen changes; it does not explain how the photograph alters or diagnose the woman's gesture.</p></figure>
