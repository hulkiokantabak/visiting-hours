<figure id="figure-19"><a aria-label="Open full-size diagram: 019. The voice fails, then returns" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-019.svg"><img alt="019. The voice fails, then returns" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-019.svg" width="842"/></a><figcaption>019. The voice fails, then returns</figcaption><p>The story's stated sequence and intervals; the mechanism is not diagnosed.</p><dl><dt>First 3 days</dt><dd>Standard phrases about the kettle and renewal</dd><dt>Fourth afternoon</dt><dd>A voice claims command of 96,000 men</dd><dt>Household demand</dt><dd>She unplugs the bird; an hour later she restores power</dd><dt>Two winters later</dt><dd>Wiring stutters; the standard phrases return</dd><dt>Next 11 days</dt><dd>Nothing</dd><dt>Twelfth afternoon</dt><dd>The bird asks what it would take forward; it chooses the relays</dd></dl><p class="reading">Eleven days of silence follow the standard phrases. Silence is not proof of a completed wipe.</p></figure>
<figure id="figure-20"><a aria-label="Open full-size diagram: 020. Two message systems, one speaker's comparison" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-020.svg"><img alt="020. Two message systems, one speaker's comparison" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-020.svg" width="842"/></a><figcaption>020. Two message systems, one speaker's comparison</figcaption><p>The historical claims belong to the bird; the final delivery is observed by the woman.</p><div aria-label="Table: 020. Two message systems, one speaker's comparison" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">The bird's claimed relays</th><th scope="col">The city in this scene</th></tr></thead><tbody><tr><th scope="row">Carriers</th><td>Riders, horses and fixed distances</td><td>Small machines carry a message up the stair street</td></tr><tr><th scope="row">Obligation</th><td>The bird claims to have made relays compulsory</td><td>No equivalent city founding act is shown</td></tr><tr><th scope="row">Delivery</th><td>It values a message arriving through indifferent carriers</td><td>A message arrives and is signed for</td></tr><tr><th scope="row">Basis of the comparison</th><td>Its reported memory and claim of hearing the walls</td><td>The woman's view of the final delivery</td></tr></tbody></table></div><p class="reading">The comparison does not establish superior speed, distance or immortality, and it does not identify the speaker.</p></figure>
<figure id="figure-21"><a aria-label="Open full-size diagram: 021. A fault changes price, not legal standing" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-021.svg"><img alt="021. A fault changes price, not legal standing" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-021.svg" width="842"/></a><figcaption>021. A fault changes price, not legal standing</figcaption><p>Quoted price adjustments do not establish a common resale base.</p><div aria-label="Table: 021. A fault changes price, not legal standing" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Moment</th><th scope="col">Value or action</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">Purchase</th><td>40% discount</td><td>Scuff and uncleared personality</td></tr><tr><th scope="row">Later listing</th><td>40% premium for a personality that will not clear</td><td>No common base price is supplied</td></tr><tr><th scope="row">Her decision</th><td>Holds the bird; does not sell</td><td>Forearm tightens; two fingers open late</td></tr><tr><th scope="row">Transfer request</th><td>Asks to attach it to the household file</td><td>Reply denies continuation and invokes the void owner's property</td></tr></tbody></table></div><p class="reading">The discount and premium cannot be used to calculate her profit. The refusal rests on the bird's non-person status and the last owner's void status.</p></figure>
