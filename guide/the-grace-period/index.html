<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; script-src &#x27;none&#x27;; style-src &#x27;self&#x27;; img-src &#x27;self&#x27;; media-src &#x27;self&#x27;; object-src &#x27;none&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Grace Period · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-grace-period/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-grace-period/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="location">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-grace-period/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content" tabindex="-1"><p class="guide-book-link"><a href="/visiting-hours/read/the-grace-period/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" hreflang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-3"><h1>3. The Grace Period</h1>
<figure id="figure-7"><a aria-label="Open full-size diagram: 007. The clocks as reported" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-007.svg"><img alt="007. The clocks as reported" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-007.svg" width="842"/></a><figcaption>007. The clocks as reported</figcaption><p>Wall time, elapsed age and registration age are not converted into one clock.</p><div aria-label="Table: 007. The clocks as reported" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Clock or record</th><th scope="col">Reported value</th><th scope="col">Associated event</th></tr></thead><tbody><tr><th scope="row">Elapsed age</th><td>11 hours</td><td>Mother in the third bed</td></tr><tr><th scope="row">Wall clock</th><td>04:30</td><td>Desk man arrives</td></tr><tr><th scope="row">Elapsed age</th><td>11 hours 40</td><td>Word spoken; time retained on the record</td></tr><tr><th scope="row">Wall clock</th><td>04:52</td><td>Account opens</td></tr><tr><th scope="row">Closing age statement</th><td>11 hours old; 8 minutes registered</td><td>The child already holds the unpaid word</td></tr><tr><th scope="row">Policy threshold</th><td>12 hours from first breath</td><td>No-charge interval ends; fee doubles</td></tr></tbody></table></div><p class="reading">The reported times do not form a clean derived chronology; no birth time or corrected age is supplied here.</p></figure>
<figure id="figure-8"><a aria-label="Open full-size diagram: 008. What care can hold in place" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-008.svg"><img alt="008. What care can hold in place" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-008.svg" width="842"/></a><figcaption>008. What care can hold in place</figcaption><p>Three helpers and the registration process operate within different limits.</p><div aria-label="Table: 008. What care can hold in place" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Action</th><th scope="col">Limit that remains</th></tr></thead><tbody><tr><th scope="row">Midwife</th><td>Tea, clean cloth, prayer knots and a witness signature</td><td>Her name stays beside the account</td></tr><tr><th scope="row">Meral</th><td>Keeps the printer beside the empty tag</td><td>Her workload request remains unsigned</td></tr><tr><th scope="row">Desk man</th><td>Explains and prints the hardship schedule</td><td>The screen requires admission for an occupied bed</td></tr><tr><th scope="row">Registration</th><td>Cot, warmth and a reading become available</td><td>Use of the grace period stays on the file</td></tr></tbody></table></div><p class="reading">Care secures material help and registration, while neither the workload nor the lasting file note is erased.</p></figure>
<figure id="figure-9"><a aria-label="Open full-size diagram: 009. A word in the child; a name on the account" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-009.svg"><img alt="009. A word in the child; a name on the account" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-009.svg" width="842"/></a><figcaption>009. A word in the child; a name on the account</figcaption><p>Two acts occur close together without becoming the same transaction.</p><div aria-label="Table: 009. A word in the child; a name on the account" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Word given to the child</th><th scope="col">Name entered for the account</th></tr></thead><tbody><tr><th scope="row">Utterance</th><td>Said twice into his ear</td><td>A short name unfamiliar to the midwife</td></tr><tr><th scope="row">Mother's distinction</th><td>Reserved for later</td><td>She asks for it to be written down</td></tr><tr><th scope="row">Immediate consequence</th><td>He has the word; nobody has been paid for it</td><td>Account opens; tag closes around his ankle</td></tr><tr><th scope="row">Continuing record</th><td>No entry for this word is shown</td><td>Registration time travels with him</td></tr></tbody></table></div><p class="reading">The text distinguishes the private word from the registered name; it does not certify that nothing can ever record the word.</p></figure>
