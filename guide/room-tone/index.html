			<circle cx="280.0" cy="244" r="3.6" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="263.311474609375" y="228" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,456) scale(1,-1)">the square</text>
			<text x="233.910107421875" y="219" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,438) scale(1,-1)">crossed once, AT HER OWN PACE</text>
			<circle cx="420.0" cy="244" r="3.6" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(54%,18%,18%); fill-rule: evenodd;"/>
			<text x="388.65" y="228" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,456) scale(1,-1)">the steps that go up</text>
			<text x="393.077294921875" y="219" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,438) scale(1,-1)">and kept taking them</text>
			<text x="582.50341796875" y="306" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,612) scale(1,-1)">THE HILL</text>
			<text x="532.6103515625" y="296" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,592) scale(1,-1)">on the hill, the gate stays open</text>
			<rect x="60" y="132" width="600" height="74" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="190" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,380) scale(1,-1)">THE CAMERAS FILED HER DEPARTURE AS WEATHER.</text>
			<text x="74" y="178" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,356) scale(1,-1)">She is unrecordable, so the one system that watches everything records her leaving as a change in conditions.</text>
			<text x="74" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,328) scale(1,-1)">THE OTHER CATS CAME DOWN FROM THE ROOFS ONE BY ONE AND SAT IN THE PLACES SHE HAD SAT,</text>
			<text x="74" y="153" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,306) scale(1,-1)">not talking, in the way of a thing that has been raised and answered.</text>
			<text x="74" y="140" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,280) scale(1,-1)">The girl sweeps the stairs and says her sayings to the water, ONE A DAY, UNPAID.</text>
			<rect x="60" y="46" width="600" height="62" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="92" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,184) scale(1,-1)">THE PIECE HANDS THE CLOSER ITS OPENING.</text>
			<text x="74" y="80" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,160) scale(1,-1)">Three stories later a woman climbs the same steps past the same last stop, and finds a cat on the step</text>
			<text x="74" y="70" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,140) scale(1,-1)">with one ear notched by something settled a long time ago — and the book never says it is the same cat.</text>
			<text x="74" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,114) scale(1,-1)">&quot;SAYINGS SAID TO THE WATER&quot; IS ON THE OFFICE’S OWN LIST OF THINGS IT CANNOT PRICE.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,56) scale(1,-1)">ON THE HILL, THE GATE STAYS OPEN.</text>
		</g>
	</g>
</svg>
