<figure id="figure-169"><a aria-label="Open full-size diagram: 169. An interest without an attachment" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-169.svg"><img alt="169. An interest without an attachment" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-169.svg" width="842"/></a><figcaption>169. An interest without an attachment</figcaption><p>Acquisition and recording attempts fail in different ways.</p><div aria-label="Table: 169. An interest without an attachment" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Attempt or expected handle</th><th scope="col">What the story supplies</th></tr></thead><tbody><tr><th scope="row">Identity and license</th><td>Birth entry, license, continuation plan</td><td>None found</td></tr><tr><th scope="row">Recurring entitlement</th><td>Renewal date or rationed sample</td><td>None found</td></tr><tr><th scope="row">Inventory</th><td>Men itemize the market</td><td>Leave with the list they brought</td></tr><tr><th scope="row">Phone recording</th><td>Surroundings preserved in playback</td><td>Her voice is room-tone</td></tr></tbody></table></div><p class="reading">The cat can still be made vulnerable through her listeners; these failures do not place everyone beyond reach.</p></figure>
<figure id="figure-170"><a aria-label="Open full-size diagram: 170. Pressure reaches the listeners" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-170.svg"><img alt="170. Pressure reaches the listeners" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-170.svg" width="842"/></a><figcaption>170. Pressure reaches the listeners</figcaption><p>A narrated sequence from fines to a different audience.</p><dl><dt>Listening fined</dt><dd>Unlicensed speech is the stated category.</dd><dt>Stalls turn away</dt><dd>For a month the listeners face their fish.</dd><dt>Visible ribs</dt><dd>The cat's body becomes thinner.</dd><dt>Children listen</dt><dd>This listening cannot be fined.</dd><dt>A girl learns</dt><dd>The cat asks her to learn unpaid remembering.</dd></dl><h4>Relationships</h4><ul><li>Listening fined → Stalls turn away: listeners withdraw</li><li>Stalls turn away → Visible ribs: bodily cost appears</li><li>Visible ribs → Children listen: another audience</li><li>Children listen → A girl learns: a saying entrusted</li></ul><p class="reading">Children cannot be fined for listening to her. The exemption says nothing about every other charge.</p></figure>
<figure id="figure-171"><a aria-label="Open full-size diagram: 171. A voice carried without playback" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-171.svg"><img alt="171. A voice carried without playback" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-171.svg" width="842"/></a><figcaption>171. A voice carried without playback</figcaption><p>Human repetition carries what phones do not recover.</p><dl><dt>The cat's spoken memory</dt><dd>Her phone-recorded voice is absent.</dd><dt>Ice-man's widow</dt><dd>Receives a nine-winter-old sentence and its tone.</dd><dt>Market</dt><dd>Memorizes and repeats the sayings.</dd><dt>Errand boys</dt><dd>Carry the sayings onward.</dd><dt>Girl on the stairs</dt><dd>Says them to the water, one a day.</dd><dt>Departure record</dt><dd>Cameras file her leaving as weather.</dd></dl><h4>Relationships</h4><ul><li>The cat's spoken memory → Ice-man's widow: returns remembered speech</li><li>The cat's spoken memory → Market: remembered by mouth</li><li>Market → Errand boys: sayings travel</li><li>The cat's spoken memory → Girl on the stairs: asks her to learn</li><li>The cat's spoken memory → Departure record: filed in another category</li></ul><p class="reading">The price the cat paid for words is withheld. Her departure does not certify the identity of another hill cat.</p></figure>
