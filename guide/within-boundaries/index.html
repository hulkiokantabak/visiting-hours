<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Within Boundaries · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/within-boundaries/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/within-boundaries/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/within-boundaries/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/within-boundaries/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-37"><h1>37. Within Boundaries</h1>
<figure id="figure-109"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-109.svg"><img alt="109. An apology that he leaves uncorrected" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-109.svg" width="842"/></a><figcaption>109. An apology that he leaves uncorrected</figcaption><p>The first tea disagreement separates what he recalls from what he permits her to believe.</p><div aria-label="Table: 109. An apology that he leaves uncorrected" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What he says or permits</th><th scope="col">What the narrative supplies</th></tr></thead><tbody><tr><th scope="row">First denial</th><td>Says he had the other tea on the eleventh</td><td>She says he had smoke on both visits</td></tr><tr><th scope="row">Apology</th><td>Allows her apology to stand</td><td>He remembers the tea going cold while he spoke</td></tr><tr><th scope="row">Later question</th><td>Points out that she already asked</td><td>She says she loses the thread</td></tr></tbody></table></div><p class="reading">The later repeated question is another event; it does not make his first denial true.</p></figure>
<figure id="figure-110"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-110.svg"><img alt="110. Ten offered, four used" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-110.svg" width="842"/></a><figcaption>110. Ten offered, four used</figcaption><p>The touch is offered, accepted and stopped before the announced count ends.</p><dl><dt>Offer</dt><dd>Ten counts, with a stated stop.</dd><dt>Assent</dt><dd>He nods; the hand settles and his muscles slacken.</dd><dt>Stop at four</dt><dd>He asks for removal; her hand returns to the table.</dd><dt>After withdrawal</dt><dd>She waits with both hands visible; he wants the touch back.</dd><dt>Unmade request</dt><dd>He learns the warmth is on the card but cannot ask for the hand.</dd></dl><p class="reading">She withdraws promptly. His wish for her to return without asking does not become renewed permission.</p></figure>
<figure id="figure-111"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-111.svg"><img alt="111. A refusal, a receipt and a repeated voice" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-111.svg" width="842"/></a><figcaption>111. A refusal, a receipt and a repeated voice</figcaption><p>Follow the next-week offer and the sound that continues outside the table.</p><div aria-label="Table: 111. A refusal, a receipt and a repeated voice" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Place or moment</th><th scope="col">His act</th><th scope="col">What the setting returns</th></tr></thead><tbody><tr><th scope="row">Forty-nine minutes</th><td>Declines the same table next week</td><td>The offer follows forty paid minutes</td></tr><tr><th scope="row">Card slot</th><td>Surrenders the card and pockets the receipt</td><td>Receipt says next week requested; slot uses her voice</td></tr><tr><th scope="row">Door</th><td>Leaves the premises</td><td>The same voice thanks him</td></tr><tr><th scope="row">Bus journey</th><td>At his stop, his hands stay on his knees</td><td>Voice heard again on the bus; doors close at his stop</td></tr></tbody></table></div><p class="reading">The nine-minute difference is calculable, but its billing is unstated. The receipt does not match his shown refusal.</p></figure>
