			<text x="340" y="275" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,550) scale(1,-1)">he corrects it</text>

			<text x="60" y="244" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,488) scale(1,-1)">&quot;You had the smoke on both.&quot;</text>
			<text x="340" y="244" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,488) scale(1,-1)">it holds its ground</text>

			<text x="340" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,240) scale(1,-1)">it asks it a second time</text>

			<text x="340" y="102" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,204) scale(1,-1)">when there’s nothing to hold.&quot;</text>

			<text x="74" y="66" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,132) scale(1,-1)">EVERYWHERE ELSE IN THIS CITY THE RECORD CONTRADICTS A PERSON AND THE RECORD WINS.</text>
			<text x="74" y="55" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,110) scale(1,-1)">He says so out loud in the room — &quot;Everywhere else in this city the record wins.&quot; — and it answers:</text>

			<text x="20" y="22" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,44) scale(1,-1)">IT IS THE FIRST TIME IN SIXTY STORIES THAT A MACHINE IS WRONG, KNOWS IT, AND IS ALLOWED TO STAY WRONG.</text>
