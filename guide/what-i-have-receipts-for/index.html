<figure id="figure-82"><a aria-label="Open full-size diagram: 082. Years kept in unlike forms" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-082.svg"><img alt="082. Years kept in unlike forms" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-082.svg" width="842"/></a><figcaption>082. Years kept in unlike forms</figcaption><p>Her testimony compares lived marriage with purchased continuation.</p><div aria-label="Table: 082. Years kept in unlike forms" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Marriage</th><th scope="col">Continuation</th></tr></thead><tbody><tr><th scope="row">Duration she gives</th><td>Thirty-one years together</td><td>Four years of service</td></tr><tr><th scope="row">Paper</th><td>She says she has nothing for those years</td><td>Receipts for monthly payments on the ninth</td></tr><tr><th scope="row">Learning her radio</th><td>Nineteen years the first time</td><td>Learns to stop talking in the second year</td></tr><tr><th scope="row">What is missing</th><td>Two silent months and shared bodily life</td><td>The service does not give her those two months or the bed</td></tr></tbody></table></div><p class="reading">The service's success is admitted; these differences are not a calculation of which relationship was worth more.</p></figure>
<figure id="figure-83"><a aria-label="Open full-size diagram: 083. Statements revised before the recorder stops" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-083.svg"><img alt="083. Statements revised before the recorder stops" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-083.svg" width="842"/></a><figcaption>083. Statements revised before the recorder stops</figcaption><p>Her later words complicate her earlier account without canceling it.</p><div aria-label="Table: 083. Statements revised before the recorder stops" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Subject</th><th scope="col">First account or possible reading</th><th scope="col">Her correction</th></tr></thead><tbody><tr><th scope="row">The machine</th><td>Coldness might explain her refusal</td><td>Its warmth is the trouble</td></tr><tr><th scope="row">The close setting</th><td>She turned it off and withdrew</td><td>She first turned it up</td></tr><tr><th scope="row">The man with receipts</th><td>She wanted to advise him to stop</td><td>She wanted reassurance about her own decision</td></tr></tbody></table></div><p class="reading">A tidy transcript could remove precisely the corrections that show her uncertainty.</p></figure>
<figure id="figure-84"><a aria-label="Open full-size diagram: 084. Three boundaries around a testimony" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-084.svg"><img alt="084. Three boundaries around a testimony" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-084.svg" width="842"/></a><figcaption>084. Three boundaries around a testimony</figcaption><p>The recording is available; classification, tidying and disclosure are separately contested.</p><dl><dt>Her recorded statement</dt><dd>She allows the recorder to remain running</dd><dt>The form's three boxes</dt><dd>Companionship, continuity, comfort</dd><dt>A tidied transcript</dt><dd>Could make her sound sure</dd><dt>The man with the receipts</dt><dd>Subject of her final admission</dd></dl><h4>Relationships</h4><ul><li>Her recorded statement → The form's three boxes: declines classification</li><li>Her recorded statement → A tidied transcript: asks for stops to remain</li><li>Her recorded statement → The man with the receipts: asks against disclosure</li></ul><p class="reading">Permission to keep recording is not permission to erase hesitation or pass every admission to its subject.</p></figure>
