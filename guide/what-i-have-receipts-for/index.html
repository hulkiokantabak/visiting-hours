			<text x="320" y="154" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,308) scale(1,-1)">&quot;Turn it off now. Or leave it running, it is your paper.&quot;</text>
			<circle cx="84" cy="120" r="4" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1; fill: rgb(54%,18%,18%); fill-rule: evenodd;"/>
			<text x="100" y="118" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,236) scale(1,-1)">AND ADDS ONE ITEM FOR THE FORM</text>
			<text x="320" y="118" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,236) scale(1,-1)">the man in the queue, younger, with the look she has in photographs</text>
			<text x="320" y="109" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.3px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,218) scale(1,-1)">from the second year</text>
			<rect x="60" y="46" width="600" height="60" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="72" y="88" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,176) scale(1,-1)">&quot;IF YOU FIND HIM, ASK HIM WHAT HE THINKS HE IS KEEPING, AND THEN ASK HIM AGAIN IN FOUR YEARS.&quot;</text>
			<text x="72" y="76" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,152) scale(1,-1)">She is seventy-one, sleeps badly, and is the last person who knows how he took his tea — half a cup,</text>
			<text x="72" y="66" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,132) scale(1,-1)">then the rest when it had gone off the boil, so the first half was always too hot and he drank it anyway —</text>
			<text x="72" y="56" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,112) scale(1,-1)">and when she goes, that goes.</text>
			<text x="20" y="30" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,60) scale(1,-1)">FOR ELEVEN DAYS SHE COULD NOT GO INTO THE KITCHEN. THAT IS GRIEF.</text>
			<text x="20" y="20" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,40) scale(1,-1)">It is the only thing left in this city that arrives without an invoice.</text>
		</g>
	</g>
</svg>
