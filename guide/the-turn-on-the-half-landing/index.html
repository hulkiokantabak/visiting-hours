			<text x="294.0037109375" y="232" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,464) scale(1,-1)">AND THERE WAS NO DUST ON IT AT ALL</text>
			<text x="248.7548828125" y="216" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,432) scale(1,-1)">somebody had been dusting a shelf with nothing on it · eleven months · the second Sunday</text>
			<text x="70" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,336) scale(1,-1)">what the paper proves</text>
			<text x="280" y="168" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,336) scale(1,-1)">the license, the receipts, four years of stubs thin as a deck, the certificate with two stamps</text>

			<text x="280" y="148" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,296) scale(1,-1)">nothing that any office would accept</text>
			<text x="70" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,256) scale(1,-1)">who was dusting it</text>
			<text x="280" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,256) scale(1,-1)">him · for eleven months, on the second Sunday, without ever once deciding to</text>
			<text x="70" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,216) scale(1,-1)">what he takes without deciding to</text>
			<text x="280" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,216) scale(1,-1)">two plates · he finds them later in his own bag</text>
			<rect x="60" y="44" width="600" height="42" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="72" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,144) scale(1,-1)">HE HANDS THE KEYS IN AT FIVE. THE CLERK IS KIND AND QUICK AND KEEPS HIM BACK FOUR MINUTES PAST HER OWN HOUR,</text>
