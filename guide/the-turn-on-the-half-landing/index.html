<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Turn on the Half-Landing · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-turn-on-the-half-landing/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-turn-on-the-half-landing/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-turn-on-the-half-landing/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-turn-on-the-half-landing/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-39"><h1>39. The Turn on the Half-Landing</h1>
<figure id="figure-115"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-115.svg"><img alt="115. The wardrobe goes up but does not come down" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-115.svg" width="842"/></a><figcaption>115. The wardrobe goes up but does not come down</figcaption><p>The same object is measured across a remembered move and the present clearing.</p><dl><dt>Thirty-one years earlier</dt><dd>Father and son carry it upward sideways; a wrist is caught at the turn.</dd><dt>By four today</dt><dd>Only the wardrobe remains; he sits with the tape.</dd><dt>Attempted removal</dt><dd>It lifts an inch, drops back; removing its door makes no difference.</dd><dt>Two priced alternatives</dt><dd>Stay and charge the estate, or break it up at cost.</dd><dt>After the keys are returned</dt><dd>It stands doorless, awaiting an estate charge and a photograph with a rule.</dd></dl><p class="reading">The final state is an object awaiting an estate charge, not a confirmed future demolition.</p></figure>
<figure id="figure-116"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-116.svg"><img alt="116. A room occupied, then a shelf tended" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-116.svg" width="842"/></a><figcaption>116. A room occupied, then a shelf tended</figcaption><p>The continuation's use and the visits after lapse are different forms of presence.</p><div aria-label="Table: 116. A room occupied, then a shelf tended" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">During the continuation</th><th scope="col">After the lapse</th></tr></thead><tbody><tr><th scope="row">Sound</th><td>Learns to hear her before seeing the room</td><td>A standard voice speaks four sentences at lapse</td></tr><tr><th scope="row">Argument</th><td>They quarrel about money and his brother</td><td>The small humming host is gone</td></tr><tr><th scope="row">Touch and staying</th><td>Hand closes on cold table; he stays another hour</td><td>He returns each second Sunday for eleven months</td></tr><tr><th scope="row">Place kept</th><td>Host stood on the shelf by the window</td><td>He dusts that empty shelf</td></tr></tbody></table></div><p class="reading">The cold table does not cancel the argument or the extra hour he stayed. Dusting does not restore the vanished host.</p></figure>
<figure id="figure-117"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-117.svg"><img alt="117. Objects leave by different decisions" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-117.svg" width="842"/></a><figcaption>117. Objects leave by different decisions</figcaption><p>The carrier bag, the coat and the wardrobe do not share one mode of selection.</p><div aria-label="Table: 117. Objects leave by different decisions" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Object</th><th scope="col">Act of selection</th><th scope="col">Where it ends</th></tr></thead><tbody><tr><th scope="row">License, receipts and certificate</th><td>Begins with the drawers</td><td>Carrier bag</td></tr><tr><th scope="row">Two plates</th><td>Set aside without deciding</td><td>Found later in his bag</td></tr><tr><th scope="row">Father's coat</th><td>Kept through earlier clearings; taken over his arm</td><td>Carried out</td></tr><tr><th scope="row">Hardship schedule</th><td>Used to write the wardrobe's cost</td><td>Fold catches biscuit crumbs</td></tr><tr><th scope="row">Wardrobe</th><td>Cannot negotiate the turn</td><td>Remains doorless in the flat</td></tr></tbody></table></div><p class="reading">The wardrobe stays while smaller objects travel through deliberate, unbidden and practical acts.</p></figure>
