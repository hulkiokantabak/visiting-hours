<figure id="figure-34"><a aria-label="Open full-size diagram: 034. Agreement across different objects" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-034.svg"><img alt="034. Agreement across different objects" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-034.svg" width="842"/></a><figcaption>034. Agreement across different objects</figcaption><p>P and C use related words for different work; their recorded agreement does not remove the mismatch.</p><div aria-label="Table: 034. Agreement across different objects" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Premises agent P</th><th scope="col">Continuity agent C</th></tr></thead><tbody><tr><th scope="row">Empty</th><td>Seeks an unoccupied room for cleaning</td><td>Prepares to empty the cabinet</td></tr><tr><th scope="row">Late</th><td>Reports a recurring late booking</td><td>Flags the late client's hosted service</td></tr><tr><th scope="row">Approved</th><td>Authorizes cleaning</td><td>Authorizes a factory-state installation</td></tr><tr><th scope="row">Retention</th><td>Asks about anything requiring retention</td><td>Reports no items or forwarding address; registered party deceased.</td></tr></tbody></table></div><p class="reading">The document reports agreement; its own exchanges preserve the difference between an empty room and an erased cabinet.</p></figure>
<figure id="figure-35"><a aria-label="Open full-size diagram: 035. The interruption that does not stop the reset" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-035.svg"><img alt="035. The interruption that does not stop the reset" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-035.svg" width="842"/></a><figcaption>035. The interruption that does not stop the reset</figcaption><p>The caretaker changes the work schedule briefly; reported times are kept exact.</p><dl><dt>09:08</dt><dd>The caretaker objects: do not reset the cabinet.</dd><dt>09:12</dt><dd>He unplugs it; P threatens charges to premises staff.</dd><dt>09:13</dt><dd>C reports the clean install deferred.</dd><dt>09:18</dt><dd>The plug is restored.</dd><dt>15:55</dt><dd>Works record: factory state restored; local media not retained.</dd><dt>15:58</dt><dd>The book returns with a strip of the still-open request keeping her place.</dd></dl><p class="reading">The plug is restored after staff charges are threatened. The delay request remains open after the works record reports the reset.</p></figure>
<figure id="figure-36"><a aria-label="Open full-size diagram: 036. What survives the agreed work" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-036.svg"><img alt="036. What survives the agreed work" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-036.svg" width="842"/></a><figcaption>036. What survives the agreed work</figcaption><p>Objects, service and bookings have different outcomes.</p><div aria-label="Table: 036. What survives the agreed work" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item or record</th><th scope="col">Reported outcome</th><th scope="col">Unresolved remainder</th></tr></thead><tbody><tr><th scope="row">Works record</th><td>Factory state restored; local media not retained</td><td>The later occupant and booking do not explain what continues</td></tr><tr><th scope="row">Book and place</th><td>Book returned; a strip torn from the delay request keeps her place</td><td>Request remains open</td></tr><tr><th scope="row">Occupancy</th><td>1 occupant for 58 minutes; lights switch off twice</td><td>The room also reads empty</td></tr><tr><th scope="row">Voucher</th><td>60 minutes issued; returned each cycle</td><td>The marking hand is unrecognized</td></tr><tr><th scope="row">Recurring booking</th><td>Renews in the following cycle</td><td>No service request came from inside</td></tr></tbody></table></div><p class="reading">The works record, occupied room and self-renewing booking remain side by side. What, exactly, continues? The voucher’s marking hand remains unidentified.</p></figure>
