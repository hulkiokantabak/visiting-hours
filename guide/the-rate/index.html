<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Rate · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-rate/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-rate/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-rate/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-rate/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-15"><h1>15. The Rate</h1>
<figure id="figure-43"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-043.svg"><img alt="043. The fare's three stated word totals" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-043.svg" width="842"/></a><figcaption>043. The fare's three stated word totals</figcaption><p>These bars compare word-denominated fares; the older two-coin fare is a different unit.</p><p>words of proven retention</p><div aria-label="Table: 043. The fare's three stated word totals" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Last year</th><td>200</td><td>First stated word-denominated level</td></tr><tr><th scope="row">Current rate</th><td>240</td><td>Calculated increase: 240 - 200 = 40</td></tr><tr><th scope="row">Year's last day</th><td>300</td><td>Calculated increase: 300 - 240 = 60</td></tr></tbody></table></div><p class="reading">The increases are calculated differences: 40 then 60 words. The earlier rates across the eleven years cannot be derived from these three levels.</p></figure>
<figure id="figure-44"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-044.svg"><img alt="044. Retention is not the receipt history" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-044.svg" width="842"/></a><figcaption>044. Retention is not the receipt history</figcaption><p>Observed counts occupy distinct stages; the lost words are not explained.</p><dl><dt>Opening count</dt><dd>191 words held after 11 years of teaching</dd><dt>Spring audit</dt><dd>188 held; the receipts remain correct</dd><dt>Calculated difference</dt><dd>3 fewer retained words: 191 - 188</dd><dt>Autumn</dt><dd>240 words audited and stamped</dd><dt>Dusk</dt><dd>Her husband crosses with 9 others</dd><dt>Afterward</dt><dd>She enters the water; it does not return her.</dd></dl><p class="reading">The widow completes her husband's audited crossing. Her own entry into the water has a different, unresolved status.</p></figure>
<figure id="figure-45"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-045.svg"><img alt="045. Published, unwritten and unbuyable" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-045.svg" width="842"/></a><figcaption>045. Published, unwritten and unbuyable</figcaption><p>Three arrangements coexist; a fourth price remains undenominated.</p><div aria-label="Table: 045. Published, unwritten and unbuyable" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Arrangement</th><th scope="col">Stated rule or practice</th><th scope="col">Boundary</th></tr></thead><tbody><tr><th scope="row">Teaching</th><td>1 word per dawn; more washes out by noon</td><td>Retention remains the family's risk</td></tr><tr><th scope="row">Lending circle</th><td>11 participants; return before the ramp</td><td>Neither forbidden nor mentioned</td></tr><tr><th scope="row">Repeated loans</th><td>No same word twice in a season</td><td>An internal practice, not a published permission</td></tr><tr><th scope="row">Name charge</th><td>One hundred</td><td>Denomination not stated</td></tr><tr><th scope="row">Banned words</th><td>The list cannot be bought</td><td>The seller is struck from the register, then shot</td></tr></tbody></table></div><p class="reading">Lending occupies an unmentioned part of the schedule. The name charge cannot safely be converted into cash or retained words.</p></figure>
