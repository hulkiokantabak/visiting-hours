			<text x="72" y="82" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,164) scale(1,-1)">STRIKING A NAME FROM THE REGISTER IS THE OLDER SENTENCE. THE SHOOTING IS THE SECOND THING THEY DID.</text>
			<text x="72" y="71" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,142) scale(1,-1)">A man the crossing will never afterward accept — drowned or buried or burned, all the same to the channel.</text>
			<text x="72" y="61" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,122) scale(1,-1)">The water took the sound and gave nothing back.</text>
			<text x="20" y="32" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,64) scale(1,-1)">A PROFESSION WITH ETIQUETTE, A HIERARCHY, AND A CONTEMPT FOR AMATEURS — FOR MOVING GRIEF ACROSS A COUNTER.</text>

</svg>
