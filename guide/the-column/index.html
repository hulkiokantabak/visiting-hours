<figure id="figure-148"><a aria-label="Open full-size diagram: 148. A fixed column, changing descriptions" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-148.svg"><img alt="148. A fixed column, changing descriptions" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-148.svg" width="842"/></a><figcaption>148. A fixed column, changing descriptions</figcaption><p>Restated heights change classifications without moving the water.</p><div aria-label="Table: 148. A fixed column, changing descriptions" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Physical reference</th><th scope="col">Official description</th></tr></thead><tbody><tr><th scope="row">Second-ring flood</th><td>Water once took the steps</td><td>Restated at the first ring</td></tr><tr><th scope="row">Third-ring memory</th><td>Residents still call it the third</td><td>Listed at the second; both marks remain</td></tr><tr><th scope="row">Spring flood</th><td>Water reaches the old fourth ring</td><td>Recorded at the third; no notice required</td></tr><tr><th scope="row">Lower street</th><td>Two doors take water; a mother is carried upstairs</td><td>The schedule has a column for doors</td></tr></tbody></table></div><p class="reading">A numerical reclassification is not a physical lowering of either column or flood.</p></figure>
<figure id="figure-149"><a aria-label="Open full-size diagram: 149. A warning cannot stay corrected" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-149.svg"><img alt="149. A warning cannot stay corrected" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-149.svg" width="842"/></a><figcaption>149. A warning cannot stay corrected</figcaption><p>Sava's attempt exposes a mismatch inside the records.</p><dl><dt>Evidence submitted</dt><dd>Old fourth ring and the two door numbers.</dd><dt>Warning refused</dt><dd>The public-notice clerk finds no qualifying rise.</dd><dt>Street marked warned</dt><dd>Measures already records a warning.</dd><dt>Sava strikes the entry</dt><dd>He tries to remove that description.</dd><dt>Entry returns</dt><dd>The next printing restores it.</dd><dt>Notice carried to a door</dt><dd>Nobody is in; Sava waits.</dd></dl><h4>Relationships</h4><ul><li>Evidence submitted → Warning refused: request returned</li><li>Warning refused → Street marked warned: another record already exists</li><li>Street marked warned → Sava strikes the entry: correction attempted</li><li>Sava strikes the entry → Entry returns: next printing</li><li>Entry returns → Notice carried to a door: he takes the notice himself</li></ul><p class="reading">The public-notice refusal and the false warned entry are different acts, not one returned notice.</p></figure>
<figure id="figure-150"><a aria-label="Open full-size diagram: 150. Whose mark carries authority" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-150.svg"><img alt="150. Whose mark carries authority" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-150.svg" width="842"/></a><figcaption>150. Whose mark carries authority</figcaption><p>A relational map of the High Line confrontation.</p><dl><dt>The painted High Line</dt><dd>The street names it after the confrontation.</dd><dt>Cat</dt><dd>Indicates the wet line.</dd><dt>Keeper</dt><dd>Paints it; his knuckle is cut.</dd><dt>Removal order</dt><dd>Bears Measures and Sava's stamp.</dd><dt>Sava</dt><dd>Catches the tin and contests removal.</dd><dt>Cleaning account</dt><dd>The keeper is told to submit an invoice.</dd></dl><h4>Relationships</h4><ul><li>Cat → Keeper: indicates where to paint</li><li>Keeper → The painted High Line: paints</li><li>Removal order → The painted High Line: orders removal</li><li>Sava → Removal order: contests this application</li><li>Keeper → Removal order: pours paint over</li><li>The painted High Line → Cleaning account: aftermath reclassified</li></ul><p class="reading">Sava's stamp is on an order he contests. That does not identify who issued it or establish one institutional intention.</p></figure>
