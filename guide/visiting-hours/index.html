<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visiting Hours · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/visiting-hours/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/visiting-hours/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/visiting-hours/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/visiting-hours/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-60"><h1>Visiting Hours</h1>
<figure id="figure-178"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-178.svg"><img alt="178. Ascent beyond the last stop" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-178.svg" width="842"/></a><figcaption>178. Ascent beyond the last stop</figcaption><p>Narrative route only; distances and spacing are not to scale.</p><dl><dt>Last stop</dt><dd>She carries a return half-ticket, water and an unspoken reason.</dd><dt>Rusted gate</dt><dd>The steps continue through older stone.</dd><dt>Wax in a niche</dt><dd>The wick is warm; she has met no one descending.</dd><dt>Treeline</dt><dd>The phone loses the city and is put away.</dd><dt>Thinning sound</dt><dd>Deliveries, traffic, harbor and channel recede.</dd><dt>Upper gate</dt><dd>The low white wall is mended; the gate stands open.</dd></dl><h4>Relationships</h4><ul><li>Last stop → Rusted gate: ascent</li><li>Rusted gate → Wax in a niche: along the steps</li><li>Wax in a niche → Treeline: ascent</li><li>Treeline → Thinning sound: sounds recede</li><li>Thinning sound → Upper gate: reaches the top</li></ul><p class="reading">Loss of connection is shown during this climb; it is not a diagram of all the hill's laws.</p></figure>
<figure id="figure-179"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-179.svg"><img alt="179. Thanks before water, shelter without a verdict" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-179.svg" width="842"/></a><figcaption>179. Thanks before water, shelter without a verdict</figcaption><p>Encounters place incompatible times beside concrete acts.</p><div aria-label="Table: 179. Thanks before water, shelter without a verdict" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Encounter</th><th scope="col">What happens</th><th scope="col">What remains open</th></tr></thead><tbody><tr><th scope="row">Visitor's thanks</th><td>Thanks her for water next summer or the one after</td><td>Her bottle is still unopened then</td></tr><tr><th scope="row">Two men at the wall</th><td>Each stands between his wars</td><td>One war has not happened yet</td></tr><tr><th scope="row">Man without faith</th><td>Sleeps on a prayer mat; someone covers his feet</td><td>Hospitality does not require a settled belief</td></tr><tr><th scope="row">Coin in the box</th><td>She recognizes it and closes the lid</td><td>Its route and identity are not explained here</td></tr><tr><th scope="row">Smuggler</th><td>She holds out her opened bottle after his halting explanation</td><td>His drinking and future crossing are not shown</td></tr></tbody></table></div><p class="reading">These are encounters in the story, not proof of a resolved time mechanism, a free economy or an identified coin.</p></figure>
<figure id="figure-180"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-180.svg"><img alt="180. An open exit and a return indoors" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-180.svg" width="842"/></a><figcaption>180. An open exit and a return indoors</figcaption><p>Evening intention is compared with the actions that follow.</p><div aria-label="Table: 180. An open exit and a return indoors" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Possibility or intention</th><th scope="col">Observed evening action</th></tr></thead><tbody><tr><th scope="row">Descent</th><td>She means to go down before dark</td><td>She goes back inside</td></tr><tr><th scope="row">Return journey</th><td>She still has the return half-ticket</td><td>It remains soft in her pocket</td></tr><tr><th scope="row">Gate</th><td>Open all day</td><td>Nobody has used it downhill</td></tr><tr><th scope="row">Visitors' book</th><td>She did not sign on arrival</td><td>She signs; the ink reaches the age of the rest</td></tr></tbody></table></div><p class="reading">She goes back inside and signs. The duration remains open; the open gate establishes neither imprisonment nor an irreversible choice.</p></figure>
