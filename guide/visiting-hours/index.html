			<text x="420" y="132.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,264) scale(1,-1)">the book does not offer him a line · the crossing will never have</text>
			<text x="420" y="124.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,248) scale(1,-1)">him now, at any rate, in any words</text>
			<path d="M 60,118 L 660,118 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="60" y="102.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,204) scale(1,-1)">THE COIN IN THE BOX</text>
			<text x="200" y="102.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,204) scale(1,-1)">one she knows the way she knows her own handwriting</text>
			<text x="420" y="102.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,204) scale(1,-1)">worn smooth, OLDER THAN THE COUNTRY · she closes the lid</text>
			<path d="M 60,88 L 660,88 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<rect x="60" y="40" width="600" height="44" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="68" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,136) scale(1,-1)">THE CHILD’S QUESTION IS THE ONLY COMPLETED TRANSACTION IN SIXTY STORIES</text>
			<text x="74" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,114) scale(1,-1)">WITH NOTHING RETAINED, RECORDED OR CHARGED.</text>
			<text x="74" y="47" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,94) scale(1,-1)">Everything the book has priced is on this hill, unpriced — and the coin the magician sent to next year is in the box.</text>
			<text x="20" y="24" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,48) scale(1,-1)">THE STATE FUNDS THEM — CONTINUITY OF HERITAGE · THE DEBIT GOES OUT MONTHLY, THEY ARE TOLD.</text>
