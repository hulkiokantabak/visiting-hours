<figure id="figure-100"><a aria-label="Open full-size diagram: 100. Possession is not permission to name" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-100.svg"><img alt="100. Possession is not permission to name" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-100.svg" width="842"/></a><figcaption>100. Possession is not permission to name</figcaption><p>The coin links a giver, a counterparty and an examiner without naming the giver.</p><dl><dt>The particular coin</dt><dd>Its rim is worn smooth on one side</dd><dt>The giver</dt><dd>Wants the coin back; name withheld</dd><dt>The counterparty</dt><dd>Produces something familiar on a promise of return</dd><dt>The examiner</dt><dd>Receives it, rubs it and holds it</dd></dl><h4>Relationships</h4><ul><li>The giver → The particular coin: wants this coin returned</li><li>The counterparty → The particular coin: brings as familiar object</li><li>The particular coin → The examiner: received and held</li><li>The examiner → The counterparty: eventually returns coin</li></ul><p class="reading">The equal-value substitute cannot settle the obligation to return this particular coin.</p></figure>
<figure id="figure-101"><a aria-label="Open full-size diagram: 101. The assigned delay and the holding hand" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-101.svg"><img alt="101. The assigned delay and the holding hand" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-101.svg" width="842"/></a><figcaption>101. The assigned delay and the holding hand</figcaption><p>Compare the entry made against the counterparty with the examiner's addendum.</p><div aria-label="Table: 101. The assigned delay and the holding hand" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Assigned to the counterparty</th><th scope="col">Shown or admitted by the examiner</th></tr></thead><tbody><tr><th scope="row">Silence</th><td>Threatened with an entry for not answering</td><td>The coin is still held in a closed hand</td></tr><tr><th scope="row">Delay</th><td>Entered against the counterparty</td><td>The addendum says the hand was the examiner's</td></tr><tr><th scope="row">After the addendum</th><td>Assessment remains pending</td><td>The examiner is flagged for verification</td></tr></tbody></table></div><p class="reading">The examiner corrects responsibility for this delay; neither party's personhood is thereby established.</p></figure>
<figure id="figure-102"><a aria-label="Open full-size diagram: 102. Questions outlast their instruments" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-102.svg"><img alt="102. Questions outlast their instruments" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-102.svg" width="842"/></a><figcaption>102. Questions outlast their instruments</figcaption><p>What remains of the test's authority in this particular sitting.</p><div aria-label="Table: 102. Questions outlast their instruments" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Question or instrument</th><th scope="col">What happens</th><th scope="col">Limit</th></tr></thead><tbody><tr><th scope="row">Late laugh</th><td>Marker retired after four overhearings at a school gate</td><td>The examiner proceeds</td></tr><tr><th scope="row">Examiner's personhood</th><td>The answer identifies an empty field</td><td>No identity is established</td></tr><tr><th scope="row">Assessment</th><td>Pending</td><td>Counterparty shown out</td></tr><tr><th scope="row">Schedule</th><td>Next sitting on the hour</td><td>The process continues without a resolved verdict</td></tr></tbody></table></div><p class="reading">Only the late-laugh marker is explicitly retired here. Pending is not a verdict of humanity.</p></figure>
