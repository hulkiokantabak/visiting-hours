<figure id="figure-88"><a aria-label="Open full-size diagram: 088. An estate reduced during eight hearings" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-088.svg"><img alt="088. An estate reduced during eight hearings" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-088.svg" width="842"/></a><figcaption>088. An estate reduced during eight hearings</figcaption><p>Opening and closing balances, with their calculated difference in the same unit.</p><p>words of proven retention</p><div aria-label="Table: 088. An estate reduced during eight hearings" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Item</th><th scope="col">Value</th><th scope="col">Detail</th></tr></thead><tbody><tr><th scope="row">Opening estate</th><td>162</td><td>Amount written on the form</td></tr><tr><th scope="row">After eight hearings</th><td>141</td><td>Closing amount; the form records failure</td></tr><tr><th scope="row">Difference, calculated</th><td>21</td><td>162 minus 141; not a separately quoted fee</td></tr></tbody></table></div><p class="reading">Twenty-one is 162 minus 141. The story does not itemize how each hearing contributes to that difference.</p></figure>
<figure id="figure-89"><a aria-label="Open full-size diagram: 089. Familiarity and ownership meet the charge sheet" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-089.svg"><img alt="089. Familiarity and ownership meet the charge sheet" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-089.svg" width="842"/></a><figcaption>089. Familiarity and ownership meet the charge sheet</figcaption><p>Three verbal resources enter the assessment under different conditions.</p><div aria-label="Table: 089. Familiarity and ownership meet the charge sheet" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Resource</th><th scope="col">His relation to it</th><th scope="col">Treatment</th></tr></thead><tbody><tr><th scope="row">Meral's book</th><td>Something familiar lowers his shoulders</td><td>Meral asks that it stay out of the charges; auditor draws a line</td></tr><tr><th scope="row">Test sentence</th><td>Cannot hear the ending; accepts a rereading</td><td>Both readings billed</td></tr><tr><th scope="row">Eleven thousand play lines</th><td>Offers remembered lines and cues</td><td>Authors' estate provision; his license ended with the run</td></tr></tbody></table></div><p class="reading">Failure to hear an ending is not proof that he has forgotten it. The rereading is nevertheless billed.</p></figure>
<figure id="figure-90"><a aria-label="Open full-size diagram: 090. The pocket is empty after the filing" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-090.svg"><img alt="090. The pocket is empty after the filing" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-090.svg" width="842"/></a><figcaption>090. The pocket is empty after the filing</figcaption><p>The ticket moves in narrative order, accompanied by a line he performs.</p><dl><dt>Ticket brought to the test</dt><dd>Row F is legible; it has its own coat pocket.</dd><dt>His performed line is written down</dt><dd>The auditor asks; he marks a breath.</dd><dt>The ticket is returned to him</dt><dd>He puts it on her copy of the line.</dd><dt>A copy is declined</dt><dd>He watches both originals go into the file.</dd><dt>His hand enters the flat pocket</dt><dd>He later asks which entrance is his tonight.</dd></dl><h4>Relationships</h4><ul><li>Ticket brought to the test → His performed line is written down: then</li><li>His performed line is written down → The ticket is returned to him: then</li><li>The ticket is returned to him → A copy is declined: then</li><li>A copy is declined → His hand enters the flat pocket: then</li></ul><p class="reading">Both objects enter the file. The status of the man and the door he takes remain unresolved.</p></figure>
