<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>For Corrections Only · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/for-corrections-only/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/for-corrections-only/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/for-corrections-only/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/for-corrections-only/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-40"><h1>40. For Corrections Only</h1>
<figure id="figure-118"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-118.svg"><img alt="118. A correction buys an invitation with an address" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-118.svg" width="842"/></a><figcaption>118. A correction buys an invitation with an address</figcaption><p>The accepted wage deduction opens an invitation route; the floor count is still rejected.</p><dl><dt>Twenty-three floors submitted</dt><dd>The photograph is rejected; invitations remain zero.</dd><dt>Three hours deducted submitted</dt><dd>The wage penalty is accepted; one invitation is earned.</dd><dt>The man from the cage is added</dt><dd>His home address travels with the invitation.</dd><dt>Two accounts name an unrecorded address</dt><dd>The Office suggests that a visit may resolve the discrepancy.</dd><dt>The broken foot is mentioned</dt><dd>The Office says the visitor will come to him.</dd></dl><h4>Relationships</h4><ul><li>Twenty-three floors submitted → Three hours deducted submitted: next correction</li><li>Three hours deducted submitted → The man from the cage is added: invitation used</li><li>The man from the cage is added → Two accounts name an unrecorded address: then</li><li>Two accounts name an unrecorded address → The broken foot is mentioned: then</li></ul><p class="reading">Admission to the group creates exposure. It does not establish that the floor measurement was accepted.</p></figure>
<figure id="figure-119"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-119.svg"><img alt="119. A display name is not a stable authority" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-119.svg" width="842"/></a><figcaption>119. A display name is not a stable authority</figcaption><p>Read the messages as claims and actions shown by the chat interface.</p><div aria-label="Table: 119. A display name is not a stable authority" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Dispute</th><th scope="col">Claim or action in the chat</th><th scope="col">What remains unsettled</th></tr></thead><tbody><tr><th scope="row">Photograph</th><td>Sava confirms the figure and requests removal</td><td>Office invokes an accepted record after rejecting it</td></tr><tr><th scope="row">Withdrawal</th><td>Earlier statement remains available</td><td>Withdrawal does not remove the earlier account</td></tr><tr><th scope="row">Replacement companions</th><td>An Office-labeled message recommends keeping the first account</td><td>A reader asks which office spoke</td></tr><tr><th scope="row">Office removes Office</th><td>Pinned message restored; display name disclaimed as authority</td><td>No stable speaker identity is established</td></tr></tbody></table></div><p class="reading">The entries do not identify which institution or person operates each instance of the Office name.</p></figure>
<figure id="figure-120"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-120.svg"><img alt="120. The driver leaves the interface for the door" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-120.svg" width="842"/></a><figcaption>120. The driver leaves the interface for the door</figcaption><p>Actual message times track the move from delivered appeals toward physical arrival.</p><dl><dt>06:29</dt><dd>Someone is at the man's door; the driver says he is coming.</dd><dt>06:31</dt><dd>Help to stand is reported; the driver's request to wait is not delivered.</dd><dt>After the undelivered reply</dt><dd>The man is removed from delivery; his seat is retained.</dd><dt>06:33</dt><dd>The driver offers more hours; payment is declared outside the group's subject.</dd><dt>06:35 and after</dt><dd>The driver says he is at the door and leaves the group; invitations fall to zero.</dd><dt>06:36 and after</dt><dd>A reader asks what happened; the book is typing.</dd></dl><p class="reading">The final typing indicator reports no outcome at the door. Neither rescue nor disappearance is confirmed.</p></figure>
