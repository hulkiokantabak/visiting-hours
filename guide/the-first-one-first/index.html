<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The First One First · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-first-one-first/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-first-one-first/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-first-one-first/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-first-one-first/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-29"><h1>29. The First One First</h1>
<figure id="figure-85"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-085.svg"><img alt="085. Two first accounts stop before payment" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-085.svg" width="842"/></a><figcaption>085. Two first accounts stop before payment</figcaption><p>The paired accounts share a date boundary and describe incompatible actions.</p><div aria-label="Table: 085. Two first accounts stop before payment" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">First account: renews</th><th scope="col">First account: does not renew</th></tr></thead><tbody><tr><th scope="row">Shared particulars</th><td>Fifty-three; wife dead eleven years</td><td>Fifty-three; wife dead eleven years</td></tr><tr><th scope="row">Morning or meeting</th><td>Interest in the removed tree, then corrected tense</td><td>A woman offers her hand; his hands stay in his pockets</td></tr><tr><th scope="row">Stopping point</th><td>Before the ninth; money still his</td><td>Before the ninth; money still his</td></tr></tbody></table></div><p class="reading">His later written intention to renew does not show a completed renewal or settle which account he originally gave.</p></figure>
<figure id="figure-86"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-086.svg"><img alt="086. Cutting the page does not cut everything" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-086.svg" width="842"/></a><figcaption>086. Cutting the page does not cut everything</figcaption><p>Four kinds of text receive four different material treatments.</p><div aria-label="Table: 086. Cutting the page does not cut everything" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Text or object</th><th scope="col">Treatment</th><th scope="col">What remains</th></tr></thead><tbody><tr><th scope="row">Boxed comfort statements</th><td>Left alone as true</td><td>Both first accounts can contain them</td></tr><tr><th scope="row">Laugh question</th><td>Leaf folded over the woman's passage</td><td>The stranger's answer is made adjacent to her</td></tr><tr><th scope="row">School-gate passage</th><td>Three lines cut out and swallowed</td><td>A slot through which the receipts remain visible</td></tr><tr><th scope="row">Third account</th><td>Signed and placed underneath</td><td>The other two accounts remain above it</td></tr></tbody></table></div><p class="reading">The story shows changes to this copy and a signed intention, not the removal of a woman or alteration of the city.</p></figure>
<figure id="figure-87"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-087.svg"><img alt="087. The index redirects the question" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-087.svg" width="842"/></a><figcaption>087. The index redirects the question</figcaption><p>Links inside the coverless book; destinations are not confirmations of identity.</p><dl><dt>The book's index</dt><dd>Consulted to find which account he gave</dd><dt>The preceding woman's account</dt><dd>Sees four years of his receipts; he has eleven</dd><dt>REFUSAL</dt><dd>The word he wants to learn</dd><dt>REINSTATEMENT</dt><dd>The index's destination from refusal</dd><dt>A third first account</dt><dd>No page number; begins with his request for the book</dd></dl><h4>Relationships</h4><ul><li>The book's index → The preceding woman's account: sends him to</li><li>The book's index → REFUSAL: entry consulted</li><li>REFUSAL → REINSTATEMENT: redirects to</li><li>The book's index → A third first account: contains without a page</li></ul><p class="reading">The index offers another account where he asks which account was his.</p></figure>
