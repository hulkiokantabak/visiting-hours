			<text x="305.53125" y="254" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,508) scale(1,-1)">eleven years, and never once</text>
			<text x="313.009375" y="240" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,480) scale(1,-1)">where anyone could see</text>
			<text x="70" y="200" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,400) scale(1,-1)">what he stopped asking in the third year</text>
			<text x="330" y="200" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,400) scale(1,-1)">whether it is her</text>
			<text x="70" y="182" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,364) scale(1,-1)">what he asks instead</text>
			<text x="330" y="182" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,364) scale(1,-1)">whether he is still the man who would pay</text>
			<text x="70" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,328) scale(1,-1)">how he answers it</text>
			<text x="330" y="164" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,328) scale(1,-1)">every month, with his thumb</text>
			<text x="70" y="146" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,292) scale(1,-1)">the answer</text>
			<text x="330" y="146" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,292) scale(1,-1)">yes</text>
			<text x="70" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,256) scale(1,-1)">and</text>
			<text x="330" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,256) scale(1,-1)">&quot;I do not know anymore what the yes is for.&quot;</text>
			<rect x="60" y="38" width="600" height="60" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="80" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.5px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,160) scale(1,-1)">LAST THURSDAY, IN THE QUEUE WITH ELEVEN YEARS OF RECEIPTS KEPT FLAT — &quot;MY WIFE WOULD HAVE LAUGHED AT THAT&quot; —</text>
			<text x="74" y="69" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,138) scale(1,-1)">an older woman with a folder reached the window and said no. Just that. She said no and signed something and went out.</text>
			<text x="74" y="58" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,116) scale(1,-1)">&quot;I have thought about her every day since. I would like to ask her how it is done. NOT WHETHER. HOW.&quot;</text>
			<text x="74" y="46" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,92) scale(1,-1)">&quot;I am going to renew this month. I want to say that plainly so you do not write me down as braver than I am.&quot;</text>
			<text x="20" y="26" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,52) scale(1,-1)">THE TWO STATEMENTS WERE MADE IN THE SAME WEEK, TO THE SAME RECORDER. SHE WAS BEHIND HIM IN THE QUEUE.</text>
			<text x="20" y="16" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,32) scale(1,-1)">Last line of the piece: &quot;If you find her. Do not tell her I asked.&quot;</text>
		</g>
	</g>
