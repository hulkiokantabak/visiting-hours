<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Export · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/export/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/export/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/export/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/export/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-14"><h1>14. Export</h1>
<figure id="figure-40"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-040.svg"><img alt="040. What can cross this border" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-040.svg" width="842"/></a><figcaption>040. What can cross this border</figcaption><p>The counter's stated distinctions apply to this export case.</p><div aria-label="Table: 040. What can cross this border" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">What is carried or retained</th><th scope="col">Stated condition</th><th scope="col">Result</th></tr></thead><tbody><tr><th scope="row">Continuation license</th><td>Foreign premises cannot be registered</td><td>No responding host abroad</td></tr><tr><th scope="row">Retained recording</th><td>Export duty exceeds twice the flight price</td><td>A file that plays</td></tr><tr><th scope="row">Unexported recordings</th><td>Estate retains them for the statutory period</td><td>No duration is specified here</td></tr><tr><th scope="row">Paid local license</th><td>Continues to the paid month's end</td><td>Her departure does not stop the license; it runs until the paid month ends.</td></tr><tr><th scope="row">Glasses case</th><td>Carried in a tin, wrapped in a sock</td><td>Travels free; hinge remains stiff</td></tr></tbody></table></div><p class="reading">Paying export duty buys playback without an answering presence. The book does not establish this as the only living departure.</p></figure>
<figure id="figure-41"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-041.svg"><img alt="041. The paperback falls between classifications" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-041.svg" width="842"/></a><figcaption>041. The paperback falls between classifications</figcaption><p>A local disagreement at neighboring counters, followed by the export clerk's intervention.</p><dl><dt>Mother's annotated paperback</dt><dd>Kept behind the receipts</dd><dt>Two descriptions</dt><dd>Personal material versus a used book</dd><dt>The screen's box</dt><dd>PERSONAL RECORDINGS returns after being closed</dd><dt>The clerk's response</dt><dd>Turns the screen away; tells her to keep the book in her hand</dd></dl><h4>Relationships</h4><ul><li>Mother's annotated paperback → Two descriptions: classification disputed</li><li>Two descriptions → The screen's box: screen offers a category</li><li>The screen's box → The clerk's response: limited intervention</li></ul><p class="reading">The clerk helps without settling the book's official classification or proving that the system accepts his decision.</p></figure>
<figure id="figure-42"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-042.svg"><img alt="042. The departure carries several kinds of keeping" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-042.svg" width="842"/></a><figcaption>042. The departure carries several kinds of keeping</figcaption><p>Objects remain materially distinct from the licensed continuation.</p><div aria-label="Table: 042. The departure carries several kinds of keeping" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Object carried or placed</th><th scope="col">Action and limit</th></tr></thead><tbody><tr><th scope="row">Painted tin</th><td>Takes the license's former place on the shelf</td><td>Later carries the glasses case</td></tr><tr><th scope="row">Final receipt</th><td>Travels in the folder's passport position</td><td>Pays for a month spent abroad</td></tr><tr><th scope="row">Aunt's red thread</th><td>Untied and taken toward the bin</td><td>Kept in her pocket</td></tr><tr><th scope="row">Glasses case</th><td>Wrapped in a sock in the tin</td><td>Its stiff hinge is the same difficulty her mother knew</td></tr></tbody></table></div><p class="reading">Keeping the aunt's thread records an unresolved attachment, not belief in a proven protective mechanism.</p></figure>
