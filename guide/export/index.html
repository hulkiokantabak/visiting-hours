			<text x="84" y="116" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,232) scale(1,-1)">Then, on the last Thursday, she does the renewal one final time, in cash, in the queue with the mothers</text>

			<text x="84" y="95" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,190) scale(1,-1)">She says yes. She carries it to the airport in the pocket where a passport would go.</text>
