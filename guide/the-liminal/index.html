			<rect x="60" y="210" width="600" height="50" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.3; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="250" y="174" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,348) scale(1,-1)">we let the benches decide where the resting is · we let the candle spring feed on its own</text>
			<text x="250" y="166" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,332) scale(1,-1)">wax · WE LET THE CITY HAPPEN</text>
			<rect x="60" y="94" width="600" height="50" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.3; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="250" y="130" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,260) scale(1,-1)">there is a form for us · WE HAVE NOT SEEN IT</text>
			<text x="250" y="116" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,232) scale(1,-1)">held somewhere down there, correct in every particular, in a hand that will thin, in ink</text>
			<text x="250" y="108" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.9px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,216) scale(1,-1)">that will reach one age</text>
			<rect x="60" y="34" width="600" height="44" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="74" y="62" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,124) scale(1,-1)">THE MENDING HAS ALWAYS BEEN SOFTER THAN THE STONE, SO THAT WHAT FAILS IS THE MENDING.</text>
			<text x="74" y="51" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,102) scale(1,-1)">A building that has outlived every administration is finally undone by a document it will never read —</text>
			<text x="74" y="41" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,82) scale(1,-1)">and the form will outlast the wall, being easier to keep.</text>
			<text x="20" y="20" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,40) scale(1,-1)">WE WATCHED THE CITY ARRIVE. WE ARE PREPARED.</text>

			<text x="210" y="270.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,540) scale(1,-1)">BEEN ASKED TO CHOOSE</text>

			<path d="M 60,176 L 660,176 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>

			<text x="210" y="144.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,288) scale(1,-1)">that THE WORDS HAD BEEN ISSUED</text>
			<path d="M 60,134 L 660,134 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="60" y="120.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,240) scale(1,-1)">A SPOON</text>

			<text x="210" y="110.0" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 5.8px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,220) scale(1,-1)">we kept the spoon · IT IS THE ONLY THING ON THIS HILL THAT NOBODY HAS EVER ASKED</text>

			<text x="74" y="72" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,144) scale(1,-1)">THE HILL HEARD AN ISSUED SENTENCE LONG BEFORE THE OFFICE HAD A NAME FOR ONE.</text>
			<text x="74" y="61" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,122) scale(1,-1)">Two hidden men, hidden from each other, describing the same mornings in the same words — and the wall,</text>

			<text x="72" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,532) scale(1,-1)">· corrects itself</text>
			<text x="72" y="246" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,492) scale(1,-1)">· supersedes, and does not hold the superseded</text>
			<text x="72" y="226" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,452) scale(1,-1)">· previous companions are not held</text>
			<text x="72" y="206" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,412) scale(1,-1)">· the corrections are not listed</text>
			<text x="72" y="186" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,372) scale(1,-1)">· a person may be corrected without being</text>
			<text x="72" y="178" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,356) scale(1,-1)">informed</text>
			<rect x="370" y="168" width="290" height="138" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.3; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="467.49814453125" y="292" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,584) scale(1,-1)">THE BOOK BY THE DOOR</text>
			<text x="382" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,532) scale(1,-1)">· filled and filled and STAYED ONE BOOK</text>
			<text x="382" y="246" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,492) scale(1,-1)">· the hands drying centuries apart</text>
			<text x="382" y="226" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,452) scale(1,-1)">· THE INK ALL ONE AGE</text>
			<text x="382" y="206" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,412) scale(1,-1)">· open, unattended, nobody audits it</text>
			<text x="382" y="186" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.1px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,372) scale(1,-1)">· no line is offered and none refused</text>
			<text x="70" y="142" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,284) scale(1,-1)">what the hill grips now</text>
			<text x="280" y="142" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,284) scale(1,-1)">gate open · wax warm · letters weathered past reading · counted from the first ones</text>
			<text x="70" y="123" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,246) scale(1,-1)">what it has been called</text>
			<text x="280" y="123" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,246) scale(1,-1)">a wall, a house, a hiding place, a bed, an office of sorts, AND NOW A VIEW</text>
			<text x="70" y="104" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,208) scale(1,-1)">each time the city arrived</text>
			<text x="280" y="104" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,208) scale(1,-1)">we were told what we were · each time it was accurate · AND EACH TIME IT WAS LESS</text>
			<text x="70" y="85" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,170) scale(1,-1)">what it asks of nobody</text>
			<text x="280" y="85" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,170) scale(1,-1)">they come up out of breath, every one of them, and stand in the gate until it goes,</text>
			<text x="280" y="66" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,132) scale(1,-1)">and NONE OF THEM HAS EVER ASKED US FOR WATER, AND WE HAVE IT</text>
			<rect x="60" y="38" width="600" height="26" style="stroke: rgb(10%,10%,10%); stroke-linecap: butt; stroke-width: 1; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>

			<text x="74" y="42" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,84) scale(1,-1)">And below at dusk the two cars rise and fall and meet — twelve seconds of lit glass — and part.</text>
