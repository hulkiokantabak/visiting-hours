<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Liminal · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/the-liminal/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/the-liminal/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/the-liminal/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/the-liminal/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-59"><h1>59. The Liminal</h1>
<figure id="figure-175"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-175.svg"><img alt="175. Four phases of the stone voice" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-175.svg" width="842"/></a><figcaption>175. Four phases of the stone voice</figcaption><p>Relative phases are narrated by the house, not dated history.</p><dl><dt>We understood</dt><dd>The first thousand years of the house's telling.</dd><dt>We tired</dt><dd>Wars and lovers return in repeated forms.</dd><dt>We let go</dt><dd>The house stops counting steps and lets the city happen.</dd><dt>We clench</dt><dd>Rain enters the mending; frost opens the wall there. The unseen form is expected to outlast it.</dd></dl><p class="reading">The thousand years belong to the house's account; no exact dates are supplied for the later shifts.</p></figure>
<figure id="figure-176"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-176.svg"><img alt="176. The observer becomes a visitor" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-176.svg" width="842"/></a><figcaption>176. The observer becomes a visitor</figcaption><p>One worker's appetite changes his place in the count.</p><div aria-label="Table: 176. The observer becomes a visitor" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Official task</th><th scope="col">Bodily participation</th></tr></thead><tbody><tr><th scope="row">Arrival</th><td>Two Office men come to count visitors</td><td>One has walked up without water</td></tr><tr><th scope="row">Food offered</th><td>The lender says they have work</td><td>The other takes off his coat</td></tr><tr><th scope="row">Counting</th><td>The lender lists his colleague as first visitor</td><td>The colleague puts the coat back on</td></tr><tr><th scope="row">At the threshold</th><td>The lender waits with the book</td><td>The other eats; the house supports his back</td></tr></tbody></table></div><p class="reading">The lender says the entry is only for the total. The scene does not establish a fee or later penalty.</p></figure>
<figure id="figure-177"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-177.svg"><img alt="177. What keeping can mean here" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-177.svg" width="842"/></a><figcaption>177. What keeping can mean here</figcaption><p>Objects and bodies receive different forms of holding.</p><dl><dt>The speaking house</dt><dd>Its acts of keeping do not amount to one settled identity.</dd><dt>Spoon on a sill</dt><dd>A woman leaves it; no one has asked about it.</dd><dt>Visitor's shoe</dt><dd>Biscuit takes it; the unnamed man returns it to the door.</dd><dt>Visitors' book</dt><dd>The page is held without editing; ink reaches one age.</dd><dt>Worker's back</dt><dd>The house supports him while he eats at the threshold.</dd></dl><h4>Relationships</h4><ul><li>The speaking house → Spoon on a sill: keeps</li><li>Visitor's shoe → The speaking house: returned within its shelter</li><li>The speaking house → Visitors' book: holds unedited page</li><li>The speaking house → Worker's back: physical support</li></ul><p class="reading">Biscuit is named; the man is not. The spoon's owner and the house's nature remain unresolved.</p></figure>
