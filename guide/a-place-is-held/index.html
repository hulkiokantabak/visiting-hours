			<text x="20" y="404" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 12px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,808) scale(1,-1)">A PLACE IS HELD · WHAT IS BEING OFFERED</text>
			<text x="20" y="390" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 7.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,780) scale(1,-1)">the whole offer, in the leaflet’s own terms · and it is not small</text>
			<text x="70" y="300" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,600) scale(1,-1)">your first Thursday</text>
			<text x="260" y="300" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,600) scale(1,-1)">free</text>
			<path d="M 70,290 L 660,290 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="70" y="274" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,548) scale(1,-1)">your words</text>
			<text x="260" y="274" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,548) scale(1,-1)">assessed at no charge</text>
			<path d="M 70,264 L 660,264 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="70" y="248" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,496) scale(1,-1)">the figure</text>
			<text x="260" y="248" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,496) scale(1,-1)">told to you before anything is opened in your name</text>
			<path d="M 70,238 L 660,238 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="70" y="222" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,444) scale(1,-1)">the introductory rate</text>
			<text x="260" y="222" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 6.6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,444) scale(1,-1)">held for four quarters</text>
			<path d="M 70,212 L 660,212 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="70" y="196" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,392) scale(1,-1)">hardship</text>

			<path d="M 70,186 L 660,186 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>
			<text x="70" y="170" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,340) scale(1,-1)">the offer itself</text>
			<text x="260" y="170" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,340) scale(1,-1)">here, you will always be able to find out what it costs</text>
			<path d="M 70,160 L 660,160 Z" style="stroke: rgb(81%,81%,81%); stroke-linecap: butt; stroke-width: 0.3;"/>

			<text x="84" y="126" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,252) scale(1,-1)">YOU HAVE PAID FOR THINGS ALL YOUR LIFE AT PRICES YOU WERE NEVER SHOWN —</text>
			<text x="84" y="115" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.4px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,230) scale(1,-1)">in years, in silence, in what you did not say at a bedside.</text>
			<text x="84" y="104" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,208) scale(1,-1)">&quot;We are simply the first place to put the number on the board where you can see it.&quot;</text>
			<rect x="70" y="40" width="590" height="46" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 1.2; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="84" y="70" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,140) scale(1,-1)">A PLACE IS HELD FOR YOU HERE. IT HAS YOUR DIMENSIONS IN IT AND NOTHING ELSE —</text>
			<text x="84" y="59" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,118) scale(1,-1)">no name yet, no account, no line one. It is held whether or not you come, and it will still be held in ten years,</text>
			<text x="84" y="49" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.4px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,98) scale(1,-1)">and nobody will bill you for the holding. THAT IS WHAT A PLACE IS.</text>
			<text x="20" y="28" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.2px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,56) scale(1,-1)">EVERY CITY MEASURES FROM SOMETHING. MOST OF THEM ARE LYING ABOUT WHAT.</text>
			<text x="20" y="18" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,36) scale(1,-1)">We are open six days. On the seventh we are open for renewals only. The seventh is the busiest.</text>
