<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Place Is Held · Visiting Hours</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/guide/a-place-is-held/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="tr" href="/visiting-hours/tr/guide/a-place-is-held/"></head><body class="guide"><a class="skip" href="#content">Skip to the text</a><nav class="topnav" aria-label="Main navigation"><a class="brand" href="/visiting-hours/">Visiting Hours</a><ul><li><a href="/visiting-hours/read/">Read</a></li><li><a href="/visiting-hours/guide/" aria-current="page">Guide</a></li><li><a href="/visiting-hours/listen/">Listen</a></li><li><a href="/visiting-hours/method/">Method</a></li><li><a href="/visiting-hours/about/">About</a></li></ul><a class="switch" href="/visiting-hours/tr/guide/a-place-is-held/" lang="tr" hreflang="tr">TÜRKÇE</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/read/a-place-is-held/">Read the story</a> · <a href="/visiting-hours/downloads/city-guide-english-landscape.pdf" lang="en" download>Download the landscape guide <span class="file-meta">PDF · 206 pages</span></a></p><section id="story-32"><h1>32. A Place Is Held</h1>
<figure id="figure-94"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-094.svg"><img alt="094. Free hours under a deadline" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-094.svg" width="842"/></a><figcaption>094. Free hours under a deadline</figcaption><p>The maternity example as this invitation tells it.</p><dl><dt>At eleven hours</dt><dd>She has not named or put down her son; bleeding and stitches remain present.</dd><dt>Fee explained</dt><dd>At twelve hours the fee would double; the hardship schedule is on her blanket.</dd><dt>Name supplied</dt><dd>The midwife witnesses; the account opens.</dd><dt>Account provision</dt><dd>Cot, warmth and a reading at the desk's convenience.</dd><dt>Leaflet's conclusion</dt><dd>The use of the free hours is recorded as a kindness that can be repeated.</dd></dl><p class="reading">The doubling is prospective. The scene does not say that the mother actually pays the doubled fee.</p></figure>
<figure id="figure-95"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-095.svg"><img alt="095. True excerpts, larger accounts" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-095.svg" width="842"/></a><figcaption>095. True excerpts, larger accounts</figcaption><p>Compare the invitation's excerpts with the current testimony in Stories 28 and 29.</p><div aria-label="Table: 095. True excerpts, larger accounts" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">What the invitation selects</th><th scope="col">What the fuller account retains</th></tr></thead><tbody><tr><th scope="row">Service quality</th><td>The service was very good</td><td>The widow also admits that some evenings she preferred him</td></tr><tr><th scope="row">Accurate recollection</th><td>Corrects her sister's birthday</td><td>The service does not supply two months of marital silence</td></tr><tr><th scope="row">The difficult second year</th><td>The service got him through it</td><td>He keeps this claim true in incompatible first accounts</td></tr><tr><th scope="row">Four hundred mornings</th><td>Mornings he would not have had</td><td>He refuses to call those mornings lies while altering his account</td></tr></tbody></table></div><p class="reading">The fuller accounts complicate the quotations without making the quoted comfort false.</p></figure>
<figure id="figure-96"><a aria-label="Open full-size diagram" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-096.svg"><img alt="096. Each offer has a boundary" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-096.svg" width="842"/></a><figcaption>096. Each offer has a boundary</figcaption><p>The leaflet's terms and final blank fields concern different commitments.</p><div aria-label="Table: 096. Each offer has a boundary" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Term or field</th><th scope="col">What the leaflet offers</th><th scope="col">Boundary</th></tr></thead><tbody><tr><th scope="row">First Thursday</th><td>Free</td><td>Not every Thursday</td></tr><tr><th scope="row">Assessment</th><td>No charge; hear the figure first</td><td>Before an account opens in your name</td></tr><tr><th scope="row">Introductory rate</th><td>Held for four quarters</td><td>Not a permanent fixed price</td></tr><tr><th scope="row">A place</th><td>Still held in ten years; holding unbilled</td><td>Not a defined bed or free continuation</td></tr><tr><th scope="row">Desired voice</th><td>A blank for the person to hear</td><td>No demand to call it the same person</td></tr><tr><th scope="row">Payer</th><td>A separate blank</td><td>The desired voice and the payer occupy different fields</td></tr></tbody></table></div><p class="reading">Free assessment and an unbilled held place do not amount to a promise that all future service is free.</p></figure>
