			<text x="158" y="172" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,344) scale(1,-1)">warm the hand under the blanket — the sensor wants warmth and a little damp</text>
			<text x="90" y="154" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,308) scale(1,-1)">instruction 5</text>
			<text x="158" y="154" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,308) scale(1,-1)">if the screen shakes its head, warm the thumb against your neck and try again</text>
			<text x="90" y="136" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,272) scale(1,-1)">instruction 8</text>
			<text x="158" y="136" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,272) scale(1,-1)">the thumb will keep working for a day, maybe two. No one will tell you this.</text>
			<rect x="90" y="74" width="500" height="30" style="stroke: rgb(54%,18%,18%); stroke-linecap: butt; stroke-width: 0.9; fill: rgb(100%,100%,100%); fill-rule: evenodd;"/>
			<text x="100" y="92" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,184) scale(1,-1)">THE HOUR IS A RACE AGAINST A HAND GOING COLD,</text>
			<text x="100" y="81" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,162) scale(1,-1)">and the document is helping. That is the horror: every line of it is good advice.</text>
			<text x="20" y="34" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,68) scale(1,-1)">&quot;You will think about it at the funeral.&quot;</text>
		</g>
	</g>
