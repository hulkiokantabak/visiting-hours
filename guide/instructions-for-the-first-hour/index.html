<figure id="figure-10"><a aria-label="Open full-size diagram: 010. Three quantities, three different limits" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-010.svg"><img alt="010. Three quantities, three different limits" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-010.svg" width="842"/></a><figcaption>010. Three quantities, three different limits</figcaption><p>Attempt count, source material and thumb viability are not interchangeable.</p><div aria-label="Table: 010. Three quantities, three different limits" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Constraint</th><th scope="col">Quantity</th><th scope="col">Status</th></tr></thead><tbody><tr><th scope="row">Phone attempts</th><td>5 available; 2 used</td><td>3 remaining, calculated as 5 - 2</td></tr><tr><th scope="row">Continuation material</th><td>90 days</td><td>Messages, walks, voice notes and small hours</td></tr><tr><th scope="row">Thumb viability</th><td>1 day, maybe 2</td><td>An estimate the applicant will recall at the funeral</td></tr></tbody></table></div><p class="reading">Three attempts remain by subtraction at instruction 5; their later use and a successful total are not narrated.</p></figure>
<figure id="figure-11"><a aria-label="Open full-size diagram: 011. The hand serves incompatible purposes" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-011.svg"><img alt="011. The hand serves incompatible purposes" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-011.svg" width="842"/></a><figcaption>011. The hand serves incompatible purposes</figcaption><p>The same contact carries intimacy, access and a final act of replacement.</p><div aria-label="Table: 011. The hand serves incompatible purposes" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Intimate or bodily act</th><th scope="col">Procedural use or limit</th></tr></thead><tbody><tr><th scope="row">Holding the hand</th><td>A contact with a prior personal history</td><td>Warmth keeps the sensor usable</td></tr><tr><th scope="row">Thumb against the neck</th><td>A body supplies warmth</td><td>Another authentication attempt</td></tr><tr><th scope="row">Ninety days of material</th><td>A record of his private life</td><td>The application cannot ask him</td></tr><tr><th scope="row">Returning the hand</th><td>Placed as it was found</td><td>Access has not supplied his consent</td></tr></tbody></table></div><p class="reading">This comparison describes uses of the hand; it does not assign each instruction one exclusive beneficiary.</p></figure>
<figure id="figure-12"><a aria-label="Open full-size diagram: 012. Nine, the gap, and the unnamed place" class="figure-visual" href="/visiting-hours/guide/figures/en/figure-012.svg"><img alt="012. Nine, the gap, and the unnamed place" height="595" loading="lazy" src="/visiting-hours/guide/figures/en/figure-012.svg" width="842"/></a><figcaption>012. Nine, the gap, and the unnamed place</figcaption><p>The final numbered positions preserve an interruption and an unresolved referent.</p><dl><dt>9</dt><dd>Put the hand back.</dd><dt>10</dt><dd>A number with no instruction.</dd><dt>11</dt><dd>An optional place to sit: the side she used.</dd><dt>12</dt><dd>The last sentence denies ownership without fixing the referent.</dd></dl><p class="reading">The final instructions leave the place and relationship unnamed. The pronoun and the empty tenth item remain as written.</p></figure>
