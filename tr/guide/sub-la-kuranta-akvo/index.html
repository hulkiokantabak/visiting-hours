<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sub la Kuranta Akvo · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/sub-la-kuranta-akvo/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/sub-la-kuranta-akvo/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/sub-la-kuranta-akvo/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/sub-la-kuranta-akvo/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-13"><h1>13. Sub la Kuranta Akvo</h1>
<figure id="figure-37"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-037.svg"><img alt="037. Açıklayıcı çeviri olmadan ölçülen üç paragraf" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-037.svg" width="842"/></a><figcaption>037. Açıklayıcı çeviri olmadan ölçülen üç paragraf</figcaption><p>Sayım, bu baskıda boşluklarla ayrılmış kelimeleri esas alır.</p><p>boşluk karakterleriyle ayrılmış kelimeler</p><div aria-label="Tablo: 037. Açıklayıcı çeviri olmadan ölçülen üç paragraf" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">1. paragraf</th><td>84</td><td>İlk paragraf</td></tr><tr><th scope="row">2. paragraf</th><td>67</td><td>İkinci paragraf</td></tr><tr><th scope="row">3. paragraf</th><td>44</td><td>Üçüncü paragraf</td></tr></tbody></table></div><p class="reading">Toplam 195 kelimedir: 84 + 67 + 44. Paragraflar kısalır; bu biçim, İngilizceye çeviri değildir.</p></figure>
<figure id="figure-38"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-038.svg"><img alt="038. İzlenebilecek sonraki üç yankı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-038.svg" width="842"/></a><figcaption>038. İzlenebilecek sonraki üç yankı</figcaption><p>Bu şekil dizilerini Esperanto sayfayla birlikte okuyun; hiçbir satır çevrilmez.</p><dl><dt>13 Sub la Kuranta Akvo</dt><dd>Sonraki öykülere uzanan seçilmiş üç yol</dd><dt>22 Lütfen Teyit Edin</dt><dd>Şekiller 064–066</dd><dt>26 Düzen Yeniden Sağlandı</dt><dd>Şekiller 076–078</dd><dt>Son · Ziyaret Saatleri</dt><dd>Şekiller 178–180</dd></dl><h4>İlişkiler</h4><ul><li>13 Sub la Kuranta Akvo → 22 Lütfen Teyit Edin: yinelenen kelimeler ve hareketler</li><li>13 Sub la Kuranta Akvo → 26 Düzen Yeniden Sağlandı: yinelenen kelimeler ve hareketler</li><li>13 Sub la Kuranta Akvo → Son · Ziyaret Saatleri: sonraki bir ifade</li></ul><p class="reading">Sonraki sahneler geri dönen unsurları değiştirir. Benzer kelimeler ve hareketler, sahneleri aynı kılmaz ya da bütün kimlikleri kesinleştirmez.</p></figure>
<figure id="figure-39"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-039.svg"><img alt="039. Doğrulanmış üç tekrar bağlantısı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-039.svg" width="842"/></a><figcaption>039. Doğrulanmış üç tekrar bağlantısı</figcaption><p>Öykü adları karşılıkları gösterir; Esperanto metin çevrilmeden kalır.</p><dl><dt>13 Sub la Kuranta Akvo</dt><dd>Sayfa çevrilmeden kalır.</dd><dt>5 Ucuz Kelimeler</dt><dd>Daha önceki bir hane içi tekrar</dd><dt>15 Tarife</dt><dd>Daha sonraki sayısal bir tekrar</dd><dt>1 Nice Yıllara</dt><dd>Daha önceki bir hava durumu tekrarı</dd></dl><h4>İlişkiler</h4><ul><li>13 Sub la Kuranta Akvo → 5 Ucuz Kelimeler: hane içi pratik</li><li>13 Sub la Kuranta Akvo → 15 Tarife: tarife dizisi</li><li>13 Sub la Kuranta Akvo → 1 Nice Yıllara: hava durumu tekrarı</li></ul><p class="reading">Bu, seçilmiş bir gönderme haritasıdır; bütün bağlantıların dökümü değildir. Hiçbir satır İngilizce olarak yeniden ifade edilmez.</p></figure>
