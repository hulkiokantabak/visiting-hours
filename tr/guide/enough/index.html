<figure id="figure-97"><a aria-label="Şekli büyüt: 097. Kimin bedenini kim okuyor" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-097.svg"><img alt="097. Kimin bedenini kim okuyor" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-097.svg" width="842"/></a><figcaption>097. Kimin bedenini kim okuyor</figcaption><p>Mesleki değerlendirme, cinsel yargı ve beden bilgisi el değiştirir.</p><div aria-label="Tablo: 097. Kimin bedenini kim okuyor" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Okuyan</th><th scope="col">Okunan beden veya eylem</th><th scope="col">Ardından gelen</th></tr></thead><tbody><tr><th scope="row">Klinik</th><td>Kavrayışı, el açıklığı ve titremesi</td><td>Elleri yalnızca ikinci ekleme kadar sigortalıdır</td></tr><tr><th scope="row">Kadın, marangozdan sonra</th><td>Ölçüm masasındaki titreyen el</td><td>Bir hastanın kaydırılmasını ister; diğer eliyle marangoza beş yıldız verir</td></tr><tr><th scope="row">Kadın, fünikülerdeki adamla</th><td>Yedinci sayışında adamın nefesi kesilir</td><td>Tepkiyi işinden tanır</td></tr><tr><th scope="row">Kadın, tellakla</th><td>Başparmak, parmaklarının altında çıtlar</td><td>Kese yeniden başlayana dek eli orada tutar</td></tr></tbody></table></div><p class="reading">Çıtlayan başparmak fark edilir ama tanı konmaz. Beş yıldız karşılaşmanın bedelini belirlemez.</p></figure>
<figure id="figure-98"><a aria-label="Şekli büyüt: 098. Hatırlanan iyilik, değişmeyen yazışma" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-098.svg"><img alt="098. Hatırlanan iyilik, değişmeyen yazışma" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-098.svg" width="842"/></a><figcaption>098. Hatırlanan iyilik, değişmeyen yazışma</figcaption><p>Bir cevaba dair anısını daha sonra bulduğuyla karşılaştırın.</p><div aria-label="Tablo: 098. Hatırlanan iyilik, değişmeyen yazışma" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Hatırladığı</th><th scope="col">Yazışmanın gösterdiği</th></tr></thead><tbody><tr><th scope="row">Eylem</th><td>Nazik bir cümle yazmak</td><td>Gönderilmiş bir cümle yok</td></tr><tr><th scope="row">Tamamlama</th><td>Yağmurlu bir perşembe göndermek</td><td>Cümlenin taslağı da yok</td></tr><tr><th scope="row">Sonradan dönüş</th><td>Aylar sonra bir tesisatçının numarasını arar</td><td>Adamın daveti son mesaj olarak kalır</td></tr></tbody></table></div><p class="reading">Çelişki korunur. Nedeni olarak görünmeyen bir gönderen, silme işlemi veya arıza sunulmaz.</p></figure>
<figure id="figure-99"><a aria-label="Şekli büyüt: 099. Kese kalkar; kadın geri getirir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-099.svg"><img alt="099. Kese kalkar; kadın geri getirir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-099.svg" width="842"/></a><figcaption>099. Kese kalkar; kadın geri getirir</figcaption><p>Hamamda bedensel izin ve baskının sırası.</p><dl><dt>Elleri açılır</dt><dd>Sıcak, omuzlarında biriken haftayı çözer.</dd><dt>Kese kalkar</dt><dd>Sırtı kesenin ardından gider.</dd><dt>Bir yerin atlandığını söyler</dt><dd>Tellağı, atlanmamış bir yere geri yönlendirir.</dd><dt>Tellağın başparmağı çıtlar</dt><dd>Tellak özür diler.</dd><dt>Eli, öteki eli yerinde tutar</dt><dd>Kese yeniden başlar.</dd><dt>Su ağırlığını taşır</dt><dd>Kesenin tekrar geçtiği yer yanar.</dd></dl><h4>İlişkiler</h4><ul><li>Elleri açılır → Kese kalkar: Sonra</li><li>Kese kalkar → Bir yerin atlandığını söyler: Sonra</li><li>Bir yerin atlandığını söyler → Tellağın başparmağı çıtlar: Sonra</li><li>Tellağın başparmağı çıtlar → Eli, öteki eli yerinde tutar: Sonra</li><li>Eli, öteki eli yerinde tutar → Su ağırlığını taşır: Sonra</li></ul><p class="reading">Son cümlede rahatlama ile yanma bir aradadır; kese, asılsız bir şikâyetle tekrarlatılır.</p></figure>
