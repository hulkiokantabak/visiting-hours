<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tören · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-observance/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-observance/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-observance/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-observance/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-51"><h1>51. Tören</h1>
<figure id="figure-151"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-151.svg"><img alt="151. Biri dururken öteki çalışmayı sürdürür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-151.svg" width="842"/></a><figcaption>151. Biri dururken öteki çalışmayı sürdürür</figcaption><p>Kumandalar ve kesintiler, olayın farklı parçalarına etki eder.</p><div aria-label="Tablo: 151. Biri dururken öteki çalışmayı sürdürür" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Amaçlanan ya da duyurulan</th><th scope="col">Olan</th></tr></thead><tbody><tr><th scope="row">Pedal</th><td>Rauf provadaki AŞAĞI kumandasını dener</td><td>Bez yükselir; elektrikçi YUKARI diye bağırır</td></tr><tr><th scope="row">Çekilen fiş</th><td>Rauf tehlikeyi durdurmaya çalışır</td><td>Yansıtılan yüzler kaybolur; motor çalışmayı sürdürür</td></tr><tr><th scope="row">Seyircilere emir</th><td>Ailelere ayakta kalmaları söylenir</td><td>Sonra bir kadın geçiş açmak için oturmalarını ister</td></tr><tr><th scope="row">Düşüşten sonra</th><td>Törenin mikrofonu yeniden çalışır</td><td>Lida, tahtaların üzerinde yaralıdır ve soluk alır</td></tr></tbody></table></div><p class="reading">Bu, gözlenen sonuçların karşılaştırmasıdır; eksiksiz bir elektrik ya da sahne planı değildir.</p></figure>
<figure id="figure-152"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-152.svg"><img alt="152. Öğrenilmiş oyundan geçen makas" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-152.svg" width="842"/></a><figcaption>152. Öğrenilmiş oyundan geçen makas</figcaption><p>Kesici alet, kullanılana dek el ve ağız değiştirir.</p><dl><dt>Kadının çantası</dt><dd>Mutfak makası ön sıradan gelir.</dd><dt>Rauf'un dolu elleri</dt><dd>Makası alamaz; makas düşer.</dd><dt>Biscuit'in ağzı</dt><dd>Köpek plastik sapları alır ve geri çekilir.</dd><dt>Öğrenilmiş dönüş</dt><dd>Rauf onu över; Biscuit erişebileceği yere gelir.</dd><dt>Rauf'un dişleri</dt><dd>Sapları yakalar.</dd><dt>Kadının eli</dt><dd>Makası alır; önce bezi, sonra gömlek kolunu keser.</dd></dl><h4>İlişkiler</h4><ul><li>Kadının çantası → Rauf'un dolu elleri: uzatılır</li><li>Rauf'un dolu elleri → Biscuit'in ağzı: düşer ve alınır</li><li>Biscuit'in ağzı → Öğrenilmiş dönüş: tanıdık bir oyun</li><li>Öğrenilmiş dönüş → Rauf'un dişleri: erişilebilen yerde</li><li>Rauf'un dişleri → Kadının eli: alet el değiştirir</li></ul><p class="reading">Gecikme, öğrenilmiş bir oyunu tehlikeye bağlar; Biscuit'i kasıtlı bir sabotajcı yapmaz.</p></figure>
<figure id="figure-153"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-153.svg"><img alt="153. Mikrofonun duyurduğu" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-153.svg" width="842"/></a><figcaption>153. Mikrofonun duyurduğu</figcaption><p>Sözlü çerçeve ile bedenin kanıtı aynı olayda yer alır.</p><div aria-label="Tablo: 153. Mikrofonun duyurduğu" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Herkese açık eylem</th><th scope="col">Bedensel olay</th><th scope="col">Uyuşmazlık</th></tr></thead><tbody><tr><th scope="row">Mikrofon, sorun yok işareti için Lida'ya teşekkür eder</th><td>Lida örtünün altındayken hazır diyen Rauf'tur</td><td>Hazır olma bildirimi başka kişiye mal edilir</td></tr><tr><th scope="row">Müdür, işlenmiş isimler için uyarır</th><td>Lida'nın giysi kolu sarılırken Rauf onu tutmaktadır</td><td>Yazıyı korumak, ona ulaşmakla çatışır</td></tr><tr><th scope="row">Kadın mikrofonu alır</th><td>Yardım geçebilsin diye seyircilerin oturmasını ister</td><td>Söz, törenden yaralanmaya yönelir</td></tr><tr><th scope="row">Müdür açılan bluzu örter</th><td>Mikrofonu Lida'nın ağzından uzaklaştırır</td><td>Koruma ve denetim birlikte gerçekleşir</td></tr></tbody></table></div><p class="reading">Son hareket, Lida'yı örtmekle mikrofonu uzaklaştırmayı birleştirir; neden böyle yaptığı belirlenmez.</p></figure>
