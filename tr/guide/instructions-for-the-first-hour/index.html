<figure id="figure-10"><a aria-label="Şekli büyüt: 010. Üç nicelik, üç ayrı sınır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-010.svg"><img alt="010. Üç nicelik, üç ayrı sınır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-010.svg" width="842"/></a><figcaption>010. Üç nicelik, üç ayrı sınır</figcaption><p>Deneme sayısı, kaynak malzeme ve başparmağın kullanılabilirliği birbirinin yerine geçmez.</p><div aria-label="Tablo: 010. Üç nicelik, üç ayrı sınır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kısıt</th><th scope="col">Nicelik</th><th scope="col">Durum</th></tr></thead><tbody><tr><th scope="row">Telefon denemeleri</th><td>5 hak; 2 kullanılmış</td><td>5 - 2 hesabıyla 3 hak kalır</td></tr><tr><th scope="row">Devam hizmeti için malzeme</th><td>90 gün</td><td>Mesajlar, yürüyüşler, sesli notlar ve gecenin geç saatleri</td></tr><tr><th scope="row">Başparmağın kullanılabilirliği</th><td>1 gün, belki 2</td><td>Başvuranın cenazede hatırlayacağı bir tahmin</td></tr></tbody></table></div><p class="reading">5. talimatta çıkarma hesabıyla üç deneme kalır; bunların sonraki kullanımı ve başarı sayısı anlatılmaz.</p></figure>
<figure id="figure-11"><a aria-label="Şekli büyüt: 011. El, bağdaşmayan amaçlara hizmet eder" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-011.svg"><img alt="011. El, bağdaşmayan amaçlara hizmet eder" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-011.svg" width="842"/></a><figcaption>011. El, bağdaşmayan amaçlara hizmet eder</figcaption><p>Aynı temas yakınlık, erişim ve sonunda eli yerine koyma eylemini taşır.</p><div aria-label="Tablo: 011. El, bağdaşmayan amaçlara hizmet eder" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Yakın veya bedensel eylem</th><th scope="col">İşlemdeki kullanım veya sınır</th></tr></thead><tbody><tr><th scope="row">Eli tutmak</th><td>Geçmişten gelen kişisel bir temas</td><td>Sıcaklık sensörü kullanılabilir tutar</td></tr><tr><th scope="row">Başparmağı boyna dayamak</th><td>Beden sıcaklık sağlar</td><td>Bir kimlik doğrulama denemesi daha</td></tr><tr><th scope="row">Doksan günlük malzeme</th><td>Özel hayatının kaydı</td><td>Başvuru ona soramaz</td></tr><tr><th scope="row">Eli yerine koymak</th><td>Bulunduğu gibi bırakılır</td><td>Erişim, onun rızasını sağlamamıştır</td></tr></tbody></table></div><p class="reading">Bu karşılaştırma elin kullanımını gösterir; her talimata yalnızca bir yararlanıcı atamaz.</p></figure>
<figure id="figure-12"><a aria-label="Şekli büyüt: 012. Dokuz, boşluk ve adı konmayan yer" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-012.svg"><img alt="012. Dokuz, boşluk ve adı konmayan yer" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-012.svg" width="842"/></a><figcaption>012. Dokuz, boşluk ve adı konmayan yer</figcaption><p>Son numaralı maddeler bir kesintiyi ve zamirin belirsiz gönderimini korur.</p><dl><dt>9</dt><dd>Eli yerine koy.</dd><dt>10</dt><dd>Talimatı olmayan bir numara.</dd><dt>11</dt><dd>Oturulabilecek yer: onun kullandığı taraf.</dd><dt>12</dt><dd>Son cümle, kime veya neye gönderme yaptığını sabitlemeden sahipliği reddeder.</dd></dl><p class="reading">Son talimatlar yere ve ilişkiye ad koymaz. Zamir ile boş onuncu madde yazıldığı gibi kalır.</p></figure>
