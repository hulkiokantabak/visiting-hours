<figure id="figure-13"><a aria-label="Şekli büyüt: 013. Hanenin sakladıkları ve tarife" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-013.svg"><img alt="013. Hanenin sakladıkları ve tarife" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-013.svg" width="842"/></a><figcaption>013. Hanenin sakladıkları ve tarife</figcaption><p>Üç çubuk da saklaması kanıtlanmış kelimeleri gösterir; farklar hesaplanmıştır.</p><p>saklaması kanıtlanmış kelimeler</p><div aria-label="Tablo: 013. Hanenin sakladıkları ve tarife" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Hanenin elindeki kelimeler</th><td>206</td><td>Üç kişi arasındaki dağılım verilmez</td></tr><tr><th scope="row">Geçerli tarife</th><td>240</td><td>Hesaplanan açık: 240 - 206 = 34 kelime</td></tr><tr><th scope="row">Yeni yıl tarifesi</th><td>300</td><td>Hesaplanan açık: 300 - 206 = 94 kelime</td></tr></tbody></table></div><p class="reading">Toplamlar hanenin açığını ortaya koyar. 206 kelimenin iki yetişkinle çocuk arasında nasıl dağıldığını göstermez.</p></figure>
<figure id="figure-14"><a aria-label="Şekli büyüt: 014. Öğretilen, biriktirilen demek değildir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-014.svg"><img alt="014. Öğretilen, biriktirilen demek değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-014.svg" width="842"/></a><figcaption>014. Öğretilen, biriktirilen demek değildir</figcaption><p>Üç dil pratiği, değeri farklı biçimlerde hesaba katar.</p><div aria-label="Tablo: 014. Öğretilen, biriktirilen demek değildir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Pratik</th><th scope="col">Sayılan ya da kullanılan</th><th scope="col">Buradan çıkmayan sonuç</th></tr></thead><tbody><tr><th scope="row">Köpek hikâyesi</th><td>Kaybetmeyi göze alabildiği kelimeler</td><td>Ucuz olmaları kaybolmalarını önlemez</td></tr><tr><th scope="row">Kutu ve aylık tekrar</th><td>Biriktirilmiş 9 kelime; onuncusu koşula bağlı</td><td>Umut edilen onuncu kelime henüz edinilmemiştir</td></tr><tr><th scope="row">Musluğun altında söylenen özel kelime</th><td>Bir kez söylenir; sayı hâlâ 9</td><td>Söylenmesi onuncu kelimeyi eklemez</td></tr><tr><th scope="row">Okul notu</th><td>Öğretilen değerli kelimeler; sayı belirtilmez</td><td>Kelime dağarcığı, biriktirilip saklananların toplamı değildir</td></tr></tbody></table></div><p class="reading">Öyküdeki okul notunda herhangi bir sayı verilmez. Not kutuya girer; biriktirilen kelimelere yenilerinin eklendiğini kanıtlamaz.</p></figure>
<figure id="figure-15"><a aria-label="Şekli büyüt: 015. Bir aygıt, hikâye anlatma örneğine dönüşür" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-015.svg"><img alt="015. Bir aygıt, hikâye anlatma örneğine dönüşür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-015.svg" width="842"/></a><figcaption>015. Bir aygıt, hikâye anlatma örneğine dönüşür</figcaption><p>Annenin bilinçli uyarlamasıyla, öykünün açıkça kurduğu neden zinciri.</p><dl><dt>Yaşlanan blok</dt><dd>Bir cümleden uzun her şeyin son kelimesini düşürür</dd><dt>Annenin uyarlaması</dt><dd>Cümlelerini kısa tutar</dd><dt>Oğlanın örneği</dt><dd>Hikâyelerin böyle anlatıldığını sanır</dd></dl><h4>İlişkiler</h4><ul><li>Yaşlanan blok → Annenin uyarlaması: anne sınıra uyum sağlar</li><li>Annenin uyarlaması → Oğlanın örneği: biçim tanıdık hale gelir</li></ul><p class="reading">Blok dokuz yaşındadır; çocuğun yaşı verilmez. Öykü, silinen kelimelerin sayısını vermez.</p></figure>
