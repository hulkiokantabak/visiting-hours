<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Önce İlki · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-first-one-first/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-first-one-first/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-first-one-first/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-first-one-first/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-29"><h1>29. Önce İlki</h1>
<figure id="figure-85"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-085.svg"><img alt="085. İki ilk anlatım da ödemeden önce durur" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-085.svg" width="842"/></a><figcaption>085. İki ilk anlatım da ödemeden önce durur</figcaption><p>İki anlatım aynı tarih sınırını paylaşır ve bağdaşmayan eylemler anlatır.</p><div aria-label="Tablo: 085. İki ilk anlatım da ödemeden önce durur" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">İlk anlatım: yeniler</th><th scope="col">İlk anlatım: yenilemez</th></tr></thead><tbody><tr><th scope="row">Ortak bilgiler</th><td>Elli üç yaşında; karısı on bir yıl önce ölmüş</td><td>Elli üç yaşında; karısı on bir yıl önce ölmüş</td></tr><tr><th scope="row">Sabah veya buluşma</th><td>Kaldırılan ağaçla ilgilenir, sonra zaman kipini düzeltir</td><td>Bir kadın elini uzatır; elleri ceplerinde kalır</td></tr><tr><th scope="row">Durdukları yer</th><td>Ayın dokuzundan önce; para hâlâ onun</td><td>Ayın dokuzundan önce; para hâlâ onun</td></tr></tbody></table></div><p class="reading">Sonradan yazdığı yenileme niyeti, yenilemenin tamamlandığını göstermez; başta hangi anlatımı verdiğini de çözmez.</p></figure>
<figure id="figure-86"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-086.svg"><img alt="086. Sayfayı kesmek her şeyi kesmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-086.svg" width="842"/></a><figcaption>086. Sayfayı kesmek her şeyi kesmez</figcaption><p>Dört tür metin, dört ayrı maddi işleme uğrar.</p><div aria-label="Tablo: 086. Sayfayı kesmek her şeyi kesmez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Metin veya nesne</th><th scope="col">İşlem</th><th scope="col">Kalan</th></tr></thead><tbody><tr><th scope="row">Kutulu teselli ifadeleri</th><td>Doğru oldukları için dokunulmaz</td><td>Her iki ilk anlatımda da bulunabilirler</td></tr><tr><th scope="row">Gülüş sorusu</th><td>Yaprak, kadının pasajının üstüne katlanır</td><td>Yabancının cevabı kadının yanına getirilir</td></tr><tr><th scope="row">Okul kapısı pasajı</th><td>Üç satır kesilip yutulur</td><td>Makbuzların hâlâ göründüğü bir yarık</td></tr><tr><th scope="row">Üçüncü anlatım</th><td>İmzalanıp alta konur</td><td>Diğer iki anlatım onun üzerinde kalır</td></tr></tbody></table></div><p class="reading">Hikâye bu nüshadaki değişiklikleri ve imzalı bir niyeti gösterir; bir kadının silindiğini veya şehrin değiştiğini değil.</p></figure>
<figure id="figure-87"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-087.svg"><img alt="087. Dizin soruyu başka yere yöneltir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-087.svg" width="842"/></a><figcaption>087. Dizin soruyu başka yere yöneltir</figcaption><p>Kapaksız kitabın içindeki bağlantılar; gösterilen yerler kimlik doğrulamaz.</p><dl><dt>Kitabın dizini</dt><dd>Hangi anlatımı verdiğini bulmak için bakar</dd><dt>Önceki kadının anlatımı</dt><dd>Adamın dört yıllık makbuzlarını görür; adamda on bir yıllık vardır</dd><dt>RET</dt><dd>Öğrenmek istediği kelime</dd><dt>YENİDEN YÜRÜRLÜK</dt><dd>Dizinin retten yönlendirdiği yer</dd><dt>Üçüncü bir ilk anlatım</dt><dd>Sayfa numarası yoktur; kitabı istemesiyle başlar</dd></dl><h4>İlişkiler</h4><ul><li>Kitabın dizini → Önceki kadının anlatımı: Buraya gönderir</li><li>Kitabın dizini → RET: Maddeye bakar</li><li>RET → YENİDEN YÜRÜRLÜK: Buraya yönlendirir</li><li>Kitabın dizini → Üçüncü bir ilk anlatım: Sayfasız olarak içerir</li></ul><p class="reading">Kendi anlatımının hangisi olduğunu sorduğu yerde dizin başka bir anlatım sunar.</p></figure>
