<figure id="figure-121"><a aria-label="Şekli büyüt: 121. Daha az bedel için ayıklanan manzara" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-121.svg"><img alt="121. Daha az bedel için ayıklanan manzara" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-121.svg" width="842"/></a><figcaption>121. Daha az bedel için ayıklanan manzara</figcaption><p>Uyku öncesi hikâyeye aldıkları ve almadıkları.</p><div aria-label="Tablo: 121. Daha az bedel için ayıklanan manzara" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Anlatıda kalanlar</th><th scope="col">Anlatıya alınmayanlar</th></tr></thead><tbody><tr><th scope="row">Manzara</th><td>Yol, çit, boş tarla, açık kapı</td><td>İsimler ve sayılar</td></tr><tr><th scope="row">Duyusal ayrıntı</th><td>Öğleden sonra; kayda değer hava yok</td><td>Limon ve müzik</td></tr><tr><th scope="row">Önceki deneme</th><td>Bir kez yeşil bir kapı denemişti</td><td>Uyandığında dört ünitelik bedel aklındaydı</td></tr></tbody></table></div><p class="reading">Bu, bedelden kaçınma çabasıdır; isimsiz her hikâyenin ücretsiz olduğunu kanıtlamaz.</p></figure>
<figure id="figure-122"><a aria-label="Şekli büyüt: 122. Ortak kelimeler ve yaklaşan eşik" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-122.svg"><img alt="122. Ortak kelimeler ve yaklaşan eşik" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-122.svg" width="842"/></a><figcaption>122. Ortak kelimeler ve yaklaşan eşik</figcaption><p>Saklanan kelimeler ile açıklanan yeni yıl sayısı karşılaştırılıyor.</p><p>saklanan kelimeler</p><div aria-label="Tablo: 122. Ortak kelimeler ve yaklaşan eşik" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Ortak birikim</th><td>194</td><td>İkisinin toplamı; ikinci soruşta da kalacak olanlar</td></tr><tr><th scope="row">Yeni yıl eşiği</th><td>300</td><td>Panoda açıklanan sayı</td></tr><tr><th scope="row">Hesaplanan açık</th><td>106</td><td>300 eksi 194; ek bir bedel değil</td></tr></tbody></table></div><p class="reading">Açık, hesaplanmıştır. Hikâye kelimelerin iki kişi arasında nasıl dağıldığını söylemez.</p></figure>
<figure id="figure-123"><a aria-label="Şekli büyüt: 123. Kim kime anlatıyor" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-123.svg"><img alt="123. Kim kime anlatıyor" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-123.svg" width="842"/></a><figcaption>123. Kim kime anlatıyor</figcaption><p>Dinleyicinin adamın eylemlerini söylemeye başladığı anlatım sırası.</p><dl><dt>Adamın uyku hikâyesi</dt><dd>Yalnızca kapıya kadar anlatır.</dd><dt>Kendine sakladığı son</dt><dd>Kadın, onun dönmesini ve ücretsiz uykusunu anlatır.</dd><dt>Adamın sıradaki sözleri</dt><dd>Kadın, onun tam söyleyeceği teklifi dile getirir.</dd><dt>Tamamlanmamış anlatı</dt><dd>Kadın henüz daha ileri gitmediğini söyler.</dd><dt>Eli bırakmaya itiraz</dt><dd>Kadın elini bıraktığını söyler; adam Henüz değil der.</dd></dl><h4>İlişkiler</h4><ul><li>Adamın uyku hikâyesi → Kendine sakladığı son: anlatma inisiyatifi değişir</li><li>Kendine sakladığı son → Adamın sıradaki sözleri: öngörü ihtimali açık kalır (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Adamın sıradaki sözleri → Tamamlanmamış anlatı: eksiksiz bir öngörü yok</li><li>Tamamlanmamış anlatı → Eli bırakmaya itiraz: sona itiraz edilir</li></ul><p class="reading">Uykuda konuşma, olası açıklamalardan biridir. Kadının anlatısı ne öngörüyü kanıtlar ne de sonu kesinleştirir.</p></figure>
