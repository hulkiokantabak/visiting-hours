<figure id="figure-79"><a aria-label="Şekli büyüt: 079. Onarım, onaran bedene dokunur" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-079.svg"><img alt="079. Onarım, onaran bedene dokunur" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-079.svg" width="842"/></a><figcaption>079. Onarım, onaran bedene dokunur</figcaption><p>Babanın isteği yanıtlanmadan önce iki aygıt iz bırakır.</p><div aria-label="Tablo: 079. Onarım, onaran bedene dokunur" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Yapılmış eller</th><th scope="col">Gece lambası</th></tr></thead><tbody><tr><th scope="row">Temas</th><td>Onarımdan sonra çıplak önkolunu kavrarlar</td><td>Gizlediği fişin uçları uyluğuna batar</td></tr><tr><th scope="row">İz</th><td>Morluklar sarıdan yeşile döner</td><td>Dizinin üzerinde izler kalır</td></tr><tr><th scope="row">Dönüş</th><td>Onarılmış bir el eve döner</td><td>Baba yalnızca içi boşaltılmış gövdeyi alır</td></tr></tbody></table></div><p class="reading">İzler, emeği ve bedensel teması gösterir; aygıtı alıkoyma hakkı vermez.</p></figure>
<figure id="figure-80"><a aria-label="Şekli büyüt: 080. Ödeme ile çalışan parçalar ayrılır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-080.svg"><img alt="080. Ödeme ile çalışan parçalar ayrılır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-080.svg" width="842"/></a><figcaption>080. Ödeme ile çalışan parçalar ayrılır</figcaption><p>El değiştirmeleri anlatı sırasıyla izleyin; dua, gece lambasının tamamı değildir.</p><dl><dt>Çalışan bir gece lambası</dt><dd>Baba anlaşılan kalan tutarı getirir ve lambasını geri ister.</dd><dt>Lamba yeniden açılır</dt><dd>Pil, devre kartı ve hoparlör birbirine bağlı kalır.</dd><dt>Parçalar tamircinin kutusunda</dt><dd>Boş gövdeyi geri verir.</dd><dt>Para yeniden babada</dt><dd>Baba gövdeyi bırakıp parasını alır.</dd><dt>Ardından taşınan dua</dt><dd>Tamirci avucundaki açıkta kalan parçalarla peşinden gider.</dd></dl><h4>İlişkiler</h4><ul><li>Çalışan bir gece lambası → Lamba yeniden açılır: Yeniden açılır</li><li>Lamba yeniden açılır → Parçalar tamircinin kutusunda: Parçalar alıkonur</li><li>Parçalar tamircinin kutusunda → Para yeniden babada: Ödeme geri alınır</li><li>Para yeniden babada → Ardından taşınan dua: Sonra</li></ul><p class="reading">Baba verdiği parayı geri alır. Tamirci, kendinde tuttuğu çalışan parçalarla peşinden gider.</p></figure>
<figure id="figure-81"><a aria-label="Şekli büyüt: 081. Ödünç tezgâh ve merdivenler" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-081.svg"><img alt="081. Ödünç tezgâh ve merdivenler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-081.svg" width="842"/></a><figcaption>081. Ödünç tezgâh ve merdivenler</figcaption><p>Ölçekli harita değil, birbiriyle çatışan özen biçimlerinin ilişki şeması.</p><dl><dt>Nuri'nin tezgâhı</dt><dd>Altgeçitte ortak kullanılan bir çalışma yüzeyi</dd><dt>Nuri</dt><dd>Güvercin çekmeceye vurunca kesmeyi bırakır</dd><dt>Güvercin</dt><dd>Bir kanadını bezin üzerinde sürükler</dd><dt>Tamirci</dt><dd>Ödünç tezgâhın ucunda çalışır</dd><dt>Katlanır masa</dt><dd>Yakında, ücret karşılığında ortadan kaybetme hizmeti verir</dd><dt>Merdivendeki baba</dt><dd>Durur; tamirci iki basamak aşağıda durur</dd></dl><h4>İlişkiler</h4><ul><li>Nuri → Nuri'nin tezgâhı: Yer verir</li><li>Nuri → Güvercin: Besler, ilgilenir</li><li>Tamirci → Nuri'nin tezgâhı: Bir ucunu kullanır</li><li>Tamirci → Katlanır masa: Babaya gösterir</li><li>Tamirci → Merdivendeki baba: Duayla peşinden gider</li></ul><p class="reading">Tamirciyle güvercine sağlanan barınak, babanın malını geri alma yönündeki karşılanmamış isteğiyle yan yana durur.</p></figure>
