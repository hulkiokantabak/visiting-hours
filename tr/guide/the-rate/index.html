<figure id="figure-43"><a aria-label="Şekli büyüt: 043. Geçiş ücretinin belirtilen üç kelime toplamı" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-043.svg"><img alt="043. Geçiş ücretinin belirtilen üç kelime toplamı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-043.svg" width="842"/></a><figcaption>043. Geçiş ücretinin belirtilen üç kelime toplamı</figcaption><p>Çubuklar, kelime cinsinden geçiş ücretlerini karşılaştırır; önceki iki madeni paralık ücret başka bir birimdir.</p><p>saklaması kanıtlanmış kelimeler</p><div aria-label="Tablo: 043. Geçiş ücretinin belirtilen üç kelime toplamı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Geçen yıl</th><td>200</td><td>Kelime cinsinden belirtilen ilk düzey</td></tr><tr><th scope="row">Geçerli tarife</th><td>240</td><td>Hesaplanan artış: 240 - 200 = 40</td></tr><tr><th scope="row">Yılın son günü</th><td>300</td><td>Hesaplanan artış: 300 - 240 = 60</td></tr></tbody></table></div><p class="reading">Artışlar hesaplanan farklardır: önce 40, sonra 60 kelime. Bu üç düzeyden on bir yılın önceki tarifeleri çıkarılamaz.</p></figure>
<figure id="figure-44"><a aria-label="Şekli büyüt: 044. Saklama, makbuz geçmişi değildir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-044.svg"><img alt="044. Saklama, makbuz geçmişi değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-044.svg" width="842"/></a><figcaption>044. Saklama, makbuz geçmişi değildir</figcaption><p>Gözlenen sayılar ayrı aşamalara aittir; kaybolan kelimeler açıklanmaz.</p><dl><dt>Başlangıç sayısı</dt><dd>11 yıllık öğretimin ardından saklanan 191 kelime</dd><dt>Bahar denetimi</dt><dd>188 kelime saklanmıştır; makbuzlar doğru kalır</dd><dt>Hesaplanan fark</dt><dd>Saklanan kelimelerde 3 eksilme: 191 - 188</dd><dt>Sonbahar</dt><dd>240 kelime denetlenir ve damgalanır</dd><dt>Alacakaranlık</dt><dd>Kocası, 9 kişiyle birlikte geçer</dd><dt>Ardından</dt><dd>Kadın suya girer; su onu geri vermez.</dd></dl><p class="reading">Dul kadın, kocasının denetlenmiş geçişini tamamlar. Kendisinin suya girişi farklı ve çözümlenmemiş bir durumdur.</p></figure>
<figure id="figure-45"><a aria-label="Şekli büyüt: 045. Yayımlanmış, yazılmamış ve satın alınamaz" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-045.svg"><img alt="045. Yayımlanmış, yazılmamış ve satın alınamaz" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-045.svg" width="842"/></a><figcaption>045. Yayımlanmış, yazılmamış ve satın alınamaz</figcaption><p>Üç düzen bir arada bulunur; dördüncü bir fiyatın birimi belirtilmez.</p><div aria-label="Tablo: 045. Yayımlanmış, yazılmamış ve satın alınamaz" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Düzen</th><th scope="col">Belirtilen kural ya da pratik</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Öğretme</th><td>Her şafakta 1 kelime; fazlası öğlene kadar silinip gider</td><td>Saklama ailenin riski olarak kalır</td></tr><tr><th scope="row">Ödünç verme halkası</th><td>11 katılımcı; rampadan önce geri verme</td><td>Ne yasaktır ne de kendisinden söz edilir</td></tr><tr><th scope="row">Tekrarlanan ödünçler</th><td>Aynı kelime bir mevsimde iki kez verilmez</td><td>İç işleyişe ait bir pratik; yayımlanmış bir izin değil</td></tr><tr><th scope="row">Ad ücreti</th><td>Yüz</td><td>Birimi belirtilmez</td></tr><tr><th scope="row">Yasaklı kelimeler</th><td>Liste satın alınamaz</td><td>Satıcı kayıttan silinir, ardından vurulur</td></tr></tbody></table></div><p class="reading">Ödünç verme, çizelgede değinilmeyen bir yerde durur. Ad ücretini güvenle nakde ya da saklanan kelimelere çevirmek mümkün değildir.</p></figure>
