<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Havuz · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-pool/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-pool/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-pool/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-pool/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-52"><h1>52. Havuz</h1>
<figure id="figure-154"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-154.svg"><img alt="154. Kanın nereye gideceğine kim karar verir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-154.svg" width="842"/></a><figcaption>154. Kanın nereye gideceğine kim karar verir</figcaption><p>Birbiriyle yarışan hak iddiaları aynı taşıyıcıda birleşir.</p><dl><dt>Kan taşıyıcısı</dt><dd>Suna onu çıkarır; sonra geri getirilmesine yardım eder.</dd><dt>Suna</dt><dd>Konumu mirastır; annesinin anılmasını ve balkonu ister.</dd><dt>Sokaktaki adam</dt><dd>Ortak hak iddia eder; torbayı oluğun üstünde tutar.</dd><dt>Yakın zamandaki bağışçı</dt><dd>Kendi katkısını tanır ve ona uzanır.</dd><dt>Havuz</dt><dd>Katkıları kaydeder; tutulan yıllar kan alma odasının üstünde bildirilir.</dd></dl><h4>İlişkiler</h4><ul><li>Suna → Kan taşıyıcısı: çıkarır, sonra geri getirir</li><li>Sokaktaki adam → Kan taşıyıcısı: ortak tasarruf iddiası (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Yakın zamandaki bağışçı → Kan taşıyıcısı: kendi katkısını ister</li><li>Havuz → Kan taşıyıcısı: etiketler ve saklar</li></ul><p class="reading">Tutulan yıllar bildirilir; bağımsız olarak gösterilmez. Buradaki hiçbir hak iddiası evrensel mülkiyet kuralına dönüşmez.</p></figure>
<figure id="figure-155"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-155.svg"><img alt="155. Dönüşten sonra dışarıda kalan kanıt" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-155.svg" width="842"/></a><figcaption>155. Dönüşten sonra dışarıda kalan kanıt</figcaption><p>Şiddet, dönüş ve kimlik bildirimi boyunca anlatı sırası.</p><dl><dt>Oluğun üstündeki torba</dt><dd>Suna adamın bileğini durdurur; bağışçı araya girer.</dd><dt>Taşıyıcı başında şiddet</dt><dd>Adam bağışçıyı iter; Suna vurur; adam Suna'ya vurur.</dd><dt>Birlikte dönüş</dt><dd>Suna ve bağışçı, taşıyıcıyı kliniğe iter.</dd><dt>İçeride bakım</dt><dd>Mühürler kontrol edilir; Suna'ya sandalye ve çay getirilir.</dd><dt>Kimlik bildirme formu</dt><dd>Memur, adamı ve ortaklarını sorar.</dd><dt>Haritası kalır</dt><dd>Suna kalemi aldığında harita hâlâ adamın cebindedir.</dd></dl><h4>İlişkiler</h4><ul><li>Oluğun üstündeki torba → Taşıyıcı başında şiddet: çatışma tırmanır</li><li>Taşıyıcı başında şiddet → Birlikte dönüş: taşıyıcı geri getirilir</li><li>Birlikte dönüş → İçeride bakım: hem kana hem bedene bakım</li><li>İçeride bakım → Kimlik bildirme formu: başka bir talep</li><li>Kimlik bildirme formu → Haritası kalır: Suna'nın payı kalır</li></ul><p class="reading">Kanı geri getirmek, çıkarılmasının planlanmasındaki Suna payını silmez.</p></figure>
<figure id="figure-156"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-156.svg"><img alt="156. İki bilek, kolay olmayan ayrım" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-156.svg" width="842"/></a><figcaption>156. İki bilek, kolay olmayan ayrım</figcaption><p>Suna'nın kavrayışı bağlam değiştirir; kısıtlama gücünü korur.</p><div aria-label="Tablo: 156. İki bilek, kolay olmayan ayrım" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Sokakta</th><th scope="col">Bağışçının sandalyesinde</th></tr></thead><tbody><tr><th scope="row">Tutulan</th><td>Adamın, oluğun üzerindeki bileği</td><td>Bağışçının çarşafa bastırılan bileği, sonra öteki bileği</td></tr><tr><th scope="row">O andaki istek</th><td>Suna, adama torbayı geri koymasını söyler</td><td>Bağışçı, hortumun çıkmasına izin vermemesini söyler</td></tr><tr><th scope="row">Değişen talep</th><td>Adam kana ulaşmaya çalışmayı sürdürür</td><td>Bağışçı, Bırak, der</td></tr><tr><th scope="row">Sınırda</th><td>Suna, bağışçının yardımıyla taşıyıcıyı geri alır</td><td>Hemşireyi bekler ve bırakmaz</td></tr></tbody></table></div><p class="reading">Son kavrayış, hem bakım hem kısıtlama olarak okunabilir; bağışçının değişen sözleri bunu çözmez.</p></figure>
