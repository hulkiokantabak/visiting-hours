<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eşikteki · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-liminal/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-liminal/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-liminal/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-liminal/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-59"><h1>59. Eşikteki</h1>
<figure id="figure-175"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-175.svg"><img alt="175. Taş sesin dört evresi" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-175.svg" width="842"/></a><figcaption>175. Taş sesin dört evresi</figcaption><p>Göreli evreleri ev anlatır; bunlar tarihli bir geçmiş değildir.</p><dl><dt>Anladık</dt><dd>Evin anlattığı ilk bin yıl.</dd><dt>Yorulduk</dt><dd>Savaşlar ve âşıklar, tekrarlanan biçimlerde geri gelir.</dd><dt>Bıraktık</dt><dd>Ev, adımları saymayı bırakır; şehrin olmasına izin verir.</dd><dt>Kasılırız</dt><dd>Yağmur yamalardan girer; don, duvarı oradan açar. Görünmeyen formun duvardan uzun süre kalması beklenir.</dd></dl><p class="reading">Bin yıl, evin anlatısına aittir; sonraki değişimler için kesin tarihler verilmez.</p></figure>
<figure id="figure-176"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-176.svg"><img alt="176. Gözlemci ziyaretçiye dönüşür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-176.svg" width="842"/></a><figcaption>176. Gözlemci ziyaretçiye dönüşür</figcaption><p>Bir çalışanın iştahı, sayımdaki yerini değiştirir.</p><div aria-label="Tablo: 176. Gözlemci ziyaretçiye dönüşür" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Resmî görev</th><th scope="col">Bedensel katılım</th></tr></thead><tbody><tr><th scope="row">Varış</th><td>İki Ofis adamı ziyaretçileri saymaya gelir</td><td>Biri yanına su almadan yürüyerek çıkmıştır</td></tr><tr><th scope="row">Yiyecek teklifi</th><td>Kitabı ödünç veren, işleri olduğunu söyler</td><td>Diğeri paltosunu çıkarır</td></tr><tr><th scope="row">Sayım</th><td>Kitabı ödünç veren, meslektaşını ilk ziyaretçi yazar</td><td>Meslektaşı paltosunu yeniden giyer</td></tr><tr><th scope="row">Eşikte</th><td>Kitabı ödünç veren, kitapla bekler</td><td>Diğeri yer; ev sırtını destekler</td></tr></tbody></table></div><p class="reading">Kitabı ödünç veren, kaydın yalnızca toplam için olduğunu söyler. Sahne, bir ücret ya da sonraki ceza saptamaz.</p></figure>
<figure id="figure-177"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-177.svg"><img alt="177. Burada tutmanın anlamları" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-177.svg" width="842"/></a><figcaption>177. Burada tutmanın anlamları</figcaption><p>Nesneler ve bedenler farklı biçimlerde tutulur.</p><dl><dt>Konuşan ev</dt><dd>Tutma eylemleri, kesinleşmiş tek bir kimlik oluşturmaz.</dd><dt>Denizlikteki kaşık</dt><dd>Bir kadın bırakır; kimse onu sormamıştır.</dd><dt>Ziyaretçinin ayakkabısı</dt><dd>Biscuit alır; isimsiz adam kapıya geri getirir.</dd><dt>Ziyaretçi defteri</dt><dd>Sayfa düzeltilmeden tutulur; mürekkepler aynı yaşa ulaşır.</dd><dt>Çalışanın sırtı</dt><dd>Eşikte yerken ev onu destekler.</dd></dl><h4>İlişkiler</h4><ul><li>Konuşan ev → Denizlikteki kaşık: tutar</li><li>Ziyaretçinin ayakkabısı → Konuşan ev: barınağına geri getirilir</li><li>Konuşan ev → Ziyaretçi defteri: sayfayı düzeltmeden tutar</li><li>Konuşan ev → Çalışanın sırtı: bedensel destek</li></ul><p class="reading">Biscuit'in ismi verilir; adamın verilmez. Kaşığın sahibi ile evin niteliği çözümsüz kalır.</p></figure>
