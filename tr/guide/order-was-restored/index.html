<figure id="figure-76"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-076.svg"><img alt="076. Açık el ile kapalı el" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-076.svg" width="842"/></a><figcaption>076. Açık el ile kapalı el</figcaption><p>Eğitim resmini bu müdahale ve raporuyla karşılaştırın.</p><div aria-label="Tablo: 076. Açık el ile kapalı el" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Talimat veya kayıt</th><th scope="col">Görülen eylem</th></tr></thead><tbody><tr><th scope="row">Eğitim resmi</th><td>Açık bir el</td><td>Görevli elini kapatır ve tutmaya devam eder</td></tr><tr><th scope="row">Tutuşun ardından</th><td>Raporda iz olmadığı yazılıdır</td><td>Adam sağ elini sol avucunda destekler</td></tr><tr><th scope="row">Perşembeyi yazarken</th><td>Adam sol elini kullanır</td><td>Görevli, üzerine yazılan sağ eli sabit tutar</td></tr><tr><th scope="row">Raporun kapasitesi</th><td>On bir kelimelik yer</td><td>Basılı raporun metninden sayılan dokuz kelime</td></tr></tbody></table></div><p class="reading">Adam sağ elini sol eliyle destekler; üzerine yine sol eliyle yazar.</p></figure>
<figure id="figure-77"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-077.svg"><img alt="077. Tek bakiye değil, dört ayrı sayı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-077.svg" width="842"/></a><figcaption>077. Tek bakiye değil, dört ayrı sayı</figcaption><p>Asılı geçiş ücreti, müşterinin kelimeleri ve görevlinin hanesi ayrı hesaplardır.</p><div aria-label="Tablo: 077. Tek bakiye değil, dört ayrı sayı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Sayı</th><th scope="col">Miktar</th><th scope="col">Neyi ölçer</th></tr></thead><tbody><tr><th scope="row">Bugünkü levha</th><td>240</td><td>Asılı geçiş ücreti</td></tr><tr><th scope="row">Rampadaki adam</th><td>239</td><td>Elindeki kelimeler</td></tr><tr><th scope="row">Görevlinin dosyası</th><td>91</td><td>Gecikmiş borç; saklanan kelime bakiyesi olarak verilmez</td></tr><tr><th scope="row">Görevlinin karısı</th><td>206</td><td>Elindeki kelimeler; ayrıca dört yıllık perşembeler belirtilir</td></tr></tbody></table></div><p class="reading">Müşterinin bugünkü geçiş ücretine bir kelimesi eksiktir. Diğer sayılar gelecekteki bir geçişin ücretini kanıtlamaz.</p></figure>
<figure id="figure-78"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-078.svg"><img alt="078. Bir tutuş derse dönüşür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-078.svg" width="842"/></a><figcaption>078. Bir tutuş derse dönüşür</figcaption><p>Yazılı talimat ve uygulamalı gösterim daha genç bir görevliye aktarılır.</p><dl><dt>Açık elin yanındaki not</dt><dd>Kenar notu, oda sessizleşmeden bırakılmamasını söyler.</dd><dt>Görevli sandalyeye oturur</dt><dd>Kolunu genç adama verir.</dd><dt>Parmaklar yerleştirilir</dt><dd>Boştaki eliyle genç adamın tutuşunu düzenler.</dd><dt>Bir parmak yukarı kayar</dt><dd>Ders, bedensel bir düzeltmeyle biter.</dd></dl><h4>İlişkiler</h4><ul><li>Açık elin yanındaki not → Görevli sandalyeye oturur: Ardından gösterilir</li><li>Görevli sandalyeye oturur → Parmaklar yerleştirilir: Sonra</li><li>Parmaklar yerleştirilir → Bir parmak yukarı kayar: Sonra</li></ul><p class="reading">Son düzeltme belirli bir tutuşu öğretir; bu tutuşun daha sonra kullanıldığı gösterilmez.</p></figure>
