<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eşya · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/effects/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/effects/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/effects/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/effects/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-18"><h1>18. Eşya</h1>
<figure id="figure-52"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-052.svg"><img alt="052. Tek imzanın olası iki sonucu" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-052.svg" width="842"/></a><figcaption>052. Tek imzanın olası iki sonucu</figcaption><p>Yardımcı ile memur bu vakayı anlatır; geçiş ücreti mevcut hesaptan gelir.</p><div aria-label="Tablo: 052. Tek imzanın olası iki sonucu" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Eşleşmeyi doğrularsa</th><th scope="col">Eşleşmeyi geçersiz kılarsa</th></tr></thead><tbody><tr><th scope="row">Ölü kardeş</th><td>Ad, bedenle birlikte gider</td><td>Kimliği belirsiz kalır; kuzey duvarına gönderilir</td></tr><tr><th scope="row">Geçiş ücreti</th><td>Yaşayan memurun mevcut hesabından</td><td>Memur hesabı elinde tutar</td></tr><tr><th scope="row">Yaşayan memur</th><td>Okunanın altında kardeşinin yerini alır</td><td>Adı ve masası kalır; hesabın kenarı gridir</td></tr><tr><th scope="row">Ayrı saklama alanı</th><td>Dosya açık kaldığı sürece yılda 4 kelime</td><td>Ücrete ilişkin başka bir sonuç belirtilmez</td></tr></tbody></table></div><p class="reading">Kayıt işlemi tek başına evrensel bir geçiş vaadi değildir. Ücretin miktarı belirtilmez; yılda dört kelime, saklama kutusuyla ilgilidir.</p></figure>
<figure id="figure-53"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-053.svg"><img alt="053. Tanıma, nüfus kaydının yapıldığı kışı açıklığa kavuşturmaz" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-053.svg" width="842"/></a><figcaption>053. Tanıma, nüfus kaydının yapıldığı kışı açıklığa kavuşturmaz</figcaption><p>Kayıtlar ile memurun bedensel tanımaları uyuşmaz; çocukluğun tam anlatısı verilmez.</p><div aria-label="Tablo: 053. Tanıma, nüfus kaydının yapıldığı kışı açıklığa kavuşturmaz" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kaydın sunduğu</th><th scope="col">Memurun tanıdığı</th></tr></thead><tbody><tr><th scope="row">Kimlik kartı</th><td>Boğulmuş beden memurun adını taşır</td><td>Kardeşinin ellerini tanır</td></tr><tr><th scope="row">Çocukluk kaydı</th><td>Kayıt ziyaretinden sonra bir ad devam eder</td><td>İki oğlan girmiştir; hane eve eksilerek dönmüştür</td></tr><tr><th scope="row">İmza örneği</th><td>50 yıldır kopyaladığı harfler</td><td>Onları boğulanın parmakları yazmıştır</td></tr><tr><th scope="row">Son doğrulama</th><td>Okuyucu bulduğu adın altına kaydeder</td><td>Kendi, daha önce dosyalanmamış el yazısıyla yazar</td></tr></tbody></table></div><p class="reading">İki oğlan ve devam eden tek ad, yer değiştirmenin her ayrıntısını ortaya koymaz; sicilin hiç yanılmadığını da kanıtlamaz.</p></figure>
<figure id="figure-54"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-054.svg"><img alt="054. Saat gider; sözlük kalır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-054.svg" width="842"/></a><figcaption>054. Saat gider; sözlük kalır</figcaption><p>İki eşyanın son işlemleri; ardından nesnesi olmayan bir hareket.</p><dl><dt>Geçiş için serbest bırakılan eşya</dt><dd>Hataya karşı bir eşya tutulabilir</dd><dt>Tutulan sözlük</dt><dd>Hâlâ şişip kapanmıştır; AÇIKLAMALAR alanına bir şey yazılmaz</dd><dt>Kardeşe takılan saat</dt><dd>Memur kayışa yeni bir delik açar ve tokayı kapatır</dd><dt>Saat kurulu halde gider</dt><dd>Vaat edildiği bilekte yolculuk eder</dd><dt>Masadaki memur</dt><dd>Artık orada olmayan saati kurar</dd></dl><h4>İlişkiler</h4><ul><li>Geçiş için serbest bırakılan eşya → Tutulan sözlük: bir eşya kalır</li><li>Geçiş için serbest bırakılan eşya → Kardeşe takılan saat: saat bedenle birlikte gider</li><li>Kardeşe takılan saat → Saat kurulu halde gider: geçiş</li><li>Saat kurulu halde gider → Masadaki memur: hareket sonrasında da sürer (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Kayıt sözlüğü, memurun bileği ise bir hareketi tutar. Bu iki koruma biçimi de okunamayan kitabı açmaz.</p></figure>
