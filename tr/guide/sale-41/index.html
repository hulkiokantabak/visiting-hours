<figure id="figure-61"><a aria-label="Şekli büyüt: 061. Nefesin üç ölçümü" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-061.svg"><img alt="061. Nefesin üç ölçümü" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-061.svg" width="842"/></a><figcaption>061. Nefesin üç ölçümü</figcaption><p>Lot 4, adı verilen üç aşamada dakika cinsinden ölçülür.</p><p>dakika</p><div aria-label="Tablo: 061. Nefesin üç ölçümü" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Kataloglama</th><td>41</td><td>Kıtalar arasındaki nefes</td></tr><tr><th scope="row">Baskı</th><td>44</td><td>Müzayede evi artışı açıklayamaz</td></tr><tr><th scope="row">Satışın kapanışı</th><td>46</td><td>Nihai durum güvencesi yok</td></tr></tbody></table></div><p class="reading">Ölçümler artar; ne neden ne de nihai süre belirtilir.</p></figure>
<figure id="figure-62"><a aria-label="Şekli büyüt: 062. Her hak talebi aynı sonuçla bitmez" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-062.svg"><img alt="062. Her hak talebi aynı sonuçla bitmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-062.svg" width="842"/></a><figcaption>062. Her hak talebi aynı sonuçla bitmez</figcaption><p>Ailenin üç müdahalesi katalogda üç ayrı sonuçla karşılaşır.</p><div aria-label="Tablo: 062. Her hak talebi aynı sonuçla bitmez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Lot</th><th scope="col">Ailenin eylemi</th><th scope="col">Kayıtlı sonuç</th></tr></thead><tbody><tr><th scope="row">7</th><td>Şarkıcıya atfedilen konuk gülüşünü düzeltir</td><td>Düzeltme not edilir; lot uzaktan satılır</td></tr><tr><th scope="row">12</th><td>Mühürlü teşhirde susma hakkını saklı tutar</td><td>Mühürlü ve açılmadan satılır; susma hakkı kullanılır</td></tr><tr><th scope="row">21</th><td>İki tarif girişimini de reddeder</td><td>Kalem tarif sırasında satıştan çekilir</td></tr></tbody></table></div><p class="reading">Susma, düzeltme ve geri çekme ayrı eylemlerdir; hiçbiri terekenin tümü üzerinde denetim kurulduğunu göstermez.</p></figure>
<figure id="figure-63"><a aria-label="Şekli büyüt: 063. Palto ve gönderilmemiş mesaj" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-063.svg"><img alt="063. Palto ve gönderilmemiş mesaj" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-063.svg" width="842"/></a><figcaption>063. Palto ve gönderilmemiş mesaj</figcaption><p>Alıcının talebinin kurduğu ilişkiler; tamamlanmış teslimat haritası değil.</p><dl><dt>Lot 23: kışlık palto</dt><dd>Alt sınır fiyatından satılır</dd><dt>44 numaralı alıcı</dt><dd>Paltoyu satın alır</dd><dt>Lot 20</dt><dd>Gönderilmemiş bir mesaj; uzaktan satılır</dd><dt>Mesajın muhatabı</dt><dd>Teslimin istendiği kişi; varış gösterilmez</dd><dt>Müzayede evi</dt><dd>Teslimatın fiyata dahil olup olmadığı sorulur</dd></dl><h4>İlişkiler</h4><ul><li>44 numaralı alıcı → Lot 23: kışlık palto: satın alır</li><li>Lot 20 → Mesajın muhatabı: bir muhatabı var</li><li>Lot 23: kışlık palto → Mesajın muhatabı: teslim edilmesi istenir (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>44 numaralı alıcı → Müzayede evi: teslimatı sorar</li></ul><p class="reading">Talep ayrı lotları bağlar. Anlatılan kayıtta muhataba ulaşan bir şey yoktur.</p></figure>
