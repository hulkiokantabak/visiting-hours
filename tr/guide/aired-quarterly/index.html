<figure id="figure-139"><a aria-label="Şekli büyüt: 139. Bakım, beklenen ziyaretin ötesine uzanır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-139.svg"><img alt="139. Bakım, beklenen ziyaretin ötesine uzanır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-139.svg" width="842"/></a><figcaption>139. Bakım, beklenen ziyaretin ötesine uzanır</figcaption><p>Odanın kayıtları ile maddi yaşamı farklı zamanlar izler.</p><div aria-label="Tablo: 139. Bakım, beklenen ziyaretin ötesine uzanır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Ölçü ya da kayıt</th><th scope="col">Neyi gösterir</th><th scope="col">Neyi çözmez</th></tr></thead><tbody><tr><th scope="row">On bir yıllık ödeme</th><td>Hesap günceldir</td><td>Her ziyaret sırasında ne olduğunu</td></tr><tr><th scope="row">Aylık, sonra üç ayda bir</th><td>Havalandırma sıklığı değişmiştir</td><td>İş yaşamının durmuş ya da boş kalmış olduğunu</td></tr><tr><th scope="row">Beklenen tarih: ikinci yıl</th><td>Eski bir beklenti dosyada kalır</td><td>Gelecekteki dönüşün tarihini</td></tr><tr><th scope="row">Bahar şeritleri</th><td>Görevli, bunları her zaman yenilediğini söyler</td><td>Oda sahibinin paltoyu aldıktan sonra ne seçeceğini</td></tr></tbody></table></div><p class="reading">On bir yıllık ödeme ile eski bir beklenen tarih yan yanadır; bu ziyaretin kesin yılı verilmez.</p></figure>
<figure id="figure-140"><a aria-label="Şekli büyüt: 140. İki talimatın arasındaki pencere" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-140.svg"><img alt="140. İki talimatın arasındaki pencere" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-140.svg" width="842"/></a><figcaption>140. İki talimatın arasındaki pencere</figcaption><p>Görevli, denetçinin bildirimi ile Meral'in araması arasında hareket eder.</p><div aria-label="Tablo: 140. İki talimatın arasındaki pencere" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Talimat ya da istek</th><th scope="col">Görevlinin yaptığı</th></tr></thead><tbody><tr><th scope="row">Denetçi</th><td>Denetime kadar pencereleri kapalı tutun</td><td>Bu pencereyi daha da açar</td></tr><tr><th scope="row">Meral</th><td>Odanın hâlâ havalandırılması gerekir</td><td>Odayı havalandırmayı sürdürür</td></tr><tr><th scope="row">Kayıt</th><td>Meral aramanın forma yazılmamasını ister</td><td>Görevli, yazdığını söyler</td></tr></tbody></table></div><p class="reading">Meral telefondaki bakım irtibat görevlisidir; odadaki görevlinin adının Meral olduğu saptanmaz.</p></figure>
<figure id="figure-141"><a aria-label="Şekli büyüt: 141. Yatağa bir öğleden sonra daha eklenir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-141.svg"><img alt="141. Yatağa bir öğleden sonra daha eklenir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-141.svg" width="842"/></a><figcaption>141. Yatağa bir öğleden sonra daha eklenir</figcaption><p>Dinlenme teklifi küçük hareketlerle şekillenir.</p><dl><dt>Birlikte katlama</dt><dd>İkisi de çarşafı tutar; kadın mutfağında uyuduğunu anlatır.</dd><dt>Dinlenme teklifi</dt><dd>Adam odada, kendi bilgisi dışında bir yaşam hayal eder.</dd><dt>Ayakkabı çözülür</dt><dd>Kadın oturur; adam paltoyu askısından alır.</dd><dt>Eski hâline getir</dt><dd>Adamın isteği üzerine kadın ayakkabıya uzanır.</dd><dt>Şimdi değil</dt><dd>Adam açıklık getirir; ayakkabı yerde kalır.</dd><dt>Aşağıda bir ses</dt><dd>Adam merdivende, yatak durulana kadar bekler.</dd></dl><h4>İlişkiler</h4><ul><li>Birlikte katlama → Dinlenme teklifi: bir teklif</li><li>Dinlenme teklifi → Ayakkabı çözülür: kabul edilir</li><li>Ayakkabı çözülür → Eski hâline getir: koşul söylenir</li><li>Eski hâline getir → Şimdi değil: zaman açıklığa kavuşur</li><li>Şimdi değil → Aşağıda bir ses: adam paltoyla ayrılır</li></ul><p class="reading">Dinlenmek mümkün olur; adamın odanın nasıl bırakılacağını denetleme isteği yine de silinmez.</p></figure>
