<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tutanak · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/minutes/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/minutes/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/minutes/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/minutes/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-36"><h1>36. Tutanak</h1>
<figure id="figure-106"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-106.svg"><img alt="106. Başlıkta mevcut, maddede yok" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-106.svg" width="842"/></a><figcaption>106. Başlıkta mevcut, maddede yok</figcaption><p>Sekreterin bedeniyle toplantının kullanabildiği mevcudiyet yan yana konur.</p><div aria-label="Tablo: 106. Başlıkta mevcut, maddede yok" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Bedensel mevcudiyet</th><th scope="col">Usuldeki mevcudiyet</th></tr></thead><tbody><tr><th scope="row">Çekilmesi istenir</th><td>Paltosu altında sıkışmış halde oturmaya devam eder</td><td>Çekildiğini yazar</td></tr><tr><th scope="row">İtirazlar sorulur</th><td>Elini kaldırır</td><td>Bir Hamil bu madde için mevcut olmadığını söyler</td></tr><tr><th scope="row">Mutabakat kaydedilir</th><td>Yazmak için elini indirir</td><td>Başkanın onun yokluğuna katıldığını kaydeder</td></tr><tr><th scope="row">Düzeltme istenir</th><td>Baştan sona orada olduğunu söyler</td><td>Mevcut yazıldığı başlığa yönlendirilir</td></tr></tbody></table></div><p class="reading">Sonunda başlığa yapılan gönderme, yenileme maddesi görüşülürken dışlanmasını düzeltmez.</p></figure>
<figure id="figure-107"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-107.svg"><img alt="107. Dışarıda bırakmak yeni bir kayıt üretir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-107.svg" width="842"/></a><figcaption>107. Dışarıda bırakmak yeni bir kayıt üretir</figcaption><p>Tutanak, kaydedilemeyecek veya kaydedilmemesi gerekenlere dair beyanları kaydeder.</p><div aria-label="Tablo: 107. Dışarıda bırakmak yeni bir kayıt üretir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Konu</th><th scope="col">Kural veya eylem</th><th scope="col">Kalan iz</th></tr></thead><tbody><tr><th scope="row">Taziyeler</th><td>Tutanağa geçirilmediği ilan edilir</td><td>Başkan bu beyanın tutulmasını emreder</td></tr><tr><th scope="row">Otuz bir yıla dayanan talep</th><td>Soru geri çekilir</td><td>İnce çizgi kelimeleri okunur bırakır</td></tr><tr><th scope="row">Sekretere teşekkür</th><td>Kendisine yüksek sesle okunur</td><td>Teşekkürü kendisi yazar</td></tr><tr><th scope="row">Kabul</th><td>Tutanak imzasız kabul edilir</td><td>Kurul imza vermez</td></tr></tbody></table></div><p class="reading">Saklanan bir cümle, dışarıda bırakılan talebi etkisiz tutarken bu dışlamayı belgeleyebilir.</p></figure>
<figure id="figure-108"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-108.svg"><img alt="108. Üstü çizilen soru ıslak manşete ulaşır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-108.svg" width="842"/></a><figcaption>108. Üstü çizilen soru ıslak manşete ulaşır</figcaption><p>Maddi sıra, doğrulanmış okunur bir kopyayla değil, bir denemeyle biter.</p><dl><dt>Bir talep hakkında soru sorulur</dt><dd>Bir Hamil, otuz bir yılın hak talebi oluşturup oluşturmadığını sorar.</dd><dt>Soru geri çekilir</dt><dd>İnce çizgisi kelimeleri okunur bırakır.</dd><dt>Manşetine su dökülür</dt><dd>Sürahi onun önünden geçirilir.</dd><dt>Manşet çizili kelimeleri örter</dt><dd>Islak kumaşı mürekkebin üstüne yayar.</dd><dt>Bekler</dt><dd>Okunur bir sonuç gösterilmez.</dd></dl><h4>İlişkiler</h4><ul><li>Bir talep hakkında soru sorulur → Soru geri çekilir: Geri çekilir</li><li>Soru geri çekilir → Manşetine su dökülür: Daha sonra</li><li>Manşetine su dökülür → Manşet çizili kelimeleri örter: Kumaş mürekkebe gelir</li><li>Manşet çizili kelimeleri örter → Bekler: Aktarımı bekler</li></ul><p class="reading">Islak manşet mürekkebi taşıyabilir; hikâye, başarılı olup olmadığı okunamadan durur.</p></figure>
