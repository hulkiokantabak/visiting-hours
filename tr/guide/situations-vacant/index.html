<figure id="figure-136"><a aria-label="Şekli büyüt: 136. Kaldırılan ilan ve gelen yardımcı" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-136.svg"><img alt="136. Kaldırılan ilan ve gelen yardımcı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-136.svg" width="842"/></a><figcaption>136. Kaldırılan ilan ve gelen yardımcı</figcaption><p>Panonun yanıtı, yardımcının onları nasıl bulduğunu açıklamaz.</p><div aria-label="Tablo: 136. Kaldırılan ilan ve gelen yardımcı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kamusal ilan</th><th scope="col">Özel yanıt</th></tr></thead><tbody><tr><th scope="row">İhtiyaç</th><td>Perşembeleri bir bakıcı; dokuz yıldır bakım</td><td>Bir kadın perşembe günü gelir</td></tr><tr><th scope="row">İlanın sonucu</th><td>61 görüntüleme; 0 başvuru; kaldırıldı, kod 4</td><td>Adresi nasıl bulduğu açıklanmaz</td></tr><tr><th scope="row">Somut rahatlık</th><td>Kızı standart tarifeyi karşılayamaz</td><td>Özenle çevirme ve dışarıda bir saat</td></tr></tbody></table></div><p class="reading">Panodaki sıfır başvuru, yardımcının onu kullandığını kanıtlamaz; kadını kimin gönderdiğini de göstermez.</p></figure>
<figure id="figure-137"><a aria-label="Şekli büyüt: 137. Oda bir görüşme odasına dönüşür" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-137.svg"><img alt="137. Oda bir görüşme odasına dönüşür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-137.svg" width="842"/></a><figcaption>137. Oda bir görüşme odasına dönüşür</figcaption><p>Erişim, başvurular ve çatışan yetkiler arasındaki ilişkiler.</p><dl><dt>Mutfak ve yatak odası</dt><dd>Bakım ile önerilen işe alım süreci aynı mekânı paylaşır.</dd><dt>Yardımcı</dt><dd>Anahtarı ister; başvuruları getirir.</dd><dt>Kızı</dt><dd>Yedek anahtarı indirir; formları tutar.</dd><dt>Dolu Ofis kadroları</dt><dd>Mevcut çalışanların da başvurması gerekir.</dd><dt>Daha önce reddeden memur</dt><dd>Kendi kalemiyle başvuru sahibi olarak gelir.</dd></dl><h4>İlişkiler</h4><ul><li>Yardımcı → Mutfak ve yatak odası: erişim kazanır</li><li>Yardımcı → Dolu Ofis kadroları: erken doldurmayı iddia eder (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Kızı → Dolu Ofis kadroları: TUT / İŞTEN ÇIKAR sunulur (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Daha önce reddeden memur → Mutfak ve yatak odası: görüşmeye gelir</li><li>Yardımcı → Kızı: yanıtı ona bırakır</li></ul><p class="reading">Süreç, çalışanları tutma ya da işten çıkarma yetkisi iddia eder; fiilen ne kadar etkili olduğu belli değildir.</p></figure>
<figure id="figure-138"><a aria-label="Şekli büyüt: 138. İki çevirme, aynı iş değildir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-138.svg"><img alt="138. İki çevirme, aynı iş değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-138.svg" width="842"/></a><figcaption>138. İki çevirme, aynı iş değildir</figcaption><p>Anne, bakımının başka amaçlar için kullanılmasını keser.</p><div aria-label="Tablo: 138. İki çevirme, aynı iş değildir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Yardımcının ilk gelişi</th><th scope="col">Memurun kaldırma girişimi</th></tr></thead><tbody><tr><th scope="row">Soru</th><td>Anneye hangi tarafının ağrıdığını sorar</td><td>Anne, kendisine sorulmasını istemek zorunda kalır</td></tr><tr><th scope="row">Dokunuş</th><td>Çarşafı soğutmadan çevirir</td><td>Çok hızlı hareket eder; anne giysisinin kolunu yakalar</td></tr><tr><th scope="row">Kızı</th><td>Dışarıda bir saat kazanır</td><td>Ellerinin ıslak olduğunu söyleyerek yalan söyler</td></tr><tr><th scope="row">Yetki</th><td>Özen, annenin yanıtıyla başlar</td><td>Kalem kalkar; anne kaldırılmayı durdurur</td></tr></tbody></table></div><p class="reading">Son isteği hangi taraf olduğunun kendisine sorulmasıdır; diyagram o tarafın neden önemli olduğunu belirlemez.</p></figure>
