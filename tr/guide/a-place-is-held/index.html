<figure id="figure-94"><a aria-label="Şekli büyüt: 094. Son saat yaklaşırken ücretsiz saatler" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-094.svg"><img alt="094. Son saat yaklaşırken ücretsiz saatler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-094.svg" width="842"/></a><figcaption>094. Son saat yaklaşırken ücretsiz saatler</figcaption><p>Doğum örneği, bu davetin anlattığı biçimiyle.</p><dl><dt>On birinci saatte</dt><dd>Oğluna ad vermemiş, onu bırakmamıştır; kanama ve dikişler hâlâ oradadır.</dd><dt>Ücret açıklanır</dt><dd>On ikinci saatte ücret ikiye katlanacaktır; güçlük çizelgesi battaniyesindedir.</dd><dt>Ad verilir</dt><dd>Ebe tanıklık eder; hesap açılır.</dd><dt>Hesabın sağladıkları</dt><dd>Bebek yatağı, sıcaklık ve masanın uygun gördüğü zamanda bir okuma.</dd><dt>Broşürün vardığı sonuç</dt><dd>Ücretsiz saatlerin kullanımı, tekrarlanabilecek bir iyilik olarak kayda geçer.</dd></dl><p class="reading">İkiye katlanma henüz gerçekleşmemiştir. Sahne, annenin iki kat ücreti gerçekten ödediğini söylemez.</p></figure>
<figure id="figure-95"><a aria-label="Şekli büyüt: 095. Doğru alıntılar, daha geniş anlatımlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-095.svg"><img alt="095. Doğru alıntılar, daha geniş anlatımlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-095.svg" width="842"/></a><figcaption>095. Doğru alıntılar, daha geniş anlatımlar</figcaption><p>Davetteki alıntıları, 28 ve 29. hikâyelerdeki güncel tanıklıklarla karşılaştırın.</p><div aria-label="Tablo: 095. Doğru alıntılar, daha geniş anlatımlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Davetin seçtikleri</th><th scope="col">Tam anlatımda kalanlar</th></tr></thead><tbody><tr><th scope="row">Hizmetin niteliği</th><td>Hizmet çok iyiydi</td><td>Dul, bazı akşamlar onu tercih ettiğini de kabul eder</td></tr><tr><th scope="row">Doğru hatırlama</th><td>Kız kardeşinin doğum gününü düzeltir</td><td>Hizmet, evlilikteki iki aylık sessizliği sağlamaz</td></tr><tr><th scope="row">Zorlu ikinci yıl</th><td>Hizmet o yılı atlatmasını sağladı</td><td>Bağdaşmayan ilk anlatımlarında bu iddiayı doğru tutar</td></tr><tr><th scope="row">Dört yüz sabah</th><td>Başka türlü sahip olamayacağı sabahlar</td><td>Anlatımını değiştirirken o sabahlara yalan demeyi reddeder</td></tr></tbody></table></div><p class="reading">Daha geniş anlatımlar, alıntılanan teselliyi yanlış kılmadan alıntıları karmaşıklaştırır.</p></figure>
<figure id="figure-96"><a aria-label="Şekli büyüt: 096. Her teklifin bir sınırı var" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-096.svg"><img alt="096. Her teklifin bir sınırı var" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-096.svg" width="842"/></a><figcaption>096. Her teklifin bir sınırı var</figcaption><p>Broşürün koşullarıyla sondaki boş alanlar farklı taahhütlere ilişkindir.</p><div aria-label="Tablo: 096. Her teklifin bir sınırı var" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Koşul veya alan</th><th scope="col">Broşürün sunduğu</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">İlk perşembe</th><td>Ücretsiz</td><td>Her perşembe değil</td></tr><tr><th scope="row">Değerlendirme</th><td>Ücretsiz; önce miktarı duyun</td><td>Adınıza hesap açılmadan önce</td></tr><tr><th scope="row">Başlangıç tarifesi</th><td>Dört çeyrek boyunca korunur</td><td>Kalıcı bir sabit fiyat değildir</td></tr><tr><th scope="row">Bir yer</th><td>On yıl sonra da tutulur; tutmak ücretlendirilmez</td><td>Tanımlı bir yatak veya ücretsiz devam hizmeti değildir</td></tr><tr><th scope="row">İstenen ses</th><td>Duyulmak istenen kişi için boşluk</td><td>Ona aynı kişi deme zorunluluğu yoktur</td></tr><tr><th scope="row">Ödeyen</th><td>Ayrı bir boşluk</td><td>İstenen ses ve ödeyen farklı alanlarda yer alır</td></tr></tbody></table></div><p class="reading">Ücretsiz değerlendirme ve ücretsiz tutulan bir yer, gelecekteki bütün hizmetlerin ücretsiz olacağı sözü değildir.</p></figure>
