			<text x="72" y="65" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,130) scale(1,-1)">Her alıntı harfiyen, ve her biri, uzayıp tersini söyleyen bir beyanın</text>
			<text x="72" y="55" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,110) scale(1,-1)">en nazik cümlesi. Esirgeme BEYAN EDİLİYOR, tam metin gerçekten erişilebilir, ve kimse gitmiyor.</text>
			<text x="20" y="30" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,60) scale(1,-1)">&quot;BUNLARA ÇEKİDÜZEN VERMEDİK. HİÇBİRİ SLOGAN DEĞİL.</text>
			<text x="20" y="20" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,40) scale(1,-1)">Bizim insanlarımız coşkulu değildir. İsabetlidirler, bu daha iyidir.&quot;</text>
		</g>
	</g>
