<figure id="figure-25"><a aria-label="Şekli büyüt: 025. Bir ad, yenilemeden uzun yaşar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-025.svg"><img alt="025. Bir ad, yenilemeden uzun yaşar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-025.svg" width="842"/></a><figcaption>025. Bir ad, yenilemeden uzun yaşar</figcaption><p>Yalnızca bildirilen aşamalar; başlangıçtaki okul yılı numaralandırılmaz.</p><dl><dt>Yenilemeler durmadan önce</dt><dd>Saat dokuzda adına cevap verilir; masa kartı ise ayrı olarak perşembeleri yenilenir.</dd><dt>Uzun bölmenin öğrenildiği yıl</dt><dd>Yenilemeler durur.</dd><dt>Bir dönem daha</dt><dd>Müdür, ücreti ödenmeyen adı listede tutar; öğretmen okumayı sürdürür.</dd><dt>Ertesi yıl</dt><dd>Öğretmen açıklama yapmadan ayrılır.</dd><dt>Yerine gelen</dt><dd>Sırayı başka bir ad doldurur.</dd><dt>Yirmi yıl sonra</dt><dd>Buluşmada eski kâğıt yoklama defteri okunur.</dd></dl><p class="reading">Öğretmen nedenini söylemeden ayrılır. Zaman çizelgesi olayların sırasını kaydeder; ayrılışının kanıtlanmış açıklamasını değil.</p></figure>
<figure id="figure-26"><a aria-label="Şekli büyüt: 026. Ücret, ad ve ödenek ayrı kayıtlardır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-026.svg"><img alt="026. Ücret, ad ve ödenek ayrı kayıtlardır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-026.svg" width="842"/></a><figcaption>026. Ücret, ad ve ödenek ayrı kayıtlardır</figcaption><p>Öykü birbiriyle bağlantılı üç kaydı verir; ödemeyi kimin durdurduğunu söylemez.</p><div aria-label="Tablo: 026. Ücret, ad ve ödenek ayrı kayıtlardır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kayıt</th><th scope="col">Süren</th><th scope="col">Şekilden çıkarılamayacak sonuç</th></tr></thead><tbody><tr><th scope="row">Sıra ücreti</th><td>Yenileme sırasında süt ile yüzme arasında listelenir</td><td>Aylık bir çizelge ya da ödemenin durma nedeni</td></tr><tr><th scope="row">Yoklama listesindeki ad</th><td>Ödenmeyen bir dönem boyunca tutulur</td><td>Müdürün tek nedeni</td></tr><tr><th scope="row">Öğrenci sayısı ve ödenek</th><td>Ad kaldığı sürece ikisi de korunur</td><td>Çocuğun varlığının hiçbir maliyeti olmadığı</td></tr><tr><th scope="row">Eski kâğıt yoklama defteri</th><td>Ödenek kaydının dışında, buluşmaya kadar kalır</td><td>Çocuğu geri getirdiği</td></tr></tbody></table></div><p class="reading">Adı tutmak, ödeneği bir dönem korur. Bunun iyilik mi, çıkar hesabı mı, yoksa ikisi birden mi olduğu açık kalır.</p></figure>
<figure id="figure-27"><a aria-label="Şekli büyüt: 027. Fotoğraf değişir; bir el hatırlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-027.svg"><img alt="027. Fotoğraf değişir; bir el hatırlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-027.svg" width="842"/></a><figcaption>027. Fotoğraf değişir; bir el hatırlar</figcaption><p>Hatırlanan kararlar olmadan, bedende ya da görüntüde iki değişim gerçekleşir.</p><div aria-label="Tablo: 027. Fotoğraf değişir; bir el hatırlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Okul fotoğrafı</th><th scope="col">Buluşma masası</th></tr></thead><tbody><tr><th scope="row">Tetikleyen</th><td>Sonbahar fotoğrafı bahara kadar değişmiştir</td><td>Dördüncü ada gelinir</td></tr><tr><th scope="row">Görünen değişim</th><td>Yanındaki çocuklar birbirinden uzaklaşmıştır</td><td>Eskiden yanında oturan kişinin eli dümdüz durur</td></tr><tr><th scope="row">Hatırlanan karar</th><td>İki çocuk da yer değiştirdiğini hatırlamaz</td><td>Kadın elini oraya koymaya karar vermemiştir</td></tr><tr><th scope="row">Merkezdeki çocuk</th><td>Metinde sekiz yaşındadır</td><td>Cevap veren sessizlik sekiz yaşındadır</td></tr></tbody></table></div><p class="reading">Karşılaştırma seçilmemiş iki değişimi birleştirir; fotoğrafın nasıl değiştiğini açıklamaz, kadının hareketine de teşhis koymaz.</p></figure>
