<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dört Dakika · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/four-minutes/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/four-minutes/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/four-minutes/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/four-minutes/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-43"><h1>43. Dört Dakika</h1>
<figure id="figure-127"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-127.svg"><img alt="127. Tanık olunan iki son" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-127.svg" width="842"/></a><figcaption>127. Tanık olunan iki son</figcaption><p>Dosyalanan inceleme ile sonraki düzeltilmiş anlatı farklı filmler tarif eder.</p><div aria-label="Tablo: 127. Tanık olunan iki son" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">İlk akşam: v.10</th><th scope="col">Düzeltilmiş anlatı: v.11</th></tr></thead><tbody><tr><th scope="row">Davet</th><td>Benimle gel</td><td>Yine gel</td></tr><tr><th scope="row">Tekne</th><td>Gün batımı teknesine binerler</td><td>Tekne görünmez</td></tr><tr><th scope="row">Tezgâh</th><td>Boştur; gelene hizmet verilmez</td><td>Kadın kalır, fincan izini siler ve hizmet verir</td></tr><tr><th scope="row">Tanık</th><td>Anne, incelemeyi yazanın elini sıkar</td><td>İncelemeyi yazan aynı koltuğa döner</td></tr></tbody></table></div><p class="reading">Gösterim raporu, dosya içinde ilk anlatıyı destekler. Sonradan geçersiz kılınması, anlatılar arasındaki çelişkiyi ortadan kaldırmaz.</p></figure>
<figure id="figure-128"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-128.svg"><img alt="128. Son sürüm olarak kalamayan sürüm" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-128.svg" width="842"/></a><figcaption>128. Son sürüm olarak kalamayan sürüm</figcaption><p>Bilinen sürümler ve başvurular, anlatıldıkları sırayla.</p><dl><dt>İlk akşam</dt><dd>Gösterilen kopya v.10'dur.</dd><dt>v.11</dt><dd>Dört dakika kısadır; v.10 geçersiz kılınır.</dd><dt>Düzeltme zorunluluğu</dt><dd>206 eski başvuru ücretli düzeltme gerektirir.</dd><dt>Düzeltilmiş başvuru</dt><dd>Yazar, ilk sonu gördüğünü reddeder.</dd><dt>Bu sabah</dt><dd>Standart artık v.12'dir; farkı dökümlenmez.</dd></dl><p class="reading">Yalnızca v.11'in dört dakikalık kısalması ölçülür.</p></figure>
<figure id="figure-129"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-129.svg"><img alt="129. Düzeltmenin ulaştığı yer" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-129.svg" width="842"/></a><figcaption>129. Düzeltmenin ulaştığı yer</figcaption><p>Sonuçlar, filmin saklanan sürümünün ötesine geçer.</p><div aria-label="Tablo: 129. Düzeltmenin ulaştığı yer" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">İlişki</th><th scope="col">Eylem</th><th scope="col">Sonuç</th></tr></thead><tbody><tr><th scope="row">Arşiv / başvuru sahibi</th><td>206 düzeltme istenir</td><td>Başvuranlar öder; ilk metinler eğitim için tutulur</td></tr><tr><th scope="row">İncelemeyi yazan / anne</th><td>Annenin gördüğü sonu reddeder</td><td>Anne ağladığı için özür diler</td></tr><tr><th scope="row">Yazar / sonraki gösterim</th><td>Tek bilet ayırtır</td><td>Anne için bilet almadan döner</td></tr><tr><th scope="row">Yazar / tekne</th><td>Dönmesini bekleyerek gitmeyi sürdürür</td><td>Geri getirildiği gösterilmez</td></tr></tbody></table></div><p class="reading">Teknenin dönmesi umudu, verilmiş bir geri getirme sözü değil, umuttur.</p></figure>
