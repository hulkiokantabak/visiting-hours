<figure id="figure-1"><a aria-label="Şekli büyüt: 001. Öykünün gerçekten saydığı sandalyeler" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-001.svg"><img alt="001. Öykünün gerçekten saydığı sandalyeler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-001.svg" width="842"/></a><figcaption>001. Öykünün gerçekten saydığı sandalyeler</figcaption><p>Aktarılan üç an gösterilir; bunlar eksiksiz bir yıllık dizinin noktaları değildir.</p><div aria-label="Tablo: 001. Öykünün gerçekten saydığı sandalyeler" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">An</th><th scope="col">Masada / ödünç alınan</th><th scope="col">Balkonda</th></tr></thead><tbody><tr><th scope="row">Gösterilen ilk doğum günü</th><td>11 ödünç sandalye; 10 konuk</td><td>Başlangıç sayısı verilmez</td></tr><tr><th scope="row">Sonraki partiler</th><td>Masa çevresindeki sayı verilmez</td><td>Önce 3, sonra 5 sandalye</td></tr><tr><th scope="row">Son parti</th><td>1 sandalye: onunki</td><td>Dolu sıralar; sayı verilmez</td></tr></tbody></table></div><p class="reading">Balkonda sandalyeler birikir; değişmeyen bir toplam ya da her parti için ayrı bir sayı verilmez.</p></figure>
<figure id="figure-2"><a aria-label="Şekli büyüt: 002. Katılmanın farklı biçimlerini barındıran oda" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-002.svg"><img alt="002. Katılmanın farklı biçimlerini barındıran oda" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-002.svg" width="842"/></a><figcaption>002. Katılmanın farklı biçimlerini barındıran oda</figcaption><p>Belirli varlıklar arasındaki ilişkiler gösterilir; eksiksiz bir konuk sayımı yapılmaz.</p><dl><dt>Doğum günü odası</dt><dd>İçindekiler değişirken oda dolu kalır.</dd><dt>En yakın arkadaş</dt><dd>Ruhsatla geri gelir; sonra karşılamadan çıkarılır</dd><dt>Baba</dt><dd>Sandalyesi dışarı çıkar; saati kalır</dd><dt>Hala / teyze</dt><dd>Her zamanki yerinde katılır; sandalyesi fotoğrafı reddeder</dd><dt>Örgülü kız</dt><dd>Başka bir kız aynı iştahı tekrarlar</dd><dt>Anne</dt><dd>Elle yapılan pastanın yerini dosyasına göre basılan pasta alır</dd></dl><h4>İlişkiler</h4><ul><li>Doğum günü odası → En yakın arkadaş: dönüş ve ret</li><li>Doğum günü odası → Baba: sandalye ile saat kalır</li><li>Doğum günü odası → Hala / teyze: oturduğu yerden katılım</li><li>Doğum günü odası → Örgülü kız: tekrarlanan hareket</li><li>Doğum günü odası → Anne: tarif dosyaya dönüşür</li></ul><p class="reading">Bedensel yokluk ile katılmayı sürdürmek aynı anlama gelmez; ruhsatla geri getirilen arkadaşın dönüşü reddedilebilir.</p></figure>
<figure id="figure-3"><a aria-label="Şekli büyüt: 003. Karşılama değişir; zil geri döner" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-003.svg"><img alt="003. Karşılama değişir; zil geri döner" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-003.svg" width="842"/></a><figcaption>003. Karşılama değişir; zil geri döner</figcaption><p>Öyküde belirtilen gecikmeler korunarak anlatı sırası izlenir.</p><dl><dt>Yedinci doğum günü</dt><dd>İki notalı zil konukları içeri alır.</dd><dt>Bir başka zil</dt><dd>Arkadaşı yurt dışındaki işinden döner; çocuğun sesi değişmiştir.</dd><dt>Zilin yerini ses alır</dt><dd>Her konuğun adını zilden yarım saniye önce söyler.</dd><dt>Ruhsatla dönen arkadaş</dt><dd>Adı geri gelir; gülüşü yarım saniye geç gelir.</dd><dt>Tekrarlanan ziller</dt><dd>Art arda üç zil, geçen yılları sıkıştırır.</dd><dt>Son satır</dt><dd>Kapı zili yeniden çalar; gelenin kimliği açıklanmaz.</dd></dl><p class="reading">Son zil yeni bir gelişe işaret eder; gelenin kimliğini açıklamaz, döngüyü bitirmez.</p></figure>
