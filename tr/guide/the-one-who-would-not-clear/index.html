<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silinmeyen · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-one-who-would-not-clear/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-one-who-would-not-clear/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-one-who-would-not-clear/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-one-who-would-not-clear/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-7"><h1>7. Silinmeyen</h1>
<figure id="figure-19"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-019.svg"><img alt="019. Ses kesilir, sonra geri döner" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-019.svg" width="842"/></a><figcaption>019. Ses kesilir, sonra geri döner</figcaption><p>Öyküde verilen sıra ve aralıklar; mekanizma teşhis edilmez.</p><dl><dt>İlk 3 gün</dt><dd>Çaydanlık ve yenilemeyle ilgili standart ifadeler</dd><dt>Dördüncü öğleden sonra</dt><dd>Bir ses, 96.000 adama komuta ettiğini ileri sürer</dd><dt>Evdeki talep</dt><dd>Kadın kuşun fişini çeker; bir saat sonra yeniden takar</dd><dt>İki kış sonra</dt><dd>Kablolar teklemeye başlar; standart ifadeler geri döner</dd><dt>Sonraki 11 gün</dt><dd>Hiçbir şey</dd><dt>On ikinci öğleden sonra</dt><dd>Kuş, yanında ne götüreceğini sorar; ulak düzenini seçer</dd></dl><p class="reading">Standart ifadelerin ardından on bir günlük sessizlik gelir. Sessizlik, silmenin tamamlandığını kanıtlamaz.</p></figure>
<figure id="figure-20"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-020.svg"><img alt="020. İki haberleşme sistemi, bir konuşanın karşılaştırması" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-020.svg" width="842"/></a><figcaption>020. İki haberleşme sistemi, bir konuşanın karşılaştırması</figcaption><p>Tarihsel iddialar kuşa aittir; son teslimatı kadın gözlemler.</p><div aria-label="Tablo: 020. İki haberleşme sistemi, bir konuşanın karşılaştırması" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kuşun anlattığı ulak düzeni</th><th scope="col">Bu sahnedeki şehir</th></tr></thead><tbody><tr><th scope="row">Taşıyıcılar</th><td>Ulaklar, atlar ve sabit mesafeler</td><td>Küçük makineler merdivenli sokaktan bir mesaj taşır</td></tr><tr><th scope="row">Yükümlülük</th><td>Kuş, ulak düzenini zorunlu kıldığını ileri sürer</td><td>Şehir için buna denk bir kuruluş eylemi gösterilmez</td></tr><tr><th scope="row">Teslimat</th><td>Mesajın, kayıtsız taşıyıcılar aracılığıyla varmasına değer verir</td><td>Bir mesaj gelir ve imzayla teslim alınır</td></tr><tr><th scope="row">Karşılaştırmanın dayanağı</th><td>Anlattığı anısı ve duvarları duyduğu iddiası</td><td>Kadının son teslimatı görmesi</td></tr></tbody></table></div><p class="reading">Karşılaştırma daha yüksek hız, daha uzun mesafe ya da ölümsüzlük ortaya koymaz; konuşanın kimliğini de belirlemez.</p></figure>
<figure id="figure-21"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-021.svg"><img alt="021. Arıza fiyatı değiştirir, hukuki durumu değil" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-021.svg" width="842"/></a><figcaption>021. Arıza fiyatı değiştirir, hukuki durumu değil</figcaption><p>Verilen fiyat değişimleri, yeniden satış için ortak bir taban fiyat oluşturmaz.</p><div aria-label="Tablo: 021. Arıza fiyatı değiştirir, hukuki durumu değil" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">An</th><th scope="col">Değer ya da eylem</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Satın alma</th><td>%40 indirim</td><td>Çizik ve silinmemiş kişilik</td></tr><tr><th scope="row">Daha sonraki ilan</th><td>Silinmeyen kişilik için %40 prim</td><td>Ortak bir taban fiyat verilmez</td></tr><tr><th scope="row">Kadının kararı</th><td>Kuşu tutar; satmaz</td><td>Önkolu kasılır; iki parmağı geç açılır</td></tr><tr><th scope="row">Devir talebi</th><td>Kuşun hane dosyasına eklenmesini ister</td><td>Yanıt, devam hizmetini reddeder ve hükümsüz sayılan sahibin mülkünü gerekçe gösterir</td></tr></tbody></table></div><p class="reading">İndirim ve primden kadının kârı hesaplanamaz. Ret, kuşun kişi sayılmamasına ve son sahibinin hükümsüz statüsüne dayanır.</p></figure>
