<figure id="figure-40"><a aria-label="Şekli büyüt: 040. Bu sınırdan neler geçebilir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-040.svg"><img alt="040. Bu sınırdan neler geçebilir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-040.svg" width="842"/></a><figcaption>040. Bu sınırdan neler geçebilir</figcaption><p>Gişede belirtilen ayrımlar bu ihracat vakası için geçerlidir.</p><div aria-label="Tablo: 040. Bu sınırdan neler geçebilir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Taşınan ya da saklanan</th><th scope="col">Belirtilen koşul</th><th scope="col">Sonuç</th></tr></thead><tbody><tr><th scope="row">Devam ruhsatı</th><td>Yabancı ülkedeki mekânlar kaydedilemez</td><td>Yurt dışında cevap veren bir barındırıcı yoktur</td></tr><tr><th scope="row">Saklanan kayıt</th><td>İhracat vergisi uçuş fiyatının iki katını aşar</td><td>Oynatılabilen bir dosya</td></tr><tr><th scope="row">İhraç edilmeyen kayıtlar</th><td>Tereke bunları yasal süre boyunca tutar</td><td>Burada süre belirtilmez</td></tr><tr><th scope="row">Ücreti ödenmiş yerel ruhsat</th><td>Ödenen ayın sonuna kadar sürer</td><td>Kadının ayrılması ruhsatı sona erdirmez; ruhsat, ücreti ödenmiş ayın sonuna kadar sürer.</td></tr><tr><th scope="row">Gözlük kılıfı</th><td>Bir çoraba sarılı olarak kutuda taşınır</td><td>Ücretsiz yolculuk eder; menteşe sert kalır</td></tr></tbody></table></div><p class="reading">İhracat vergisini ödemek, cevap veren bir varlık olmadan kaydı oynatmayı satın alır. Kitap, bunun yaşayan birinin tek ayrılışı olduğunu söylemez.</p></figure>
<figure id="figure-41"><a aria-label="Şekli büyüt: 041. Karton kapaklı kitap sınıfların arasında kalır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-041.svg"><img alt="041. Karton kapaklı kitap sınıfların arasında kalır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-041.svg" width="842"/></a><figcaption>041. Karton kapaklı kitap sınıfların arasında kalır</figcaption><p>Yan yana gişelerde yerel bir anlaşmazlık; ardından ihracat görevlisinin müdahalesi.</p><dl><dt>Annenin not aldığı karton kapaklı kitap</dt><dd>Makbuzların arkasında tutulur</dd><dt>İki tanım</dt><dd>Kişisel malzeme ile kullanılmış kitap</dd><dt>Ekrandaki kutu</dt><dd>KİŞİSEL KAYITLAR kapatıldıktan sonra geri gelir</dd><dt>Görevlinin karşılığı</dt><dd>Ekranı çevirir; kadına kitabı elinde tutmasını söyler</dd></dl><h4>İlişkiler</h4><ul><li>Annenin not aldığı karton kapaklı kitap → İki tanım: sınıflandırma tartışmalı</li><li>İki tanım → Ekrandaki kutu: ekran bir kategori sunar</li><li>Ekrandaki kutu → Görevlinin karşılığı: sınırlı müdahale</li></ul><p class="reading">Görevli, kitabın resmî sınıfını belirlemeden ve sistemin kararını kabul ettiğini kanıtlamadan yardım eder.</p></figure>
<figure id="figure-42"><a aria-label="Şekli büyüt: 042. Ayrılışta saklamanın farklı biçimleri taşınır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-042.svg"><img alt="042. Ayrılışta saklamanın farklı biçimleri taşınır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-042.svg" width="842"/></a><figcaption>042. Ayrılışta saklamanın farklı biçimleri taşınır</figcaption><p>Nesneler maddi olarak ruhsatlı devam hizmetinden ayrı kalır.</p><div aria-label="Tablo: 042. Ayrılışta saklamanın farklı biçimleri taşınır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Taşınan ya da yerleştirilen nesne</th><th scope="col">Eylem ve sınır</th></tr></thead><tbody><tr><th scope="row">Boyalı kutu</th><td>Rafta ruhsatın eski yerini alır</td><td>Daha sonra gözlük kılıfını taşır</td></tr><tr><th scope="row">Son makbuz</th><td>Dosyada pasaportun yerinde yolculuk eder</td><td>Yurt dışında geçirilecek bir ayı öder</td></tr><tr><th scope="row">Halanın / teyzenin kırmızı ipi</th><td>Çözülür ve çöpe götürülür</td><td>Kadının cebinde tutulur</td></tr><tr><th scope="row">Gözlük kılıfı</th><td>Kutuda bir çoraba sarılıdır</td><td>Sert menteşesi, annesinin bildiği aynı güçlüktür</td></tr></tbody></table></div><p class="reading">Akrabasının verdiği ipi saklamak, kanıtlanmış bir koruma mekanizmasına inancı değil, çözülmemiş bir bağlılığı kaydeder.</p></figure>
