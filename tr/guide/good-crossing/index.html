<figure id="figure-103"><a aria-label="Şekli büyüt: 103. Bir bilek, iki acil ihtiyaç" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-103.svg"><img alt="103. Bir bilek, iki acil ihtiyaç" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-103.svg" width="842"/></a><figcaption>103. Bir bilek, iki acil ihtiyaç</figcaption><p>Sözler anlatı sırasıyla; metin bunları söyleyenleri adlandırmaz.</p><dl><dt>Telefon çalar</dt><dd>“Dinleyin. Telefonum.” sözünü “Onun adı. Bakın.” izler.</dd><dt>Bir bilek tutulur</dt><dd>“Bileğimi bırak.” sözüne “Yanaşana kadar.” karşılığı gelir.</dd><dt>“O el bana lazım.”</dt><dd>Tutma ve çekmeme talimatları birbiriyle çatışır.</dd><dt>Telefon vapurun altına gider</dt><dd>Arama kaybolur.</dd><dt>Teşekkür ve yinelenen ad</dt><dd>“Beni kurtardın.” sözünü “Üstünde onun adı vardı.” izler.</dd></dl><h4>İlişkiler</h4><ul><li>Telefon çalar → Bir bilek tutulur: Sonra</li><li>Bir bilek tutulur → “O el bana lazım.”: Sonra</li><li>“O el bana lazım.” → Telefon vapurun altına gider: Sonra</li><li>Telefon vapurun altına gider → Teşekkür ve yinelenen ad: Sonra</li></ul><p class="reading">Kalçasından söz eden, bileği tutan ve “oğlum” diyen, olası rollerdir. Bu rollerin aynı kişiye ait olup olmadığı belirsizdir.</p></figure>
<figure id="figure-104"><a aria-label="Şekli büyüt: 104. Aramanın kanıtı, arayanlara dair cevaplar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-104.svg"><img alt="104. Aramanın kanıtı, arayanlara dair cevaplar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-104.svg" width="842"/></a><figcaption>104. Aramanın kanıtı, arayanlara dair cevaplar</figcaption><p>Aramaya dair sözler, konuşmacıları belirtilmeyen diyaloğun başka sözleriyle karşılaşır.</p><div aria-label="Tablo: 104. Aramanın kanıtı, arayanlara dair cevaplar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Aramaya dair sözler</th><th scope="col">Konuşmanın getirdiği</th></tr></thead><tbody><tr><th scope="row">Kayıptan önce</th><td>Ekranda bir ad</td><td>Dikkat kalçada ve tutmayı sürdürmededir</td></tr><tr><th scope="row">Kayıptan sonra</th><td>“O arıyordu.”</td><td>İnsanların bir şey istiyorlarsa yeniden arayacağı güvencesi</td></tr><tr><th scope="row">Tekrarlanan kanıt</th><td>“Üstünde onun adı vardı.”</td><td>Her şeye bir ad konabileceği uyarısı</td></tr><tr><th scope="row">Dinlemek</th><td>Gelen arama kaybolmuştur</td><td>Biri gerçekten dinlenmiş olduğunu ilan eder</td></tr></tbody></table></div><p class="reading">Ekrandaki ad, konuşma içinde önem taşır; arayanın kimliğini tek başına doğrulamaz.</p></figure>
<figure id="figure-105"><a aria-label="Şekli büyüt: 105. Kayıp, saklanan ve boş poşetten sunulan" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-105.svg"><img alt="105. Kayıp, saklanan ve boş poşetten sunulan" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-105.svg" width="842"/></a><figcaption>105. Kayıp, saklanan ve boş poşetten sunulan</figcaption><p>Üç farklı şey, farklı koşullarla sahneden geçer.</p><div aria-label="Tablo: 105. Kayıp, saklanan ve boş poşetten sunulan" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Şey</th><th scope="col">Durum</th><th scope="col">Mümkün veya eksik kalan</th></tr></thead><tbody><tr><th scope="row">Telefon</th><td>Vapurun altında</td><td>Gelen arama yanıtlanamaz</td></tr><tr><th scope="row">“Onun için” saklanan kelime</th><td>Biri onu on bir aydır sakladığını, dişleriyle yokladığını söyler</td><td>Harcanmaz, hâlâ saklanır</td></tr><tr><th scope="row">Ekmek kabuğu poşeti</th><td>Aramadan önce de sonra da boş olduğu söylenir</td><td>Teklif yinelenir; bir aktarım gösterilmez</td></tr></tbody></table></div><p class="reading">Birinin ekmek kabuğunu aldığı gösterilmez. Saklanan kelime konuşmada harcanmaz.</p></figure>
