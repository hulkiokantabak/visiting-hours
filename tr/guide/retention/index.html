<figure id="figure-88"><a aria-label="Şekli büyüt: 088. Sekiz dinleme boyunca azalan bir tereke" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-088.svg"><img alt="088. Sekiz dinleme boyunca azalan bir tereke" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-088.svg" width="842"/></a><figcaption>088. Sekiz dinleme boyunca azalan bir tereke</figcaption><p>Başlangıç ve kapanış bakiyeleriyle aynı birimde hesaplanan farkları.</p><p>saklaması kanıtlanmış kelimeler</p><div aria-label="Tablo: 088. Sekiz dinleme boyunca azalan bir tereke" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Başlangıçtaki tereke</th><td>162</td><td>Formda yazan miktar</td></tr><tr><th scope="row">Sekiz dinlemeden sonra</th><td>141</td><td>Son miktar; form başarısızlık kaydeder</td></tr><tr><th scope="row">Hesaplanan fark</th><td>21</td><td>162 eksi 141; ayrıca belirtilmiş bir ücret değildir</td></tr></tbody></table></div><p class="reading">Yirmi bir, 162 eksi 141'dir. Hikâye her dinlemenin bu farka ne kadar katkıda bulunduğunu tek tek vermez.</p></figure>
<figure id="figure-89"><a aria-label="Şekli büyüt: 089. Tanışıklık ve mülkiyet masraf cetvelinde" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-089.svg"><img alt="089. Tanışıklık ve mülkiyet masraf cetvelinde" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-089.svg" width="842"/></a><figcaption>089. Tanışıklık ve mülkiyet masraf cetvelinde</figcaption><p>Üç söz kaynağı, farklı koşullarla değerlendirmeye girer.</p><div aria-label="Tablo: 089. Tanışıklık ve mülkiyet masraf cetvelinde" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kaynak</th><th scope="col">Onunla ilişkisi</th><th scope="col">Uygulama</th></tr></thead><tbody><tr><th scope="row">Meral'in kitabı</th><td>Tanıdık bir şey omuzlarını gevşetir</td><td>Meral ücretlendirilmemesini ister; denetçi bir çizgi çeker</td></tr><tr><th scope="row">Sınama cümlesi</th><td>Sonunu duyamaz; tekrar okunmasını kabul eder</td><td>İki okuma da ücretlendirilir</td></tr><tr><th scope="row">On bir bin tiyatro repliği</th><td>Hatırladığı replikleri ve girişleri sunar</td><td>Yazarların tereke hükmü; ruhsatı gösterimlerle sona ermiştir</td></tr></tbody></table></div><p class="reading">Sonunu duyamaması, unuttuğunun kanıtı değildir. Yine de tekrar okuma ücretlendirilir.</p></figure>
<figure id="figure-90"><a aria-label="Şekli büyüt: 090. Dosyalamadan sonra cep boştur" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-090.svg"><img alt="090. Dosyalamadan sonra cep boştur" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-090.svg" width="842"/></a><figcaption>090. Dosyalamadan sonra cep boştur</figcaption><p>Bilet, onun seslendirdiği bir replik eşliğinde anlatı sırasıyla el değiştirir.</p><dl><dt>Sınamaya getirilen bilet</dt><dd>F Sırası okunur; paltosunda kendine ait bir cebi vardır.</dd><dt>Seslendirdiği replik yazıya geçer</dt><dd>Denetçi sorar; adam bir nefes yeri işaretler.</dd><dt>Bilet ona geri verilir</dt><dd>Bileti, denetçinin yazdığı repliğin üstüne koyar.</dd><dt>Kopya istemez</dt><dd>İki aslın da dosyaya girişini izler.</dd><dt>Eli düzleşmiş cebe girer</dt><dd>Sonra bu gece hangi girişin kendisine ait olduğunu sorar.</dd></dl><h4>İlişkiler</h4><ul><li>Sınamaya getirilen bilet → Seslendirdiği replik yazıya geçer: Sonra</li><li>Seslendirdiği replik yazıya geçer → Bilet ona geri verilir: Sonra</li><li>Bilet ona geri verilir → Kopya istemez: Sonra</li><li>Kopya istemez → Eli düzleşmiş cebe girer: Sonra</li></ul><p class="reading">İki nesne de dosyaya girer. Adamın durumu ve gireceği kapı çözüme bağlanmaz.</p></figure>
