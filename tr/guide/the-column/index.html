<figure id="figure-148"><a aria-label="Şekli büyüt: 148. Sabit sütun, değişen tanımlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-148.svg"><img alt="148. Sabit sütun, değişen tanımlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-148.svg" width="842"/></a><figcaption>148. Sabit sütun, değişen tanımlar</figcaption><p>Yeniden belirtilen yükseklikler, suyu değil sınıflandırmayı değiştirir.</p><div aria-label="Tablo: 148. Sabit sütun, değişen tanımlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Fiziksel referans</th><th scope="col">Resmî tanım</th></tr></thead><tbody><tr><th scope="row">İkinci halka seli</th><td>Su bir zamanlar basamakları almıştı</td><td>Yeniden birinci halkada belirtilir</td></tr><tr><th scope="row">Üçüncü halka anısı</th><td>Sakinler ona hâlâ üçüncü der</td><td>İkinci diye kaydedilir; iki iz de kalır</td></tr><tr><th scope="row">Bahar seli</th><td>Su eski dördüncü halkaya ulaşır</td><td>Üçüncü diye kaydedilir; bildirim gerekmez</td></tr><tr><th scope="row">Aşağıdaki sokak</th><td>İki kapıya su girer; bir anne yukarı taşınır</td><td>Çizelgede kapılar için bir sütun vardır</td></tr></tbody></table></div><p class="reading">Sayısal yeniden sınıflandırma, sütunun ya da sel suyunun fiziksel olarak alçalması değildir.</p></figure>
<figure id="figure-149"><a aria-label="Şekli büyüt: 149. Bir uyarının düzeltmesi kalıcı olamaz" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-149.svg"><img alt="149. Bir uyarının düzeltmesi kalıcı olamaz" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-149.svg" width="842"/></a><figcaption>149. Bir uyarının düzeltmesi kalıcı olamaz</figcaption><p>Sava'nın girişimi, kayıtlar arasındaki uyuşmazlığı açığa çıkarır.</p><dl><dt>Kanıt sunulur</dt><dd>Eski dördüncü halka ve iki kapı numarası.</dd><dt>Uyarı reddedilir</dt><dd>Duyuru memuru, gereken ölçüde yükselme bulamaz.</dd><dt>Sokak uyarıldı yazılıdır</dt><dd>Ölçüler'de zaten bir uyarı kayıtlıdır.</dd><dt>Sava kaydı çizer</dt><dd>Bu tanımı kaldırmayı dener.</dd><dt>Kayıt geri döner</dt><dd>Sonraki baskı onu geri getirir.</dd><dt>Kapıya götürülen bildirim</dt><dd>Evde kimse yoktur; Sava bekler.</dd></dl><h4>İlişkiler</h4><ul><li>Kanıt sunulur → Uyarı reddedilir: istek geri çevrilir</li><li>Uyarı reddedilir → Sokak uyarıldı yazılıdır: başka kayıt zaten vardır</li><li>Sokak uyarıldı yazılıdır → Sava kaydı çizer: düzeltme denenir</li><li>Sava kaydı çizer → Kayıt geri döner: sonraki baskı</li><li>Kayıt geri döner → Kapıya götürülen bildirim: bildirimi kendisi götürür</li></ul><p class="reading">Kamusal uyarının reddi ile yanlış uyarıldı kaydı ayrı eylemlerdir; geri dönen tek bir bildirim değildir.</p></figure>
<figure id="figure-150"><a aria-label="Şekli büyüt: 150. Kimin izi yetki taşır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-150.svg"><img alt="150. Kimin izi yetki taşır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-150.svg" width="842"/></a><figcaption>150. Kimin izi yetki taşır</figcaption><p>Yüksek Çizgi'deki karşılaşmanın ilişkileri.</p><dl><dt>Boyanmış Yüksek Çizgi</dt><dd>Sokak ona adını karşılaşmadan sonra verir.</dd><dt>Kedi</dt><dd>Islak çizgiyi gösterir.</dd><dt>Görevli</dt><dd>Çizgiyi boyar; parmak eklemi kesilir.</dd><dt>Silme emri</dt><dd>Ölçüler'i ve Sava'nın damgasını taşır.</dd><dt>Sava</dt><dd>Kutuyu yakalar, silinmesine itiraz eder.</dd><dt>Temizlik hesabı</dt><dd>Görevliye fatura sunması söylenir.</dd></dl><h4>İlişkiler</h4><ul><li>Kedi → Görevli: boyanacak yeri gösterir</li><li>Görevli → Boyanmış Yüksek Çizgi: boyar</li><li>Silme emri → Boyanmış Yüksek Çizgi: silinmesini emreder</li><li>Sava → Silme emri: bu uygulamaya itiraz eder</li><li>Görevli → Silme emri: üzerine boya döker</li><li>Boyanmış Yüksek Çizgi → Temizlik hesabı: sonuç yeniden sınıflanır</li></ul><p class="reading">Sava'nın damgası itiraz ettiği emirdedir. Bu, emri kimin verdiğini ya da tek bir kurumsal niyeti göstermez.</p></figure>
