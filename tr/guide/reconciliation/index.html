<figure id="figure-34"><a aria-label="Şekli büyüt: 034. Farklı nesneler üzerinde anlaşma" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-034.svg"><img alt="034. Farklı nesneler üzerinde anlaşma" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-034.svg" width="842"/></a><figcaption>034. Farklı nesneler üzerinde anlaşma</figcaption><p>P ile C benzer kelimeleri farklı işler için kullanır; kayda geçen anlaşmaları bu uyuşmazlığı ortadan kaldırmaz.</p><div aria-label="Tablo: 034. Farklı nesneler üzerinde anlaşma" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Mekân görevlisi P</th><th scope="col">Devamlılık görevlisi C</th></tr></thead><tbody><tr><th scope="row">Boş</th><td>Temizlik için kullanılmayan bir oda arar</td><td>Dolabı boşaltmaya hazırlanır</td></tr><tr><th scope="row">Geç</th><td>Tekrarlayan geç saat rezervasyonunu bildirir</td><td>Merhum müşterinin barındırılan hizmetini işaretler</td></tr><tr><th scope="row">Onaylandı</th><td>Temizliğe izin verir</td><td>Fabrika durumunda kuruluma izin verir</td></tr><tr><th scope="row">Saklama</th><td>Saklanması gereken bir şey olup olmadığını sorar</td><td>Eşya ya da yeni adres olmadığını; kayıtlı tarafın öldüğünü bildirir.</td></tr></tbody></table></div><p class="reading">Belge anlaşma sağlandığını bildirir; içindeki yazışmalar ise boş bir oda ile silinmiş bir dolap arasındaki farkı korur.</p></figure>
<figure id="figure-35"><a aria-label="Şekli büyüt: 035. Sıfırlamayı durdurmayan kesinti" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-035.svg"><img alt="035. Sıfırlamayı durdurmayan kesinti" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-035.svg" width="842"/></a><figcaption>035. Sıfırlamayı durdurmayan kesinti</figcaption><p>Bakıcı iş programını kısa süreliğine değiştirir; bildirilen saatler aynen korunur.</p><dl><dt>09:08</dt><dd>Bakıcı itiraz eder: dolabı sıfırlamayın.</dd><dt>09:12</dt><dd>Fişi çeker; P, mekân personeline masraf çıkarılacağını söyler.</dd><dt>09:13</dt><dd>C, temiz kurulumun ertelendiğini bildirir.</dd><dt>09:18</dt><dd>Fiş yeniden takılır.</dd><dt>15:55</dt><dd>İş kaydı: fabrika durumuna dönüldü; yerel medya saklanmadı.</dd><dt>15:58</dt><dd>Kitap, hâlâ açık olan talepten bir şerit kadının kaldığı yeri tutacak şekilde geri gelir.</dd></dl><p class="reading">Personelden ücret alınacağı söylenince fiş yeniden takılır. İş kaydı sıfırlamayı bildirdikten sonra da erteleme talebi açık kalır.</p></figure>
<figure id="figure-36"><a aria-label="Şekli büyüt: 036. Üzerinde anlaşılan işten geriye kalanlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-036.svg"><img alt="036. Üzerinde anlaşılan işten geriye kalanlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-036.svg" width="842"/></a><figcaption>036. Üzerinde anlaşılan işten geriye kalanlar</figcaption><p>Nesneler, hizmet ve rezervasyonlar farklı sonuçlara varır.</p><div aria-label="Tablo: 036. Üzerinde anlaşılan işten geriye kalanlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe ya da kayıt</th><th scope="col">Bildirilen sonuç</th><th scope="col">Açık kalan</th></tr></thead><tbody><tr><th scope="row">İş kaydı</th><td>Fabrika durumuna dönüldü; yerel medya saklanmadı</td><td>Sonraki kullanıcı ve rezervasyon, neyin sürdüğünü açıklamaz</td></tr><tr><th scope="row">Kitap ve kalınan yer</th><td>Kitap geri verilir; erteleme talebinden koparılan şerit kadının kaldığı yeri tutar</td><td>Talep açık kalır</td></tr><tr><th scope="row">Doluluk</th><td>58 dakika boyunca 1 kişi; ışıklar iki kez söner</td><td>Oda aynı zamanda boş görünür</td></tr><tr><th scope="row">Kupon</th><td>60 dakikalık kupon verilir; her döngüde geri gelir</td><td>İşaret koyan el tanınmaz</td></tr><tr><th scope="row">Yinelenen rezervasyon</th><td>Bir sonraki döngüde yenilenir</td><td>İçeriden hiçbir hizmet talebi gelmemiştir</td></tr></tbody></table></div><p class="reading">İş kaydı, kullanılan oda ve kendini yenileyen rezervasyon yan yana durur. Tam olarak ne sürmektedir? Kuponu işaretleyen elin kimliği belirsiz kalır.</p></figure>
