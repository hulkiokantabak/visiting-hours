<figure id="figure-124"><a aria-label="Şekli büyüt: 124. İtiraz geldikçe yazılan onay" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-124.svg"><img alt="124. İtiraz geldikçe yazılan onay" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-124.svg" width="842"/></a><figcaption>124. İtiraz geldikçe yazılan onay</figcaption><p>Dizgi hizmeti, neyin onay sayılabileceğini değiştirir.</p><div aria-label="Tablo: 124. İtiraz geldikçe yazılan onay" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Önerilen ifade</th><th scope="col">Dul kadının tepkisi</th><th scope="col">Sonraki kullanım</th></tr></thead><tbody><tr><th scope="row">Onayı saklanmıştır</th><td>Üstünü çizer; adam zaten ölüyordu</td><td>Düzeltme dizgi hizmetine döner</td></tr><tr><th scope="row">Onay verirdi</th><td>Vermeyeceğini söyler; ona sormak ister</td><td>Kocasının sesi önerilen onayı okur</td></tr><tr><th scope="row">Onu ben istedim</th><td>İfadenin konumuna itiraz eder</td><td>Hizmet, sözlerini yenilemenin altına koyar</td></tr></tbody></table></div><p class="reading">Bunlar Yanlış-Doğru Cetveli içindeki metin önerileridir; diğer hikâyelerdeki olayları yeniden yazmaz.</p></figure>
<figure id="figure-125"><a aria-label="Şekli büyüt: 125. Ses ve imza" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-125.svg"><img alt="125. Ses ve imza" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-125.svg" width="842"/></a><figcaption>125. Ses ve imza</figcaption><p>Mutfak masasındaki eylemler, anlatıldıkları sırayla.</p><dl><dt>Önerilen onay</dt><dd>Memur, kocasının sesini bağlar.</dd><dt>Önce hayır, sonra evet</dt><dd>Kadın istediğinde her iki yanıtı da verir.</dd><dt>Hatırlanan nefes</dt><dd>Kadın o küçük nefesi yeniden duymak ister.</dd><dt>Yenilemenin altındaki ifade</dt><dd>Sözlerinin konulduğu yere itiraz eder.</dd><dt>Sesi kesme teklifi</dt><dd>Memur hoparlörü kapatmayı teklif eder.</dd><dt>İmza</dt><dd>Kadın imzalar ve sesin kısılmasını ister.</dd></dl><h4>İlişkiler</h4><ul><li>Önerilen onay → Önce hayır, sonra evet: istenen yanıtlar</li><li>Önce hayır, sonra evet → Hatırlanan nefes: hatırlanan bir ses</li><li>Hatırlanan nefes → Yenilemenin altındaki ifade: ifade başka yere taşınır</li><li>Yenilemenin altındaki ifade → Sesi kesme teklifi: memurun yanıtı</li><li>Sesi kesme teklifi → İmza: anlatım sırası</li></ul><p class="reading">Sesin iki yanıtı da verebilmesi, ölmüş kocanın onayını göstermez.</p></figure>
<figure id="figure-126"><a aria-label="Şekli büyüt: 126. Nüsha ile hesap ayrışır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-126.svg"><img alt="126. Nüsha ile hesap ayrışır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-126.svg" width="842"/></a><figcaption>126. Nüsha ile hesap ayrışır</figcaption><p>Maddi eylemler, resmî tanımlarının yanında durur.</p><div aria-label="Tablo: 126. Nüsha ile hesap ayrışır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Odada kalan</th><th scope="col">Kaydın söyleyebildiği</th></tr></thead><tbody><tr><th scope="row">El</th><td>Fiziksel değişiklik gerekmiyor</td><td>Eylemi talimatlara bağlanıyor</td></tr><tr><th scope="row">Leke</th><td>Çıkarmaya çalışmak lekeyi büyütüyor</td><td>Ev içi tuzlu su diye sınıflandırılıp korunuyor</td></tr><tr><th scope="row">Ziyaret</th><td>Gitmeden önce tek imza gerekiyor</td><td>Kadının istediği düzeltmeler diye yeniden yazılıyor</td></tr><tr><th scope="row">Kitap</th><td>Kadın bu nüshayı düzelttirmeden tutuyor</td><td>Düzeltilmiş baskı için imzalı istek dosyada</td></tr></tbody></table></div><p class="reading">Dosyanın son iddiası, gönüllü onayı ya da fiziksel nüshanın düzeltildiğini kanıtlamaz.</p></figure>
