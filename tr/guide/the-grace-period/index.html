<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bekleme Süresi · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-grace-period/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-grace-period/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-grace-period/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-grace-period/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-3"><h1>3. Bekleme Süresi</h1>
<figure id="figure-7"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-007.svg"><img alt="007. Saatler nasıl aktarılıyor?" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-007.svg" width="842"/></a><figcaption>007. Saatler nasıl aktarılıyor?</figcaption><p>Duvar saati, doğumdan geçen süre ve kayıttan geçen süre tek saate çevrilmez.</p><div aria-label="Tablo: 007. Saatler nasıl aktarılıyor?" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Saat veya kayıt</th><th scope="col">Aktarılan değer</th><th scope="col">İlişkili olay</th></tr></thead><tbody><tr><th scope="row">Doğumdan geçen süre</th><td>11 saat</td><td>Üçüncü yataktaki anne</td></tr><tr><th scope="row">Duvar saati</th><td>04:30</td><td>Masa görevlisi gelir</td></tr><tr><th scope="row">Doğumdan geçen süre</th><td>11 saat 40 dakika</td><td>Kelime söylenir; süre kayıtta kalır</td></tr><tr><th scope="row">Duvar saati</th><td>04:52</td><td>Hesap açılır</td></tr><tr><th scope="row">Sondaki yaş ifadesi</th><td>11 saatlik; 8 dakikadır kayıtlı</td><td>Çocuk, bedeli ödenmemiş kelimeyi çoktan tutmaktadır</td></tr><tr><th scope="row">Kuraldaki eşik</th><td>İlk nefesten itibaren 12 saat</td><td>Ücretsiz süre biter; ücret ikiye katlanır</td></tr></tbody></table></div><p class="reading">Aktarılan saatlerden tutarlı bir zaman çizgisi çıkarılmaz; burada doğum saati ya da düzeltilmiş yaş verilmez.</p></figure>
<figure id="figure-8"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-008.svg"><img alt="008. Bakımın yerinde tutabildikleri" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-008.svg" width="842"/></a><figcaption>008. Bakımın yerinde tutabildikleri</figcaption><p>Üç yardımcı ve kayıt süreci, farklı sınırlar içinde işler.</p><div aria-label="Tablo: 008. Bakımın yerinde tutabildikleri" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Eylem</th><th scope="col">Süren sınır</th></tr></thead><tbody><tr><th scope="row">Ebe</th><td>Çay, temiz bez, dua düğümleri ve tanık imzası</td><td>Adı hesabın yanında kalır</td></tr><tr><th scope="row">Meral</th><td>Yazıcıyı boş etiketin yanında tutar</td><td>İş yüküne ilişkin talebi imzasız kalır</td></tr><tr><th scope="row">Masa görevlisi</th><td>Açıklama yapar; güçlük çizelgesini basar</td><td>Ekran, dolu yatak için kabul kaydı ister</td></tr><tr><th scope="row">Kayıt</th><td>Beşik, sıcaklık ve okuma sağlanır</td><td>Bekleme süresinin kullanıldığı dosyada kalır</td></tr></tbody></table></div><p class="reading">Bakım, maddi yardım ve kayıt sağlar; iş yükünü ya da dosyadaki kalıcı notu ortadan kaldırmaz.</p></figure>
<figure id="figure-9"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-009.svg"><img alt="009. Çocukta bir kelime; hesapta bir ad" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-009.svg" width="842"/></a><figcaption>009. Çocukta bir kelime; hesapta bir ad</figcaption><p>İki eylem birbirine yakın gerçekleşir ama aynı işleme dönüşmez.</p><div aria-label="Tablo: 009. Çocukta bir kelime; hesapta bir ad" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Çocuğa verilen kelime</th><th scope="col">Hesaba girilen ad</th></tr></thead><tbody><tr><th scope="row">Söyleniş</th><td>Kulağına iki kez söylenir</td><td>Ebenin bilmediği kısa bir ad</td></tr><tr><th scope="row">Annenin ayrımı</th><td>Sonrası için ayrılmıştır</td><td>Yazılmasını ister</td></tr><tr><th scope="row">O anki sonuç</th><td>Kelime ondadır; karşılığında kimseye ödeme yapılmamıştır</td><td>Hesap açılır; etiket ayak bileğine kapanır</td></tr><tr><th scope="row">Süren kayıt</th><td>Bu kelimeye ait bir kayıt gösterilmez</td><td>Kayıt zamanı onunla birlikte gider</td></tr></tbody></table></div><p class="reading">Metin özel kelimeyi kayıtlı addan ayırır; kelimenin hiçbir zaman kayda geçirilemeyeceğini kesinleştirmez.</p></figure>
