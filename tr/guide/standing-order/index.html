<figure id="figure-70"><a aria-label="Şekli büyüt: 070. Bir referans yön değiştirir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-070.svg"><img alt="070. Bir referans yön değiştirir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-070.svg" width="842"/></a><figcaption>070. Bir referans yön değiştirir</figcaption><p>Talebin referansını ödemelerde ve ödeyen alanında izleyin.</p><dl><dt>Sorgulama</dt><dd>Ödemelerin yetki belgesi gelmeden hesabı devretmeyi reddeder.</dd><dt>O gece</dt><dd>Kira, annesinin odası ve kazan borçları talebin referansıyla kapanır.</dd><dt>Ertesi sabah</dt><dd>Teşekkür gelir; yetki belgesi gelmez.</dd><dt>Yeni kaynak satırı</dt><dd>Ödeyen olarak tam adı belirir.</dd><dt>Sonraki geçiş</dt><dd>Son maaşından bir geçiş ücreti çıkar.</dd></dl><p class="reading">İstenen yetki belgesi hiç gelmeden borçlar kapanır.</p></figure>
<figure id="figure-71"><a aria-label="Şekli büyüt: 071. İki birim, açık kalan bir talep" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-071.svg"><img alt="071. İki birim, açık kalan bir talep" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-071.svg" width="842"/></a><figcaption>071. İki birim, açık kalan bir talep</figcaption><p>Usule ilişkin bağlar; talimatı gizlice kimin yönettiğini göstermez.</p><dl><dt>Talebinin referansı</dt><dd>Yetki belgesi hâlâ eksiktir</dd><dt>Hesaplar</dt><dd>Alacakları teyit eder; eski talimatı konuşmaz</dd><dt>Sorgulamalar</dt><dd>Yetki belgesini ister; parayı konuşmaz</dd><dt>İki cevap</dt><dd>Her birim ötekinin cevabını saklamasını söyler</dd></dl><h4>İlişkiler</h4><ul><li>Hesaplar → Talebinin referansı: referanslı alacakları teyit</li><li>Sorgulamalar → Talebinin referansı: kanıtsız kapatamaz</li><li>Hesaplar → İki cevap: Sorgulamaların cevabını tut</li><li>Sorgulamalar → İki cevap: Hesapların cevabını tut</li></ul><p class="reading">Her birim onu, ötekinin konuşmayı reddettiği kanıta yöneltir.</p></figure>
<figure id="figure-72"><a aria-label="Şekli büyüt: 072. Ödeyenin adı sığar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-072.svg"><img alt="072. Ödeyenin adı sığar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-072.svg" width="842"/></a><figcaption>072. Ödeyenin adı sığar</figcaption><p>Devir anlatı sırasıyla ilerler; bilerek verilmiş onay gösterilmez.</p><dl><dt>Ödeyen alanında yeni ad</dt><dd>Yerine gelen kadın bu iş için başka bir işten ayrılmıştır.</dd><dt>Kimin geçiş ücreti olduğu sorulur</dt><dd>Cevap, hep burada olduğudur.</dd><dt>Parmakla gösterilen imza</dt><dd>Yaşça büyük kadın sayfayı sabit tutar.</dd><dt>Anahtar el değiştirir</dt><dd>Mürekkebin kurumasını bekler.</dd><dt>Çan çalar</dt><dd>Bir geçiş ücreti çıkar; yaşça büyük kadının bakiyesi değişmez.</dd></dl><h4>İlişkiler</h4><ul><li>Ödeyen alanında yeni ad → Kimin geçiş ücreti olduğu sorulur: sonra</li><li>Kimin geçiş ücreti olduğu sorulur → Parmakla gösterilen imza: sonra</li><li>Parmakla gösterilen imza → Anahtar el değiştirir: sonra</li><li>Anahtar el değiştirir → Çan çalar: sonra</li></ul><p class="reading">Devirden sonra bakiyesi değişmez. Yeni kadının neyi anladığı gösterilmez.</p></figure>
