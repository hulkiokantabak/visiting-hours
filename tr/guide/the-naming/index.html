<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İsim Koyma · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-naming/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-naming/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-naming/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-naming/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-56"><h1>56. İsim Koyma</h1>
<figure id="figure-166"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-166.svg"><img alt="166. Denenen, değiştirilen, reddedilen isimler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-166.svg" width="842"/></a><figcaption>166. Denenen, değiştirilen, reddedilen isimler</figcaption><p>Örnekler, doğrulanmış hayatları değil, bu sesin girişimlerini izler.</p><div aria-label="Tablo: 166. Denenen, değiştirilen, reddedilen isimler" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Yaklaşılan kişi</th><th scope="col">Denenen isim ya da tanımlar</th><th scope="col">Parçanın bıraktığı yer</th></tr></thead><tbody><tr><th scope="row">Sekizinci mumdan önceki çocuk</th><td>Emin / Tomas / Aron</td><td>Onu o mumdan önce bırak</td></tr><tr><th scope="row">Üçüncü yataktaki anne</th><td>Nadia / Roza / üçüncü yatak / Halide</td><td>Harcanmamış kelime çocukta kalır</td></tr><tr><th scope="row">Defterli kadın</th><td>Dora / Sabine / Dora</td><td>İmza çizgisinin yanındaki parmak</td></tr><tr><th scope="row">Sandalye taşıyan adam</th><td>Marek / Selim / hiçbir şey</td><td>Kapıların ardından iyi geceler demesine izin ver</td></tr></tbody></table></div><p class="reading">Her satırın ima ettiği oklar, isim koyan sesin düzeltmeleridir; öteki öykülerdeki kişilerin isimlerini değiştirmez.</p></figure>
<figure id="figure-167"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-167.svg"><img alt="167. Bir isim, konumu belirleyemez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-167.svg" width="842"/></a><figcaption>167. Bir isim, konumu belirleyemez</figcaption><p>Zaten isimli kişiler ile belirsiz kimlikler, düzgün dosyalanmaya direnir.</p><div aria-label="Tablo: 167. Bir isim, konumu belirleyemez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">İsim koyan sesin elindeki</th><th scope="col">Varamayacağı sonuç</th></tr></thead><tbody><tr><th scope="row">Rauf ve Lida</th><td>Zaten mevcut isimler</td><td>İsim koymak yaralı bedenin yerini almaz</td></tr><tr><th scope="row">Suna</th><td>Taşıyıcıyı almak ve geri getirmek için tek isim</td><td>Onu ahlaki ayrımın yalnız bir yanına koyamaz</td></tr><tr><th scope="row">Dul</th><td>İki başka kadının olası yankıları</td><td>Üç kadın ya da bir; ne dosyada ne seste alan vardır</td></tr><tr><th scope="row">R-73</th><td>Beş kez yanıt verilen bir tanım</td><td>Fişe yanıt vermek, kesinleşmiş bir kişi adı değildir</td></tr></tbody></table></div><p class="reading">Sayfanın iki yanı, farklı Sunalar değil, ahlaki bir ayrım olarak okunabilir. Dulun üç ya da bir olma ihtimali açık kalır.</p></figure>
<figure id="figure-168"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-168.svg"><img alt="168. İsim koymayı bırakmanın farklı nedenleri" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-168.svg" width="842"/></a><figcaption>168. İsim koymayı bırakmanın farklı nedenleri</figcaption><p>Ret, mahremiyet ve başarısızlık aynı sınır değildir.</p><dl><dt>Bitmemiş isim koyma sayfası</dt><dd>İsim koymaya başlanırken olduğundan daha çok insan vardır, ama sayfa uzamamıştır.</dd><dt>Sekreter</dt><dd>Ses, onun şakasını açığa vurmayı reddeder.</dd><dt>İsimsiz bırakılan iki kişi</dt><dd>Yazılmaktan bıkmışlardır.</dd><dt>Ferit</dt><dd>Kolay isim çizilir; çizilen yer okunaklı bırakılır.</dd><dt>Kedi</dt><dd>Dört girişim; ses, bağlanacak hiçbir şey bulamaz.</dd></dl><h4>İlişkiler</h4><ul><li>Bitmemiş isim koyma sayfası → Sekreter: saklı tutar</li><li>Bitmemiş isim koyma sayfası → İsimsiz bırakılan iki kişi: isimsiz bırakır</li><li>Bitmemiş isim koyma sayfası → Ferit: kendi reddini kaydeder</li><li>Bitmemiş isim koyma sayfası → Kedi: tamamlayamaz</li></ul><p class="reading">Bunlar bu sayfada gerçekleşen sınırlardır; her kayıttan ya da ücretten garantili bir bağışıklık değildir.</p></figure>
