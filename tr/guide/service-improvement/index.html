<figure id="figure-157"><a aria-label="Şekli büyüt: 157. Dinleme saatinin yanındaki kayıt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-157.svg"><img alt="157. Dinleme saatinin yanındaki kayıt" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-157.svg" width="842"/></a><figcaption>157. Dinleme saatinin yanındaki kayıt</figcaption><p>Saatler öyküden alınmıştır; kayıt iddiaları uzlaştırılmaz.</p><dl><dt>02:58</dt><dd>Akşam çizelgesi sonuna kadar okunur.</dd><dt>03:00</dt><dd>Planlı kesinti başlar.</dd><dt>03:41</dt><dd>Bir ses satırında çizgi vardır.</dd><dt>04:01</dt><dd>Hizmet döner; bütünlük temizdir; saatte hiç kayıt olmadığı söylenir.</dd><dt>04:02</dt><dd>Ses, saati dördü bir geçiyor diye verir.</dd><dt>05:14</dt><dd>Meral, açık kapı bildirimiyle Yedi'nin kapısına gelir.</dd></dl><p class="reading">03:41'deki çizgi, kayıt olmadığı iddiasının yanında görünür bir satırdır; ne söylendiğini açığa çıkarmaz.</p></figure>
<figure id="figure-158"><a aria-label="Şekli büyüt: 158. Yaşanan ve kopyası verilebilen" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-158.svg"><img alt="158. Yaşanan ve kopyası verilebilen" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-158.svg" width="842"/></a><figcaption>158. Yaşanan ve kopyası verilebilen</figcaption><p>Saklanan ifadeler, erişilebilir resmî kopyalar anlamına gelmez.</p><div aria-label="Tablo: 158. Yaşanan ve kopyası verilebilen" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Sakinlerin anlatıları</th><th scope="col">İdari işlem</th></tr></thead><tbody><tr><th scope="row">Numaralanan sesler</th><td>Bir, İki, Üç, Beş, Altı, Yedi</td><td>Dört numaralı ifade basılmamıştır</td></tr><tr><th scope="row">Yaşanan</th><td>Dokunuş, soğuk, belki şarkı, açılma, karanlık ve belirsiz kutular</td><td>Kayıtlı olay yoktur; olaylar kayıt gerektirir</td></tr><tr><th scope="row">Kopyalar</th><td>Üç sakin kendi ifadesini ister</td><td>Sahiplik kabul edilir; verme usulü yoktur</td></tr><tr><th scope="row">Bellek</th><td>O saat farklı hatırlanır</td><td>Yeni kesinti yoktur; saat emsal oluşturmaz</td></tr></tbody></table></div><p class="reading">Dört numaralı ifadenin yokluğu açıklanmaz. Numaradaki boşluk, belirli bir kayıp kişinin kanıtı değildir.</p></figure>
<figure id="figure-159"><a aria-label="Şekli büyüt: 159. Kim okur, kim karar verir, kim düzeltir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-159.svg"><img alt="159. Kim okur, kim karar verir, kim düzeltir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-159.svg" width="842"/></a><figcaption>159. Kim okur, kim karar verir, kim düzeltir</figcaption><p>Bakım ve özel kayıt, siyasi yaprağın açık bıraktığı somut ihtiyaçlara yanıt verir.</p><dl><dt>Kesintinin ardından</dt><dd>Okunmaya ve o saatin bir anlatısına ihtiyaç sürer.</dd><dt>Meral ve Yedi</dt><dd>İkisi arasında seçim yapmadan iki etiketi yeniden okur.</dd><dt>İki kapı bildirimi</dt><dd>Biri kapıların açık kalmasını, diğeri kapanmasını ister.</dd><dt>Siyasi yaprak</dt><dd>Saate prova der; kenarda kutuları kimin okuyacağı sorulur.</dd><dt>İki sakin</dt><dd>Biri diğerinin anlatısını yazar; anlatan bir kelimeyi değiştirir.</dd></dl><h4>İlişkiler</h4><ul><li>İki kapı bildirimi → Meral ve Yedi: çatışan talimatlar</li><li>Meral ve Yedi → Kesintinin ardından: karar vermeden okuma</li><li>Siyasi yaprak → Kesintinin ardından: bir yorum önerir (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>İki sakin → Kesintinin ardından: düzeltilmiş kopya oluşturur</li></ul><p class="reading">Özel kopyayı konuşan kişi düzeltir; her sakinin anlatısını koruyacağı garanti değildir.</p></figure>
