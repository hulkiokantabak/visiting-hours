<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuyu · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-well/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-well/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-well/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-well/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-55"><h1>55. Kuyu</h1>
<figure id="figure-163"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-163.svg"><img alt="163. İstemek, farklı ölçeklerde" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-163.svg" width="842"/></a><figcaption>163. İstemek, farklı ölçeklerde</figcaption><p>Öykünün kimseye atfetmediği dilekler için olası bir gruplama.</p><div aria-label="Tablo: 163. İstemek, farklı ölçeklerde" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kapsam</th><th scope="col">Örnekler</th><th scope="col">Dileğin açık bıraktığı</th></tr></thead><tbody><tr><th scope="row">Sıradan bedensel yaşam</th><td>Diz, para, köpek ve küçük bir bahçe</td><td>Genel bir kuram olmadan rahatlama</td></tr><tr><th scope="row">Başka bir vesile</th><td>Sesli bir pazar; ilk film akşamı yeniden</td><td>Tekrar; ille de eski hâle dönüş değil</td></tr><tr><th scope="row">Karşılaşmayı denetlemek</th><td>Yeni bir soru; nefesin ait olduğu yerde olması</td><td>Bir şeyin nasıl olacağına kimin karar vereceği</td></tr><tr><th scope="row">Peşinden gitmeyi reddetmek</th><td>Tepeye tırmanmak yerine tepe için kalmak</td><td>Başkalarının farklı arzuları yanında bir yer</td></tr></tbody></table></div><p class="reading">Bunlar okuma kategorileridir; kimlikler ya da hangi arzunun gerçekleşmeyi hak ettiğine dair bir sıralama değildir.</p></figure>
<figure id="figure-164"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-164.svg"><img alt="164. Dilek sahipleri isimsiz, yankılar tanıdık" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-164.svg" width="842"/></a><figcaption>164. Dilek sahipleri isimsiz, yankılar tanıdık</figcaption><p>Güncel öyküler tanınır ifadeler sunar; konuşanları kesinleştirmez.</p><dl><dt>Kimseye atfedilmeyen dilekler</dt><dd>Kuyu, isim vermeden arzuları bir araya getirir.</dd><dt>43 - Dört Dakika</dt><dd>Teknenin hâlâ içinde olduğu eski bir akşam.</dd><dt>49 - Standart Yeminler</dt><dd>Cumartesinin uzatılmış formu.</dd><dt>54 - Son Kelime</dt><dd>Kabul edilen kelimeler arasındaki nefes.</dd><dt>53 - Hizmet İyileştirmesi</dt><dd>Kapıların açık olduğu saat üç.</dd></dl><h4>İlişkiler</h4><ul><li>Kimseye atfedilmeyen dilekler → 43 - Dört Dakika: filmin yankısı (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Kimseye atfedilmeyen dilekler → 49 - Standart Yeminler: törenin yankısı (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Kimseye atfedilmeyen dilekler → 54 - Son Kelime: kaydın yankısı (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Kimseye atfedilmeyen dilekler → 53 - Hizmet İyileştirmesi: saatin yankısı (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Ortak ayrıntılar tanımaya davet eder; dilek sahibinin önceki öykünün başkişisi olduğunu kanıtlamaz.</p></figure>
<figure id="figure-165"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-165.svg"><img alt="165. Kuyudan kayıt olarak çıkan" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-165.svg" width="842"/></a><figcaption>165. Kuyudan kayıt olarak çıkan</figcaption><p>Üç aylık dönem sonu işlemi, dilekleri kaydetmeden malzemeyi ayırır.</p><div aria-label="Tablo: 165. Kuyudan kayıt olarak çıkan" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Malzeme ya da içerik</th><th scope="col">İşlem</th><th scope="col">Kayıtlı sonuç</th></tr></thead><tbody><tr><th scope="row">Madeni paralar</th><td>Üç aylık dönem sonunda sayılır</td><td>Genel hesaba geri verilir</td></tr><tr><th scope="row">Sudan çıkan kâğıt</th><td>Para mı diye bakmak için kurutulur, sonra atılır</td><td>Korunmuş hiçbir dilek anlatılmaz</td></tr><tr><th scope="row">Dilekler</th><td>İşlemde hiçbir zaman istenmez</td><td>Kaydedilmez</td></tr></tbody></table></div><p class="reading">Madeni paralar genel hesaba girer; bu, dileklerin sunulduğu ya da yanıtlandığı anlamına gelmez.</p></figure>
