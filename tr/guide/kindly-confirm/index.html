<figure id="figure-64"><a aria-label="Şekli büyüt: 064. İki perşembe, farklı sonuçlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-064.svg"><img alt="064. İki perşembe, farklı sonuçlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-064.svg" width="842"/></a><figcaption>064. İki perşembe, farklı sonuçlar</figcaption><p>Kayıt ve anneler anlatı sırasıyla taktik değiştirir.</p><dl><dt>İlk perşembe</dt><dd>Değiştirilen kırk dosya kırk yenileme üretir; fatura çıkmaz.</dd><dt>Hafta sonu</dt><dd>Kayıt kendini düzeltir.</dd><dt>Pazartesi</dt><dd>Saklanan çıktılar perşembeyle değil, dosyalarla uyuşur.</dd><dt>Yeni form</dt><dd>İkinci imza kutusu bir teyit şartı daha getirir.</dd><dt>İkinci perşembe</dt><dd>Kız kardeşler katılır; ayakkabı kapıyı tutar, sıra makinesi eşiği aşar.</dd></dl><p class="reading">İkinci protesto eylemi sürdürür; sonucu bildirilmez.</p></figure>
<figure id="figure-65"><a aria-label="Şekli büyüt: 065. Bir salon, iki tür düzeltme" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-065.svg"><img alt="065. Bir salon, iki tür düzeltme" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-065.svg" width="842"/></a><figcaption>065. Bir salon, iki tür düzeltme</figcaption><p>Salonun çözebildiğiyle annenin çözemediğini karşılaştırın.</p><div aria-label="Tablo: 065. Bir salon, iki tür düzeltme" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Çifte ödeme</th><th scope="col">Oğlunun kimliği</th></tr></thead><tbody><tr><th scope="row">Kanıt</th><td>Nisanda iki kez alınan ödeme</td><td>Fotoğraflarda kaştaki aynı çentik</td></tr><tr><th scope="row">İlk adım</th><td>Anne sormadan iade edilir</td><td>Anne bütün fotoğrafları getirir</td></tr><tr><th scope="row">Ekranın cevabı</th><td>İade fişi basar</td><td>Annenin kanıtını reddeder</td></tr><tr><th scope="row">Açık kalan</th><td>İade fişi kuyruğa gösterilir</td><td>Okulda isim hâlâ okunur; biri cevap verir</td></tr></tbody></table></div><p class="reading">İade gerçektir. Çocuğun duraklatılmış yenilemesini ne açıklar ne de ortadan kaldırır.</p></figure>
<figure id="figure-66"><a aria-label="Şekli büyüt: 066. Maliyete kim ad koyar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-066.svg"><img alt="066. Maliyete kim ad koyar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-066.svg" width="842"/></a><figcaption>066. Maliyete kim ad koyar</figcaption><p>Eylem hakkındaki sözler, bu sözlere direnen eylemlerin yanına konur.</p><div aria-label="Tablo: 066. Maliyete kim ad koyar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kim ya da hangi metin</th><th scope="col">Ne der ya da sunar</th><th scope="col">Anne ya da beden ne yapar</th></tr></thead><tbody><tr><th scope="row">Örgütleyen kadın</th><td>Her teyit için dört ek saniye</td><td>Anne dosyayı geri verirken bu sözü tekrarlar</td></tr><tr><th scope="row">Yeni rehber</th><td>Dosya değişimini ilk zafer sayar</td><td>Anne, taşıyana duraklatılmış satırı okutur</td></tr><tr><th scope="row">Rehberi taşıyan</th><td>Oğlunun dosyasını kopyalamak ister</td><td>Anne dosyayı kapatır</td></tr><tr><th scope="row">Eve gelen örgütleyici</th><td>Çocukla kalır</td><td>Anne yemek saatini söyler, yeni sıra numarası alır</td></tr><tr><th scope="row">İkinci perşembede nöbetçi</th><td>Girişi kapatmaya çalışır</td><td>Kapıyı tutan ayakkabıya basar</td></tr></tbody></table></div><p class="reading">Annenin dosyasını yayımlatmayı reddetmesiyle çocuk bakımını kabul etmesi ayrı seçimlerdir.</p></figure>
