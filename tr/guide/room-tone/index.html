<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oda Tonu · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/room-tone/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/room-tone/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/room-tone/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/room-tone/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-57"><h1>57. Oda Tonu</h1>
<figure id="figure-169"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-169.svg"><img alt="169. Bağlanacak bir şey bulamayan ilgi" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-169.svg" width="842"/></a><figcaption>169. Bağlanacak bir şey bulamayan ilgi</figcaption><p>Edinme ve kaydetme girişimleri farklı biçimlerde başarısız olur.</p><div aria-label="Tablo: 169. Bağlanacak bir şey bulamayan ilgi" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Girişim ya da beklenen dayanak</th><th scope="col">Öykünün sunduğu</th></tr></thead><tbody><tr><th scope="row">Kimlik ve ruhsat</th><td>Doğum kaydı, ruhsat, devam planı</td><td>Hiçbiri bulunmaz</td></tr><tr><th scope="row">Yinelenen hak</th><td>Yenileme tarihi ya da paylaştırılan numune</td><td>Hiçbiri bulunmaz</td></tr><tr><th scope="row">Envanter</th><td>Adamlar pazarı kalem kalem yazar</td><td>Getirdikleri listeyle giderler</td></tr><tr><th scope="row">Telefon kaydı</th><td>Yeniden çalmada çevre korunur</td><td>Kedinin sesi oda tonudur</td></tr></tbody></table></div><p class="reading">Kedi, dinleyenler yoluyla hâlâ savunmasız bırakılabilir; bu başarısızlıklar herkesi erişilmez kılmaz.</p></figure>
<figure id="figure-170"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-170.svg"><img alt="170. Baskı, dinleyenlere ulaşır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-170.svg" width="842"/></a><figcaption>170. Baskı, dinleyenlere ulaşır</figcaption><p>Cezalardan farklı bir dinleyici kitlesine uzanan anlatı sırası.</p><dl><dt>Dinlemeye ceza</dt><dd>Belirtilen kategori, ruhsatsız konuşmadır.</dd><dt>Tezgâhlar sırt döner</dt><dd>Dinleyenler bir ay boyunca balıklarına döner.</dd><dt>Görünen kaburgalar</dt><dd>Kedinin bedeni zayıflar.</dd><dt>Çocuklar dinler</dt><dd>Bu dinlemeye ceza kesilemez.</dd><dt>Bir kız öğrenir</dt><dd>Kedi, kızdan ücret karşılığı olmayan hatırlamayı öğrenmesini ister.</dd></dl><h4>İlişkiler</h4><ul><li>Dinlemeye ceza → Tezgâhlar sırt döner: dinleyenler çekilir</li><li>Tezgâhlar sırt döner → Görünen kaburgalar: bedensel maliyet görünür</li><li>Görünen kaburgalar → Çocuklar dinler: başka bir dinleyici kitlesi</li><li>Çocuklar dinler → Bir kız öğrenir: bir söz emanet edilir</li></ul><p class="reading">Çocuklara onu dinledikleri için ceza kesilemez. Muafiyet, öteki bütün ücretler hakkında bir şey söylemez.</p></figure>
<figure id="figure-171"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-171.svg"><img alt="171. Kayıt çalmadan taşınan ses" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-171.svg" width="842"/></a><figcaption>171. Kayıt çalmadan taşınan ses</figcaption><p>İnsanların tekrarı, telefonların geri getiremediğini taşır.</p><dl><dt>Kedinin sözlü belleği</dt><dd>Telefona kaydedilen sesi yoktur.</dd><dt>Buzcunun dul eşi</dt><dd>Dokuz kış öncesinin cümlesini, tonuyla birlikte alır.</dd><dt>Pazar</dt><dd>Sözleri ezberler ve tekrarlar.</dd><dt>Getir götürcü çocuklar</dt><dd>Sözleri daha uzağa taşır.</dd><dt>Merdivendeki kız</dt><dd>Sözleri suya söyler; günde bir tane.</dd><dt>Ayrılış kaydı</dt><dd>Kameralar, gidişini hava durumu diye dosyalar.</dd></dl><h4>İlişkiler</h4><ul><li>Kedinin sözlü belleği → Buzcunun dul eşi: hatırlanan sözü geri verir</li><li>Kedinin sözlü belleği → Pazar: ağızdan hatırlanır</li><li>Pazar → Getir götürcü çocuklar: sözler yol alır</li><li>Kedinin sözlü belleği → Merdivendeki kız: öğrenmesini ister</li><li>Kedinin sözlü belleği → Ayrılış kaydı: başka kategoride dosyalanır</li></ul><p class="reading">Kedinin kelimeler için ne ödediği açıklanmaz. Ayrılması, tepedeki başka bir kedinin kimliğini kesinleştirmez.</p></figure>
