<figure id="figure-133"><a aria-label="Şekli büyüt: 133. Son kaydın koruduğu" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-133.svg"><img alt="133. Son kaydın koruduğu" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-133.svg" width="842"/></a><figcaption>133. Son kaydın koruduğu</figcaption><p>Kadının beden hafızası, inme sonrası kayıtla uyuşmaz.</p><div aria-label="Tablo: 133. Son kaydın koruduğu" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Diskteki kayıt</th><th scope="col">Kadın dinlerken</th></tr></thead><tbody><tr><th scope="row">Konuşma</th><td>İnmeden sonra akıcı okuma</td><td>Ağzı, kayıtta olmayan tökezlemeyi tamamlar</td></tr><tr><th scope="row">Araya giren sözler</th><td>Kitap dışından iki söz</td><td>Diski iki kez dinler</td></tr><tr><th scope="row">Ailenin bildiği</th><td>Kataloglanmış maldaki bir ses</td><td>Kardeşlerine dinletmez</td></tr></tbody></table></div><p class="reading">Fark gözlenir; kusursuz okumanın kaynağı açıklığa kavuşmaz.</p></figure>
<figure id="figure-134"><a aria-label="Şekli büyüt: 134. Yok edildikten sonra süren hak iddiası" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-134.svg"><img alt="134. Yok edildikten sonra süren hak iddiası" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-134.svg" width="842"/></a><figcaption>134. Yok edildikten sonra süren hak iddiası</figcaption><p>Tepkiler anlatım sırasıyla gösterilir; tarihli bir neden zinciri oluşturmaz.</p><dl><dt>Satıştan önceki gece</dt><dd>Kardeşler diskleri yakar.</dd><dt>Satış sabahı</dt><dd>31. lot geri çekilir; ardından geri çekme bedeli gelir.</dd><dt>Hafta içinde</dt><dd>Fotoğrafçı, kadının kaldırdığı parmağı da çeker.</dd><dt>Bir hafta sonra</dt><dd>Bir müşteri, kalıntı için taban fiyatın tamamını teklif eder.</dd><dt>Yenileme işaretlenir</dt><dd>Ağabeyin sonbahar yenilemesi inceleme için işaretlenir; gerekçe yoktur.</dd><dt>Yazın gelen mektup</dt><dd>Teklif sürer; kadın külü fasulye sırasına karıştırmıştır.</dd></dl><p class="reading">Ağabeyin incelemesi için gerekçe verilmez. Zaman sırası tek başına misillemeyi kanıtlamaz.</p></figure>
<figure id="figure-135"><a aria-label="Şekli büyüt: 135. Bir mirasın üç hâli" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-135.svg"><img alt="135. Bir mirasın üç hâli" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-135.svg" width="842"/></a><figcaption>135. Bir mirasın üç hâli</figcaption><p>Yok etme, gizleme ve toprağa karıştırma farklı sonuçlar doğurur.</p><div aria-label="Tablo: 135. Bir mirasın üç hâli" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Malzeme</th><th scope="col">Ailenin yaptığı</th><th scope="col">Kalan</th></tr></thead><tbody><tr><th scope="row">Ses diskleri</th><td>Tek tek yakılır</td><td>Disklerden yapılabilecek olan artık yapılamaz; kalıntı üzerindeki hak iddiası sürer</td></tr><tr><th scope="row">Kül</th><td>Fasulye sırasına karıştırılır</td><td>Taban fiyat üzerinden teklif açık kalır</td></tr><tr><th scope="row">Kâğıt albümler</th><td>Kızın yatağının altında gizlenir</td><td>Bu kataloğa alınmamıştır</td></tr><tr><th scope="row">Fasulyeler</th><td>Külle işlenen toprakta büyür</td><td>Büyümeleri teklifi kapatmaz</td></tr></tbody></table></div><p class="reading">Kataloglanmamış olmak, özünde fiyatlandırılamaz ya da her hak iddiasının dışında olmak değildir.</p></figure>
