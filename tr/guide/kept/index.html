<figure id="figure-16"><a aria-label="Şekli büyüt: 016. Okuruna doğru yazılan bir günlük" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-016.svg"><img alt="016. Okuruna doğru yazılan bir günlük" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-016.svg" width="842"/></a><figcaption>016. Okuruna doğru yazılan bir günlük</figcaption><p>Sunuldukları sırayla seçilmiş anlar; aralarına hafta sayıları eklenmemiştir.</p><dl><dt>Cuma</dt><dd>E. günlüğü açar; günlük yazarı o günün yazısını kısa tutar.</dd><dt>Daha sonraki salı</dt><dd>Altı çizilen yerler başlar; günlük yazarı yazısını onlara yöneltir.</dd><dt>Cumartesi</dt><dd>Mahrem bir anıya uzun bir bölüm ayrılır.</dd><dt>Çarşamba</dt><dd>Günlük yazarı dördüncü kez sayfaların eksildiğini bildirir.</dd><dt>Son pazar</dt><dd>E. altını çizmeden okur; günlük yazarı yazısını kısa tutar.</dd></dl><p class="reading">Günlük, E.'nin okumasına tepki verir; bu, kimin devam ettirildiğini ya da eksik sayfaları kimin denetlediğini belirlemez.</p></figure>
<figure id="figure-17"><a aria-label="Şekli büyüt: 017. Takvimin söylediği, sakladığından azdır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-017.svg"><img alt="017. Takvimin söylediği, sakladığından azdır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-017.svg" width="842"/></a><figcaption>017. Takvimin söylediği, sakladığından azdır</figcaption><p>Verilen tarihler ve işaretler, tarihini belirleyemedikleri şeylerle karşılaştırılır.</p><div aria-label="Tablo: 017. Takvimin söylediği, sakladığından azdır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Görünen işaret</th><th scope="col">Ortaya koyduğu</th><th scope="col">Ortaya koymadığı</th></tr></thead><tbody><tr><th scope="row">Yinelenen perşembe</th><td>Yenileme günlükte tekrar eder</td><td>Numaralı, kesintisiz bir hafta dizisi</td></tr><tr><th scope="row">Haziranın ikinci haftası</th><td>Planlanan ziyaret gerçekleşir</td><td>Önceki her günlük yazısının tarihi</td></tr><tr><th scope="row">Tireyle başlayan iki bölüm</th><td>Metin sürmekte olan bir cümleden devam eder</td><td>Tarihleri ayrı ayrı belirlenmiş iki silme</td></tr><tr><th scope="row">Bildirilen dördüncü olay</th><td>Günlük yazarı sayfaların yine eksik olduğunu bildirir</td><td>Çıkarılan her sayfanın içeriği</td></tr></tbody></table></div><p class="reading">Güvenilir bir hafta sayısı yoktur. Cümle ortasında başlayan bölümler, her eksiltmenin tarihini ya da nedenini kanıtlamadan boşlukları görünür kılar.</p></figure>
<figure id="figure-18"><a aria-label="Şekli büyüt: 018. Okuma, izin ve kapalı kapak" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-018.svg"><img alt="018. Okuma, izin ve kapalı kapak" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-018.svg" width="842"/></a><figcaption>018. Okuma, izin ve kapalı kapak</figcaption><p>Günlüğün belirtilen dolaşımı, yazıların aradığı yakınlıktan farklıdır.</p><div aria-label="Tablo: 018. Okuma, izin ve kapalı kapak" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Mahrem kullanım</th><th scope="col">Hizmet izni ya da yapılmayan eylem</th></tr></thead><tbody><tr><th scope="row">Altını çizme</th><td>E. ekmeği, martıları ve yakayı işaretler</td><td>Günlük yazarı sonraki yazılarını bu işaretlere yöneltir</td></tr><tr><th scope="row">Günlük</th><td>Kadının bedenine ilişkin kesin anılar sayfada kalır</td><td>Yazılar hizmet iyileştirmesi için özetlenebilir</td></tr><tr><th scope="row">Dolaşım</th><td>E. defteri okur</td><td>Toplu içerik karşı tarafa ulaşabilir</td></tr><tr><th scope="row">Göl kıyısında</th><td>Günlük yazarı, E.’nin fotoğrafını çekmeyerek sabahı korur</td><td>Fotoğraf çekmeyi reddetmesi de yazıya geçer</td></tr><tr><th scope="row">Kapalı kapak</th><td>Kadının avucu defteri kapalı tutar</td><td>Bu hareketin anlatısı defterin içinde kalır</td></tr></tbody></table></div><p class="reading">Bildirim, özetlemeye ve toplu bilgi paylaşımına izin verir. Belirli bir eksik sayfanın bu izne dayanılarak çıkarıldığını kanıtlamaz.</p></figure>
