<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seneye · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/next-year/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/next-year/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/next-year/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/next-year/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-31"><h1>31. Seneye</h1>
<figure id="figure-91"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-091.svg"><img alt="091. İki getiren, geriye kalan iki jest" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-091.svg" width="842"/></a><figcaption>091. İki getiren, geriye kalan iki jest</figcaption><p>Kart da yapılmış el de onlardan ayrılmaya yönelik yinelenen başarısız denemelerden sonra gelir.</p><div aria-label="Tablo: 091. İki getiren, geriye kalan iki jest" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Yenileme kartlı kadın</th><th scope="col">Yapılmış eli getiren adam</th></tr></thead><tbody><tr><th scope="row">Masadan önce</th><td>Dört iptal ve dört yeniden yürürlüğe koyma</td><td>Eli iki kez çöp kutularından eve taşır</td></tr><tr><th scope="row">İstek veya yük</th><td>Yok edilmesini değil, kaybolmasını ister</td><td>Eli bir gömleğe sarıp getirir</td></tr><tr><th scope="row">Numaradan sonra</th><td>Elleri kartın biçimini korur</td><td>Nefesi değişir</td></tr><tr><th scope="row">Nereye gitti sorusu</th><td>Nereye gittiğini sorar</td><td>Sormaz</td></tr></tbody></table></div><p class="reading">İstekler ve rahatlama somuttur; iki nesnenin de nereye gittiği belirlenmez.</p></figure>
<figure id="figure-92"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-092.svg"><img alt="092. Ücretler ve içinde tuttuğu kelimeler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-092.svg" width="842"/></a><figcaption>092. Ücretler ve içinde tuttuğu kelimeler</figcaption><p>Belirtilen ödeme koşullarını sihirbazın biriktirdiği kelimelerden ayırın.</p><div aria-label="Tablo: 092. Ücretler ve içinde tuttuğu kelimeler" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">İfade</th><th scope="col">Miktar veya ilişki</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Kadının ödemesi</th><td>Yeniden yürürlük bedelinden az</td><td>Madeni para miktarı veya para birimi belirtilmez</td></tr><tr><th scope="row">Adama yapılan numara sonrası istek</th><td>Açıkça söylenen bir kelime</td><td>Belirli bir alışveriş gösterilir</td></tr><tr><th scope="row">Sihirbazın içindeki kelimeler</th><td>Kendisine ait olmayan 140 kelime</td><td>Hepsini nasıl edindiğinin geçmişi verilmez</td></tr><tr><th scope="row">Kadının kelimesi</th><td>Onu yük taşıyıcı olarak hisseder</td><td>Bu onun bedensel algısıdır</td></tr></tbody></table></div><p class="reading">Kadının ödemesi madeni parayla ifade edilmez. Tek bir istek evrensel bir tarife oluşturmaz.</p></figure>
<figure id="figure-93"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-093.svg"><img alt="093. Nesneler kaybolur; bir kelime saklanır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-093.svg" width="842"/></a><figcaption>093. Nesneler kaybolur; bir kelime saklanır</figcaption><p>Katlanır masadaki ilişkiler; görülmeyen bir varış noktasına güzergâh çizilmez.</p><dl><dt>Sihirbaz</dt><dd>İki nesneye de dokunmadan numaraları yapar</dd><dt>Yenileme kartı</dt><dd>Kadının elleri onu çevreleyen biçimde kalır</dd><dt>Yapılmış el</dt><dd>Adam nereye gittiğini sormaz</dd><dt>Kadının kelimesi</dt><dd>İçinde hissettiği kelimelerin arasındadır</dd><dt>Masanın arkası</dt><dd>Çekmece yoktur</dd></dl><h4>İlişkiler</h4><ul><li>Yenileme kartı → Sihirbaz: Kaybetme numarası yapılır</li><li>Yapılmış el → Sihirbaz: Kaybetme numarası yapılır</li><li>Kadının kelimesi → Sihirbaz: İçinde tutulur</li><li>Sihirbaz → Masanın arkası: Orada saklandığı gösterilmez (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Çekmecenin yokluğu sıradan bir açıklamayı eler; yöntemi açığa çıkarmaz.</p></figure>
