			<text x="74" y="45" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,90) scale(1,-1)">&quot;Ben kayıt değilim. Ben refakatim.&quot;</text>
			<text x="20" y="22" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,44) scale(1,-1)">ALTMIŞ HİKÂYEDE İLK KEZ BİR MAKİNE YANILIYOR, BUNU BİLİYOR VE YANLIŞ KALMASINA İZİN VERİLİYOR.</text>
		</g>
	</g>
