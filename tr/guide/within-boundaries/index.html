<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sınırlar İçinde · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/within-boundaries/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/within-boundaries/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/within-boundaries/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/within-boundaries/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-37"><h1>37. Sınırlar İçinde</h1>
<figure id="figure-109"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-109.svg"><img alt="109. Düzeltmeden bıraktığı bir özür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-109.svg" width="842"/></a><figcaption>109. Düzeltmeden bıraktığı bir özür</figcaption><p>İlk çay anlaşmazlığı, hatırladıklarıyla kadının inanmasına izin verdiklerini ayırır.</p><div aria-label="Tablo: 109. Düzeltmeden bıraktığı bir özür" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Söylediği veya izin verdiği</th><th scope="col">Anlatının sunduğu</th></tr></thead><tbody><tr><th scope="row">İlk inkâr</th><td>Ayın on birinde öteki çayı içtiğini söyler</td><td>Kadın iki gelişinde de isli çay içtiğini söyler</td></tr><tr><th scope="row">Özür</th><td>Kadının özrünü düzeltmeden bırakır</td><td>Konuşurken çayın soğuduğunu hatırlar</td></tr><tr><th scope="row">Sonraki soru</th><td>Bunu daha önce sorduğunu belirtir</td><td>Kadın konunun ucunu kaçırdığını söyler</td></tr></tbody></table></div><p class="reading">Sonradan yinelenen soru başka bir olaydır; ilk inkârını doğru kılmaz.</p></figure>
<figure id="figure-110"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-110.svg"><img alt="110. On sunulur, dört kullanılır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-110.svg" width="842"/></a><figcaption>110. On sunulur, dört kullanılır</figcaption><p>Dokunuş teklif edilir, kabul edilir ve belirtilen sayım bitmeden durdurulur.</p><dl><dt>Teklif</dt><dd>Ona kadar sayılacak, sonra durulacaktır.</dd><dt>Kabul</dt><dd>Başını sallar; el yerleşir, kasları gevşer.</dd><dt>Dörtte dur</dt><dd>Elini çekmesini ister; kadının eli masaya döner.</dd><dt>El çekildikten sonra</dt><dd>Kadın iki eli görünür halde bekler; adam dokunuşu geri ister.</dd><dt>Dile gelmeyen istek</dt><dd>Sıcaklığın kartta olduğunu öğrenir ama eli isteyemez.</dd></dl><p class="reading">Kadın hemen elini çeker. Adamın sormadan geri dönmesini istemesi, yeniden verilmiş izne dönüşmez.</p></figure>
<figure id="figure-111"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-111.svg"><img alt="111. Bir ret, bir makbuz ve yinelenen ses" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-111.svg" width="842"/></a><figcaption>111. Bir ret, bir makbuz ve yinelenen ses</figcaption><p>Gelecek haftaki teklifin ve masadan kalkınca süren sesin izini sürün.</p><div aria-label="Tablo: 111. Bir ret, bir makbuz ve yinelenen ses" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Yer veya an</th><th scope="col">Adamın eylemi</th><th scope="col">Ortamın verdiği karşılık</th></tr></thead><tbody><tr><th scope="row">Kırk dokuzuncu dakika</th><td>Gelecek hafta aynı masayı reddeder</td><td>Teklif, ücretli kırk dakikadan sonra gelir</td></tr><tr><th scope="row">Kart yuvası</th><td>Kartı verir, makbuzu cebine koyar</td><td>Makbuz gelecek hafta istendiğini söyler; yuva kadının sesini kullanır</td></tr><tr><th scope="row">Kapı</th><td>Mekândan ayrılır</td><td>Aynı ses teşekkür eder</td></tr><tr><th scope="row">Otobüs yolculuğu</th><td>Durağında elleri dizlerinde kalır</td><td>Otobüste ses yine duyulur; durağında kapılar kapanır</td></tr></tbody></table></div><p class="reading">Dokuz dakikalık fark hesaplanabilir; ücreti belirtilmez. Makbuz, gösterilen retle uyuşmaz.</p></figure>
