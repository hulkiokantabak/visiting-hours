<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dokuza Basın · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/press-nine/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/press-nine/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/press-nine/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/press-nine/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-44"><h1>44. Dokuza Basın</h1>
<figure id="figure-130"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-130.svg"><img alt="130. Gerçekte kullandığı seçenekler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-130.svg" width="842"/></a><figcaption>130. Gerçekte kullandığı seçenekler</figcaption><p>Aramadaki yolu ve yinelenen seçenek döngüsü.</p><dl><dt>3 - Arıza bildir</dt><dd>Geciken gülüş ruhsatlı profile uygundur.</dd><dt>0 - Biriyle konuş</dt><dd>Tutulan sıra, Kuyruktan ayrıldınız yanıtına dönüşür.</dd><dt>4 - Terekeler</dt><dd>Karşı taraf arama kabul etmez.</dd><dt>5 - İsmi söyle</dt><dd>İsim, yeni seçenekler açar.</dd><dt>2 - Sesi dinle</dt><dd>Örnek ilk kelimeden önce biter.</dd><dt>9 - Seçenekleri yinele</dt><dd>Aşınmış tuş onu menüye döndürür.</dd></dl><h4>İlişkiler</h4><ul><li>3 - Arıza bildir → 0 - Biriyle konuş: sonraki seçimi</li><li>0 - Biriyle konuş → 4 - Terekeler: sonraki seçimi</li><li>4 - Terekeler → 5 - İsmi söyle: sonraki seçimi</li><li>5 - İsmi söyle → 2 - Sesi dinle: örnek seçilir</li><li>2 - Sesi dinle → 9 - Seçenekleri yinele: seçenekler yinelenir</li><li>9 - Seçenekleri yinele → 9 - Seçenekleri yinele: yeniden dokuza basar</li></ul><p class="reading">Bu, hikâyede seçilen tuşların izidir; hizmetin bütün menüsü değildir.</p></figure>
<figure id="figure-131"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-131.svg"><img alt="131. Ücretsiz erişim, sınırlı temas" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-131.svg" width="842"/></a><figcaption>131. Ücretsiz erişim, sınırlı temas</figcaption><p>Aramanın ücretsiz olması kişiye sınırsız erişim sağlamaz.</p><div aria-label="Tablo: 131. Ücretsiz erişim, sınırlı temas" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Sunulan</th><th scope="col">Arayana ulaşan</th></tr></thead><tbody><tr><th scope="row">Arama</th><td>Ücretsiz aramalar</td><td>Yinelenen menüler</td></tr><tr><th scope="row">Kişi</th><td>Terekeler ve bakiyeler üzerinden bir yol</td><td>Kayda geçen özür, temas sayılır</td></tr><tr><th scope="row">Ses</th><td>Takvim yılı başına bir örnek</td><td>İlk kelimeden önceki nefes</td></tr><tr><th scope="row">Dinledikten sonra</th><td>Menüyü yineleme seçeneği</td><td>Örnek kullanılmıştır</td></tr></tbody></table></div><p class="reading">Yıllık örnek hakkı tükenir; hikâye adamın bütün yılının kaybolduğunu söylemez.</p></figure>
<figure id="figure-132"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-132.svg"><img alt="132. Yüzeylerde tutulan hafıza" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-132.svg" width="842"/></a><figcaption>132. Yüzeylerde tutulan hafıza</figcaption><p>Nesneler tanışıklığı gösterir; bekleyen adamı tanımlamaz.</p><dl><dt>Arayan adam</dt><dd>Bedeni sessizlik kabinini zaten tanır.</dd><dt>Tabure</dt><dd>Dizleri yerini hatırlar.</dd><dt>Kapı</dt><dd>Vernik, eski baş harfleri örter.</dd><dt>Anahtar</dt><dd>Örneği dinledikten sonra da cebindedir.</dd><dt>Dokuz</dt><dd>Tekrar tekrar basılması rakamı silmiştir.</dd><dt>Bekleyen adam</dt><dd>Camın ötesindedir; görevi söylenmez.</dd></dl><h4>İlişkiler</h4><ul><li>Arayan adam → Tabure: tanıdık temas</li><li>Arayan adam → Kapı: bildiği yüzey</li><li>Arayan adam → Anahtar: taşır</li><li>Arayan adam → Dokuz: tekrar tekrar basar</li><li>Bekleyen adam → Arayan adam: dışarıda bekler</li></ul><p class="reading">Aşınma tekrarı düşündürür; kesin süreyi ya da bekleyen adamın görevini göstermez.</p></figure>
