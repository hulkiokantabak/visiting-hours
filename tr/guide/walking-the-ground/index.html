<figure id="figure-55"><a aria-label="Şekli büyüt: 055. Levha, taş ve kadının kararı" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-055.svg"><img alt="055. Levha, taş ve kadının kararı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-055.svg" width="842"/></a><figcaption>055. Levha, taş ve kadının kararı</figcaption><p>Seçilmiş uyuşmazlıklar farklı kayıtlara dönüşür.</p><div aria-label="Tablo: 055. Levha, taş ve kadının kararı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Konum</th><th scope="col">Levha / taş ilişkisi</th><th scope="col">Kadının karşılığı</th></tr></thead><tbody><tr><th scope="row">40 / 12</th><td>Kendini adamış baba ve balık ticareti / su üzerinde iyi bir adam</td><td>Uyumlu</td></tr><tr><th scope="row">40 / 19</th><td>Sevgili eşi / kendine ait bir kadın</td><td>Duygu ifadesi, aileden</td></tr><tr><th scope="row">41 / 8</th><td>Sessiz levha / perşembe ziyaretleri vaadi</td><td>Uyumlu; ayakta durmanın izleri kalır</td></tr><tr><th scope="row">42 / 1</th><td>Ad ve meslek / 9 geçişi ödedi</td><td>İki kez işaretler; tablet birini kabul eder</td></tr><tr><th scope="row">42 / 6</th><td>Aramızdan alındı / ALINDI</td><td>Hiçbir şey kaydedilmez</td></tr><tr><th scope="row">43 / 11</th><td>Tekrarlanan başlangıç / alttaki hakkında uyarı</td><td>Uyumlu; taş levhadan 11 yıl eskidir</td></tr></tbody></table></div><p class="reading">Granit kendiliğinden daha doğru sayılmaz. Kadının kayıt seçimlerinde takdir kullanma, kayda geçirmeme ve başarısız bir ikinci işaret bulunur.</p></figure>
<figure id="figure-56"><a aria-label="Şekli büyüt: 056. Annesinin anıtının iki ifadesi vardır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-056.svg"><img alt="056. Annesinin anıtının iki ifadesi vardır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-056.svg" width="842"/></a><figcaption>056. Annesinin anıtının iki ifadesi vardır</figcaption><p>Hatırlanan seçim, yenileme ve boş taş ayrı kalır.</p><div aria-label="Tablo: 056. Annesinin anıtının iki ifadesi vardır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Hatırladığı ya da bedeninde yaşadığı</th><th scope="col">Kayıtlı yüzey</th></tr></thead><tbody><tr><th scope="row">Seçilen cümle</th><td>Daha kolay diye hatırlar ve doğru olduğunu söyler</td><td>Yenilemede daha sıcak yazar</td></tr><tr><th scope="row">Altı yıl</th><td>Kesilecek satırı seçmemiştir</td><td>Granit boş kalır</td></tr><tr><th scope="row">Kaçınılan sıra</th><td>Topukları yere gömülür; o sırada yürümez</td><td>Ertelendi, erişim: kilitli kapı için bir kategori</td></tr><tr><th scope="row">Ödeme</th><td>Borç her ay hesaba işlenir</td><td>Onun yerine, parasının yettiği cümleyi satın alır</td></tr></tbody></table></div><p class="reading">Rehber, daha kolay ve daha sıcak ifadelerini birlikte görünür tutar. Doğru bir asıl seçmez; değişimin mekanizmasını da belirlemez.</p></figure>
<figure id="figure-57"><a aria-label="Şekli büyüt: 057. İş, eşlik ve tamamlanmamış bir seçenek" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-057.svg"><img alt="057. İş, eşlik ve tamamlanmamış bir seçenek" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-057.svg" width="842"/></a><figcaption>057. İş, eşlik ve tamamlanmamış bir seçenek</figcaption><p>Bildirilen toplamlar ve son eylemler, gelecekte bir yazı kazınacağını garanti etmez.</p><div aria-label="Tablo: 057. İş, eşlik ve tamamlanmamış bir seçenek" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Ölçüm ya da eylem</th><th scope="col">Öyküde verilen</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Tamamlanan / kalan iş</th><td>629 incelendi; 311 kaldı; toplam 940</td><td>629 + 311 = 940; hesapla kontrol</td></tr><tr><th scope="row">Uyuşmazlıklar</th><td>İncelenen 629 içinde 106</td><td>Her yargının doğruluğunu onaylamaz</td></tr><tr><th scope="row">Ofis ortalaması</th><td>280</td><td>Karşılaştırılabilir iş yükünün paydası belirtilmez</td></tr><tr><th scope="row">Paylaşılan termos ve çorba</th><td>Idris ile karşılıklı adlarını söylerler; komşu kalır</td><td>İlgi ve bakım, annesinin anıtını çözüme kavuşturmaz</td></tr><tr><th scope="row">Harf kazıma kartı</th><td>Idris ile güldükten sonra kartı alır</td><td>Kazınmış yazı, ödenmiş fiyat ya da iptal edilmiş borç gösterilmez</td></tr></tbody></table></div><p class="reading">Kartı almak bir eylemdir; tamamlanmış bir satın alma ya da yenilemenin sonu değildir. Buradaki ofis ortalamasının paydası belirtilmez.</p></figure>
