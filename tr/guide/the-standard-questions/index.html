<figure id="figure-100"><a aria-label="Şekli büyüt: 100. Elde tutmak, ad verme izni değildir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-100.svg"><img alt="100. Elde tutmak, ad verme izni değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-100.svg" width="842"/></a><figcaption>100. Elde tutmak, ad verme izni değildir</figcaption><p>Para, verenin adını açıklamadan veren kişiyi, karşı tarafı ve sınav görevlisini bağlar.</p><dl><dt>O belirli para</dt><dd>Kenarının bir yanı aşınarak pürüzsüzleşmiştir</dd><dt>Parayı veren</dt><dd>Parasını geri ister; adı açıklanmaz</dd><dt>Karşı taraf</dt><dd>Geri verme sözü üzerine tanıdık bir nesne çıkarır</dd><dt>Sınav görevlisi</dt><dd>Alır, ovalar ve elinde tutar</dd></dl><h4>İlişkiler</h4><ul><li>Parayı veren → O belirli para: Bu parayı geri ister</li><li>Karşı taraf → O belirli para: Tanıdık nesne olarak getirir</li><li>O belirli para → Sınav görevlisi: Alınır ve tutulur</li><li>Sınav görevlisi → Karşı taraf: Sonunda parayı geri verir</li></ul><p class="reading">Eşdeğer bir para, bu belirli parayı geri verme yükümlülüğünü karşılayamaz.</p></figure>
<figure id="figure-101"><a aria-label="Şekli büyüt: 101. Yüklenen gecikme ve tutan el" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-101.svg"><img alt="101. Yüklenen gecikme ve tutan el" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-101.svg" width="842"/></a><figcaption>101. Yüklenen gecikme ve tutan el</figcaption><p>Karşı taraf aleyhine düşülen kaydı sınav görevlisinin ek notuyla karşılaştırın.</p><div aria-label="Tablo: 101. Yüklenen gecikme ve tutan el" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Karşı tarafa yüklenen</th><th scope="col">Sınav görevlisinde görülen veya itiraf</th></tr></thead><tbody><tr><th scope="row">Sessizlik</th><td>Cevap vermediği için kayıt tehdidi</td><td>Para hâlâ kapalı elde tutulur</td></tr><tr><th scope="row">Gecikme</th><td>Karşı taraf aleyhine kaydedilir</td><td>Ek not, elin sınav görevlisine ait olduğunu söyler</td></tr><tr><th scope="row">Ek nottan sonra</th><td>Değerlendirme askıdadır</td><td>Sınav görevlisi doğrulama için işaretlenir</td></tr></tbody></table></div><p class="reading">Sınav görevlisi bu gecikmenin sorumluluğunu düzeltir; iki tarafın da kişi olup olmadığı bununla belirlenmez.</p></figure>
<figure id="figure-102"><a aria-label="Şekli büyüt: 102. Sorular, araçlarından uzun ömürlü" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-102.svg"><img alt="102. Sorular, araçlarından uzun ömürlü" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-102.svg" width="842"/></a><figcaption>102. Sorular, araçlarından uzun ömürlü</figcaption><p>Bu oturumda sınamanın otoritesinden geriye kalanlar.</p><div aria-label="Tablo: 102. Sorular, araçlarından uzun ömürlü" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Soru veya araç</th><th scope="col">Olan</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Geç gülme</th><td>Okul kapısında dört kez duyulunca işaret kaldırılır</td><td>Sınav görevlisi devam eder</td></tr><tr><th scope="row">Sınav görevlisinin kişi oluşu</th><td>Cevap, boş bir alanı gösterir</td><td>Kimlik belirlenmez</td></tr><tr><th scope="row">Değerlendirme</th><td>Askıda</td><td>Karşı taraf dışarı çıkarılır</td></tr><tr><th scope="row">Program</th><td>Sonraki oturum saat başında</td><td>Karar kesinleşmeden süreç devam eder</td></tr></tbody></table></div><p class="reading">Burada yalnızca geç gülme işareti açıkça kullanımdan kaldırılır. Askıda olmak, insan olduğuna dair karar değildir.</p></figure>
