<figure id="figure-4"><a aria-label="Şekli büyüt: 004. Orta istasyon çevresindeki gündelik düzen" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-004.svg"><img alt="004. Orta istasyon çevresindeki gündelik düzen" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-004.svg" width="842"/></a><figcaption>004. Orta istasyon çevresindeki gündelik düzen</figcaption><p>Yerleri gündelik düzen bağlar; bu, ölçülmüş bir harita değildir.</p><dl><dt>Orta istasyon</dt><dd>İşi ile odası aynı yerde bulunur.</dd><dt>Üstteki oda</dt><dd>Yatak, çatal, bisiklet; pazar günleri yalnız uyur</dd><dt>Pencere dışındaki geçiş yeri</dt><dd>İki vagon 12 saniyeliğine karşılaşır</dd><dt>Deniz</dt><dd>Pazar günü yüzme</dd><dt>Balık tezgâhı</dt><dd>Ayakta yemek yer</dd><dt>Merdivenli sokak</dt><dd>Mart ayındaki ikinci karşılaşmadan sonra çellistin yolu</dd></dl><h4>İlişkiler</h4><ul><li>Orta istasyon → Üstteki oda: üstteki oda</li><li>Orta istasyon → Pencere dışındaki geçiş yeri: işyerinden görünen</li><li>Orta istasyon → Deniz: pazar günkü düzen</li><li>Deniz → Balık tezgâhı: pazar günkü düzen</li><li>Orta istasyon → Merdivenli sokak: çellist peronu kullanmaz (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Metin odayı istasyonun üstüne yerleştirir; gidilen her yeri kablonun görüş alanına sokmaz.</p></figure>
<figure id="figure-5"><a aria-label="Şekli büyüt: 005. Yıllık döküm belleği açıklığa kavuşturamaz" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-005.svg"><img alt="005. Yıllık döküm belleği açıklığa kavuşturamaz" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-005.svg" width="842"/></a><figcaption>005. Yıllık döküm belleği açıklığa kavuşturamaz</figcaption><p>Farklı birimler ve kanıt türleri birbirinden ayrı tutulur.</p><div aria-label="Tablo: 005. Yıllık döküm belleği açıklığa kavuşturamaz" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kanıt</th><th scope="col">Aktarılan sayı ya da olgu</th><th scope="col">Belirsiz kalan</th></tr></thead><tbody><tr><th scope="row">Hizmetin yıllık dökümü</th><td>11 ad; 4,5 yıldız</td><td>Uyuşmazlığı hangi kayıtların oluşturduğu</td></tr><tr><th scope="row">Hatırladıkları</th><td>9 beden</td><td>Neyi unuttuğu ya da tanıyamadığı</td></tr><tr><th scope="row">İki kayıt</th><td>Kendi odasında çekilmiş fotoğraflar</td><td>Battaniyenin üstüne bir yüz yerleştiremez</td></tr><tr><th scope="row">Yastık kılıfları</th><td>Tanımadığı takım kendisine aittir</td><td>Sahip olduklarıyla belleğinin neden ayrıştığı</td></tr><tr><th scope="row">İyileşmiş ısırık</th><td>11 adın hiçbiriyle eşleşmez</td><td>Hangi karşılaşmadan kaldığı</td></tr></tbody></table></div><p class="reading">On bir ad ile hatırlanan dokuz beden uyuşmaz; metin her farkı ya da nedenini açıklamaz.</p></figure>
<figure id="figure-6"><a aria-label="Şekli büyüt: 006. On iki saniye ve tamamlanmayan hareket" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-006.svg"><img alt="006. On iki saniye ve tamamlanmayan hareket" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-006.svg" width="842"/></a><figcaption>006. On iki saniye ve tamamlanmayan hareket</figcaption><p>Son karşılaşma anlatı sırasıyla gösterilir; adamın tam konumu belirtilmez.</p><dl><dt>Geçiş yerinde karşılaşma</dt><dd>Vagonların camları 12 saniye aynı hizada kalır.</dd><dt>İnen vagonda bir el</dt><dd>Bir avuç cama doğru kalkar.</dd><dt>Karşılık veren eli</dt><dd>Kimin eline karşılık verdiğini görmeden elini kaldırır.</dd><dt>Vagonlar ayrılır</dt><dd>Eli havada kalır.</dd><dt>Üstteki oda</dt><dd>İkinci tabak kapıdan görülebilen yerde durur.</dd></dl><p class="reading">Kalkan elin sahibi belli değildir. Elini havada tutması görülür; karşılıklı tanıma gösterilmez.</p></figure>
