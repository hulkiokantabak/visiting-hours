<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Son Kelime · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/the-last-word/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/the-last-word/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/the-last-word/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/the-last-word/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-54"><h1>54. Son Kelime</h1>
<figure id="figure-160"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-160.svg"><img alt="160. Yeni sayı ve babasının biriktirdikleri" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-160.svg" width="842"/></a><figcaption>160. Yeni sayı ve babasının biriktirdikleri</figcaption><p>Dört çubuk da saklanan kelimeleri gösterir; eski eşik ve eksik miktar hesaplanmıştır.</p><p>saklanan kelimeler</p><div aria-label="Tablo: 160. Yeni sayı ve babasının biriktirdikleri" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Baba, son yoklamada</th><td>239</td><td>Saklama fişlerinin gösterdiği</td></tr><tr><th scope="row">Eski pano</th><td>240</td><td>300 eksi belirtilen 60 kelimelik artış</td></tr><tr><th scope="row">Yeni pano</th><td>300</td><td>Söylemesi için kadına ödeme yapılan sayı</td></tr><tr><th scope="row">Hesaplanan eksik</th><td>61</td><td>300 eksi 239; 60 kelimelik artış değil</td></tr></tbody></table></div><p class="reading">Yeni panoda 60 artış vardır; ama son yoklamada 239 çıktığı için babasının eksiği 61'dir.</p></figure>
<figure id="figure-161"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-161.svg"><img alt="161. Aynı nefes, farklı yerlerde" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-161.svg" width="842"/></a><figcaption>161. Aynı nefes, farklı yerlerde</figcaption><p>Kurgu, sesin kabul edilen kelimelerle ilişkisini değiştirir.</p><dl><dt>Ödünç nefes</dt><dd>Duyuru nazik gelir.</dd><dt>Kendi ilk kaydı</dt><dd>Üç ile yüz arasında nefesi takılır.</dd><dt>Nefes çıkarılır</dt><dd>Ses, hiçbir borcu yokmuş gibi gelir.</dd><dt>İsteğiyle geri konur</dt><dd>İmzalamadan önce takılmayı duyar.</dd><dt>Yeni yıl yayını</dt><dd>Nefes iki kelimeden sonra gelir ve rahatlama gibi duyulur.</dd></dl><h4>İlişkiler</h4><ul><li>Ödünç nefes → Kendi ilk kaydı: kendi nefesini ister</li><li>Kendi ilk kaydı → Nefes çıkarılır: teknisyen keser</li><li>Nefes çıkarılır → İsteğiyle geri konur: geri konmasını ister</li><li>İsteğiyle geri konur → Yeni yıl yayını: sonra yeri değişir</li></ul><p class="reading">Yayımlanan sürüm kadının kayıtlı nefesini başka yere koyar; malzemenin aynı kalması, etkisini korumaz.</p></figure>
<figure id="figure-162"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-162.svg"><img alt="162. Para ödenir, kelimeler yine öğrenilecektir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-162.svg" width="842"/></a><figcaption>162. Para ödenir, kelimeler yine öğrenilecektir</figcaption><p>Kayıt ücreti ile saklanan kelimelerin hesabı birbirinin yerine geçmez.</p><div aria-label="Tablo: 162. Para ödenir, kelimeler yine öğrenilecektir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kayıt ve para</th><th scope="col">Babanın saklaması</th></tr></thead><tbody><tr><th scope="row">Kabul edilen iş</th><td>Söylenen iki kelime ücret kazandırır</td><td>Fişleri hâlâ saklanan 239 kelime gösterir</td></tr><tr><th scope="row">Özel kopya</th><td>İlk kayıt, ücretin yarısına mal olur</td><td>Nefesin yerini duymak, kelime aktarımı değildir</td></tr><tr><th scope="row">Eve destek</th><td>Ücret, annesinin para sıkıntısını hafifletebilir</td><td>Yeni pano hâlâ 300 ister</td></tr><tr><th scope="row">Kıyıda</th><td>Ekmek parası annesinin cebine girer</td><td>Suya doğru eğilir ve sonraki kelimeyi söyler</td></tr></tbody></table></div><p class="reading">Ekmek parası bırakır ve sonraki kelimeye yardım eder. İkisinin de babasına geçiş satın aldığı gösterilmez.</p></figure>
