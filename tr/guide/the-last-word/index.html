			<text x="74" y="120" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,240) scale(1,-1)">Bir sonu bile ortasında blok olmadan veremiyor — ve blok bir kez onun kelimesini</text>

			<text x="74" y="57" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,114) scale(1,-1)">ve hikâye Perşembe ile çiçeklerin arasına hiçbir şey koymuyor.</text>
			<text x="74" y="47" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.3px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,94) scale(1,-1)">Hikâyede yanıldığını söyleyen hiçbir şey yok. Haklı olduğunu söyleyen de yok.</text>
