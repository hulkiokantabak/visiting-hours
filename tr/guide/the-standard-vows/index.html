<figure id="figure-145"><a aria-label="Şekli büyüt: 145. Hazır törende açılan yer" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-145.svg"><img alt="145. Hazır törende açılan yer" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-145.svg" width="842"/></a><figcaption>145. Hazır törende açılan yer</figcaption><p>Resmî şartlar, bedensel ve ailevi jestlerle yan yana durur.</p><div aria-label="Tablo: 145. Hazır törende açılan yer" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Resmî yapı</th><th scope="col">İçine giren</th><th scope="col">Görünür uyarlama</th></tr></thead><tbody><tr><th scope="row">Zorunlu soruların her biri iki kez</th><td>Yüksek ve alçak sesli yanıtlar</td><td>İki yanıt biçimi de törende yer bulur</td></tr><tr><th scope="row">Verilen yemin metni</th><td>Kadının başparmağı adamın nabzında</td><td>Dokunuş, kelimelere eşlik eder</td></tr><tr><th scope="row">Sıradaki çift bekler</th><td>Kadın teyzesinin duasını ister</td><td>Memur kartını ters çevirir</td></tr><tr><th scope="row">Hediye defteri</th><td>Tutarı belirtilmeyen hediyeler</td><td>En son doldurulan, daha dar üçüncü sütun</td></tr></tbody></table></div><p class="reading">Fiyatı belirtilmemiş hediyeye yer açılması, ona hiçbir zaman değer biçilemeyeceğini kanıtlamaz.</p></figure>
<figure id="figure-146"><a aria-label="Şekli büyüt: 146. İmzalı sayfanın ötesine taşınan mürekkep" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-146.svg"><img alt="146. İmzalı sayfanın ötesine taşınan mürekkep" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-146.svg" width="842"/></a><figcaption>146. İmzalı sayfanın ötesine taşınan mürekkep</figcaption><p>Dizi, ilan edilmiş bir muafiyeti değil, izleri takip eder.</p><dl><dt>Yenileme mürekkebi</dt><dd>Perşembe damgası zaten ıslaktır.</dd><dt>İmzalı sayfa</dt><dd>İkisi de imzalar; kadın avucunu mürekkebe bastırır.</dd><dt>Kapanan el</dt><dd>İzi kaldırır, avucunu kapatır.</dd><dt>Memurun başparmağı</dt><dd>Kenara bir iz ekler; paraf ve tarih atar.</dd><dt>Koridorda iki el</dt><dd>Kocası temiz elini tutar; mürekkep öteki elinde kalır.</dd></dl><h4>İlişkiler</h4><ul><li>Yenileme mürekkebi → İmzalı sayfa: törende kullanılır</li><li>İmzalı sayfa → Kapanan el: mürekkep aktarılır</li><li>Kapanan el → Memurun başparmağı: memur izini ekler</li><li>Memurun başparmağı → Koridorda iki el: izler farklı taşınır</li></ul><p class="reading">Sayfa okunaklı kalır. Memurun eklediği iz ne formu siler ne de sonraki ses kaydı çatışmasını çözer.</p></figure>
<figure id="figure-147"><a aria-label="Şekli büyüt: 147. İzin, kayıt ve belirsiz ulaşma" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-147.svg"><img alt="147. İzin, kayıt ve belirsiz ulaşma" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-147.svg" width="842"/></a><figcaption>147. İzin, kayıt ve belirsiz ulaşma</figcaption><p>Telefondaki görünür eylem, kadının telefonuna ne ulaştığını çözmez.</p><div aria-label="Tablo: 147. İzin, kayıt ve belirsiz ulaşma" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Anlaşma ya da niyet</th><th scope="col">Sahnenin gösterdiği</th></tr></thead><tbody><tr><th scope="row">Aralarındaki anlaşma</th><td>Fotoğraf, sesler olmadan</td><td>Kadın kabul etmiştir</td></tr><tr><th scope="row">Kadının özel isteği</th><td>Yalnız kendisi için ses</td><td>Şahitten ayrıca istemiştir</td></tr><tr><th scope="row">Şahidin telefonu</th><td>Seste Gönderildi yazar</td><td>Kayıt çalar; kadının kocası onu siler</td></tr><tr><th scope="row">Kadının telefonu</th><td>Kalçasına değerek hareket eder</td><td>Fotoğraflar gelir; sesin ulaştığı kanıtlanmaz</td></tr></tbody></table></div><p class="reading">Şahidin telefonunda Gönderildi görünür. Sonda açıkça yalnızca fotoğrafların gelmekte olduğu söylenir.</p></figure>
