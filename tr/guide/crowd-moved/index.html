<figure id="figure-28"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-028.svg"><img alt="028. Beş iş, farklı kayıtlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-028.svg" width="842"/></a><figcaption>028. Beş iş, farklı kayıtlar</figcaption><p>Yalnızca gerçekten verilen ücretler ve sınıflandırmalar gösterilir.</p><div aria-label="Tablo: 028. Beş iş, farklı kayıtlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">İş</th><th scope="col">Birimin yaptığı</th><th scope="col">Verilen kayıt</th></tr></thead><tbody><tr><th scope="row">Dokuzda düğün</th><td>İlk dansı eşgüdümler</td><td>Fatura dayanağı belirtilmez</td></tr><tr><th scope="row">Öğlen okul</th><td>Direnen oğlan için perdeyi ve hızı değiştirir</td><td>Şarkılar ruhsatlıdır</td></tr><tr><th scope="row">Balık pazarında cenaze toplantısı</th><td>4 sessiz dakika çalar ya da susar</td><td>Bir eser, icra edildi</td></tr><tr><th scope="row">Akşam Depo</th><td>Ruhsatsız altı basamaklı ezgiyi çalar</td><td>4 dakika: anomali, tekrarlayan</td></tr><tr><th scope="row">Şafakta meydan</th><td>Kalabalığı sevk eder; meydan 20 dakikada boşalır</td><td>Tek satır: kalabalık, sevk edildi</td></tr></tbody></table></div><p class="reading">Cenaze toplantısı icra, meydan ise sonuç olarak faturalandırılır; öteki işlerin fatura dayanağı belirtilmez.</p></figure>
<figure id="figure-29"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-029.svg"><img alt="029. Kim konuşacak zaman bulur" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-029.svg" width="842"/></a><figcaption>029. Kim konuşacak zaman bulur</figcaption><p>İnsanlar, birim çalışmadan önce ve çalışırken söz hakkı için çekişir.</p><div aria-label="Tablo: 029. Kim konuşacak zaman bulur" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Dikkat talebi</th><th scope="col">Karşılık</th></tr></thead><tbody><tr><th scope="row">Cenaze toplantısında</th><td>Kız konuşurken bir yasçı ücretli isteğini dile getirmek için elini kaldırır</td><td>Dul kadın onun elini indirir; kız sözünü bitirir</td></tr><tr><th scope="row">Pankartta</th><td>Bir kadın talepten BİZİM kelimesini çıkarır</td><td>Taşıyanlar kalan şeridi havada tutar</td></tr><tr><th scope="row">Megafonda</th><td>Aynı kadın elini uzatır</td><td>Megafonu tutan kişi onu kadının arkasındaki adama verir</td></tr><tr><th scope="row">Birimin kutusunda</th><td>Bir adam kutuya ulaşır ve bir ağız hareketini tekrarlar</td><td>Görevli balmumunu kulaklarında tutar ve kutuyu çekip uzaklaştırır</td></tr></tbody></table></div><p class="reading">Değiştirilen pankart ve verilmeyen megafon, tek bir örgüt ya da öğretiyi değil, söz hakkı üzerindeki çekişmeyi gösterir.</p></figure>
<figure id="figure-30"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-030.svg"><img alt="030. Kulak tıkaçlarının ardında ayaklar öğrenir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-030.svg" width="842"/></a><figcaption>030. Kulak tıkaçlarının ardında ayaklar öğrenir</figcaption><p>Depo'da bedensel alımlamanın zinciri ve sonradan duyulan izi.</p><dl><dt>Ruhsatsız ezgi</dt><dd>Depo'da aşağı inen altı basamak</dd><dt>Taş üzerindeki ayaklar</dt><dd>Ayakları, kulaklarının duyamadığını öğrenir</dd><dt>Şafakta çıkarılan tıkaçlar</dt><dd>Sıradan şehir yeniden kulaklarına ulaşır</dd><dt>Meydandan geçiş</dt><dd>Aşağı inen altı basamağı mırıldanır</dd></dl><h4>İlişkiler</h4><ul><li>Ruhsatsız ezgi → Taş üzerindeki ayaklar: zeminden hissedilir</li><li>Taş üzerindeki ayaklar → Şafakta çıkarılan tıkaçlar: anlatının ilerleyen bölümünde (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Şafakta çıkarılan tıkaçlar → Meydandan geçiş: anlatının ilerleyen bölümünde (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">İşitmesi engellenmiştir; etkilenmesi değil. Sonradan ezgiyi mırıldanması, ona sahip olduğunu ya da ondan özgürleştiğini göstermez.</p></figure>
