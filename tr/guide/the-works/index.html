<figure id="figure-49"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-049.svg"><img alt="049. Sayılan yüksekliğin yanındaki kayıtlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-049.svg" width="842"/></a><figcaption>049. Sayılan yüksekliğin yanındaki kayıtlar</figcaption><p>Bu öyküde yer alan kayıtları karşılaştırın.</p><div aria-label="Tablo: 049. Sayılan yüksekliğin yanındaki kayıtlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kayıt ya da gözlem</th><th scope="col">Kat sayısı</th><th scope="col">Doğrudan sonucu</th></tr></thead><tbody><tr><th scope="row">Asansör formu</th><td>19</td><td>Kurtarmayı izinsiz sayar</td></tr><tr><th scope="row">Ölçüler kartı</th><td>23</td><td>Mühendis kartı ters çevirir; Sava yeniden yüzünü çevirir</td></tr><tr><th scope="row">İşçilerin asansör defteri</th><td>23</td><td>Operatör, işçilerin ücret almadan tuttuğu ortak deftere katı kaydeder</td></tr><tr><th scope="row">Çitteki bildirim</th><td>19</td><td>Adam ayrılırken değişmemiştir</td></tr><tr><th scope="row">Operatörün akşam sayımı</th><td>Işıkları yanan 23 kat</td><td>Yeniden sayar</td></tr></tbody></table></div><p class="reading">Sayı önemlidir: kafesin adamlara ulaşmak için 19'un üstüne çıkması gerekir; çelişen belgeler kurtarılmalarını yalnızca kâğıt üstünde kalmış bir olaya dönüştürmez.</p></figure>
<figure id="figure-50"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-050.svg"><img alt="050. Yükseklik tartışması kurtarmanın maliyetine dönüşür" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-050.svg" width="842"/></a><figcaption>050. Yükseklik tartışması kurtarmanın maliyetine dönüşür</figcaption><p>Eylemler anlatı sırasındadır; kesinti, mühendisin kayda geçirdiği cezadır.</p><dl><dt>Mühendisin inkârı</dt><dd>Telsizdeki sese rağmen 19'un üstünde kimse yoktur</dd><dt>Cama dayanan parmak</dt><dd>Kafesin üstünü gösterir ve fazla alçakta olduğunu söyler</dd><dt>Yükseltilen kafes</dt><dd>Üç adam iner; birinin ayağı yaralıdır</dd><dt>Aleyhte asansör formu</dt><dd>19; izinsiz kaldırma; 3 saatlik ücret kesintisi</dd><dt>Operatör imzalar</dt><dd>Mühendis tartışmalı yüksekliği değil, inişi kabul eder</dd></dl><h4>İlişkiler</h4><ul><li>Mühendisin inkârı → Cama dayanan parmak: operatör yerin söylenmesini ister</li><li>Cama dayanan parmak → Yükseltilen kafes: operatör kafesi yükseltir</li><li>Yükseltilen kafes → Aleyhte asansör formu: mühendis cezayı kaydeder</li><li>Aleyhte asansör formu → Operatör imzalar: ardından imza gelir</li></ul><p class="reading">Üç adam yere dönerken operatör üç saatlik ücretini kaybeder. Kurtarma, kaydı o yüksekliği kabul etmeye zorlamaz.</p></figure>
<figure id="figure-51"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-051.svg"><img alt="051. Yükseklik savunulur; ücret kesintisine tanıklık edilmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-051.svg" width="842"/></a><figcaption>051. Yükseklik savunulur; ücret kesintisine tanıklık edilmez</figcaption><p>Sava bir yetki alanına itiraz eder; operatörün sonraki talebini üstlenmez.</p><div aria-label="Tablo: 051. Yükseklik savunulur; ücret kesintisine tanıklık edilmez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Resmî ya da mesleki eylem</th><th scope="col">Eylemin sınırı</th></tr></thead><tbody><tr><th scope="row">Mühendis</th><td>Yoklamanın kendi yetkisinde olduğunu söyler ve 19 kaydeder</td><td>Kafesin döndüğünü görmüştür ama operatörün anlatısını reddeder</td></tr><tr><th scope="row">Sava</th><td>Yüksekliği savunur ve 23 yazılı kartını yeniden yüzü yukarı çevirir</td><td>Ücret kesintisine tanıklık etmez</td></tr><tr><th scope="row">Operatör</th><td>İşçilerin defterine 23 ekler</td><td>Yine de aleyhte formu imzalar</td></tr><tr><th scope="row">İşçilerin defteri</th><td>Yılların katlarını kendi elleriyle taşır</td><td>Değiştirmeye ya da misillemeye karşı koruma garanti edilmez</td></tr></tbody></table></div><p class="reading">Karşıt kartın yardımı sınırlıdır. Sava'nın neden tanıklık etmediği belirtilmez.</p></figure>
