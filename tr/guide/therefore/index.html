			<text x="102" y="68" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.6px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,136) scale(1,-1)">GEÇİMİNİ KELİMELERE FİYAT BİÇEREK SAĞLAYAN BİR ADAM, KENDİ MERDİVENLERİNİ İKİ KEZ AYNI ŞEKİLDE SAYAMIYOR.</text>
			<text x="102" y="58" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6.2px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,116) scale(1,-1)">Ödeme almayan ve bilmeyen çocuk, her seferinde doğru sayıyor.</text>
			<text x="20" y="30" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 6.8px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,60) scale(1,-1)">HİKÂYEDE BİR SAYININ GÜVENİLİR OLDUĞU TEK YER, MERDİVENDEKİ ALTI YAŞINDA BİR ÇOCUK.</text>
		</g>
	</g>

			<text x="70" y="289" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: normal; font-size: 7px;fill: rgb(10%,10%,10%); stroke:none;" transform="translate(0,578) scale(1,-1)">Dünyanın anlaşılabilir olduğunu varsayın.</text>

			<text x="70" y="266" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: bold; font-style: normal; font-size: 7.4px;fill: rgb(54%,18%,18%); stroke:none;" transform="translate(0,532) scale(1,-1)">Bir de bana yine ödeme yapılacağını varsayın.</text>

			<text x="340" y="197" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,394) scale(1,-1)">doğru, ve çelişki değil — daha uzun bir doğru betimleme, daha kısası değil</text>

			<text x="340" y="128" style="font-family: Helvetica, Arial, 'Liberation Sans', 'Nimbus Sans', 'Helvetica Neue', sans-serif; font-weight: normal; font-style: italic; font-size: 6px;fill: rgb(43%,43%,43%); stroke:none;" transform="translate(0,256) scale(1,-1)">ve yine, ardından hiçbir şey gelmeden</text>
