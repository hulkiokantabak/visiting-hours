<figure id="figure-46"><a aria-label="Şekli büyüt: 046. Bildirilen dört basamak sayısı" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-046.svg"><img alt="046. Bildirilen dört basamak sayısı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-046.svg" width="842"/></a><figcaption>046. Bildirilen dört basamak sayısı</figcaption><p>Bütün çubuklar bildirilen sayıları gösterir; merdivenin bağımsız ölçümleri değildir.</p><p>bildirilen basamak sayısı</p><div aria-label="Tablo: 046. Bildirilen dört basamak sayısı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Anlatıcının ilk sayımı</th><td>17</td><td>İnerken sayar</td></tr><tr><th scope="row">Anlatıcının tekrar sayımı</th><td>19</td><td>İlk sayımıyla uyuşmaz</td></tr><tr><th scope="row">Elleri</th><td>23</td><td>Anlatıldığı biçimiyle bedensel bir sayım</td></tr><tr><th scope="row">Oğlu çıkarken</th><td>20</td><td>Doğru sayı olarak belirlenmez</td></tr></tbody></table></div><p class="reading">Hiçbir basamak sayısının doğruluğu onaylanmaz. Ayrı bir iddia olan “Üç elim var” sözü bu basamak karşılaştırmasının dışında kalır.</p></figure>
<figure id="figure-47"><a aria-label="Şekli büyüt: 047. Bir cevap, iki anlam" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-047.svg"><img alt="047. Bir cevap, iki anlam" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-047.svg" width="842"/></a><figcaption>047. Bir cevap, iki anlam</figcaption><p>Görevli reddi kaydeder; konuşan, hesap hakkındaki iddiasını sürdürür.</p><div aria-label="Tablo: 047. Bir cevap, iki anlam" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Görevlinin seçtiği anlam</th><th scope="col">Anlatıcının tekrarladığı anlam</th></tr></thead><tbody><tr><th scope="row">Odaktaki soru</th><td>Kabul ediyor musunuz?</td><td>Hesabım hiç kapanacak mı?</td></tr><tr><th scope="row">Hayır cevabı</th><td>Kabul etmez</td><td>Hesabı kapanmayacaktır</td></tr><tr><th scope="row">Eylem</th><td>Görevli ilk hayırı seçer</td><td>Adam ikinci hayırı söylemeyi sürdürür</td></tr><tr><th scope="row">Görünen devam</th><td>Annesinin ağzı hareket eder</td><td>Cevap üzerinde anlaşma gösterilmez</td></tr></tbody></table></div><p class="reading">Ekran, konuşanın itiraz ettiği bir anlamı kabul eder. Bu, bir cevabın anlamı üzerindeki çatışmadır; evrensel bir hesap yasasının kanıtı değildir.</p></figure>
<figure id="figure-48"><a aria-label="Şekli büyüt: 048. Kanıtlama girişiminin koptuğu yer" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-048.svg"><img alt="048. Kanıtlama girişiminin koptuğu yer" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-048.svg" width="842"/></a><figcaption>048. Kanıtlama girişiminin koptuğu yer</figcaption><p>Anlatıcının son akıl yürütmesi, öne sürdüğü sonuca dönüp durur.</p><dl><dt>Yazdığı varsayımlar</dt><dd>Anlaşılabilir bir dünya; süren ödeme</dd><dt>En kısa doğru betimleme</dt><dd>Anlatıcı onun var olduğunu ileri sürer</dd><dt>Eklenen bir cümle</dt><dd>Daha uzun, doğru bir betimleme oluşur</dd><dt>Çelişki</dt><dd>Sonucu çelişki olarak adlandırır</dd><dt>Tekrarlanan öyleyse</dt><dd>Sayfada bundan ileri bir sonuç çıkmaz</dd></dl><h4>İlişkiler</h4><ul><li>Yazdığı varsayımlar → En kısa doğru betimleme: anlatıcı ileri sürer (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>En kısa doğru betimleme → Eklenen bir cümle: bir cümle ekler</li><li>Eklenen bir cümle → Çelişki: geçersiz çıkarım (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li><li>Çelişki → Tekrarlanan öyleyse: iddia edilen sonuç (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Daha uzun, doğru bir betimleme en kısa olanı çürütmez. Son çıkarım biçimsel olarak geçersizdir; konuşan, bu sonucun çıkmasına neden ihtiyaç duyar?</p></figure>
