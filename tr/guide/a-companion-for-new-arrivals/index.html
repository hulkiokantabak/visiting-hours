<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yeni Gelenler İçin Rehber · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/a-companion-for-new-arrivals/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/a-companion-for-new-arrivals/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/a-companion-for-new-arrivals/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/a-companion-for-new-arrivals/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-38"><h1>38. Yeni Gelenler İçin Rehber</h1>
<figure id="figure-112"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-112.svg"><img alt="112. Bir kapak, değiştirilmiş orta sayfaları taşır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-112.svg" width="842"/></a><figcaption>112. Bir kapak, değiştirilmiş orta sayfaları taşır</figcaption><p>Kitapçık kendi dolaşım yolunu anlatır; bağımsız olarak kimliği belirlenmiş bir örgütü değil.</p><dl><dt>Değiştirilmiş kitapçık</dt><dd>İki sıra zımba deliği değişikliği gösterir</dd><dt>Ofis'in kapağı</dt><dd>Kitapçığın dışı olarak tutulur</dd><dt>Değiştirilmiş orta sayfalar</dt><dd>Tezgâha ulaşmadan değiştirilir</dd><dt>Memur</dt><dd>Değişiklikten haberi olmayabilir</dd><dt>Hitap edilen okur</dt><dd>Değişikliği nasıl aktaracağı anlatılır</dd></dl><h4>İlişkiler</h4><ul><li>Ofis'in kapağı → Değiştirilmiş kitapçık: Kapağı sağlar</li><li>Değiştirilmiş orta sayfalar → Değiştirilmiş kitapçık: Değişmiş ortayı sağlar</li><li>Memur → Değiştirilmiş kitapçık: Nüshayı dağıtır</li><li>Değiştirilmiş kitapçık → Hitap edilen okur: Kopyalama talimatı verir</li><li>Hitap edilen okur → Değiştirilmiş orta sayfalar: Başka değişimler istenir (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Memur değişikliği bilmiyor olabilir. Başka bir nüshayı değiştirme talimatı, okurun bunu zaten yaptığının kanıtı değildir.</p></figure>
<figure id="figure-113"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-113.svg"><img alt="113. Kilitli kapı bir talebi kesintiye uğratır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-113.svg" width="842"/></a><figcaption>113. Kilitli kapı bir talebi kesintiye uğratır</figcaption><p>Sahanlıktaki olaylar, kitapçığın aktardığı biçimiyle.</p><dl><dt>Bir kadına oda verilir</dt><dd>Sayfaları komşulara dağıtmayı reddeder.</dd><dt>Biri anahtar için geri gelir</dt><dd>Kitapçığın tarafından biri anahtarı ister.</dd><dt>Kapı zaten kilitlidir</dt><dd>İçerideki kadın kilitlemiştir.</dd><dt>Odayı bulan dışarıda kalır</dt><dd>Odayı bulan kadın sahanlıkta kalır.</dd><dt>Anahtarı isteyen önce ayrılır</dt><dd>Odayı bulan kadın kalırken anahtarı isteyen gider.</dd></dl><h4>İlişkiler</h4><ul><li>Bir kadına oda verilir → Biri anahtar için geri gelir: Retten sonra</li><li>Biri anahtar için geri gelir → Kapı zaten kilitlidir: Kilitli kapıyla karşılaşır</li><li>Kapı zaten kilitlidir → Odayı bulan dışarıda kalır: Sonra</li><li>Odayı bulan dışarıda kalır → Anahtarı isteyen önce ayrılır: Sonra</li></ul><p class="reading">Kalmak, içeridekini koruyabilir. Odayı bulan kadının amacı ve içeridekinin kalıcı güvenliği belirsizdir.</p></figure>
<figure id="figure-114"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-114.svg"><img alt="114. Kitapçığın kendi tarafına tutturduğu kanıtlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-114.svg" width="842"/></a><figcaption>114. Kitapçığın kendi tarafına tutturduğu kanıtlar</figcaption><p>Çelişkili fişler ve rahatsız edici nesneler, kitapçığın anlatımını da sınar.</p><div aria-label="Tablo: 114. Kitapçığın kendi tarafına tutturduğu kanıtlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kanıt veya alan</th><th scope="col">Üzerindeki baskı</th><th scope="col">Kitapçıktaki talimat</th></tr></thead><tbody><tr><th scope="row">İki ret fişi</th><td>Memurlar, veren büroları farklı adlandırır</td><td>İkisini de sakla; kitapçığın tarafı birini attırmasın</td></tr><tr><th scope="row">Üstüne basılan ayakkabı</th><td>Nüshaların altına kaldırılır</td><td>Ortaya çıkar</td></tr><tr><th scope="row">Boş saatler veya reddedilen adres</th><td>Yeni bir satır bu bilgiyi ister</td><td>Satır boş kalabilir; gerekçe kutusu yoktur</td></tr><tr><th scope="row">Kayıt defterleri</th><td>Kitapçık emir verenlerin değişmesini önerir</td><td>Defterlere dokunma</td></tr></tbody></table></div><p class="reading">Bunlar davranış talepleridir; bütün yazarlarının veya gelecekteki görevlilerin bunlara uyacağının kanıtı değildir.</p></figure>
