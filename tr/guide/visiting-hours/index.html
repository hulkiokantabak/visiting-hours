<figure id="figure-178"><a aria-label="Şekli büyüt: 178. Son durağın ötesine çıkış" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-178.svg"><img alt="178. Son durağın ötesine çıkış" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-178.svg" width="842"/></a><figcaption>178. Son durağın ötesine çıkış</figcaption><p>Yalnız anlatı güzergâhıdır; uzaklıklar ve aralıklar ölçekli değildir.</p><dl><dt>Son durak</dt><dd>Dönüş yarım bileti, su ve söylenmemiş bir neden taşır.</dd><dt>Paslı kapı</dt><dd>Basamaklar, daha eski taşların arasından sürer.</dd><dt>Nişte mum</dt><dd>Fitil sıcaktır; aşağı inen kimseyle karşılaşmamıştır.</dd><dt>Ağaç sınırı</dt><dd>Telefon şehri kaybeder ve kaldırılır.</dd><dt>Seyrelen ses</dt><dd>Teslimatlar, trafik, liman ve kanal uzaklaşır.</dd><dt>Üst kapı</dt><dd>Alçak beyaz duvar onarılmıştır; kapı açıktır.</dd></dl><h4>İlişkiler</h4><ul><li>Son durak → Paslı kapı: çıkış</li><li>Paslı kapı → Nişte mum: basamaklar boyunca</li><li>Nişte mum → Ağaç sınırı: çıkış</li><li>Ağaç sınırı → Seyrelen ses: sesler uzaklaşır</li><li>Seyrelen ses → Üst kapı: tepeye ulaşır</li></ul><p class="reading">Bağlantı kaybı bu tırmanışta gösterilir; diyagram, tepenin bütün yasalarını çizmez.</p></figure>
<figure id="figure-179"><a aria-label="Şekli büyüt: 179. Sudan önce teşekkür, hüküm vermeden barınak" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-179.svg"><img alt="179. Sudan önce teşekkür, hüküm vermeden barınak" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-179.svg" width="842"/></a><figcaption>179. Sudan önce teşekkür, hüküm vermeden barınak</figcaption><p>Karşılaşmalar, uyuşmayan zamanları somut eylemlerle yan yana koyar.</p><div aria-label="Tablo: 179. Sudan önce teşekkür, hüküm vermeden barınak" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Karşılaşma</th><th scope="col">Olan</th><th scope="col">Açık kalan</th></tr></thead><tbody><tr><th scope="row">Ziyaretçinin teşekkürü</th><td>Gelecek yaz ya da sonraki yaz vereceği su için teşekkür eder</td><td>Kadının şişesi o sırada hâlâ açılmamıştır</td></tr><tr><th scope="row">Duvardaki iki adam</th><td>Her biri kendi savaşlarının arasında durur</td><td>Bir savaş henüz olmamıştır</td></tr><tr><th scope="row">İnancı olmayan adam</th><td>Seccadede uyur; biri ayaklarını örter</td><td>Konukseverlik, kesinleşmiş inanç gerektirmez</td></tr><tr><th scope="row">Kutudaki madeni para</th><td>Kadın onu tanır ve kapağı kapatır</td><td>Yolu ve kimliği burada açıklanmaz</td></tr><tr><th scope="row">Kaçakçı</th><td>Kesik kesik açıklamasından sonra kadın açtığı şişeyi uzatır</td><td>İçtiği ya da ileride karşıya geçtiği gösterilmez</td></tr></tbody></table></div><p class="reading">Bunlar öyküdeki karşılaşmalardır; çözülmüş zaman düzeninin, ücretsiz ekonominin ya da kimliği bilinen madeni paranın kanıtı değildir.</p></figure>
<figure id="figure-180"><a aria-label="Şekli büyüt: 180. Açık çıkış ve yeniden içeri dönüş" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-180.svg"><img alt="180. Açık çıkış ve yeniden içeri dönüş" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-180.svg" width="842"/></a><figcaption>180. Açık çıkış ve yeniden içeri dönüş</figcaption><p>Akşam niyeti, ardından gelen eylemlerle karşılaştırılır.</p><div aria-label="Tablo: 180. Açık çıkış ve yeniden içeri dönüş" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Olasılık ya da niyet</th><th scope="col">Gözlenen akşam eylemi</th></tr></thead><tbody><tr><th scope="row">İniş</th><td>Hava kararmadan inmeye niyetlidir</td><td>Yeniden içeri girer</td></tr><tr><th scope="row">Dönüş yolculuğu</th><td>Dönüş yarım bileti hâlâ yanındadır</td><td>Cebinde yumuşamış olarak kalır</td></tr><tr><th scope="row">Kapı</th><td>Bütün gün açıktır</td><td>Kimse onu aşağı gitmek için kullanmamıştır</td></tr><tr><th scope="row">Ziyaretçi defteri</th><td>Geldiğinde imzalamamıştır</td><td>İmzalar; mürekkep diğerleriyle aynı yaşa ulaşır</td></tr></tbody></table></div><p class="reading">Yeniden içeri girer ve imzalar. Kalış süresi açık kalır; açık kapı ne hapsedilmeyi ne de geri dönülmez bir seçimi kanıtlar.</p></figure>
