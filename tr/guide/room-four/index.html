<figure id="figure-67"><a aria-label="Şekli büyüt: 067. Gösterilen kartlar, saklanan bilgi" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-067.svg"><img alt="067. Gösterilen kartlar, saklanan bilgi" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-067.svg" width="842"/></a><figcaption>067. Gösterilen kartlar, saklanan bilgi</figcaption><p>Eldeki açığa çıkışlar; her oyuncunun olası kartlarının hesabı değil.</p><dl><dt>Floptan önce</dt><dd>Değerlemeci yedilileri kapalı atar.</dd><dt>Flop</dt><dd>Görevli dokuzluları açık atar; Değerlemeci inceler.</dd><dt>Turn: maça dokuz</dt><dd>Dul'da floş vardır; Görevli Oğlan'ın dördüncü dokuzlusunu göremez.</dd><dt>River: karo on</dt><dd>Dul’un beş maçalı floşu Oğlan’ın papazla biten kentini yener; Oğlan oturur.</dd><dt>Kartlar açık</dt><dd>Ustabaşı iki dörtlüsünü gösterir. İki pot da Dul'a gider.</dd></dl><p class="reading">Dört dokuzlu: Görevli’de iki, turn kartında bir, Oğlan’ın elinde gizli bir tane. Çifti neden gösterdiği bilinmez.</p></figure>
<figure id="figure-68"><a aria-label="Şekli büyüt: 068. Eldeki, borçtaki, iddiadaki" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-068.svg"><img alt="068. Eldeki, borçtaki, iddiadaki" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-068.svg" width="842"/></a><figcaption>068. Eldeki, borçtaki, iddiadaki</figcaption><p>Birimler ayrı kalır; Oğlan, Dul'un kelimeleri hakkındaki hesabına karşı çıkar.</p><div aria-label="Tablo: 068. Eldeki, borçtaki, iddiadaki" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kalem</th><th scope="col">Miktar ya da birim</th><th scope="col">Durum</th></tr></thead><tbody><tr><th scope="row">Kocanın devam hizmeti</th><td>Dört ay</td><td>Dul bununla ayrılır</td></tr><tr><th scope="row">Oğlan'ın yazılan borcu</th><td>Saklaması kanıtlanmış 420 kelime</td><td>O imzalar; kadın elinde tutar</td></tr><tr><th scope="row">Dul'un Oğlan'a dair hesabı</th><td>211 kelime ve bir anne</td><td>Oğlan az önce gereken kelimeleri olduğunu söylemiştir</td></tr><tr><th scope="row">İşletmenin pot payı</th><td>Yüzde beş, aşağı yuvarlanır</td><td>Virgülden sonra ikinci basamağa kadar alınır</td></tr><tr><th scope="row">Borcun kayda geçirilmesi</th><td>İşlem bedeli; miktarı belirtilmez</td><td>Borcun kayda geçirilmesi işleminden düşülür</td></tr></tbody></table></div><p class="reading">211, kadının onun hakkında ileri sürdüğü sayıdır; diyagramın sunduğu bağımsız bir denetim değildir.</p></figure>
<figure id="figure-69"><a aria-label="Şekli büyüt: 069. Kartlardan sonra tekrarlanan eller" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-069.svg"><img alt="069. Kartlardan sonra tekrarlanan eller" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-069.svg" width="842"/></a><figcaption>069. Kartlardan sonra tekrarlanan eller</figcaption><p>Kart masasındaki jestler, sonraki salı rampaya uzanır.</p><div aria-label="Tablo: 069. Kartlardan sonra tekrarlanan eller" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Masada</th><th scope="col">Elden sonra</th></tr></thead><tbody><tr><th scope="row">Oğlan</th><td>Beğendiği kartlara iki kez dokunur</td><td>İmzadan önce kendi ellerine iki kez dokunur</td></tr><tr><th scope="row">Görevli</th><td>Attığı dokuzluları gösterir</td><td>Dokuzluları karısından saklar; sonra rampaya bir sandalye getirir</td></tr><tr><th scope="row">Değerlemeci</th><td>Ustabaşı'na eşlik eder, bir el kaçırır</td><td>Oğlan'ın imzasına tanıklık eder</td></tr><tr><th scope="row">Dul</th><td>Kendi parası iki kez sayılır</td><td>Borç fişini iki kez okur</td></tr></tbody></table></div><p class="reading">Salı günü rampaya tek hareketle getirilen sandalye, “Düzen Yeniden Sağlandı”da (26) yeniden görünür. Dokuzluları gösterme nedeni açıklanmaz.</p></figure>
