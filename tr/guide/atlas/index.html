<figure><a aria-label="Şekli büyüt: İki tepe, eksiksiz plan yok" class="figure-visual" href="/visiting-hours/guide/figures/tr/atlas-01.svg"><img alt="İki tepe, eksiksiz plan yok" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/atlas-01.svg" width="842"/></a><figcaption>İki tepe, eksiksiz plan yok</figcaption><p>Belirtilen yerlerin şeması; sokak haritası ya da ölçekli çizim değil.</p><dl><dt>Bir liman ve iki tepe</dt><dd>Şehrin sunduğu yollar eşit değildir.</dd><dt>Yakın tepe</dt><dd>Füniküler, orta istasyon, kubbe, son durak.</dd><dt>Uzak tepe</dt><dd>Şantiye, vinçler, sözleşmeli hava.</dd><dt>Farklı adlarla anılan su</dt><dd>Daire: kanal. Başka yerlerde: deniz, ya da nehir mi deniz mi.</dd><dt>Balık pazarı</dt><dd>Tentelerin altındaki hava; konuşan kedi.</dd><dt>Son durağın yukarısı</dt><dd>Halat korkuluk, açık kapı, manastır.</dd></dl><h4>İlişkiler</h4><ul><li>Bir liman ve iki tepe → Yakın tepe: Yakın tepe</li><li>Bir liman ve iki tepe → Uzak tepe: Uzak tepe</li><li>Bir liman ve iki tepe → Farklı adlarla anılan su: Referans noktası</li><li>Bir liman ve iki tepe → Balık pazarı: Pazar</li><li>Yakın tepe → Son durağın yukarısı: Son durağın ötesindeki yol (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Her yağmur satın alınmış değildir. Yol son durağın ötesinde sürer; kesin uzaklık ve şehrin eksiksiz planı verilmez.</p></figure>
<figure><a aria-label="Şekli büyüt: Ayrılma yolları" class="figure-visual" href="/visiting-hours/guide/figures/tr/atlas-02.svg"><img alt="Ayrılma yolları" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/atlas-02.svg" width="842"/></a><figcaption>Ayrılma yolları</figcaption><p>Farklı yolculuklar; olası bütün ayrılışların toplamı değil.</p><div aria-label="Tablo: Ayrılma yolları" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Hikâyedeki yolculuk</th><th scope="col">Ardından gelen</th></tr></thead><tbody><tr><th scope="row">İhracat · 14</th><td>Kız, şafak uçuşuna biner.</td><td>Annesinin ruhsatı yalnızca ödenmiş ayın sonuna kadar geçerlidir.</td></tr><tr><th scope="row">Tarife · 15</th><td>Denetlenen koca tekneyle geçer.</td><td>Dul kadın suya girer; geri getirilmez.</td></tr><tr><th scope="row">Verilmez · 58</th><td>Ziyaretçi açık kapıya kadar sayar.</td><td>İner ve saydığı rakamı aygıta verir.</td></tr><tr><th scope="row">Ziyaret Saatleri · Son</th><td>Dönüş biletiyle başka bir çıkış.</td><td>Yeniden içeri girer ve imzalar.</td></tr></tbody></table></div><p class="reading">Karşıya geçmek, göç etmek ve tepeye yürümek farklı yolculuklardır. Son ziyaretçi yeniden içeri girip imza atar; kalış süresi belirsizdir.</p></figure>
<figure><a aria-label="Şekli büyüt: Tekrarlanan zamanlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/atlas-03.svg"><img alt="Tekrarlanan zamanlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/atlas-03.svg" width="842"/></a><figcaption>Tekrarlanan zamanlar</figcaption><p>Seçilmiş çizelgeler ve yeni yıla açık bir geçiş.</p><div aria-label="Tablo: Tekrarlanan zamanlar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Saat ya da aralık</th><th scope="col">İşlediği yer</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">İlk on iki saat</th><td>Doğum kaydı · 3</td><td>Ücret yok; kullanım kaydedilir.</td></tr><tr><th scope="row">Perşembe</th><td>Yenilemeler; kuyruklar; kanadın kararlaştırdığı gün</td><td>Tekrarlanır; tek ve eşzamanlı bir takvimi kanıtlamaz.</td></tr><tr><th scope="row">Ayın on dördü, 03:00-04:00</th><td>Uyaran · 20</td><td>BULUNAN KİŞİLER: yok kaydının altında biri çalışır.</td></tr><tr><th scope="row">03:00-04:00</th><td>Planlı kesinti · 53</td><td>04:01'de dönüş; 03:41'de bir ses işareti.</td></tr><tr><th scope="row">Yılın ilk sabahı</th><td>Son Kelime · 54</td><td>Yeni ücret çoktan söylenmektedir.</td></tr></tbody></table></div><p class="reading">Kitap uzun geçmişler, yinelenen döngüler ve bir yıl değişimi içerir. Bu, tüm öyküleri tek bir yıla yerleştiren bir zaman çizelgesi değildir.</p></figure>
<figure><a aria-label="Şekli büyüt: Ücret ve değişen açık" class="figure-visual" href="/visiting-hours/guide/figures/tr/atlas-04.svg"><img alt="Ücret ve değişen açık" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/atlas-04.svg" width="842"/></a><figcaption>Ücret ve değişen açık</figcaption><p>Saklaması kanıtlanmış kelimeler; nakit ya da ücretle kaydedilen kelime sayısı değil.</p><p>Saklaması kanıtlanmış kelimeler</p><div aria-label="Tablo: Ücret ve değişen açık" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Önceki ücret · Tarife</th><td>200</td><td>Panonun önceki gerekliliği.</td></tr><tr><th scope="row">Hanenin elindeki · Ucuz Kelimeler</th><td>206</td><td>İki yetişkin ve bir çocuk; paylaştırma belirtilmez.</td></tr><tr><th scope="row">Babanın son sayımı · Son Kelime</th><td>239</td><td>Eski ücretin bir, yenisinin 61 altında.</td></tr><tr><th scope="row">Yeni yıldan önceki ücret</th><td>240</td><td>Dul kadının kocası denetimden sonra bu sayıya ulaşır.</td></tr><tr><th scope="row">Yeni yıldaki ücret</th><td>300</td><td>240'tan 60 artış; fiyat dönüştürme formülü değil.</td></tr></tbody></table></div><p class="reading">61 kelimelik açık, 300'den 239 çıkarılarak hesaplanır. Öğretmek, saklamak, denetlemek ve okuyana ödeme yapmak ayrı kalır.</p></figure>
