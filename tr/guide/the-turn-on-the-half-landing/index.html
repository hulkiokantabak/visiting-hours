<figure id="figure-115"><a aria-label="Şekli büyüt: 115. Gardırop çıkar ama inmez" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-115.svg"><img alt="115. Gardırop çıkar ama inmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-115.svg" width="842"/></a><figcaption>115. Gardırop çıkar ama inmez</figcaption><p>Aynı nesne, hatırlanan taşınmayla bugünkü boşaltma sırasında ölçülür.</p><dl><dt>Otuz bir yıl önce</dt><dd>Baba oğul onu yan yan yukarı taşır; dönüşte bir bilek sıkışır.</dd><dt>Bugün saat dörtte</dt><dd>Yalnız gardırop kalmıştır; elinde metreyle oturur.</dd><dt>Çıkarma denemesi</dt><dd>Bir inç kalkıp geri düşer; kapağını çıkarmak fark yaratmaz.</dd><dt>İki fiyatlı seçenek</dt><dd>Kalır, bedeli terekeden alınır; veya masrafına parçalanır.</dd><dt>Anahtarlar verildikten sonra</dt><dd>Kapaksız durur; terekeden ücret alınmasını ve cetvelli fotoğrafını bekler.</dd></dl><p class="reading">Son durumda nesne, terekeden ücret alınmasını bekler; ileride parçalanacağı kesinleşmez.</p></figure>
<figure id="figure-116"><a aria-label="Şekli büyüt: 116. Dolu bir odadan bakılan bir rafa" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-116.svg"><img alt="116. Dolu bir odadan bakılan bir rafa" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-116.svg" width="842"/></a><figcaption>116. Dolu bir odadan bakılan bir rafa</figcaption><p>Devam hizmetinin kullanımıyla sona erdikten sonraki ziyaretler, farklı mevcudiyet biçimleridir.</p><div aria-label="Tablo: 116. Dolu bir odadan bakılan bir rafa" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Devam hizmeti sırasında</th><th scope="col">Ruhsat düştükten sonra</th></tr></thead><tbody><tr><th scope="row">Ses</th><td>Odayı görmeden kadını duymayı öğrenir</td><td>Ruhsat düşerken standart bir ses dört cümle söyler</td></tr><tr><th scope="row">Tartışma</th><td>Para ve erkek kardeşi üzerine tartışırlar</td><td>Küçük, mırıldanan barındırıcı gitmiştir</td></tr><tr><th scope="row">Dokunmak ve kalmak</th><td>Eli soğuk masayı kavrar; bir saat daha kalır</td><td>On bir ay boyunca ikinci pazarları döner</td></tr><tr><th scope="row">Korunan yer</th><td>Barındırıcı pencere yanındaki rafta dururdu</td><td>O boş rafın tozunu alır</td></tr></tbody></table></div><p class="reading">Soğuk masa, tartışmayı veya kaldığı fazladan saati silmez. Toz almak, gitmiş olan barındırıcıyı geri getirmez.</p></figure>
<figure id="figure-117"><a aria-label="Şekli büyüt: 117. Nesneler farklı kararlarla çıkar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-117.svg"><img alt="117. Nesneler farklı kararlarla çıkar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-117.svg" width="842"/></a><figcaption>117. Nesneler farklı kararlarla çıkar</figcaption><p>Poşet, palto ve gardırop aynı seçilme biçimini paylaşmaz.</p><div aria-label="Tablo: 117. Nesneler farklı kararlarla çıkar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Nesne</th><th scope="col">Seçme eylemi</th><th scope="col">Vardığı yer</th></tr></thead><tbody><tr><th scope="row">Ruhsat, makbuzlar ve belge</th><td>Çekmecelerden başlar</td><td>Poşet</td></tr><tr><th scope="row">İki tabak</th><td>Karar vermeden ayırır</td><td>Sonradan çantasında bulunur</td></tr><tr><th scope="row">Babanın paltosu</th><td>Önceki boşaltmalarda saklar; koluna alır</td><td>Dışarı taşır</td></tr><tr><th scope="row">Güçlük çizelgesi</th><td>Gardırobun bedelini yazmak için kullanılır</td><td>Katı, bisküvi kırıntılarını tutar</td></tr><tr><th scope="row">Gardırop</th><td>Dönüşü alamaz</td><td>Dairede kapaksız kalır</td></tr></tbody></table></div><p class="reading">Gardırop kalırken küçük nesneler bilinçli, kendiliğinden ve pratik eylemlerle taşınır.</p></figure>
