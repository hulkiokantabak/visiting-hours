<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Son Pozisyon · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/final-position/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/final-position/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/final-position/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/final-position/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-8"><h1>8. Son Pozisyon</h1>
<figure id="figure-22"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-022.svg"><img alt="022. Vaat edilen uzatma geçersiz kalır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-022.svg" width="842"/></a><figcaption>022. Vaat edilen uzatma geçersiz kalır</figcaption><p>İki anlaşmazlık, kişinin anlattığını bir belge ya da aygıtın yanına koyar.</p><div aria-label="Tablo: 022. Vaat edilen uzatma geçersiz kalır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kişisel anlatı ya da müdahale</th><th scope="col">Belge ya da aygıtın yanıtı</th></tr></thead><tbody><tr><th scope="row">Elin bakımı</th><td>Teknisyen bildirimin yanlış olduğunu söyler ve UZATILDI damgası basar</td><td>Adamın telefonu damgayı reddeder</td></tr><tr><th scope="row">Kitabın ödünç verilmesi</th><td>Anlatı, kitabın adama ait olduğunu ve onu daha önce ödünç verdiğini söyler</td><td>Ödünç fişi onu kitabı alan kişi olarak gösterir</td></tr><tr><th scope="row">Israr</th><td>Kadın damgayı denemeyi sürdürür</td><td>Kapatma yine gece yarısında gerçekleşir</td></tr></tbody></table></div><p class="reading">Rehber, ödünç ilişkisinin iki anlatımını da görünür tutar. Fişi düzeltmez; teknisyenin bilerek yalan söylediğine de karar vermez.</p></figure>
<figure id="figure-23"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-023.svg"><img alt="023. On bir yıl tek bir alanla sonlanır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-023.svg" width="842"/></a><figcaption>023. On bir yıl tek bir alanla sonlanır</figcaption><p>Farklı kayıtlar aynı elin farklı yönlerini saklar.</p><div aria-label="Tablo: 023. On bir yıl tek bir alanla sonlanır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Kayıt</th><th scope="col">İçerdiği</th><th scope="col">Kesinleştirmediği</th></tr></thead><tbody><tr><th scope="row">Eski yaralanma</th><td>Et ve kemikten elini 42 yaşında kaybetmiştir</td><td>Bir takvim tarihi</td></tr><tr><th scope="row">Gecelik raporlar</th><td>11 yıl; kavrama, titreme ve sıcaklık</td><td>Kesin gece sayısı</td></tr><tr><th scope="row">Evdeki değişim</th><td>İki kişi için kavanoz açmayı bıraktığı ay</td><td>Kimi ya da neyi kaybettiği</td></tr><tr><th scope="row">AÇIK</th><td>Teknisyenin gelmesi gerekir</td><td>Fiyat ya da süresiz faturalandırma</td></tr><tr><th scope="row">KAPALI</th><td>Yeni ziyaret gerekmez; küçük bir alacak</td><td>Elin onu tutmasının anlamı</td></tr></tbody></table></div><p class="reading">Burada on bir yıl kesin bir gece sayısına çevrilemez. İki kişi için kavanoz açmayı bırakması, evde kimi ya da neyi kaybettiğini belirlemez.</p></figure>
<figure id="figure-24"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-024.svg"><img alt="024. Kapatmadan bir tutuş yaratmak" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-024.svg" width="842"/></a><figcaption>024. Kapatmadan bir tutuş yaratmak</figcaption><p>Son akşamdan seçilmiş eylemler ve bunların daha sonraki idari karşılığı.</p><dl><dt>Son akşam</dt><dd>Düğmeleri ilikler, çözer ve yeniden başlar; portakalı soyar.</dd><dt>İki imza</dt><dd>Her eliyle bir kez yazar; adlar aynıdır.</dd><dt>Form alanı</dt><dd>KAPALI seçeneğini işaretler.</dd><dt>Seçtiği pozisyon</dt><dd>Canlı elini mekanik elin içine koyar.</dd><dt>Gece yarısından sabaha</dt><dd>Son şarj parmakları yavaşça kapatır; adam kalır.</dd><dt>İkinci hafta</dt><dd>Karşı taraf teşekkür eder ve küçük bir alacak ekler.</dd></dl><p class="reading">KAPALI seçeneğini kullanışı, alana yüklenen hizmet hesabını aşar; elektriği geri getirmez ve kapatmayı önlemez.</p></figure>
