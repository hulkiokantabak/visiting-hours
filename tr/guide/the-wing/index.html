<figure id="figure-73"><a aria-label="Şekli büyüt: 073. Sığınağın günlük işleri" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-073.svg"><img alt="073. Sığınağın günlük işleri" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-073.svg" width="842"/></a><figcaption>073. Sığınağın günlük işleri</figcaption><p>Kanadın korumaları, bunları sürdüren işlerle ve sınırlarla yan yana durur.</p><div aria-label="Tablo: 073. Sığınağın günlük işleri" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kanadın sağladığı</th><th scope="col">Yapılması gereken</th></tr></thead><tbody><tr><th scope="row">Duvarlar</th><td>Teyitler ve düzeltmeler geçmez</td><td>İnsanlar unu dokuz yüz metre taşır</td></tr><tr><th scope="row">Okul</th><td>Kayıtsız, her sabah iki saat</td><td>Okul yüzünden ayrılan aileler vardır</td></tr><tr><th scope="row">Bakım</th><td>Doktor ayda iki kez ücret almadan gelir</td><td>Boru bağlantı parçaları artık üretilmez</td></tr><tr><th scope="row">Öğrenme</th><td>Tesisatçı kimin öğreneceğini sorar</td><td>Sonunda iki kişi kalkıp onunla gider</td></tr><tr><th scope="row">Dışarıdan öneri</th><td>Gerçek bir güçlük kademesi ve kayda dönüş</td><td>Kapı kapalı kalsa da ziyaret kayda geçer</td></tr></tbody></table></div><p class="reading">İçerideki yardım gerçektir; ne güçlük önerisi ne muhalif yayınlar her ihtiyaca cevap verir.</p></figure>
<figure id="figure-74"><a aria-label="Şekli büyüt: 074. Avlu bölünür; tarafların adı verilmez" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-074.svg"><img alt="074. Avlu bölünür; tarafların adı verilmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-074.svg" width="842"/></a><figcaption>074. Avlu bölünür; tarafların adı verilmez</figcaption><p>Ateşte ve avluda sayılan insanlar; 31 ile 37'nin toplamı 68'dir.</p><p>kişi</p><div aria-label="Tablo: 074. Avlu bölünür; tarafların adı verilmez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Öğe</th><th scope="col">Değer</th><th scope="col">Ayrıntı</th></tr></thead><tbody><tr><th scope="row">Ateşte okunan sayı</th><td>68</td><td>Ziyaret ve tartışmadan önce</td></tr><tr><th scope="row">Oylamada kapı yanında</th><td>31</td><td>Yer belirtilir; oyunun anlamı etiketlenmez</td></tr><tr><th scope="row">Oylamada duvar yanında</th><td>37</td><td>Yer belirtilir; oyunun anlamı etiketlenmez</td></tr></tbody></table></div><p class="reading">Kapı sonra açılır. Öykü tarafları adlandırmaz, kazanan önergeyi bildirmez, kapıyı açanı belirtmez.</p></figure>
<figure id="figure-75"><a aria-label="Şekli büyüt: 075. Sayılar farklı işler yapar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-075.svg"><img alt="075. Sayılar farklı işler yapar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-075.svg" width="842"/></a><figcaption>075. Sayılar farklı işler yapar</figcaption><p>İnsan sayısını, hane kaydını ve sayım sayısını ayırın.</p><div aria-label="Tablo: 075. Sayılar farklı işler yapar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Sayı</th><th scope="col">Birim</th><th scope="col">Öyküdeki kullanımı</th></tr></thead><tbody><tr><th scope="row">68</th><td>Kişi</td><td>Ateşte okunur, tebeşirle yazılır, sonra silinir</td></tr><tr><th scope="row">31</th><td>Sayım</td><td>Biri bu toplamı tutar; önceki amaçları saklanır</td></tr><tr><th scope="row">19</th><td>Hane</td><td>Ziyaretçiler hava kararmadan kaydeder</td></tr><tr><th scope="row">68</th><td>Duvarda tutulan sayı</td><td>O gece okunmaz; sonra bir çocuğa açıklanır</td></tr></tbody></table></div><p class="reading">On dokuz hane, altmış sekiz kişiden çıkarılamaz. Duvardaki eski sayı sonradan açıklama ister.</p></figure>
