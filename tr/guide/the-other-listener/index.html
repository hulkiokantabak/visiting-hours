<figure id="figure-142"><a aria-label="Şekli büyüt: 142. Beden orada, mesele sonuçlanmış" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-142.svg"><img alt="142. Beden orada, mesele sonuçlanmış" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-142.svg" width="842"/></a><figcaption>142. Beden orada, mesele sonuçlanmış</figcaption><p>Yaşlı adamın günü, telefonunda görünen sonuçla örtüşmez.</p><div aria-label="Tablo: 142. Beden orada, mesele sonuçlanmış" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Bedensel mevcudiyet</th><th scope="col">İdari sonuç</th></tr></thead><tbody><tr><th scope="row">Doğrulama</th><td>R-73 diye beş kez çağrılınca yanıt verir</td><td>Kabulden önce kanı temizlenir</td></tr><tr><th scope="row">Saat altıda</th><td>Numarası kapalı bir gişede görünür</td><td>Ses, çağrının yapıldığını söyler</td></tr><tr><th scope="row">Fazla tahsilat</th><td>Telefonda on bir yıl kayıtlıdır</td><td>Mesele sonuçlanmış olur</td></tr><tr><th scope="row">Yarın</th><td>Fiş geçerliliğini korur</td><td>Yeni numaralar birden başlar</td></tr></tbody></table></div><p class="reading">Sonuçlandırma kaydı, adamın bu sahnede para aldığına dair kanıt değildir.</p></figure>
<figure id="figure-143"><a aria-label="Şekli büyüt: 143. Bir liste, değişen okurlar" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-143.svg"><img alt="143. Bir liste, değişen okurlar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-143.svg" width="842"/></a><figcaption>143. Bir liste, değişen okurlar</figcaption><p>Çözülmüş bir tarih değil, yaşlı adamın aile hikâyesindeki ilişkiler.</p><dl><dt>Kayıpların listesi</dt><dd>Sonraki okurları, hangi adların askerlere ait olduğunu sorar.</dd><dt>İlk derleyici</dt><dd>Bir asker—ya da kardeşi askerler tarafından götürülmüş bir adam.</dd><dt>Görevli</dt><dd>Bir kalem ödünç verir; daha sonra tencereyi ocağa koyar.</dd><dt>Hapishaneyi açanlar</dt><dd>Yıllar sonra ellerinde listeyle gelirler.</dd><dt>Dışarıdaki insanlar</dt><dd>Kimisi fotoğraf, kimisi ip tutar.</dd></dl><h4>İlişkiler</h4><ul><li>İlk derleyici → Kayıpların listesi: kayıpları yazar</li><li>Görevli → İlk derleyici: kalem ödünç verir</li><li>Hapishaneyi açanlar → Kayıpların listesi: onunla döner</li><li>Hapishaneyi açanlar → Görevli: kimlikleri sorar</li><li>Dışarıdaki insanlar → Görevli: bir yanıt bekler</li></ul><p class="reading">Asker ile kardeşi alınan adam, farklı anlatımlardır. Görevlinin sonradan kimseyi adlandırıp adlandırmadığı açık kalır.</p></figure>
<figure id="figure-144"><a aria-label="Şekli büyüt: 144. İsim de isteyen yardım" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-144.svg"><img alt="144. İsim de isteyen yardım" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-144.svg" width="842"/></a><figcaption>144. İsim de isteyen yardım</figcaption><p>Bugünkü ziyaret, farklı yardım biçimlerini yan yana getirir.</p><div aria-label="Tablo: 144. İsim de isteyen yardım" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">İlişki</th><th scope="col">Yardım ya da söz</th><th scope="col">Kalan talep</th></tr></thead><tbody><tr><th scope="row">Genç kadın / yaşlı adam</th><td>Parmağını sarar; ekmeği paylaşır; kalkmasına yardım eder</td><td>Kendisinin değil, birinin döneceğine söz verir</td></tr><tr><th scope="row">Genç adam / yaşlı adam</th><td>Fazla tahsilatı son birimine kadar kopyalar</td><td>İlerideki işlem için adını sorup harf harf yazar</td></tr><tr><th scope="row">Bugünkü yardımcılar / aile hikâyesi</th><td>Dinler, sonu hakkında anlaşamazlar</td><td>Genç adam görevlinin adını sorar</td></tr><tr><th scope="row">Basamaktaki kadın / yaşlı adam</th><td>Duayı birlikte tekrarlarlar</td><td>Anlaşmaları listenin akıbetini çözmez</td></tr></tbody></table></div><p class="reading">Yiyecek ve somut destek gerçektir; kaydedilen isimlerin ileride nasıl kullanılacağı açık kalır.</p></figure>
