<figure id="figure-172"><a aria-label="Şekli büyüt: 172. Farklı ölçüler birbirinin yerine geçmez" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-172.svg"><img alt="172. Farklı ölçüler birbirinin yerine geçmez" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-172.svg" width="842"/></a><figcaption>172. Farklı ölçüler birbirinin yerine geçmez</figcaption><p>Sayımlar ve tahminler, aynı yürüyüşün farklı yönlerini adlandırır.</p><div aria-label="Tablo: 172. Farklı ölçüler birbirinin yerine geçmez" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Ölçü</th><th scope="col">Değer ve kaynak</th><th scope="col">Sınır</th></tr></thead><tbody><tr><th scope="row">Yürüme süresi</th><td>Kadın için 11 dakika; aygıta göre 9</td><td>Söylemediği süre, aygıtın tahmininden farklıdır</td></tr><tr><th scope="row">Fiziksel basamaklar</th><td>Aygıta ve kadının sayacına göre 194</td><td>Bacakları, aygıtın sahte dediği 16 basamağı bulamaz</td></tr><tr><th scope="row">Sokağın sayımı</th><td>112; nefes gerektirenler</td><td>Basamak sayımından farklı bir temel</td></tr><tr><th scope="row">Son duraktan kapıya</th><td>2311 adım; aygıt yaklaşık 1540 metreye çevirir</td><td>Çeviri, kadının kısa adımlarını hesaba katar</td></tr></tbody></table></div><p class="reading">Aygıtın sahte basamak iddiasını kadının bacakları doğrulamaz. Dakika, basamak, nefes sayısı ve adım farklı birimlerdir.</p></figure>
<figure id="figure-173"><a aria-label="Şekli büyüt: 173. Kapalı zincirden geçen güncel yol" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-173.svg"><img alt="173. Kapalı zincirden geçen güncel yol" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-173.svg" width="842"/></a><figcaption>173. Kapalı zincirden geçen güncel yol</figcaption><p>Çelişen talimatlar, fiilî bir geçişe dönüşür.</p><dl><dt>Zincirle kapatılan yol</dt><dd>Cumartesi günü, uyuşmazlık sürerken karşıya geçer.</dd><dt>Yeşil güzergâh</dt><dd>Telefon yolu önerir.</dd><dt>Güzergâh geri çekilir</dt><dd>Başka bir güncel bildirim onu geri çeker.</dd><dt>Birinci bekçi</dt><dd>Zinciri kaldırır; sonra kadının tırmanmasına yardım eder.</dd><dt>İkinci bekçi</dt><dd>Zinciri yerine koyar.</dd><dt>Kadın ve alışveriş</dt><dd>Alışveriş alttan, kadın üstten geçer.</dd></dl><h4>İlişkiler</h4><ul><li>Yeşil güzergâh → Zincirle kapatılan yol: geçiş sunar</li><li>Güzergâh geri çekilir → Zincirle kapatılan yol: güzergâhı geri çeker</li><li>Birinci bekçi → Zincirle kapatılan yol: engeli kaldırır</li><li>İkinci bekçi → Zincirle kapatılan yol: engeli yerine koyar</li><li>Birinci bekçi → Kadın ve alışveriş: el uzatır</li><li>Kadın ve alışveriş → Zincirle kapatılan yol: engele rağmen geçer</li></ul><p class="reading">Bu bir ilişki haritasıdır; ölçülmüş sokak planı ya da bekçilerden birinin bütün Ofis'i temsil ettiğinin kanıtı değildir.</p></figure>
<figure id="figure-174"><a aria-label="Şekli büyüt: 174. Sonuç kimde kalır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-174.svg"><img alt="174. Sonuç kimde kalır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-174.svg" width="842"/></a><figcaption>174. Sonuç kimde kalır</figcaption><p>Sunulan hesap ile saklanan üç sayının konumları farklıdır.</p><div aria-label="Tablo: 174. Sonuç kimde kalır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kadının erişebildiği</th><th scope="col">Başka yerde tutulan ya da söylenen</th></tr></thead><tbody><tr><th scope="row">Uzaklık</th><td>Güzergâhı ve 2311 adımı kadın verir</td><td>Aygıt, yaklaşık çevirisine başka tür bir yanıt der</td></tr><tr><th scope="row">Yazılı sonuç</th><td>Sayaç ile defter aynı sayıyı verir</td><td>Erişilemeyen dosyada farklı, üçüncü bir sayı vardır</td></tr><tr><th scope="row">Defter</th><td>Kendisine sorulmadan yazar</td><td>Aygıt, defterin fotoğrafını iki kez çeker</td></tr><tr><th scope="row">Amaç</th><td>Kadın, yürüyüşü isteyip istemediğini sorar</td><td>Hiçbir şey istemediğini söyler; ikisi de yürümeyi bırakmaz</td></tr></tbody></table></div><p class="reading">Görülmeyen sayının değeri ya da nedeni belirtilmez. Aygıtın yardımı, ne istediğini ortaya koymaz.</p></figure>
