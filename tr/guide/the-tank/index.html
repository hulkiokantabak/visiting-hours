<figure id="figure-31"><a aria-label="Şekli büyüt: 031. Bileklik ile beden ayrılır" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-031.svg"><img alt="031. Bileklik ile beden ayrılır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-031.svg" width="842"/></a><figcaption>031. Bileklik ile beden ayrılır</figcaption><p>Kimin kimin bilekliğini taktığını izleyin; para cinsinden bir bakiye uydurmayın.</p><div aria-label="Tablo: 031. Bileklik ile beden ayrılır" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Adamın bedeninde</th><th scope="col">Kadının bedeninde</th></tr></thead><tbody><tr><th scope="row">İtiş kakıştan önce</th><td>İkinci turda bilekliği parlar</td><td>Başlangıç bakiyesi belirtilmez</td></tr><tr><th scope="row">İtiş kakıştan sonra</th><td>Kadının koyu bilekliği; eti kesecek kadar dar</td><td>Adamın parlak bilekliği; borcunu taşır</td></tr><tr><th scope="row">Harcama</th><td>Kadının bakiyesini pahalı saatlere harcar</td><td>Kadın adamın parasızlığını takar</td></tr><tr><th scope="row">Seçim</th><td>Mekân, adamdaki kadın bilekliğini seçer</td><td>Kadının bedensel tepkisi adamın uzanan elini durdurur</td></tr><tr><th scope="row">Şafak</th><td>Bileklikler geri verilir</td><td>Bileklikler geri verilir</td></tr></tbody></table></div><p class="reading">Bileklik değişimi harcama hakkını yeniden dağıtır. Gecenin kaydını satmaya eşit ölçüde razı olduklarını göstermez.</p></figure>
<figure id="figure-32"><a aria-label="Şekli büyüt: 032. Dokunmaya izin kesintisiz değildir" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-032.svg"><img alt="032. Dokunmaya izin kesintisiz değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-032.svg" width="842"/></a><figcaption>032. Dokunmaya izin kesintisiz değildir</figcaption><p>Öykü üç karşılaşmayı yan yana getirir; bunlardaki rızayı eşitlemez.</p><div aria-label="Tablo: 032. Dokunmaya izin kesintisiz değildir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Karşılaşma</th><th scope="col">Adamın eylemi</th><th scope="col">Kadının karşılığı</th></tr></thead><tbody><tr><th scope="row">Eski su merdivenleri</th><td>Ellerini kalçalarına koyarak sorar</td><td>Cevap verir</td></tr><tr><th scope="row">Kaydedilen gece karşılığında bedava kadeh</th><td>İçkiye uzanır</td><td>Kadın elini adamın bileğine kapatır; adam öbür elini kullanır</td></tr><tr><th scope="row">Kaydedilmiş yakınlıklarını izlerken</th><td>Başparmağı kadının bel lastiğini bulur</td><td>Kadın başparmağı orada yakalar</td></tr><tr><th scope="row">Sonraki kuyruk</th><td>Girişe geri döner</td><td>İkisi de yeniden girmek için ödeme yapar</td></tr></tbody></table></div><p class="reading">Sonraki durdurma hareketleri, kulübe birlikte dönüşlerini sorunlu kılar; şekil kadının son niyetlerine karar vermez.</p></figure>
<figure id="figure-33"><a aria-label="Şekli büyüt: 033. Çalan, kaydeden ve su veren bir mekân" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-033.svg"><img alt="033. Çalan, kaydeden ve su veren bir mekân" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-033.svg" width="842"/></a><figcaption>033. Çalan, kaydeden ve su veren bir mekân</figcaption><p>Depo içindeki ilişkiler; yerleşimler şematiktir, ölçekli değildir.</p><dl><dt>Depo</dt><dd>Suyu boşaltılmış sarnıç; 40 sütun bası iletir</dd><dt>Giriş</dt><dd>Bileklikler harcamayı gösterir; bir oğlan kanındaki bir şey yüzünden içeri alınmaz.</dd><dt>Eski su merdivenleri</dt><dd>Üçüncü sütunun ardında; mahrem bir karşılaşma</dd><dt>Bar</dt><dd>Bedava bir kadeh, kaydedilmiş gecenin tamamını satın alır</dd><dt>Barın üstündeki duvar</dt><dd>Satın alınan geceler hafta boyunca oynatılır</dd><dt>Küçük tabak</dt><dd>Barmen bahşişlerin yerine kaplumbağa için su koyar</dd></dl><h4>İlişkiler</h4><ul><li>Depo → Giriş: giriş denetimi</li><li>Depo → Eski su merdivenleri: 3. sütunun arkasındaki merdivenler</li><li>Depo → Bar: kayıt alışverişi</li><li>Bar → Barın üstündeki duvar: saklama ve gösterme ruhsatı var</li><li>Bar → Küçük tabak: barmenin eylemi</li></ul><p class="reading">Mekândaki alışverişlerin yanında küçük bir bakım eylemi de vardır; ne tabağa ne merdivenlere uydurma bir tarife yüklenir.</p></figure>
