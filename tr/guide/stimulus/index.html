<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uyaran · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/stimulus/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/stimulus/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/stimulus/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/stimulus/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-20"><h1>20. Uyaran</h1>
<figure id="figure-58"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-058.svg"><img alt="058. İlk çalınış farklı bedenlerde karşılık bulur" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-058.svg" width="842"/></a><figcaption>058. İlk çalınış farklı bedenlerde karşılık bulur</figcaption><p>Bildirilen nota konumları, kadının hareketiyle birimin tepkisini karşılaştırır.</p><div aria-label="Tablo: 058. İlk çalınış farklı bedenlerde karşılık bulur" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">An</th><th scope="col">Kadın ya da kayıt</th><th scope="col">Birim ya da dolaplar</th></tr></thead><tbody><tr><th scope="row">4 notadan sonra</th><td>Sol topuğu kalkar; sertçe yere indirir</td><td>Henüz bir tepki belirtilmez</td></tr><tr><th scope="row">Kayıttaki takılma</th><td>Eski topuk 5. notadan önce takılır; ardından sürtünme ve gülüş gelir</td><td>Ayrı bir neden ortaya konmaz</td></tr><tr><th scope="row">5. nota</th><td>Kayıt çalmayı sürdürür</td><td>Birimin ışıklarının yanıp sönme sıklığı değişir</td></tr><tr><th scope="row">6. nota</th><td>Kayıt çalmayı sürdürür</td><td>Birimin fanları yavaşlar; dolaplar da onlarla durulur</td></tr></tbody></table></div><p class="reading">Kadının topuğu, kayıttaki sürtünmeden önce kalkar. Sıra, onu anının mı, müziğin mi, yoksa birimin mi yönettiğini ortaya koymaz.</p></figure>
<figure id="figure-59"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-059.svg"><img alt="059. Fişini çektiği, gelen birimdir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-059.svg" width="842"/></a><figcaption>059. Fişini çektiği, gelen birimdir</figcaption><p>Bir deneyin denetim koşullarını kanıtlamayan bir deneme ve eylem dizisi.</p><dl><dt>İğne kaldırılır</dt><dd>Fanlar sürer; sıradan soğutma olasılığını düşünür</dd><dt>Kayıt yeniden çalar</dt><dd>Topuğu kalkar; adamın ne dediğini yine kaçırır</dd><dt>Gelen birimin fişi çekilir</dt><dd>Işıkları söner; dolaplar uğuldamayı sürdürür</dd><dt>Plak yeniden çalınır</dt><dd>Kadın uzaklaşır; sürtünme anında yanlış ayağının üzerindedir</dd><dt>Sonra, dışarıda</dt><dd>Adımı dener ve tutturamaz</dd></dl><h4>İlişkiler</h4><ul><li>İğne kaldırılır → Kayıt yeniden çalar: yeniden dener</li><li>Kayıt yeniden çalar → Gelen birimin fişi çekilir: birime müdahale eder</li><li>Gelen birimin fişi çekilir → Plak yeniden çalınır: plağı yeniden başlatır</li><li>Plak yeniden çalınır → Sonra, dışarıda: anlatının ilerleyen bölümünde (aktarılmış, eksik, tartışmalı ya da yoruma dayalı bağ)</li></ul><p class="reading">Ruhsatlı dolaplara güç gelmeye devam eder. Sonraki kusurlu dansı bir irade denemesini düşündürür; etkiden kurtulduğunu kanıtlamaz.</p></figure>
<figure id="figure-60"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-060.svg"><img alt="060. Uyaran kaydının kaçırdığı" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-060.svg" width="842"/></a><figcaption>060. Uyaran kaydının kaçırdığı</figcaption><p>Planlanmış bir teslimat ile kadının belirsiz bağlılığı aynı saati anlatır.</p><div aria-label="Tablo: 060. Uyaran kaydının kaçırdığı" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Kayda geçen ya da planlanan</th><th scope="col">Sahnede bulunan</th></tr></thead><tbody><tr><th scope="row">Yinelenen uyaran aralığı</th><td>03:00-04:00; her on dördünde</td><td>Kendi plaklarını ve pikabını getirir</td></tr><tr><th scope="row">Hazır bulunma</th><td>Hazır bulunan kişiler: yok; açılışta ve kapanışta</td><td>Çalar, durdurur, birime dokunur ve dans eder</td></tr><tr><th scope="row">Salonun ortasındaki dolap</th><td>Tereke baharda 4 birim fazla ödemiştir</td><td>Kadın, artan hareketliliğini sevinç olarak okumuştur</td></tr><tr><th scope="row">Boş bölme</th><td>Hizmetten çıkarılmış</td><td>Kadın ona ait plağı sonuna kadar çalar</td></tr><tr><th scope="row">Tamamlanan uyaran</th><td>Kapanış kaydı teslimatı kaydeder</td><td>Partnerinin söyledikleri duyulmamış kalır; kadın adımı kaçırır</td></tr></tbody></table></div><p class="reading">Defterdeki yok, kadını sahneden silmez. Terekeye ek ücret çıkarıldığı gösterilir, ama bunun kesin nedeni kanıtlanmaz.</p></figure>
