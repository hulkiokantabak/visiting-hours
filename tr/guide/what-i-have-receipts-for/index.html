<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neyin Makbuzu Var Bende · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/what-i-have-receipts-for/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/what-i-have-receipts-for/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/what-i-have-receipts-for/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/what-i-have-receipts-for/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-28"><h1>28. Neyin Makbuzu Var Bende</h1>
<figure id="figure-82"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-082.svg"><img alt="082. Farklı biçimlerde saklanan yıllar" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-082.svg" width="842"/></a><figcaption>082. Farklı biçimlerde saklanan yıllar</figcaption><p>Tanıklığı, yaşanmış evlilikle satın alınmış devam hizmetini karşılaştırır.</p><div aria-label="Tablo: 082. Farklı biçimlerde saklanan yıllar" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col"></th><th scope="col">Evlilik</th><th scope="col">Devam hizmeti</th></tr></thead><tbody><tr><th scope="row">Verdiği süre</th><td>Birlikte otuz bir yıl</td><td>Dört yıllık hizmet</td></tr><tr><th scope="row">Kâğıtlar</th><td>O yıllardan elinde hiçbir şey olmadığını söyler</td><td>Her ayın dokuzunda yapılan ödemelerin makbuzları</td></tr><tr><th scope="row">Radyosunu öğrenmek</th><td>İlkinde on dokuz yıl</td><td>İkinci yılda konuşmayı kesmeyi öğrenir</td></tr><tr><th scope="row">Eksik kalan</th><td>İki sessiz ay ve paylaşılan bedensel hayat</td><td>Hizmet o iki ayı da yatağı da vermez</td></tr></tbody></table></div><p class="reading">Hizmetin başarısını kabul eder; bu farklar hangi ilişkinin daha değerli olduğunu hesaplamaz.</p></figure>
<figure id="figure-83"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-083.svg"><img alt="083. Kayıt sürerken değişen ifadeler" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-083.svg" width="842"/></a><figcaption>083. Kayıt sürerken değişen ifadeler</figcaption><p>Sonraki sözleri ilk anlatımını silmeden karmaşıklaştırır.</p><div aria-label="Tablo: 083. Kayıt sürerken değişen ifadeler" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Konu</th><th scope="col">İlk anlatım veya olası okuma</th><th scope="col">Kendi düzeltmesi</th></tr></thead><tbody><tr><th scope="row">Makine</th><td>Soğukluğu, reddini açıklayabilir</td><td>Sorun sıcaklığıdır</td></tr><tr><th scope="row">Yakınlık ayarı</th><td>Kapatıp geri çekilmiştir</td><td>Önce ayarı yükseltmiştir</td></tr><tr><th scope="row">Makbuzları olan adam</th><td>Ona bırakmasını öğütlemek istemiştir</td><td>Kendi kararı için güvence istemiştir</td></tr></tbody></table></div><p class="reading">Düzeltilmiş bir döküm, tam da kararsızlığını gösteren düzeltmeleri ortadan kaldırabilir.</p></figure>
<figure id="figure-84"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-084.svg"><img alt="084. Bir tanıklığın çevresindeki üç sınır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-084.svg" width="842"/></a><figcaption>084. Bir tanıklığın çevresindeki üç sınır</figcaption><p>Kayda izin verir; sınıflandırma, düzeltme ve açıklama ayrı ayrı tartışılır.</p><dl><dt>Kayda geçen ifadesi</dt><dd>Kayıt cihazının açık kalmasına izin verir</dd><dt>Formdaki üç kutu</dt><dd>Yoldaşlık, süreklilik, teselli</dd><dt>Düzeltilmiş döküm</dt><dd>Onu eminmiş gibi gösterebilir</dd><dt>Makbuzları olan adam</dt><dd>Son itirafında sözünü ettiği kişi</dd></dl><h4>İlişkiler</h4><ul><li>Kayda geçen ifadesi → Formdaki üç kutu: Sınıflandırmayı reddeder</li><li>Kayda geçen ifadesi → Düzeltilmiş döküm: Duraklamalar kalsın ister</li><li>Kayda geçen ifadesi → Makbuzları olan adam: Aktarılmamasını ister</li></ul><p class="reading">Kaydı sürdürme izni, tereddütleri silme veya her itirafı hakkında konuşulan kişiye aktarma izni değildir.</p></figure>
