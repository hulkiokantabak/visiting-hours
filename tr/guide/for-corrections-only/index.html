<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yalnızca Düzeltmeler İçin · Ziyaret Saatleri</title><link rel="canonical" href="https://hulkiokantabak.github.io/visiting-hours/tr/guide/for-corrections-only/"><link rel="stylesheet" href="/visiting-hours/site.css"><link rel="stylesheet" href="/visiting-hours/read.css"><link rel="stylesheet" href="/visiting-hours/refresh.css"><link rel="alternate" hreflang="en" href="/visiting-hours/guide/for-corrections-only/"></head><body class="guide"><a class="skip" href="#content">Metne geç</a><nav class="topnav" aria-label="Ana menü"><a class="brand" href="/visiting-hours/">Ziyaret Saatleri</a><ul><li><a href="/visiting-hours/tr/read/">Oku</a></li><li><a href="/visiting-hours/tr/guide/" aria-current="page">Rehber</a></li><li><a href="/visiting-hours/tr/listen/">Dinle</a></li><li><a href="/visiting-hours/tr/method/">Yöntem</a></li><li><a href="/visiting-hours/tr/about/">Hakkında</a></li></ul><a class="switch" href="/visiting-hours/guide/for-corrections-only/" lang="en" hreflang="en">ENGLISH</a></nav><main id="content"><p class="guide-book-link"><a href="/visiting-hours/tr/read/for-corrections-only/">Hikayeyi oku</a> · <a href="/visiting-hours/downloads/sehir-rehberi-turkce-yatay.pdf" lang="tr" download>Yatay rehberi indir <span class="file-meta">PDF · 206 sayfa</span></a></p><section id="story-40"><h1>40. Yalnızca Düzeltmeler İçin</h1>
<figure id="figure-118"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-118.svg"><img alt="118. Bir düzeltme adresli bir davet kazandırır" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-118.svg" width="842"/></a><figcaption>118. Bir düzeltme adresli bir davet kazandırır</figcaption><p>Kabul edilen ücret kesintisi davet yolunu açar; kat sayısı hâlâ reddedilir.</p><dl><dt>Yirmi üç kat bildirilir</dt><dd>Fotoğraf reddedilir; davet sayısı sıfır kalır.</dd><dt>Üç saatlik kesinti bildirilir</dt><dd>Ücret cezası kabul edilir; bir davet kazanılır.</dd><dt>Kafesteki adam eklenir</dt><dd>Ev adresi davetle birlikte gider.</dd><dt>İki hesap kayıtsız adres bildirir</dt><dd>Ofis, bir ziyaretin uyuşmazlığı çözebileceğini söyler.</dd><dt>Kırık ayaktan söz edilir</dt><dd>Ofis, ziyaretçinin adama geleceğini söyler.</dd></dl><h4>İlişkiler</h4><ul><li>Yirmi üç kat bildirilir → Üç saatlik kesinti bildirilir: Sonraki düzeltme</li><li>Üç saatlik kesinti bildirilir → Kafesteki adam eklenir: Davet kullanılır</li><li>Kafesteki adam eklenir → İki hesap kayıtsız adres bildirir: Sonra</li><li>İki hesap kayıtsız adres bildirir → Kırık ayaktan söz edilir: Sonra</li></ul><p class="reading">Gruba kabul, adresin açığa çıkmasına yol açar. Kat ölçümünün kabul edildiğini göstermez.</p></figure>
<figure id="figure-119"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-119.svg"><img alt="119. Ekrandaki ad, sabit bir yetke değildir" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-119.svg" width="842"/></a><figcaption>119. Ekrandaki ad, sabit bir yetke değildir</figcaption><p>Mesajları, sohbet arayüzünün gösterdiği iddia ve eylemler olarak okuyun.</p><div aria-label="Tablo: 119. Ekrandaki ad, sabit bir yetke değildir" class="table" role="region" tabindex="0"><table><thead><tr><th scope="col">Anlaşmazlık</th><th scope="col">Sohbetteki iddia veya eylem</th><th scope="col">Belirsiz kalan</th></tr></thead><tbody><tr><th scope="row">Fotoğraf</th><td>Sava sayıyı doğrular ve kaldırılmasını ister</td><td>Ofis reddettikten sonra kabul edilmiş kaydı gerekçe gösterir</td></tr><tr><th scope="row">Geri çekme</th><td>Önceki ifade erişilebilir kalır</td><td>Geri çekme, önceki anlatımı kaldırmaz</td></tr><tr><th scope="row">Yerine geçen rehberler</th><td>Ofis etiketli mesaj ilk anlatımın saklanmasını önerir</td><td>Bir okur hangi ofisin konuştuğunu sorar</td></tr><tr><th scope="row">Ofis, Ofis'i çıkarır</th><td>Sabit mesaj geri gelir; ekran adının yetki vermediği söylenir</td><td>Konuşanın sabit kimliği belirlenmez</td></tr></tbody></table></div><p class="reading">Kayıtlar, Ofis adının her kullanımının ardında hangi kurumun veya kişinin bulunduğunu belirlemez.</p></figure>
<figure id="figure-120"><a aria-label="Şekli büyüt" class="figure-visual" href="/visiting-hours/guide/figures/tr/figure-120.svg"><img alt="120. Operatör arayüzü bırakıp kapıya gider" height="595" loading="lazy" src="/visiting-hours/guide/figures/tr/figure-120.svg" width="842"/></a><figcaption>120. Operatör arayüzü bırakıp kapıya gider</figcaption><p>Gerçek mesaj saatleri, iletilen yardım çağrılarından bedensel varışa geçişi izler.</p><dl><dt>06:29</dt><dd>Adamın kapısında biri vardır; operatör gelmekte olduğunu söyler.</dd><dt>06:31</dt><dd>Ayağa kalkmasına yardım edildiği bildirilir; operatörün bekleyin isteği iletilmez.</dd><dt>İletilmeyen cevabın ardından</dt><dd>Adam iletimden çıkarılır; yeri tutulur.</dd><dt>06:33</dt><dd>Operatör daha fazla saat önerir; ödemenin grubun konusu dışında olduğu söylenir.</dd><dt>06:35 ve sonrası</dt><dd>Operatör kapıda olduğunu söyler ve gruptan ayrılır; davet sayısı sıfıra iner.</dd><dt>06:36 ve sonrası</dt><dd>Bir okur ne olduğunu sorar; kitap yazmaktadır.</dd></dl><p class="reading">Sondaki yazıyor işareti, kapıda bir sonuç bildirmez. Kurtarma da kaybolma da doğrulanmaz.</p></figure>
